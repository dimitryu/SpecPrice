// ── Part pricing — the vendors' own APIs ──────────────────────────────────────
// This used to scrape findchips.com through a chain of CORS proxies. That is
// gone: the site served a different page to datacenter IPs than to a browser,
// so lookups failed in a way no parser work could fix, and every public proxy
// we relied on died at once in Aug 2026. Prices now come from Mouser's and
// DigiKey's documented APIs via our own Cloud Function — no HTML parsing, no
// proxy chain, nothing to block. findchips.com survives in the UI only as a
// link, for eyeballing distributors the two APIs don't cover.
// coinmill.com publishes currency rates as a plain web page with no CORS
// header, so it still needs a server-side fetch. Our own Cloud Function does
// it; allorigins stays as a fallback for the case where the function isn't
// deployed. (This is all that's left of the old proxy chain.)
const RATE_PROXY_URL = 'https://us-central1-specprice-236a2.cloudfunctions.net/priceProxy?url=';
const RATE_PROXY_FALLBACK = 'https://api.allorigins.win/raw?url=';
// Official Mouser/DigiKey APIs via our Cloud Function (see functions/index.js).
// Unlike the FindChips scrape this is a documented, structured, permitted data
// source — no HTML parsing and nothing to block — so it's the primary source
// for the Mouser/DigiKey columns and keeps working when scraping doesn't.
const PRICE_API_URL = 'https://us-central1-specprice-236a2.cloudfunctions.net/priceLookup';
async function _apiPriceLookup(pn, qty, desc){
  if(!pn || !auth.currentUser) return null;
  const token=await auth.currentUser.getIdToken();
  // The description is sent as a TIE-BREAKER only. Spec numbers like
  // M81824/1-2 are made by several qualified manufacturers, all "exact"
  // matches on the part number and wildly different in price — the BOM's own
  // wording is what says which one is meant.
  const q=`pn=${encodeURIComponent(pn)}&qty=${encodeURIComponent(qty||1)}`
        + (desc?`&desc=${encodeURIComponent(String(desc).slice(0,300))}`:'');
  const resp=await fetch(`${PRICE_API_URL}?${q}`,
    {headers:{Authorization:'Bearer '+token}, signal:AbortSignal.timeout(45000)});
  if(!resp.ok){
    let msg=`HTTP ${resp.status}`;
    try{ const j=await resp.json(); if(j&&j.error) msg=j.error; }catch{}
    throw new Error(msg);
  }
  return resp.json();
}

// ══════════════════════════════════════════════════════════════════════════════
// ── Currency conversion → USD (via coinmill.com, same CORS proxy as FindChips) ─
const _COINMILL_URLS = {
  CHF: 'https://iw.coinmill.com/CHF_USD.html',
  JPY: 'https://iw.coinmill.com/JPY_USD.html',
  EUR: 'https://iw.coinmill.com/EUR_USD.html',
  ILS: 'https://iw.coinmill.com/ILS_USD.html',
  GBP: 'https://iw.coinmill.com/GBP_USD.html',
};
const _currencyRateCache = {};

// Detect a 3-letter currency code (or symbol) from a raw price string; defaults to USD
function _detectCurrency(raw){
  const s=String(raw||'').trim();
  if(/₪|\bILS\b|\bNIS\b|שקל|^ש"?ח?$/i.test(s)) return 'ILS';
  if(/€|\bEUR\b/i.test(s)) return 'EUR';
  if(/£|\bGBP\b/i.test(s)) return 'GBP';
  if(/¥|\bJPY\b/i.test(s)) return 'JPY';
  if(/\bCHF\b/i.test(s)) return 'CHF';
  return 'USD';
}
// Maps a short currency-column value (e.g. Priority ERP's "מטבע שורה" column, which uses
// values like "ש" for shekel, or plain "EUR"/"GBP"/"USD") to our 3-letter codes.
function _normalizeCurrencyCode(raw){
  const s=String(raw||'').trim();
  if(!s) return '';
  if(/^ש"?ח?$/.test(s) || /^(ILS|NIS)$/i.test(s)) return 'ILS';
  if(/^EUR$/i.test(s)) return 'EUR';
  if(/^GBP$/i.test(s)) return 'GBP';
  if(/^JPY$/i.test(s)) return 'JPY';
  if(/^CHF$/i.test(s)) return 'CHF';
  if(/^USD$/i.test(s)) return 'USD';
  return _detectCurrency(s);
}

// Tries our own function first (authenticated), then the public fallback.
// Throws only if both fail, so a rate lookup degrades rather than dying.
async function _fetchRatePage(url){
  const attempts=[];
  if(auth.currentUser){
    try{
      const token=await auth.currentUser.getIdToken();
      attempts.push(()=>fetch(RATE_PROXY_URL+encodeURIComponent(url),
        {headers:{Authorization:'Bearer '+token}, signal:AbortSignal.timeout(30000)}));
    }catch(e){ console.warn('[Currency] no ID token:',e.message); }
  }
  attempts.push(()=>fetch(RATE_PROXY_FALLBACK+encodeURIComponent(url),
    {signal:AbortSignal.timeout(15000)}));
  let last='';
  for(const go of attempts){
    try{
      const resp=await go();
      if(!resp.ok){ last='HTTP '+resp.status; continue; }
      const html=await resp.text();
      if(html && html.length>200) return html;
      last='empty response';
    }catch(e){ last=e.name==='TimeoutError'?'timed out':(e.message||'failed'); }
  }
  throw new Error(last||'no rate source available');
}

async function _fetchCurrencyRate(code){
  if(code==='USD') return 1;
  if(_currencyRateCache[code]) return _currencyRateCache[code];
  const url=_COINMILL_URLS[code];
  if(!url) return null;
  try{
    const html=await _fetchRatePage(url);
    // coinmill pages phrase the rate as "1 XXX = Y.YYYYY USD" somewhere in the text
    let m = html.match(new RegExp('1\\s*'+code+'\\s*=\\s*([\\d,]+\\.?\\d*)\\s*USD','i'));
    if(!m) m = html.match(/=\s*([\d,]+\.\d+)\s*USD/i);
    if(m){
      const rate=parseFloat(m[1].replace(/,/g,''));
      if(rate>0){ _currencyRateCache[code]=rate; return rate; }
    }
  }catch(e){ console.warn('[Currency] rate fetch error:',code,e.message); }
  return null;
}

// Parses a raw price (may include a currency symbol/code) and converts to a plain USD number.
// If currencyOverride is given (e.g. from a separate "Currency" column, common in Priority ERP
// exports where the amount itself is a bare number and the currency lives in its own column),
// that takes precedence over symbol-sniffing the price string.
// Returns null if the value can't be parsed at all. Falls back to the raw number (unconverted)
// if a live rate can't be fetched, so an import never blocks on network issues.
async function _convertToUSD(raw, currencyOverride=''){
  const s=String(raw||'').trim();
  if(!s) return null;
  const num=parseFloat(s.replace(/[^\d.\-]/g,''));
  if(isNaN(num)) return null;
  const cur=currencyOverride ? (_normalizeCurrencyCode(currencyOverride)||_detectCurrency(s)) : _detectCurrency(s);
  if(cur==='USD') return num;
  const rate=await _fetchCurrencyRate(cur);
  if(!rate){ console.warn('[Currency] no rate for',cur,'- keeping original value'); return num; }
  return Math.round(num*rate*10000)/10000;
}

function _fcParsePriceBreaks(texts){
  const breaks=[];
  // Strategy A: "N+ $X.XX" pairs inline
  for(const t of texts){
    const re=/([\d,]+)\s*\+?\s*\$\s*([\d,]+\.\d+)/g; let m;
    while((m=re.exec(t))!==null){
      const qty=parseInt(m[1].replace(/,/g,''));
      const price=parseFloat(m[2].replace(/,/g,''));
      if(qty>0&&price>0) breaks.push([qty,price]);
    }
  }
  // Strategy B: adjacent qty/price cells
  if(!breaks.length){
    for(let i=0;i<texts.length-1;i++){
      const qm=texts[i].trim().match(/^([\d,]+)$/);
      if(qm){
        const nxt=texts[i+1];
        const pm=nxt.match(/\$\s*([\d,]+\.\d+)/)||nxt.trim().match(/^(\d+\.\d{2,4})$/);
        if(pm){
          const qty=parseInt(qm[1].replace(/,/g,''));
          const price=parseFloat(pm[1].replace(/,/g,''));
          if(qty>0&&price>0){breaks.push([qty,price]);i++;}
        }
      }
    }
  }
  // Strategy C: first dollar amount = unit price
  if(!breaks.length){
    for(const t of texts){
      const m=t.match(/\$\s*([\d,]+\.\d+)/);
      if(m){breaks.push([1,parseFloat(m[1].replace(/,/g,''))]);break;}
      const m2=t.trim().match(/^(\d+\.\d{2,4})$/);
      if(m2){breaks.push([1,parseFloat(m2[1])]);break;}
    }
  }
  breaks.sort((a,b)=>a[0]-b[0]);
  const seen=new Set(),result=[];
  for(const [qty,price] of breaks){if(!seen.has(qty)){seen.add(qty);result.push([qty,price]);}}
  return result;
}

// FindChips lists length-based parts (cables, wire, etc.) in FEET, but our BOMs
// store length quantities in mm (the system's sole canonical length unit —
// see _normalizeUnitQty). Before searching FindChips for a length-unit part,
// convert the local qty to feet so the nearest price-break match is against
// the right scale — otherwise e.g. a 2500mm cable would be searched as "2500"
// and match a price break meant for 2500 feet, not 2500mm (~8.2 ft).
// gr (grams) is treated the same as mm here per business rule — it's a bulk-
// material quantity, not a per-piece count, so it gets the same non-"pc"
// lookup treatment. "pc" (and anything unrecognized) passes through unchanged.
function _priceTargetQty(qty, unit){
  const u=String(unit||'').trim().toLowerCase();
  const n=parseFloat(qty)||0;
  if(u==='mm'||u==='gr') return Math.max(1, Math.round(n*0.00328084));
  return Math.max(1, Math.round(n)||1);
}

function _fcNearestBreakPrice(breaks,targetQty){
  if(!breaks.length) return '';
  let [bestQty,bestPrice]=breaks[0];
  let bestDist=Math.abs(targetQty-bestQty);
  for(const [qty,price] of breaks.slice(1)){
    const dist=Math.abs(targetQty-qty);
    if(dist<bestDist||(dist===bestDist&&qty<bestQty)){bestDist=dist;bestQty=qty;bestPrice=price;}
  }
  return '$'+bestPrice.toFixed(4).replace(/\.?0+$/,'');
}

// Canonical distributor names, matched against the section "haystack" (visible
// name + class + id + data-* attributes). Ordered most-specific-first.
const _FC_DISTRIBUTORS=[
  [/digi-?\s*key/, 'DigiKey'],
  [/mouser/,       'Mouser'],
  [/arrow/,        'Arrow'],
  [/avnet/,        'Avnet'],
  [/newark|farnell|element ?14/, 'Newark'],
  [/rs[-_ ]?(components|online|delivers)/, 'RS Components'],
  [/\btti\b/,      'TTI'],
  [/heilind/,      'Heilind'],
  [/future ?electronics/, 'Future Electronics'],
  [/verical/,      'Verical'],
  [/onlinecomponents/, 'OnlineComponents'],
  [/bisco/,        'Bisco'],
  [/allied/,       'Allied'],
];
function _fcPrettyDistributor(haystack){
  for(const [re,name] of _FC_DISTRIBUTORS) if(re.test(haystack)) return name;
  // Last resort: pull a readable slug out of a class like "distributor-results-mouser"
  const m=String(haystack||'').match(/distributor[-_]results[-_]([a-z0-9]+)/);
  return m ? m[1].charAt(0).toUpperCase()+m[1].slice(1) : '';
}
// Looks up one part with the Mouser + DigiKey APIs and normalises the answer
// into the shape the rest of the app expects. Returns per-vendor entries plus
// `best` (the cheaper of the two) — never throws for "not found", which is a
// legitimate answer, only for an actual transport/credential failure.
async function lookupPartPrices(partNumber, qty=0, desc=''){
  const data=await _apiPriceLookup(partNumber, qty||1, desc);
  if(!data) return {mouser:null, digikey:null, best:null, errors:[]};
  // Keep an entry whenever the vendor LISTS the part, even at price 0.
  // A non-stocked or quote-only part still answers the question "does this
  // exist and where?", and dropping it was reporting real parts as missing.
  const norm=v=>v ? {
    price:+v.price||0, stock:v.stock||'0', url:v.url||'', mpn:v.mpn||'',
    manufacturer:v.manufacturer||'',
    breakQty:v.breakQty||0, exact:v.exactMatch!==false, status:v.status||'',
    // How many products shared this part number, and how well the winner's
    // description matched ours. considered>1 means a choice was made.
    considered:v.considered||1, descScore:v.descScore||0, desc:v.desc||'',
    candidates:Array.isArray(v.candidates)?v.candidates:[],
    chosenBy:v.chosenBy||'',
  } : null;
  const mouser=norm(data.mouser), digikey=norm(data.digikey);
  const listed=[mouser&&{...mouser,name:'Mouser'}, digikey&&{...digikey,name:'DigiKey'}].filter(Boolean);
  // "best" = cheapest among those that actually quoted a price; if nobody did,
  // fall back to any listing so the caller still gets stock and a link.
  const priced=listed.filter(v=>v.price>0);
  const best = priced.length ? priced.reduce((a,b)=>b.price<a.price?b:a)
             : (listed[0]||null);
  return {mouser, digikey, best, listed, errors:data.errors||[]};
}

// mode: 'parts' → save to Firestore allParts; 'sd' → update sdItems in memory
//
// Runs lookups CONCURRENTLY. The old sequential loop with a 400ms pause between
// parts existed to avoid hammering a site we were scraping without permission;
// against the vendors' own APIs that caution is pointless, and it made a 13-part
// check take the better part of a minute. The pool below is deliberately small
// so we stay well inside Mouser's per-minute rate limit — going wider risks
// HTTP 429s that would make the whole run slower, not faster.
const PRICE_CHECK_CONCURRENCY = 5;

async function runFCCheckModal(items, mode){
  if(!items.length){toast('No parts to check','error');return;}
  let stopped=false;
  const total=items.length;

  const money=v=>v>0?('$'+(+v).toFixed(2)):'';
  // Unit prices need more places than line totals: a connector at $0.0032 and
  // one at $0.0089 are both "$0.00" at two decimals, which would make the QVL
  // comparison tooltip look like it picked at random.
  const moneyUnit=v=>v>0?('$'+(+v).toFixed(4).replace(/\.?0+$/,'')):'';
  // Every price column in this modal shows the TOTAL for the row's quantity,
  // not a per-unit figure. That's the number being decided on, and it's the
  // only basis on which the three sources are comparable at all: Priority
  // quotes cable per METRE while the distributors quote per FOOT, so ranking
  // per-unit numbers made Priority look ~3x dearer than it is.
  const _lineCost=(it,field,price)=>{
    const p=parseFloat(price)||0;
    if(!p) return 0;
    return _sdLineCost({qty:it.qty, unit:it.unit, [field]:p}, field);
  };

  showModal(`<div class="modal" style="width:min(96vw,900px)">
    <div class="modal-head"><h3>🔍 Check Price</h3><button class="close-modal" id="fc-close-x">✕</button></div>
    <div class="modal-body" id="fc-modal-body">
      <div class="ai-status" style="margin-bottom:8px"><div class="ring"></div><span id="fc-status">Starting…</span></div>
      <div class="progress-bar"><div class="progress-fill" id="fc-prog"></div></div>
      <div style="max-height:340px;overflow:auto;margin-top:12px">
        <table style="width:100%;font-size:12px" id="fc-res-table">
          <thead><tr style="position:sticky;top:0;background:#fff">
            <th>MNF P/N</th><th>Manufacturer</th><th>QTY</th>
            <th title="Total for the row's QTY, not a per-unit price">Mouser</th>
            <th title="Units Mouser has on hand">Mouser Stock</th>
            <th title="Total for the row's QTY, not a per-unit price">DigiKey</th>
            <th title="Units DigiKey has on hand">DigiKey Stock</th>
            <th title="Total for the row's QTY, not a per-unit price">Priority</th>
            <th>Status</th>
          </tr></thead>
          <tbody id="fc-res-tbody">
            ${items.map((it,i)=>`<tr id="fc-row-${i}">
              <td id="fc-pn-${i}">${esc(it.part_number)}${(it.alt_mpns||[]).length>1
                ? `<span style="margin-left:5px;padding:1px 5px;border-radius:8px;background:#EDE9FE;color:#5B21B6;font-size:9px;font-weight:700" title="${esc((it.alt_mpns||[]).map(a=>a.mpn).join('\n'))}">${(it.alt_mpns||[]).length} QVL</span>`
                : ''}</td>
              <td id="fc-mf-${i}" style="color:var(--muted)">${esc(it.manufacturer||'')||'—'}</td>
              <td>${it.qty||1}</td>
              <td id="fc-mo-${i}" style="color:var(--muted)">—</td>
              <td id="fc-ms-${i}" style="color:var(--muted)">—</td>
              <td id="fc-dk-${i}" style="color:var(--muted)">—</td>
              <td id="fc-ds-${i}" style="color:var(--muted)">—</td>
              <td id="fc-pr-${i}" style="color:var(--muted)">${money(_lineCost(it,'priority_price',parseFloat(it.priority_price)||0))||'—'}</td>
              <td id="fc-st-${i}"><span class="ring" style="width:12px;height:12px;border-width:2px;display:inline-block;vertical-align:middle"></span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <!-- Legend. The status glyphs and the price colours both carry meaning
           that isn't guessable, and this modal is exactly where a user meets
           them for the first time. Kept on one compact block so it explains
           without competing with the results above. -->
      <div style="margin-top:10px;padding:9px 11px;background:var(--bg,#F8FAFC);border:1px solid var(--border);border-radius:6px;font-size:11px;line-height:1.9;color:var(--muted)">
        <div style="display:flex;flex-wrap:wrap;gap:6px 18px">
          <span><strong style="color:var(--green)">✓</strong> found, with a price</span>
          <span><strong style="color:var(--green)">✓ ≈</strong> found under a differently formatted part number — hover to see which</span>
          <span><strong style="color:#B45309">◑</strong> in the catalogue, but no published price (non-stocked / quote-only)</span>
          <span><strong>Not found</strong> neither vendor lists this part number</span>
          <span><strong style="color:var(--red)">red text</strong> the lookup failed — hover for the reason</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px;border-top:1px dashed var(--border);padding-top:5px">
          <span><strong>Prices are the TOTAL for the row's QTY</strong>, not per unit — that's the only basis on which the three sources compare (Priority quotes per metre, the distributors per foot)</span>
          <span><strong style="color:var(--green)">green</strong> = cheapest of the three, <strong style="color:var(--red)">red</strong> = dearest</span>
          <span><strong>Stock 0</strong> = that vendor carries it but has none on hand; <strong>—</strong> = that vendor doesn't list it</span>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="btn-fc-stop">Stop</button>
      <span id="fc-summary" style="font-size:12px;color:var(--muted)"></span>
    </div>
  </div>`);

  const _fcRefresh=()=>{ if(mode==='parts'){allParts=[];renderPartStock();}else{renderSalesDesk();} };
  document.getElementById('btn-fc-stop').addEventListener('click',()=>{stopped=true;closeModal();_fcRefresh();});
  document.getElementById('fc-close-x').addEventListener('click',()=>{stopped=true;closeModal();_fcRefresh();});

  let done=0, found=0, failures=0, lastError='';
  // Distinct API-side problems (bad credentials, vendor outage), collected so
  // the run summary names each once instead of repeating it per part.
  const apiErrors=new Set();

  // Colour the three price cells against each other, same rule as the tables:
  // cheapest green, dearest red. Priority is included so the comparison the
  // user actually cares about — "is the distributor cheaper than our ERP?" —
  // is answerable without leaving this modal.
  const paintRow=(i, dk, mo, pr)=>{
    const vals=[dk,mo,pr].filter(v=>v>0);
    const lo=vals.length?Math.min(...vals):0, hi=vals.length?Math.max(...vals):0;
    const put=(id,v)=>{
      const el=document.getElementById(id); if(!el) return;
      if(!(v>0)){ el.textContent='—'; el.style.color='var(--muted)'; return; }
      el.textContent=money(v);
      el.style.color = vals.length<2 ? 'var(--text)'
                     : (v<=lo ? 'var(--green)' : (v>=hi ? 'var(--red)' : 'var(--text)'));
      el.style.fontWeight = (vals.length>1 && v<=lo) ? '700' : '400';
    };
    put(`fc-dk-${i}`,dk); put(`fc-mo-${i}`,mo); put(`fc-pr-${i}`,pr);
  };

  const setStatus=(i,txt,color='var(--muted)',title='')=>{
    const el=document.getElementById(`fc-st-${i}`);
    if(el) el.innerHTML=`<span style="color:${color};font-size:11px${title?';cursor:help':''}"${title?` title="${esc(title)}"`:''}>${txt}</span>`;
  };
  const tick=()=>{
    done++;
    const prog=document.getElementById('fc-prog');
    if(prog) prog.style.width=Math.round(100*done/total)+'%';
    const stEl=document.getElementById('fc-status');
    if(stEl) stEl.textContent=`Checked ${done}/${total}…`;
    const sumEl=document.getElementById('fc-summary');
    if(sumEl) sumEl.textContent=`${done}/${total} checked, ${found} prices found${failures?`, ${failures} failed`:''}`;
  };

  async function checkOne(it, i){
    if(stopped) return;
    setStatus(i,'⏳');
    const prPrice=parseFloat(it.priority_price)||0;
    try{
      // Labels/markers aren't catalogue parts — no distributor lists them, so
      // skip the network round-trip and use the agreed nominal price.
      if(/\b(label|marker)\b/i.test(it.description||'')){
        setStatus(i,'✓ nominal','var(--muted)','Labels/markers use a fixed $0.2 price');
        return;
      }
      const targetQty=_priceTargetQty(it.qty, it.unit);

      // ── Qualified Vendor List: price every approved alternative ──
      // A QVL names several manufacturer part numbers that the CUSTOMER has
      // already approved as interchangeable for one of their part numbers.
      // Since any of them may be bought, the correct quote is the cheapest —
      // pricing only the first (as this used to) could quote a part that costs
      // several times what an equally-approved alternative does.
      const alts=(it.alt_mpns||[]).filter(a=>a&&a.mpn);
      const candidates = alts.length>1 ? alts.map(a=>a.mpn) : [it.part_number];

      let pick=null;              // {res, pn, price, listed}
      const compared=[];          // for the tooltip: what was checked, and what it cost
      for(const cpn of candidates){
        if(stopped) return;
        let c=null;
        try{
          c=await lookupPartPrices(cpn, targetQty, it.description||'');
        }catch(e){
          compared.push({pn:cpn, error:e.message});
          // With one candidate there's nothing to fall back to, so the row
          // fails as before. With several, a single dead alternative must not
          // discard the others.
          if(candidates.length===1) throw e;
          continue;
        }
        for(const m of (c.errors||[])) apiErrors.add(m);
        const price = (c.best && c.best.price>0) ? c.best.price : 0;
        compared.push({pn:cpn, price, found:!!c.best});
        const cand={res:c, pn:cpn, price, listed:!!c.best};
        if(!pick) pick=cand;
        else if(cand.price>0 && (pick.price===0 || cand.price<pick.price)) pick=cand;   // cheaper wins
        else if(pick.price===0 && !pick.listed && cand.listed) pick=cand;               // listed beats missing
      }

      const r = pick ? pick.res : {mouser:null, digikey:null, best:null, listed:[], errors:[]};
      const chosenPn = pick ? pick.pn : it.part_number;
      const chosenMfr = (alts.find(a=>a.mpn===chosenPn)||{}).manufacturer || '';
      const priced=compared.filter(c=>c.price>0);
      const savedVs = priced.length>1 ? Math.max(...priced.map(c=>c.price)) : 0;

      // Show the winner in place of the provisional first pick.
      if(candidates.length>1){
        const pnEl=document.getElementById(`fc-pn-${i}`);
        if(pnEl){
          const lines=compared.map(c=>
            `${c.pn} — ${c.error?('error: '+c.error):(c.price>0?moneyUnit(c.price)+' /unit':(c.found?'listed, no price':'not found'))}`
          ).join('\n');
          pnEl.innerHTML=`${esc(chosenPn)}<span style="margin-left:5px;padding:1px 5px;border-radius:8px;background:#DCFCE7;color:#166534;font-size:9px;font-weight:700;cursor:help" title="${esc('Cheapest of '+candidates.length+' QVL-approved alternatives:\n\n'+lines)}">best of ${candidates.length}</span>`;
        }
      }

      const dkNum = r.digikey ? r.digikey.price : '';
      const moNum = r.mouser  ? r.mouser.price  : '';
      // Stored per-unit (that's what the columns elsewhere hold), displayed as
      // the line total for this row's quantity.
      paintRow(i,
        _lineCost(it,'digikey_price',dkNum),
        _lineCost(it,'mouser_price',moNum),
        _lineCost(it,'priority_price',prPrice));

      // Stock PER VENDOR. A single "Stock" column showed only whichever vendor
      // won on price, so you could not tell whether the other one had any —
      // which is the first thing you need when the cheapest source is empty.
      // 0 stays meaningful ("they carry it, none on hand"), distinct from blank
      // ("this vendor doesn't list it").
      const stockOf = v => v ? String(parseInt(v.stock,10)||0) : '';
      const mouserStock  = stockOf(r.mouser);
      const digikeyStock = stockOf(r.digikey);
      const paintStock=(id,val)=>{
        const el=document.getElementById(id); if(!el) return;
        if(val===''){ el.textContent='—'; el.style.color='var(--muted)'; el.title=''; return; }
        const n=parseInt(val,10)||0;
        el.textContent=n>0?n.toLocaleString():'0';
        el.style.color = n>0 ? 'var(--text)' : '#B45309';
        el.title = n>0 ? '' : 'Listed by this vendor, none currently in stock';
      };
      paintStock(`fc-ms-${i}`, mouserStock);
      paintStock(`fc-ds-${i}`, digikeyStock);

      if(!r.best){
        setStatus(i,'Not found','var(--muted)',
          'Neither Mouser nor DigiKey lists this part number.');
        return;
      }
      found++;
      // Three things worth telling apart in one glyph:
      //   ✓   priced, exact part-number match
      //   ✓ ≈ priced, matched under a differently formatted MPN
      //   ◑   listed but no price quoted (non-stocked / quote-only)
      const noPrice = !(r.best.price>0);
      const glyph = noPrice ? '◑' : (r.best.exact?'✓':'✓ ≈');
      let tip = noPrice
        ? `Listed by ${r.best.name} as "${r.best.mpn}"${r.best.status?` (${r.best.status})`:''} but no price is published — usually non-stocked or quote-only.`
        : (r.best.exact ? '' : `Matched ${r.best.name} part "${r.best.mpn}" — punctuation/zero-padding differs from "${it.part_number}"`);
      if(savedVs>pick.price){
        tip=(tip?tip+'\n\n':'')+`Cheapest QVL alternative: ${moneyUnit(pick.price)}/unit vs ${moneyUnit(savedVs)}/unit for the dearest approved option.`;
      }
      setStatus(i, glyph, noPrice?'#B45309':'var(--green)', tip);

      // The distributor knows the real manufacturer; our rows frequently don't
      // (a PDF BOM often omits it). Fill it in ONLY when we have nothing —
      // never overwrite a name that came from the customer's own QVL sheet,
      // which is the authoritative source when it exists.
      const vendorMfr=(r.best && r.best.manufacturer) || '';
      const newMfr = (!String(it.manufacturer||'').trim() && vendorMfr) ? vendorMfr : '';
      if(newMfr){
        it.manufacturer=newMfr;
        const mfEl=document.getElementById(`fc-mf-${i}`);
        if(mfEl){ mfEl.textContent=newMfr; mfEl.style.color='var(--text)'; }
      }

      // Match quality, per vendor, recorded on the row. Until now this lived
      // only in the Check Price modal's status column and vanished the moment
      // it was closed — so whoever later read the price had no way to tell a
      // quote for the EXACT part from one matched under a differently
      // formatted part number. On a quote that difference matters.
      //   'exact'   — priced, part number matched exactly
      //   'approx'  — priced, matched ignoring punctuation/zero-padding
      //   'noprice' — vendor lists the part but publishes no price
      //   ''        — vendor doesn't list it
      const matchCode=v=>!v ? '' : (!(v.price>0) ? 'noprice' : (v.exact ? 'exact' : 'approx'));
      const matchFields={
        mouser_match:  matchCode(r.mouser),
        mouser_mpn:    r.mouser  ? (r.mouser.mpn||'')  : '',
        mouser_mfr:    r.mouser  ? (r.mouser.manufacturer||'') : '',
        mouser_alts:   r.mouser  ? (r.mouser.considered||1) : 0,
        mouser_desc:   r.mouser  ? String(r.mouser.desc||'').slice(0,160) : '',
        // What was compared, so the tooltip can show the actual choice instead
        // of just asserting one was made. Capped for Firestore's document size.
        mouser_by:     r.mouser  ? (r.mouser.chosenBy||'') : '',
        mouser_cands:  r.mouser  ? (r.mouser.candidates||[]).slice(0,6).map(c=>({
                         pn:String(c.pn||'').slice(0,60), mfr:String(c.mfr||'').slice(0,40),
                         desc:String(c.desc||'').slice(0,90), score:c.score||0,
                         price:+c.price||0})) : [],
        digikey_match: matchCode(r.digikey),
        digikey_mpn:   r.digikey ? (r.digikey.mpn||'') : '',
        digikey_mfr:   r.digikey ? (r.digikey.manufacturer||'') : '',
        digikey_alts:  r.digikey ? (r.digikey.considered||1) : 0,
        digikey_desc:  r.digikey ? String(r.digikey.desc||'').slice(0,160) : '',
        digikey_by:    r.digikey ? (r.digikey.chosenBy||'') : '',
        digikey_cands: r.digikey ? (r.digikey.candidates||[]).slice(0,6).map(c=>({
                         pn:String(c.pn||'').slice(0,60), mfr:String(c.mfr||'').slice(0,40),
                         desc:String(c.desc||'').slice(0,90), score:c.score||0,
                         price:+c.price||0})) : [],
      };

      const stockFields={ mouser_stock:mouserStock, digikey_stock:digikeyStock };
      // Legacy single field kept in step with the winning vendor so older rows
      // and any code still reading `stock` don't suddenly go blank.
      const stock=String(r.best ? (parseInt(r.best.stock,10)||0) : 0);
      if(mode==='parts'){
        if(it._id){
          try{
            const patch={
              mouser_price:moNum, digikey_price:dkNum, ...matchFields, ...stockFields,
              stock, updatedAt:serverTimestamp(), qty:1
            };
            if(newMfr) patch.manufacturer=newMfr;
            // The cheapest approved alternative becomes the part we quote.
            if(candidates.length>1 && chosenPn && chosenPn!==it.part_number){
              patch.part_number=chosenPn;
              if(chosenMfr) patch.manufacturer=chosenMfr;
            }
            await updateDoc(doc(db,'companies',companyId,'parts_cache',it._id),patch);
            const ap=allParts.find(p=>p._id===it._id);
            if(ap){
              ap.mouser_price=moNum; ap.digikey_price=dkNum; ap.stock=stock;
              Object.assign(ap, matchFields, stockFields);
              if(newMfr) ap.manufacturer=newMfr;
              if(patch.part_number){ ap.part_number=patch.part_number; ap.manufacturer=chosenMfr||ap.manufacturer; }
            }
          }catch(e){ console.warn('price save error:',e.message); }
        }
      } else if(mode==='sd'){
        const sdIdx=it._sdIdx;
        if(sdIdx!==undefined&&sdItems[sdIdx]){
          sdItems[sdIdx].mouser_price=moNum;
          sdItems[sdIdx].digikey_price=dkNum;
          Object.assign(sdItems[sdIdx], matchFields, stockFields);
          if(newMfr) sdItems[sdIdx].manufacturer=newMfr;
          if(candidates.length>1 && chosenPn && chosenPn!==sdItems[sdIdx].part_number){
            sdItems[sdIdx].part_number=chosenPn;
            if(chosenMfr) sdItems[sdIdx].manufacturer=chosenMfr;
          }
          _sdRecalcTotal(sdItems[sdIdx]);
        }
        // Mirror into the Database so the next quote starts from a known price.
        try{
          const pn=(it.part_number||'').trim();
          if(pn){
            const existing=allParts.find(p=>String(p.part_number||'').toLowerCase()===pn.toLowerCase());
            if(existing){
              const sdPatch={
                mouser_price:moNum, digikey_price:dkNum, ...matchFields, ...stockFields,
                stock, updatedAt:serverTimestamp(), qty:1
              };
              if(newMfr) sdPatch.manufacturer=newMfr;
              await updateDoc(doc(db,'companies',companyId,'parts_cache',existing._id),sdPatch);
              existing.mouser_price=moNum; existing.digikey_price=dkNum; existing.stock=stock;
              Object.assign(existing, matchFields, stockFields);
              if(newMfr) existing.manufacturer=newMfr;
            } else {
              const key=pn.replace(/[\/\\#\[\]*?]/g,'_').slice(0,500);
              await setDoc(doc(db,'companies',companyId,'parts_cache',key),{
                part_number:pn, description:'', drawing_number:'', manufacturer:newMfr||'',
                unit:'', atlantium_pn:'', qty:1, stock, ...matchFields, ...stockFields,
                mouser_price:moNum, digikey_price:dkNum,
                price_description:'', updatedAt:serverTimestamp()
              },{merge:true});
              allParts.push({_id:key, part_number:pn, qty:1, stock, ...matchFields, ...stockFields,
                mouser_price:moNum, digikey_price:dkNum, manufacturer:newMfr||''});
            }
          }
        }catch(e){ console.warn('price->Database save error:',e.message); }
      }
    }catch(e){
      failures++;
      lastError=e.message||String(e);
      const short=lastError.length>50?lastError.slice(0,50)+'…':lastError;
      setStatus(i, esc(short), 'var(--red)', lastError);
      console.warn('price check error',it.part_number,lastError);
    }
  }

  // Fixed-size worker pool: each worker pulls the next index until they run out.
  // Simpler than batching and keeps every slot busy even when one part is slow.
  let next=0;
  const worker=async()=>{
    while(!stopped){
      const i=next++;
      if(i>=items.length) return;
      await checkOne(items[i], i);
      tick();
    }
  };
  await Promise.all(Array.from({length:Math.min(PRICE_CHECK_CONCURRENCY,total)}, worker));

  const prog=document.getElementById('fc-prog'); if(prog) prog.style.width='100%';
  const stEl=document.getElementById('fc-status');
  if(stEl){
    stEl.textContent=`Done — ${found}/${total} prices found${failures?`, ${failures} failed`:''}`;
    // If EVERY part failed it's an outage or a credential problem, not a data
    // problem — say so plainly instead of leaving the user guessing.
    if(failures===total && total>0){
      stEl.innerHTML=`<span style="color:var(--red)">Price check failed for all ${total} part(s) — ${esc(lastError)}</span>`;
    }
    // Deliberately NOT warned about: a vendor with no credentials at all.
    // Running with only one of the two is a supported setup, and nagging on
    // every check would train the user to ignore this line — including when it
    // says something that matters.
    for(const m of [...apiErrors]) if(/no (api key|credentials) configured/i.test(m)) apiErrors.delete(m);
    if(apiErrors.size){
      const note=document.createElement('div');
      note.style.cssText='margin-top:6px;font-size:11px;color:#92400e';
      note.textContent='Mouser/DigiKey API: '+[...apiErrors].slice(0,3).join(' · ');
      stEl.parentElement?.appendChild(note);
    }
  }
  const stopBtn=document.getElementById('btn-fc-stop');
  if(stopBtn){stopBtn.textContent='Close';stopBtn.className='btn btn-green';
    stopBtn.onclick=()=>{closeModal();_fcRefresh();};
  }
  const ringEl=document.querySelector('#fc-modal-body .ring');
  if(ringEl){ringEl.style.cssText='width:16px;height:16px;border-radius:50%;background:#1B6B3A;border:none;animation:none;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;line-height:1';ringEl.textContent='✓';}
  // Audit trail for every price check — success AND failure, so a run that
  // found nothing is distinguishable from one that never reached the vendors.
  logSystemAudit('price_check',{
    screen: mode==='parts'?'Database':'Sales Desk',
    checked: done, found, failed: failures, stopped,
    ...(failures?{error:lastError}:{})
  }, failures!==total || total===0);
}

// ── PRIORITY IMPORT — Excel (part_number + price) → Part Stock priority_price ─
// ══════════════════════════════════════════════════════════════════════════════
const _PN_HEADER_HINTS=['part number','part_number','partnumber','pn','p/n','מק"ט','מקט','catalog','item number','item no','cat no','cat#'];
const _PRICE_HEADER_HINTS=['price','unit price','מחיר','cost','rate'];
const _CURRENCY_HEADER_HINTS=['currency','curr','מטבע'];
const _UNIT_HEADER_HINTS=['unit','units','uom','u/m','יחידה','יחידות',"יח'",'יח'];
const _DESC_HEADER_HINTS=['description','desc','product description','part description','name','item name','תיאור','תאור','שם פריט','שם מוצר'];

// Priority ERP exports label their units column ("יח'") with these Hebrew/
// English tokens rather than pc/mm/gr directly — map them to our 3 canonical
// units. This is a straight label mapping (not a qty rescale): Priority
// import rows carry a per-part unit-of-measure label, not a quantity value.
//   יח' / יח / K / טר  → pc
//   מטר (meter)        → mm
//   רגל (foot)         → mm
//   מל                 → gr
// Anything else falls back to the general system-wide canonical fold (covers
// the case where Priority already exported pc/mm/gr/M/EA/cm/etc. directly).
function _priorityMapUnit(raw){
  const s=String(raw||'').trim();
  if(!s) return '';
  if(s==="יח'"||s==='יח'||s.toLowerCase()==='k'||s==='טר') return 'pc';
  if(s==='מטר') return 'mm';
  if(s==='רגל') return 'mm';
  if(s==='מל') return 'gr';
  return _normalizeUnitQty(1, s).unit;
}

function _priorityFindCol(headers, hints){
  const norm=headers.map(h=>String(h||'').trim().toLowerCase());
  for(const hint of hints){
    const idx=norm.findIndex(h=>h===hint);
    if(idx>=0) return idx;
  }
  for(const hint of hints){
    const idx=norm.findIndex(h=>h.includes(hint));
    if(idx>=0) return idx;
  }
  return -1;
}

// Parses one worksheet into {rows, headers}. Header list is padded out to the widest row in
// the sheet (Excel pivot-table exports, trailing unlabeled columns, etc. can make row 0
// shorter than later data rows) so every real data column gets its own selectable option in
// the mapping dropdowns.
function _priorityParseSheet(sheet){
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:''});
  const maxCols = rows.reduce((m,r)=>Math.max(m, r.length), 0);
  const headers = Array.from({length:maxCols}, (_,i)=>rows[0][i] ?? '');
  return {rows, headers};
}
// Higher score = more likely to be the real Part Number / Price data table, as opposed to
// e.g. a PivotTable summary sheet (common in Priority ERP exports) that only has a single
// "Row Labels" column and none of our real data.
function _priorityScoreSheet(headers){
  let score=0;
  if(_priorityFindCol(headers,_PN_HEADER_HINTS)>=0) score+=10;
  if(_priorityFindCol(headers,_PRICE_HEADER_HINTS)>=0) score+=10;
  if(_priorityFindCol(headers,_CURRENCY_HEADER_HINTS)>=0) score+=2;
  score += Math.min(headers.length,20)*0.1;
  return score;
}

async function handlePriorityFile(file){
  const body=document.getElementById('pi-modal-body');
  const foot=document.querySelector('#modal-bg .modal-foot');
  body.innerHTML=`<div class="ai-status"><div class="ring"></div><span id="pi-msg">Reading file…</span></div>`;
  foot.innerHTML='';

  try{
    if(!window.XLSX) throw new Error('Excel library not loaded — please reload the page and try again.');
    const ab=await file.arrayBuffer();
    const wb=XLSX.read(ab,{type:'array'});
    if(!wb.SheetNames.length) throw new Error('No sheets found in this file.');

    // Parse EVERY sheet and score it, so multi-sheet workbooks (Priority ERP exports commonly
    // bundle a PivotTable summary sheet — useless here, just "Row Labels" — alongside a
    // "DataSheet" with the real Part Number / Price / Currency columns) default to whichever
    // sheet actually looks like tabular data, instead of blindly using the first sheet.
    const sheetsData = wb.SheetNames.map(name=>{
      const {rows, headers} = _priorityParseSheet(wb.Sheets[name]);
      return {name, rows, headers, score:_priorityScoreSheet(headers)};
    }).filter(s=>s.rows.length>0);
    if(!sheetsData.length) throw new Error('The file appears to be empty.');
    sheetsData.sort((a,b)=>b.score-a.score);

    renderPrioritySheetMapping(sheetsData, sheetsData[0].name, body, foot);
  }catch(e){
    body.innerHTML+=`<p style="color:red;margin-top:12px">Error: ${e.message}</p>`;
    foot.innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
  }
}

// Suggest which column is Part Number (מק"ט), which is Priority Price (מחיר ליחידה), and
// (optionally) which column holds the currency code — Priority ERP exports often keep the
// amount as a bare number with the currency in its own column (e.g. "מטבע שורה": EUR/GBP/ש).
// Also lets the user switch sheets when the workbook has more than one. All pre-selected from
// header detection, but always confirmed by the user before parsing.
function renderPrioritySheetMapping(sheetsData, activeSheetName, body, foot){
  const active = sheetsData.find(s=>s.name===activeSheetName) || sheetsData[0];
  const {rows, headers} = active;

  let pnCol=_priorityFindCol(headers,_PN_HEADER_HINTS);
  let prCol=_priorityFindCol(headers,_PRICE_HEADER_HINTS);
  let curCol=_priorityFindCol(headers,_CURRENCY_HEADER_HINTS);
  let unitCol=_priorityFindCol(headers,_UNIT_HEADER_HINTS);
  const headerDetected = pnCol>=0 || prCol>=0;
  if(pnCol<0) pnCol=0;
  if(prCol<0) prCol=(pnCol===1?0:1);
  if(prCol===pnCol) prCol=(pnCol===0 && headers.length>1)?1:(pnCol>0?0:1);

  const colLabel=(h,i)=>{ const t=String(h||'').trim(); return t?esc(t):`(Column ${i+1})`; };
  const colOpts=(selected)=>headers.map((h,i)=>`<option value="${i}" ${i===selected?'selected':''}>${colLabel(h,i)}</option>`).join('');
  const noneOpts=(selected,label)=>`<option value="-1" ${selected<0?'selected':''}>${label}</option>`+
    headers.map((h,i)=>`<option value="${i}" ${i===selected?'selected':''}>${colLabel(h,i)}</option>`).join('');
  const curOpts=(selected)=>noneOpts(selected,'— None (detect from price text, default USD) —');
  const unitOpts=(selected)=>noneOpts(selected,'— None —');
  const sampleRows=(headerDetected?rows.slice(1):rows).slice(0,3);

  body.innerHTML=`
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px">We suggest the following column mapping — confirm or change before importing:</p>
    ${sheetsData.length>1?`<div class="form-field">
      <label>Sheet</label>
      <select class="form-input" id="pi-sheet-sel">
        ${sheetsData.map(s=>`<option value="${esc(s.name)}" ${s.name===active.name?'selected':''}>${esc(s.name)} (${s.rows.length} rows, ${s.headers.length} cols)</option>`).join('')}
      </select>
    </div>`:''}
    <div class="form-field" style="margin-top:10px">
      <label>MNF P/N column (מק"ט)</label>
      <select class="form-input" id="pi-pn-col">${colOpts(pnCol)}</select>
    </div>
    <div class="form-field" style="margin-top:10px">
      <label>Priority Price column (מחיר ליחידה)</label>
      <select class="form-input" id="pi-price-col">${colOpts(prCol)}</select>
    </div>
    <div class="form-field" style="margin-top:10px">
      <label>Currency column (optional)</label>
      <select class="form-input" id="pi-cur-col">${curOpts(curCol)}</select>
    </div>
    <div class="form-field" style="margin-top:10px">
      <label>Units column (optional)</label>
      <select class="form-input" id="pi-unit-col">${unitOpts(unitCol)}</select>
    </div>
    <div class="form-field" style="margin-top:10px">
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-weight:400;font-size:12px">
        <input type="checkbox" id="pi-has-header" ${headerDetected?'checked':''} style="width:auto">
        First row is a header row (skip it)
      </label>
    </div>
    ${sampleRows.length?`<div style="margin-top:12px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Preview:</div>
      <div class="table-wrap"><table style="font-size:11px">
        <tbody>${sampleRows.map(r=>`<tr>${headers.map((_,i)=>`<td>${esc(String(r[i]??''))}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>`:''}`;

  foot.innerHTML=`
    <button class="btn btn-ghost" id="pi-map-cancel">Cancel</button>
    <button class="btn btn-green" id="pi-map-continue">Continue →</button>`;

  document.getElementById('pi-sheet-sel')?.addEventListener('change',e=>{
    renderPrioritySheetMapping(sheetsData, e.target.value, body, foot);
  });
  document.getElementById('pi-map-cancel').addEventListener('click',closeModal);
  document.getElementById('pi-map-continue').addEventListener('click', async()=>{
    const pnColSel=parseInt(document.getElementById('pi-pn-col').value);
    const prColSel=parseInt(document.getElementById('pi-price-col').value);
    const curColSel=parseInt(document.getElementById('pi-cur-col').value);
    const unitColSel=parseInt(document.getElementById('pi-unit-col').value);
    const skipHeader=document.getElementById('pi-has-header').checked;
    if(pnColSel===prColSel){ toast('MNF P/N and Price columns must be different','error'); return; }

    const btn=document.getElementById('pi-map-continue');
    btn.disabled=true; btn.textContent='Converting…';

    const dataRows=skipHeader?rows.slice(1):rows;
    const parsed=[];
    for(const r of dataRows){
      const pn=String(r[pnColSel]||'').trim();
      const rawPrice=r[prColSel];
      if(!pn || rawPrice===''||rawPrice===undefined||rawPrice===null) continue;
      const rawCur = curColSel>=0 ? r[curColSel] : '';
      const usd=await _convertToUSD(rawPrice, rawCur);
      if(usd===null) continue;
      const unit = unitColSel>=0 ? _priorityMapUnit(r[unitColSel]) : '';
      parsed.push({part_number:pn, priority_price:usd, unit, _raw:String(rawPrice)});
    }

    if(!parsed.length){
      body.innerHTML=`<p style="color:var(--muted);margin-top:10px">No valid MNF P/N + Price rows were detected with this mapping.</p>`;
      foot.innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
      return;
    }

    showPriorityPreview(parsed, body, foot);
  });
}

function showPriorityPreview(rows, body, foot){
  const modalEl=body.closest('.modal');
  if(modalEl){ modalEl.style.width='min(94vw,700px)'; modalEl.style.maxWidth='700px'; }

  const tBody=rows.map((r,i)=>`<tr data-i="${i}">
    <td contenteditable="true" data-k="part_number" data-i="${i}" style="min-width:140px">${esc(r.part_number)}</td>
    <td contenteditable="true" data-k="priority_price" data-i="${i}" style="min-width:90px">${esc(String(r.priority_price))}</td>
    <td contenteditable="true" data-k="unit" data-i="${i}" style="min-width:70px">${esc(r.unit||'')}</td>
    <td><button class="btn btn-red btn-sm" onclick="this.closest('tr').remove()">✕</button></td>
  </tr>`).join('');

  body.innerHTML=`
    <div class="ai-status" style="margin-bottom:10px">
      <div style="width:16px;height:16px;border-radius:50%;background:#1B6B3A;border:none;animation:none;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;line-height:1">✓</div>
      <span>${rows.length} rows parsed (prices converted to $) — click any cell to edit before saving</span>
    </div>
    <div class="table-wrap" style="max-height:calc(85vh - 175px);overflow:auto"><table>
      <thead><tr><th>MNF P/N</th><th>Priority Price ($)</th><th>Units</th><th></th></tr></thead>
      <tbody id="pi-preview-tbody">${tBody}</tbody>
    </table></div>`;

  foot.innerHTML=`
    <button class="btn btn-ghost" id="pi-cancel">Cancel</button>
    <button class="btn btn-green" id="pi-save">💾 Save to Database (${rows.length} rows)</button>`;

  document.getElementById('pi-cancel').addEventListener('click',closeModal);
  document.getElementById('pi-save').addEventListener('click', async()=>{
    const finalRows=[];
    document.querySelectorAll('#pi-preview-tbody tr').forEach(tr=>{
      const pn=tr.querySelector('[data-k="part_number"]')?.textContent.trim()||'';
      const pr=parseFloat(tr.querySelector('[data-k="priority_price"]')?.textContent.trim())||0;
      const unit=tr.querySelector('[data-k="unit"]')?.textContent.trim()||'';
      if(pn) finalRows.push({part_number:pn, priority_price:pr, unit});
    });
    if(!finalRows.length){ toast('No rows to save','error'); return; }
    const btn=document.getElementById('pi-save');
    btn.disabled=true; btn.textContent='Saving…';
    try{
      const {updated, created}=await savePriorityImport(finalRows);
      toast(`Priority Import: ${updated} updated, ${created} created`,'success');
      logAudit('priority_import',{updated,created},true);
      closeModal();
      allParts=[]; renderPartStock();
    }catch(e){ toast('Save error: '+e.message,'error'); logAudit('priority_import',{error:e.message},false); btn.disabled=false; btn.textContent=`💾 Save to Database (${finalRows.length} rows)`; }
  });
}

// Upsert priority prices into parts_cache. Existing part_number → update priority_price;
// unknown part_number → create a new row with just part_number + priority_price.
async function savePriorityImport(rows){
  await loadParts();
  let updated=0, created=0;
  for(const r of rows){
    const pn=r.part_number.trim();
    if(!pn) continue;
    const existing=allParts.find(p=>String(p.part_number||'').toLowerCase()===pn.toLowerCase());
    const unit=_dbNormalizeUnit(r.unit);
    try{
      if(existing){
        const patch={priority_price:r.priority_price, updatedAt:serverTimestamp(), qty:1};
        if(unit) patch.unit=unit;
        await updateDoc(doc(db,'companies',companyId,'parts_cache',existing._id), patch);
        existing.priority_price=r.priority_price; if(unit) existing.unit=unit;
        updated++;
      } else {
        const key=pn.replace(/[\/\\#\[\]*?]/g,'_').slice(0,500);
        await setDoc(doc(db,'companies',companyId,'parts_cache',key),{
          part_number:pn, description:'', drawing_number:'', manufacturer:'',
          unit, atlantium_pn:'', price:'', distributor:'', stock:'', price_description:'', qty:1,
          priority_price:r.priority_price, updatedAt:serverTimestamp()
        },{merge:true});
        allParts.push({_id:key, part_number:pn, priority_price:r.priority_price, unit, qty:1});
        created++;
      }
    }catch(e){ console.warn('[PriorityImport] save error:',pn,e.message); }
  }
  return {updated, created};
}

        ${sheetsData.map(s=>`<option value="${esc(s.name)}" ${s.name===active.name?'selected':''}>${esc(s.name)} (${s.rows.length} rows, ${s.headers.length} cols)</option>`).join('')}
      </select>

      <label>MNF P/N column</label>

    </div>
    <div class="form-field" style="margin-top:10px">
      <label>Description column</label>
      <select class="form-input" id="ti-desc-col">${colOpts(descCol)}</select>
    </div>
    <div class="form-field" style="margin-top:10px">
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-weight:400;font-size:12px">

      </label>

      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Preview:</div>

        <tbody>${sampleRows.map(r=>`<tr>${headers.map((_,i)=>`<td>${esc(String(r[i]??''))}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>`:''}`;

  foot.innerHTML=`
    <button class="btn btn-ghost" id="ti-map-cancel">Cancel</button>
    <button class="btn btn-green" id="ti-map-continue">Continue →</button>`;

  document.getElementById('ti-sheet-sel')?.addEventListener('change',e=>{
    renderToolsSheetMapping(sheetsData, e.target.value, body, foot);
  });
  document.getElementById('ti-map-cancel').addEventListener('click',closeModal);
  document.getElementById('ti-map-continue').addEventListener('click', ()=>{
    const pnColSel=parseInt(document.getElementById('ti-pn-col').value);
    const descColSel=parseInt(document.getElementById('ti-desc-col').value);
    const skipHeader=document.getElementById('ti-has-header').checked;
    if(pnColSel===descColSel){ toast('MNF P/N and Description columns must be different','error'); return; }

    const dataRows=skipHeader?rows.slice(1):rows;
    const parsed=[];
    for(const r of dataRows){
      const pn=String(r[pnColSel]||'').trim();
      const desc=String(r[descColSel]||'').trim();
      if(!pn) continue;
      parsed.push({part_number:pn, description:desc});
    }

    if(!parsed.length){
      body.innerHTML=`<p style="color:var(--muted);margin-top:10px">No valid MNF P/N rows were detected with this mapping.</p>`;
      foot.innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
      return;
    }

    showToolsPreview(parsed, body, foot);
  });
}

function showToolsPreview(rows, body, foot){

  body.innerHTML=`
    <div class="ai-status" style="margin-bottom:10px">
      <div style="width:16px;height:16px;border-radius:50%;background:#1B6B3A;border:none;animation:none;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;line-height:1">✓</div>

      <thead><tr><th>MNF P/N</th><th>Description</th><th></th></tr></thead>

  foot.innerHTML=`

  document.getElementById('ti-cancel').addEventListener('click',closeModal);
  document.getElementById('ti-save').addEventListener('click', async()=>{
    const finalRows=[];
    document.querySelectorAll('#ti-preview-tbody tr').forEach(tr=>{
      const pn=tr.querySelector('[data-k="part_number"]')?.textContent.trim()||'';
      const desc=tr.querySelector('[data-k="description"]')?.textContent.trim()||'';
      if(pn) finalRows.push({part_number:pn, description:desc});
    });
    if(!finalRows.length){ toast('No rows to save','error'); return; }
    const btn=document.getElementById('ti-save');
    btn.disabled=true; btn.textContent='Saving…';
    try{
      const {updated, created}=await saveToolsImport(finalRows);
      toast(`Tools Catalog Import: ${updated} updated, ${created} created`,'success');
      logAudit('tools_catalog_import',{updated,created},true);
      closeModal();
      allParts=[]; renderPartStock();
    }catch(e){ toast('Save error: '+e.message,'error'); logAudit('tools_catalog_import',{error:e.message},false); btn.disabled=false; btn.textContent=`💾 Save to Database (${finalRows.length} rows)`; }
  });
}

// Upsert tool part numbers + descriptions into parts_cache. Existing
// part_number → update description; unknown part_number → create a new row.
// This is deliberately a straight overwrite of description (unlike BOM saves,
// which only fill it in if blank) since the user is explicitly (re-)importing
// a tools catalog and expects its descriptions to take effect.
// own_stock is always set true here — items brought in via this specific
// import are, by definition, tools the company already has in stock (see the
// "Stock" column in _psCellHTML, and Sales Desk's ownership check in
// handleSDFiles, which excludes own_stock=true tool rows from the final price).
async function saveToolsImport(rows){
  await loadParts();
  let updated=0, created=0;
  for(const r of rows){
    const pn=r.part_number.trim();
    if(!pn) continue;
    const existing=allParts.find(p=>String(p.part_number||'').toLowerCase()===pn.toLowerCase());
    try{
      if(existing){
        await updateDoc(doc(db,'companies',companyId,'parts_cache',existing._id),
          {description:r.description||'', own_stock:true, updatedAt:serverTimestamp(), qty:1});
        existing.description=r.description||''; existing.own_stock=true;
        updated++;
      } else {
        const key=pn.replace(/[\/\\#\[\]*?]/g,'_').slice(0,500);
        await setDoc(doc(db,'companies',companyId,'parts_cache',key),{
          part_number:pn, description:r.description||'', drawing_number:'', manufacturer:'',
          unit:'', atlantium_pn:'', price:'', priority_price:'', distributor:'', stock:'', price_description:'', qty:1,
          own_stock:true, updatedAt:serverTimestamp()
        },{merge:true});
        allParts.push({_id:key, part_number:pn, description:r.description||'', own_stock:true, qty:1});
        created++;
      }
    }catch(e){ console.warn('[ToolsImport] save error:',pn,e.message); }
  }
  return {updated, created};
}

// Canonical column order — identical to the Database's (see the Part Stock
// column list) so the same data reads the same way on every screen.
const _SD_DEFAULT_COLS=[
  {k:'drawing_number', l:'Drawing #',       w:'100px'},
  {k:'part_number',    l:'MNF P/N',          w:'110px'},
  {k:'description',    l:'Description',     w:'190px',wrap:true},
  {k:'manufacturer',   l:'Manufacturer',    w:'120px'},
  {k:'qty',            l:'QTY',             w:'75px'},
  {k:'unit',           l:'Units',           w:'55px'},
  {k:'mouser_price',   l:'Mouser Cost',     w:'95px'},
  {k:'mouser_stock',   l:'Mouser Stock',    w:'85px'},
  {k:'digikey_price',  l:'DigiKey Cost',    w:'95px'},
  {k:'digikey_stock',  l:'DigiKey Stock',   w:'85px'},
  {k:'priority_price', l:'Priority Cost',  w:'95px'},
  {k:'total',          l:'Part Cost',       w:'85px'},
  {k:'labor_time',     l:'Labor Time',      w:'85px'},
];
// Length constants for "mm"-unit (length) rows — Priority lists cable/wire
// pricing per METER, while Mouser and DigiKey quote it per FOOT (see
// _priceTargetQty, which already converts mm→feet when looking those prices up).
// A flat qty×price would overshoot by ~1000x for Priority and ~305x for the
// distributors if the row's mm quantity were multiplied straight against either
// price without first converting it into the unit that price is quoted in.
const MM_PER_METER=1000, MM_PER_FOOT=304.8;
// Every price source the app can quote from. Order matters only for tie-breaks.
const _SD_PRICE_SOURCES=['priority_price','mouser_price','digikey_price'];
// Actual dollar cost of this row if priced from `priceField` — for "pc" (and any
// other non-length) rows the price is already per-piece, so qty multiplies
// directly; for "mm" rows the qty is first converted into whatever unit that
// particular source quotes in.
function _sdLineCost(r, priceField){
  const price=parseFloat(r[priceField])||0;
  if(!price) return 0;
  const qty=parseFloat(r.qty)||1;
  const unit=String(r.unit||'').trim().toLowerCase();
  if(unit==='mm'){
    if(priceField==='priority_price') return price*(qty/MM_PER_METER);
    // Mouser and DigiKey both sell bulk wire by the foot.
    return price*(qty/MM_PER_FOOT);
  }
  return price*qty;
}
// Part Cost is directly editable in the table (see _sdCellHTML 'total' case) —
// r.manual_total, when set, is a straight user-typed override of the whole
// line's cost (not a per-unit price), useful when there's no FC/Priority price
// at all or when the user has a better number (e.g. a vendor quote). Clearing
// the field goes back to the normal auto-calculation below.
// Part Cost uses whichever available source produces the LOWEST actual dollar
// cost for this row (mirrors the Windows app's _update_row_total). Compared on
// real cost, never on the sources' raw per-unit numbers: those aren't on the
// same unit basis for mm rows, so a naive min() would pick per-foot over
// per-metre and understate the line by ~3x.
// r._costSource records which one won, so the UI can say where a number came
// from instead of leaving the user to reverse-engineer it.
function _sdRecalcTotal(r){
  if(r.manual_total!=null && r.manual_total!==''){
    r.total=parseFloat(r.manual_total)||0;
    r._costSource='manual';
    return r.total;
  }
  let best=0, bestField='';
  for(const f of _SD_PRICE_SOURCES){
    const c=_sdLineCost(r,f);
    if(c>0 && (best===0 || c<best)){ best=c; bestField=f; }
  }
  // Only if no real source quoted this part: fall back to the AI's crimp-tool
  // estimate. Deliberately last — a real quote always beats a guess, however
  // close the guess looks.
  if(!best){
    const est=_sdLineCost(r,'est_price');
    if(est>0){ best=est; bestField='est_price'; }
  }
  r.total=best;
  r._costSource=bestField;
  return r.total;
}
// Labor Total = labor_time(min) × qty_for_labor, for "pc"-counted rows only —
// mm/gr rows take the flat-1-minute path below instead, so this only ever
// runs for a per-piece count.
function _sdLaborQtyMultiplier(r){
  const qtyNum=parseFloat(r.qty)||0;
  return qtyNum>0 ? qtyNum : 1;
}
function _sdRecalcLaborTotal(r){
  // The Labor Time column in the table is directly user-editable (see
  // _sdCellHTML 'labor_time' case) — once the user types their own number,
  // r._laborManualOverride is set and that number is used as-is here,
  // exactly like Part Cost's manual_total override. Clearing the field goes
  // back to the auto-calculation below.
  if(r._laborManualOverride) return r.labor_total;
  const lt=parseFloat(r.labor_time)||0;
  // A row's labor_time can ALSO be a genuine AI-computed total from the
  // cable-process analysis (see handleSDFiles), where it already equals
  // unit_minutes × qty_in_drawing — the sum of every manufacturing step the
  // AI tied to this specific row (e.g. the main cable row is exactly where
  // "cut and strip", "braid shield", etc. land). That real, drawing-derived
  // total must win over the mm/gr flat-1-minute floor below — checking unit
  // FIRST would silently throw away legitimate computed minutes just because
  // the row happens to be measured in mm/gr, which is exactly the case for a
  // cable/wire row. Do NOT re-multiply by this row's own qty column either:
  // that column may represent a different quantity concept entirely (e.g.
  // "1 connector housing" whose pins are crimped 20 times), so multiplying
  // again here would silently inflate the total.
  if(r._laborFixedTotal){
    r.labor_total = lt;
    return r.labor_total;
  }
  // Length rows (mm — the system's sole canonical length unit) and bulk-weight
  // rows (gr, treated the same as mm per business rule) that DIDN'T get a real
  // AI-computed total (e.g. a plain length-of-wire stock row with no process
  // steps identified) always take a flat 1 minute of labor instead of scaling
  // with a manually-typed rate × the row's mm/gr quantity — prepping this kind
  // of material takes roughly the same setup time no matter the quantity.
  const unit=String(r.unit||'').trim().toLowerCase();
  if(unit==='mm'||unit==='gr'){
    r.labor_total = 1;
    return r.labor_total;
  }
  // A manually-typed Labor Time is always a PER-UNIT rate that scales with
  // the row's own Sales-Desk quantity (e.g. "apply label" × 8 identical
  // rows) — that multiplication happens here.
  r.labor_total = lt>0 ? lt*_sdLaborQtyMultiplier(r) : 0;
  return r.labor_total;
}
function _sdRecalcRow(r){ _sdRecalcTotal(r); _sdRecalcLaborTotal(r); return r; }
const _SD_UNIT_OPTIONS=['','pc','mm','gr'];
const _TOOL_TAG='<span style="margin-inline-start:6px;padding:1px 6px;border-radius:8px;background:#F59E0B;color:#fff;font-size:9px;font-weight:700;vertical-align:middle">TOOL</span>';
function _sdCellHTML(k,r,i){
