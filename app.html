             just sits there and the button looks dead — the user has no way to
             know work is happening, let alone that it's nearly done. -->
        <div id="sd-labor-progress" style="display:none;padding:10px 12px;border-top:1px solid var(--border);
             background:#EFF6FF;color:#1E40AF;font-size:12px;align-items:center;gap:9px">
          <div class="ring" style="width:15px;height:15px;border-width:2px;flex-shrink:0"></div>
          <span id="sd-labor-progress-txt">Estimating labor time…</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <!-- Rendered by _sdRenderSummary(). Costing is per DRAWING now, so
             the panel can't be static markup with fixed ids: the number of
             blocks depends on how many drawings are loaded. -->
        <div id="sd-summary-host" style="display:flex;flex-direction:column;gap:10px"></div>
        <button class="btn btn-green" style="width:100%;padding:10px;justify-content:center" id="btn-sd-export">📊 Export to Excel</button>
      </div>
    </div>`);

  renderSD();
  makeTableResizable(document.getElementById('sd-table'));
  makeColumnsReorderable(document.getElementById('sd-table'),'salesdesk',SD_COLS,()=>renderSalesDesk());
  wireScrollButtons('#sd-table-wrap','sd-scroll-left','sd-scroll-right');
  wireShiftCheck(document.getElementById('sd-table'),'.sd-check');
  document.querySelectorAll('#sd-table thead th[data-col]').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.col;
    if(_sdSortCol===k) _sdSortAsc=!_sdSortAsc; else { _sdSortCol=k; _sdSortAsc=true; }
    renderSalesDesk();
  }));

  // Search box — same AND/OR/NOT/"phrase"/(...) boolean query syntax as the
  // Database table (see parseBoolQuery); renderSD() already reads _sdFilterQ
  // and filters sdItems by it on every call, this just exposes it in the UI.
  const sdSearchInp=document.getElementById('sd-search');
  wireSearchClear('sd-search','sd-search-clear');
  sdSearchInp.addEventListener('input',debounce(()=>{
    _sdFilterQ=sdSearchInp.value;
    renderSD();
  },200));

  // Tools / Labor Time / Profit are per-drawing inputs now, created and wired
  // inside _sdRenderSummary(). The old global handlers pointed at ids that no
  // longer exist and would throw on every Sales Desk render.

  document.getElementById('btn-sd-addpick').addEventListener('click',()=>{
    openPartPickerModal(async(parts,qtyOverride,hadSelection)=>{
      let added=0;
      for(const p of parts){
        const origQty=String(p.qty||'').trim();
        const qty = hadSelection ? ((qtyOverride!==1||!origQty) ? qtyOverride : (parseFloat(origQty)||1)) : (parseFloat(p.qty)||1);
        const item={part_number:p.part_number||'',description:p.description||'',
          // Everything the Database already knows about this part comes across.
          // Re-deriving the manufacturer from a price check when it's sitting
          // right there in the record is wasted work, and leaves the column
          // blank until someone happens to run Check Price.
          manufacturer:p.manufacturer||'',
          alt_mpns:(p.alt_mpns||[]),
          est_price:parseFloat(p.est_price)||0,
          drawing_number:p.drawing_number||p.drawing_name||'',
          qty, unit:p.unit||p.units||'pcs',priority_price:parseFloat(p.priority_price)||0,
          mouser_price:parseFloat(p.mouser_price)||'', digikey_price:parseFloat(p.digikey_price)||'',
          total:0, labor_time:'', labor_total:0};
        _sdRecalcRow(item);
        sdItems.push(item);
        added++;
      }
      renderSalesDesk();
      toast(`Added ${added} part(s) to Sales Desk`,'success');
      logAudit('sales_desk_add_from_picker',{count:added},true);
      // The labor estimate is an AI call, so it takes a moment. Without this
      // the Labor Time column just sits at 0 for a few seconds and looks broken
      // — which is exactly how the old empty stub looked.
      await _sdRunLaborEstimate();
    });
  });

  document.getElementById('btn-sd-clear').addEventListener('click',()=>{
    sdItems=[];_sdFilterQ='';_sdLaborMinutesOverride=null;_sdToolsTotalOverride=null;
    _sdDwgSettings={}; _sdCollapsedRows=new Set();   // per-drawing state must not carry over
    window._sdCollapsedDwgs=new Set(); window._sdCollapseInit=false;
    _sdLaborBreakdowns=[];_sdPendingLaborByKey={};_sdDrawingNotes=[];
    renderSD();
  });
  document.getElementById('btn-sd-newrow').addEventListener('click',()=>{
    sdItems.push({part_number:'',description:'',manufacturer:'',drawing_number:'',qty:1,unit:'',
      priority_price:0,total:0,labor_time:'',labor_total:0});
    renderSD();
  });
  document.getElementById('btn-sd-labor')?.addEventListener('click',async()=>{
    if(!sdItems.length){ toast('No parts in Sales Desk','error'); return; }
    await _sdRunLaborEstimate(true);   // pressing the button IS the confirmation
  });

  document.getElementById('btn-sd-export').addEventListener('click',()=>exportSalesDeskExcel());

  // SD check-all toggle
  document.addEventListener('change',e=>{
    if(e.target.id==='sd-check-all'){
      document.querySelectorAll('.sd-check').forEach(cb=>cb.checked=e.target.checked);
    }
  });

  // SD FindChips button
  document.getElementById('btn-sd-fc').addEventListener('click',()=>{
    const checked=[...document.querySelectorAll('.sd-check:checked')].map(cb=>Number(cb.dataset.i));
    const targets = checked.length
      ? sdItems.filter((_,i)=>checked.includes(i))
      : sdItems;
    const items=targets.filter(r=>r.part_number).map(r=>{
      const sdIdx=sdItems.indexOf(r);
      return{part_number:r.part_number, qty:parseFloat(r.qty)||1, unit:r.unit||'',
        description:r.description||'', _sdIdx:sdIdx};
    });
    if(!items.length){toast('No parts to check','error');return;}
    runFCCheckModal(items,'sd');
  });

  // From File (BOM extraction for Sales Desk)
  document.getElementById('btn-sd-file').addEventListener('click',()=>{
    if(!anthKey){ showSettingsModal(()=>document.getElementById('btn-sd-file')?.click()); return; }
    openSDFileModal();
  });
}

// Full-featured Part Stock picker for Sales Desk — mirrors the Windows app's
// ui/sales_desk_dialog.py _PartPickerDialog: filter by Drawing Number / Drawing
// Name dropdown plus free-text boolean search, multi-select rows (checkboxes),
// an optional QTY-per-part override, and "Add Selected" (or, if nothing is
// checked, every currently-visible row is added — same as Windows).
// onAdd(parts, qtyOverride, hadSelection) is called once, after the modal closes.
function openPartPickerModal(onAdd){
  showModal(`<div class="modal" style="width:min(96vw,1100px)">
    <div class="modal-head"><h3>📦 Select from Database</h3><button class="close-modal" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="toolbar" style="margin-bottom:8px">
        <label style="font-size:12px;color:var(--muted);white-space:nowrap">Filter by:</label>
        <select id="pp-field" class="search-box" style="flex:0 0 auto;width:150px">
          <option value="drawing_number">Drawing Number</option>
          <option value="drawing_name">Drawing Name</option>
        </select>
        <select id="pp-value" class="search-box" style="flex:0 0 auto;min-width:220px">
          <option value="">All</option>
        </select>
        <div class="search-wrap">
          <input class="search-box" id="pp-search" placeholder='Search part number / description — AND/OR/NOT/"phrase"'>
          <button type="button" class="search-clear" id="pp-search-clear" title="Clear">✕</button>
        </div>
      </div>
      <div class="table-wrap" style="max-height:50vh" id="pp-table-wrap">
        <table id="pp-table">
          <thead><tr>
            <th style="width:28px"><input type="checkbox" id="pp-check-all"></th>
            <th>MNF P/N</th><th>Drawing #</th><th>Drawing Name</th><th>Description</th>
            <th>QTY</th><th>Units</th><th>Priority Price</th>
          </tr></thead>
          <tbody id="pp-tbody"></tbody>
        </table>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px">
        <label style="font-size:12px;color:var(--muted)">QTY per selected part:</label>
        <input type="number" id="pp-qty" class="form-input" style="width:90px" value="1" min="0.001" step="any">
        <span style="font-size:11px;color:var(--muted)">(only used for rows you check — unchecked "Add All" keeps each part's own QTY)</span>
        <span class="count-badge" id="pp-count" style="margin-left:auto"></span>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" id="pp-add">＋ Add Selected</button>
    </div>
  </div>`);

  let visibleParts=[];
  const fieldSel=document.getElementById('pp-field');
  const valueSel=document.getElementById('pp-value');
  const searchInp=document.getElementById('pp-search');
  wireSearchClear('pp-search','pp-search-clear');

  const reloadValueOptions=()=>{
    const field=fieldSel.value;
    const values=[...new Set(allParts.map(p=>p[field]).filter(Boolean).map(v=>String(v).trim()).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b));
    valueSel.innerHTML=`<option value="">All (${values.length})</option>`+
      values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
    filterRows();
  };

  const filterRows=()=>{
    const field=fieldSel.value;
    const val=valueSel.value;
    const predicate=parseBoolQuery(searchInp.value);
    visibleParts=allParts.filter(p=>{
      if(val && String(p[field]||'').trim()!==val) return false;
      if(searchInp.value.trim()){
        const haystack=[p.part_number,p.description,p.manufacturer,p.drawing_number,p.drawing_name]
          .map(v=>String(v||'')).join(' | ').toLowerCase();
        if(!predicate(haystack)) return false;
      }
      return true;
    });
    const tb=document.getElementById('pp-tbody');
    tb.innerHTML=visibleParts.map(p=>{
      const fc=parseFloat(p.price)||0, pr=parseFloat(p.priority_price)||0;
      let fcC='',prC='';
      if(fc&&pr){fcC=fc<=pr?'price-green':'price-red';prC=pr<=fc?'price-green':'price-red';}
      return `<tr data-id="${esc(p._id)}">
        <td style="text-align:center"><input type="checkbox" class="pp-check" data-id="${esc(p._id)}"></td>
        <td>${esc(p.part_number)}</td><td>${esc(p.drawing_number)}</td><td>${esc(p.drawing_name)}</td>
        <td class="wrap">${esc(p.description)}</td><td>${esc(p.qty)}</td><td>${esc(p.unit||p.units)}</td>
        <td>${fc?`<span class="${fcC}">${fmtPrice(fc)}</span>`:''}</td>
        <td>${pr?`<span class="${prC}">${fmtPrice(pr)}</span>`:''}</td>
      </tr>`;
    }).join('')||`<tr class="empty-row"><td colspan="9">No parts match this filter</td></tr>`;
    document.getElementById('pp-count').textContent=`${visibleParts.length} parts`;
  };

  fieldSel.addEventListener('change',reloadValueOptions);
  valueSel.addEventListener('change',filterRows);
  searchInp.addEventListener('input',debounce(filterRows,220));
  document.getElementById('pp-check-all').addEventListener('change',e=>{
    document.querySelectorAll('.pp-check').forEach(cb=>cb.checked=e.target.checked);
  });
  wireShiftCheck(document.getElementById('pp-table'),'.pp-check');
  reloadValueOptions();

  document.getElementById('pp-add').addEventListener('click',()=>{
    const checked=[...document.querySelectorAll('.pp-check:checked')].map(cb=>cb.dataset.id);
    const qtyOverride=parseFloat(document.getElementById('pp-qty').value)||1;
    const hadSelection=checked.length>0;
    const selected = hadSelection ? allParts.filter(p=>checked.includes(p._id)) : visibleParts;
    if(!selected.length){ toast('No parts to add','error'); return; }
    closeModal();
    onAdd(selected, qtyOverride, hadSelection);
  });
}

function openSDFileModal(){
  showModal(`<div class="modal">
    <div class="modal-head"><h3>Import BOM from File</h3><button class="close-modal" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="sd-modal-body">
      <div class="drop-zone" id="sd-drop-zone" tabindex="0">
        <span class="icon-big">📄</span>
        <strong>Drop PDF, Image or Excel here</strong>
        <p>PDF / PNG / JPG / XLSX / XLS / CSV — parts will be added to Sales Desk. You can select multiple files, extracted together into one review.</p>
        <input type="file" id="sd-file-input" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.xlsx,.xlsm,.xls,.csv" multiple style="display:none">
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>
  </div>`);

  const dz=document.getElementById('sd-drop-zone');
  const fi=document.getElementById('sd-file-input');
  dz.addEventListener('click',()=>fi.click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
  dz.addEventListener('drop',e=>{
    e.preventDefault();dz.classList.remove('dragover');
    const files=[...e.dataTransfer.files];
    if(files.length) handleSDFiles(files);
  });
  fi.addEventListener('change',()=>{
    if(fi.files.length) handleSDFiles([...fi.files]);
  });
}

// Extracts BOM rows from ALL selected files, then shows one combined preview
// before adding everything to the Sales Desk in a single confirmation step.
async function handleSDFiles(files){
  if(!files || !files.length) return;
  const body=document.getElementById('sd-modal-body');
  const foot=document.querySelector('#modal-bg .modal-foot');
  const allRows=[];
  const errors=[];

  for(let fidx=0; fidx<files.length; fidx++){
    const file=files[fidx];
    const isPDF=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
    const isImg=file.type.startsWith('image/');
    const isXls=_isSpreadsheetFile(file);
    if(!isPDF&&!isImg&&!isXls){ errors.push(`"${file.name}" — not a PDF, image or spreadsheet, skipped`); continue; }

    const filePrefix = files.length>1 ? `File ${fidx+1}/${files.length}: ${esc(file.name)} — ` : '';
    body.innerHTML=`<div class="ai-status"><div class="ring"></div><span id="sd-ai-msg">${filePrefix}${isXls?'Reading spreadsheet…':(isPDF?'Extracting PDF text…':'Reading image…')}</span></div>
      <div class="progress-bar"><div class="progress-fill" id="sd-prog"></div></div>`;
    foot.innerHTML='';
    const setM=(m,p)=>{
      const e=document.getElementById('sd-ai-msg');if(e)e.textContent=filePrefix+m;
      const b=document.getElementById('sd-prog');if(b)b.style.width=p+'%';
    };

    try {
      let extractedRows=[];
      let _pdfText='', _pdfTextLen=0, _pdfImages=[];
      let _procIsImage=false, _procImgData=null; // whichever image (if any) ended up being used — reused below for the cable-process analysis

      if(isXls){
        setM('Reading spreadsheet…',20);
        const sheets=await readExcelSheets(file);
        const sheetText=await extractExcelText(file);
        // Structured parse first — exact and repeatable (see
        // _parseStructuredBOMSheet). AI only for unrecognisable layouts.
        extractedRows=parseExcelSheetsStructured(sheets)||[];
        if(extractedRows.length){
          setM(`Parsed ${extractedRows.length} component(s) from the sheet`,60);
        } else {
          if(!sheetText.trim()) throw new Error('the spreadsheet appears to be empty');
          setM('Layout not recognised — asking AI…',50);
          extractedRows=await aiExtractBOM(sheetText,false,null,file.name,'excel');
        }
        // Keep the sheet text as the "drawing text" for the cable-process and
        // notes analyses below — there's no page image for a spreadsheet, so
        // those run in text mode off the same content.
        _pdfText=sheetText;
      } else if(isPDF){
        setM('Reading PDF pages…',15);
        const {pageTexts,pageImages}=await extractPDFPages(file);
        _pdfImages=pageImages;
        _pdfText=pageTexts.map((t,i)=>`=== PAGE ${i+1} ===\n${t}`).join('\n\n');
        _pdfTextLen=pageTexts.join('').trim().length;

        // See _findBOMPageIndex — a detected BOM-header page whose OWN text
        // is still very short (just the header, no real rows) is a strong
        // sign this table's cells are graphics, not text: trust vision over
        // the whole-document text blob even if it returned SOME rows, since
        // those are almost certainly pulled from boilerplate elsewhere, not
        // the real table.
        const _bomPageIdx=_findBOMPageIndex(pageTexts);
        const _bomPageSparse=_bomPageIdx>=0 && (pageTexts[_bomPageIdx]||'').trim().length<400;

        if(_pdfTextLen>50){
          setM('Sending text to AI…',45);
          extractedRows=await aiExtractBOM(_pdfText,false,null,file.name);
        }
        if((!extractedRows.length||_bomPageSparse)&&anthKey){
          setM('Text extraction found nothing — trying page vision…',60);
          // Try the detected BOM sheet FIRST, then fall back to the rest of
          // the pages in order.
          const pageOrder=_pdfImages.map((_,idx)=>idx);
          if(_bomPageIdx>=0){
            const pos=pageOrder.indexOf(_bomPageIdx);
            if(pos>0){ pageOrder.splice(pos,1); pageOrder.unshift(_bomPageIdx); }
          }
          for(let k=0;k<pageOrder.length;k++){
            const pi=pageOrder[k];
            const b64=_pdfImages[pi];
            if(!b64) continue;
            setM(`Vision analysis: page ${pi+1}/${_pdfImages.length}…`,60+Math.round(35*k/pageOrder.length));
            const rows2=await aiExtractBOM('',true,{b64,mimeType:'image/jpeg'},file.name);
            if(rows2.length){extractedRows=rows2;_procIsImage=true;_procImgData={b64,mimeType:'image/jpeg'};break;}
          }
        }
        // Fall back to the detected BOM sheet's own image (or page 1 if none
        // was detected) for the cable-process analysis below, rather than
        // always defaulting to page 1 — the real assembly content, and
        // therefore the steps the AI needs to see, usually lives on whichever
        // page the BOM itself is on.
        if(!_procIsImage){
          const fallbackIdx=_bomPageIdx>=0?_bomPageIdx:0;
          if(_pdfImages[fallbackIdx]){ _procIsImage=true; _procImgData={b64:_pdfImages[fallbackIdx],mimeType:'image/jpeg'}; }
        }
      } else {
        setM('Encoding image…',20);
        const {b64,mimeType}=await encodeImage(file);
        setM('Sending to AI (vision)…',50);
        extractedRows=await aiExtractBOM('',true,{b64,mimeType},file.name);
        _procIsImage=true; _procImgData={b64,mimeType};
      }

      _normalizeBOMRows(extractedRows);
      // Parse filename: "303-49-00251-00 REV 01 _approved.pdf"
      // → drawingName="303-49-00251-00", revision="REV 01 _approved"
      const _fileBase=file.name.replace(/\.[^.]+$/,'');
      const _spaceIdx=_fileBase.indexOf(' ');
      const effectiveDwgName=_spaceIdx>0 ? _fileBase.slice(0,_spaceIdx) : _fileBase;
      const fileRevision=_spaceIdx>0 ? _fileBase.slice(_spaceIdx+1).trim() : '';
      extractedRows.forEach(r=>{
        if(!r.drawing_number) r.drawing_number=effectiveDwgName;
        if(!r.drawing_name) r.drawing_name=effectiveDwgName;
        if(!r.revision) r.revision=fileRevision;
        _normalizeExtractedRow(r);
      });

      // Sales-Desk-only: analyze the actual manufacturing steps this cable
      // assembly needs (cut/strip, crimp, heat-shrink, label, test…) and their
      // time, assuming series/batch production. Each step's minutes get
      // attributed to whichever BOM row it belongs to (bridged via
      // _sdPendingLaborByKey, consumed when the rows are added to sdItems
      // below) — steps not tied to one row are kept as this breakdown's own
      // generalMinutes so the assembly's total labor cost still accounts for
      // them (only while a row from this drawing remains — see
      // _sdActiveGeneralLaborMinutes). The full
      // breakdown (+ a single-unit reference time) is kept in
      // _sdLaborBreakdowns for the Cost Summary breakdown modal.
      if(extractedRows.length && anthKey){
        try{
          setM('Analyzing cable manufacturing process…',95);
          const rowsList=extractedRows.map((r,idx)=>`${idx}: ${r.description||r.part_number||''} (qty=${r.qty||''}${r.unit?' '+r.unit:''})`).join('\n');
          const proc = await aiAnalyzeCableProcess(_procIsImage?'':_pdfText, _procIsImage, _procImgData, rowsList);
          if(proc && proc.steps.length){
            let generalMinutes=0, rowTiedMinutes=0;
            const displaySteps=[]; // per-assembly totals (already multiplied) — for the breakdown modal
            for(const step of proc.steps){
              const unitMins=parseFloat(step.unit_minutes)||0;
              if(!unitMins) continue;
              // qty_in_drawing is the AI's own count of how many times this
              // operation actually repeats in ONE assembly, read directly from
              // the drawing (e.g. 20 contacts crimped) — deliberately NOT the
              // BOM row's own qty field, which can describe a different thing
              // entirely (e.g. a connector-housing row with BOM qty=1 whose
              // pins still get crimped 20 times). The app does this
              // multiplication itself (never trusts AI arithmetic).
              const qtyInDrawing=parseFloat(step.qty_in_drawing)||1;
              const totalMins=unitMins*qtyInDrawing;
              const row = (step.row_idx!=null) ? extractedRows[step.row_idx] : null;
              if(row){
                // _sdPendingLaborByKey now stores an ALREADY-COMPUTED TOTAL
                // (unit_minutes × qty_in_drawing) for this row, not a rate to
                // be multiplied again — the save callback below marks the
                // resulting item with _laborFixedTotal so _sdRecalcLaborTotal
                // uses it as-is instead of re-multiplying by the Sales-Desk
                // table's own (possibly unrelated) qty column.
                // IMPORTANT: key on row.drawing_number (what item.drawing_number
                // will actually be set to below), NOT effectiveDwgName (the
                // filename-derived guess) — if the AI extracted its own
                // drawing_number from the drawing itself (e.g. "WLS - 122 - 011")
                // that differs from the filename's formatting, using
                // effectiveDwgName here would silently never match the lookup
                // key built from item.drawing_number in the save callback below,
                // so the total would be silently lost and the breakdown modal
                // would never find this drawing's rows either.
                const key=`${row.drawing_number||effectiveDwgName}|${row.part_number||row.description||step.row_idx}`;
                _sdPendingLaborByKey[key]=(_sdPendingLaborByKey[key]||0)+totalMins;
                // Since v1.8.42, a row's _laborFixedTotal (this AI-computed
                // total) always wins over the mm/gr flat-1-minute floor in
                // _sdRecalcLaborTotal — so the real, uncapped totalMins is
                // what Cost Summary will actually add up for this row too.
                // Capping it here to 1 for mm/gr rows (as an earlier version
                // of this did) would make the modal UNDER-report compared to
                // the real applied total — the two must show the same number.
                rowTiedMinutes+=totalMins;
                displaySteps.push({operation:step.operation, unitMinutes:unitMins, qty:qtyInDrawing, minutes:totalMins});
              } else {
                generalMinutes+=totalMins;
                displaySteps.push({operation:step.operation, unitMinutes:unitMins, qty:qtyInDrawing, minutes:totalMins});
              }
            }
            _sdLaborBreakdowns.push({
              // Same reasoning as the key fix above: use the actual (possibly
              // AI-extracted) drawing_number that rows will carry into sdItems,
              // not the filename-derived guess, so this breakdown is found by
              // _sdActiveGeneralLaborMinutes / openLaborBreakdownModal (both of
              // which match against sdItems' real drawing_number field).
              drawingName: extractedRows[0]?.drawing_number || effectiveDwgName,
              steps: displaySteps,
              // Always the row-tied sum + general (both already reflecting
              // real per-assembly quantities) — this keeps "Total (series,
              // per unit)" exactly equal to what Cost Summary's Labor Time
              // actually adds up, so the two numbers can never disagree.
              rowTiedMinutes,
              seriesTotal: rowTiedMinutes + generalMinutes,
              // The single-stand-alone-cable reference is meant to include
              // extra one-off setup/changeover overhead that a batch run
              // doesn't pay per-unit — so it should logically never be LOWER
              // than the series per-unit total. The AI's own estimate is a
              // separate, independent guess (not derived from the steps
              // above), so it can come back inconsistent; floor it at the
              // series total so the two numbers never contradict each other.
              singleUnitMinutes: Math.max(parseFloat(proc.single_unit_minutes)||0, rowTiedMinutes+generalMinutes),
              generalMinutes,
            });
          }
        }catch(e){ console.warn('[SD] cable-process analysis failed:', e.message); }
      }

      // Sales-Desk-only: pull out any NOTES / MANUFACTURING INSTRUCTIONS text
      // the drawing carries (separate from the BOM table) — shown below the
      // BOM table (see _sdRenderNotesPanel). Runs even if no BOM rows were
      // found, since a drawing can still have notes worth surfacing.
      if(anthKey){
        try{
          setM('Checking for Notes / Manufacturing Instructions…',97);
          const notes=await aiExtractDrawingNotes(_procIsImage?'':_pdfText, _procIsImage, _procImgData);
          if(notes.length){
            _sdDrawingNotes.push({drawingName: extractedRows[0]?.drawing_number || effectiveDwgName, notes});
          }
        }catch(e){ console.warn('[SD] notes extraction failed:', e.message); }
      }

      if(!extractedRows.length){
        errors.push(`"${file.name}" — no BOM rows detected`);
      } else {
        allRows.push(...extractedRows);
      }
    } catch(e){
      errors.push(`"${file.name}" — ${e.message}`);
    }
  }

  if(errors.length) errors.forEach(msg=>toast(msg,'error'));

  const _ringEl=body.querySelector('.ring');
  if(_ringEl){_ringEl.style.cssText='width:16px;height:16px;border-radius:50%;background:#1B6B3A;border:none;animation:none;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;line-height:1';
    _ringEl.textContent='✓';}

  if(!allRows.length){
    body.innerHTML=`<p style="color:var(--muted);margin-top:10px">No BOM rows were detected in ${files.length>1?`any of the ${files.length} files`:'this file'}.</p>`;
    foot.innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
    return;
  }

  // Show editable preview — on Save: save to Part Stock + add to Sales Desk
  showBOMPreview(allRows, body, foot,
    `💾 Save to Database + Sales Desk (${allRows.length} rows${files.length>1?` from ${files.length} files`:''})`,
    async(updatedRows)=>{
      await saveBOMToPartStock(updatedRows);
      let added=0;
      let _sdRowIdx=-1;
      for(const r of updatedRows){
        _sdRowIdx++;
        const pn=(r.part_number||'').trim().toLowerCase();
        const match=pn?allParts.find(p=>String(p.part_number||'').toLowerCase()===pn):null;
        const qty=parseFloat(r.qty)||1;
        const item={
          part_number:r.part_number||r.item||'', description:r.description||'',
          drawing_number:r.drawing_number||match?.drawing_number||match?.drawing_name||'',
          qty, unit:r.unit||match?.unit||match?.units||'pcs',
          // A crimp/insertion TOOL row is synthesized fresh by the AI during
          // drawing extraction (see _BOM_TEXT_PROMPT/_BOM_VISION_PROMPT rule 5)
          // and carries its own approximate price on r.price — it generally
          // won't be found in the Database (allParts/match) yet since it was
          // just created by saveBOMToPartStock a few lines above and the local
          // allParts cache hasn't been refreshed. Prefer r.price when present
          // so the tool's estimate shows up immediately instead of appearing as
          // $0.00 until the next Database refresh.
          est_price:r.price?(parseFloat(r.price)||0):(match?parseFloat(match.est_price)||0:0),
          alt_mpns:(r.alt_mpns||[]).length>1?r.alt_mpns:((match&&match.alt_mpns)||[]),
          priority_price:match?parseFloat(match.priority_price)||0:0, total:0,
          mouser_price:match?parseFloat(match.mouser_price)||'':'',
          digikey_price:match?parseFloat(match.digikey_price)||'':'',
          labor_time:'', labor_total:0,
          // Whether this tool is already owned (in Stock) is no longer decided
          // here once at import time — see _sdIsToolOwned, which checks the
          // Database live every time Cost Summary recomputes, so toggling the
          // Stock checkbox later is picked up immediately.
        };
        // Cable-process-analysis time (see handleSDFiles) is the sole source of
        // an auto-filled Labor Time for drawing-imported rows (Manufacturing
        // Routings, a keyword-based fallback, was removed). It's already a
        // FIXED TOTAL (unit_minutes × qty_in_drawing, computed in handleSDFiles
        // from the AI's own count of drawing repeats) — _laborFixedTotal tells
        // _sdRecalcLaborTotal to use it as-is instead of multiplying again by
        // this row's own qty column (see that function for why).
        // Must match the EXACT same fallback priority used when this key was
        // stored above (row.part_number||row.description||step.row_idx) —
        // NOT item.part_number, which for a row with no real part number
        // falls back to r.item (the row/item NUMBER, e.g. "5"), a completely
        // different value from what the storage side falls back to
        // (row.description). That mismatch silently dropped the AI-computed
        // fixed total for every row lacking a manufacturer part number —
        // common for plain cable/wire rows or generic hardware — which is
        // exactly where a chunk of "missing" labor time was going, even
        // though the breakdown modal (which sums proc.steps directly,
        // independent of whether this lookup succeeds) kept showing the
        // full, correct total.
        const dwgKey=`${item.drawing_number}|${r.part_number||r.description||_sdRowIdx}`;
        if(_sdPendingLaborByKey[dwgKey]!=null){
          item.labor_time = String(_sdPendingLaborByKey[dwgKey]);
          item._laborFixedTotal = true;
        }
        _sdRecalcRow(item);
        sdItems.push(item);
        added++;
      }
      _sdPendingLaborByKey={};
      toast(`Added ${added} parts to Sales Desk`,'success');
      logAudit('sales_desk_add_from_drawing',{count:added},true);
      closeModal();
      document.getElementById('sd-tbody')&&renderSalesDesk();
      await _sdAutoMatchLabor();
      document.getElementById('sd-tbody')&&renderSalesDesk();
      // No popup here anymore — whether any TOOL row is excluded because it's
      // already in Stock is shown inline in each drawing’s Cost Summary block
      // in _sdUpdateSummaryUI, driven by _sdIsToolOwned), which the renderSalesDesk()
      // call above already refreshes.
    }
  );
}

// ── Part Stock → Excel export (client-side via SheetJS) ───────────────────────
// `rows` are the rows to actually write out (selected rows, or every filtered row
// across all pages if nothing was selected); `totalCount` is always the full
// filtered-row count, used only to report "exported X of Y" in the toast.
function exportPartStockExcel(rows, totalCount, cols){
  if(!window.XLSX){ toast('Excel library not loaded — please reload the page','error'); return; }
  if(!rows.length){ toast('No rows to export','error'); return; }
  const exportCols=cols.filter(c=>c.k!=='_fc');
  const headers=exportCols.map(c=>c.l);
  const aoa=[headers];
  rows.forEach(p=>{
    aoa.push(exportCols.map(c=>{
      if(c.k==='updatedAt') return fmtDate(p.updatedAt);
      if(c.k==='priority_price') return parseFloat(p.priority_price)||'';
      if(c.k==='mouser_price') return parseFloat(p.mouser_price)||'';
      if(c.k==='digikey_price') return parseFloat(p.digikey_price)||'';
      if(c.k==='unit') return p.unit||p.units||'';
      if(c.k==='rfq_names') return (p.rfq_names||[]).join(', ');
      return p[c.k]||'';
    }));
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=exportCols.map(()=>({wch:16}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Database');
  const fname=`Database_Export_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb,fname);
  toast(`Exported ${rows.length} of ${totalCount} rows`,'success');
}

// ── RFQ Detail (BOM) → Excel export (client-side via SheetJS) ─────────────────
function exportBOMExcel(rows, totalCount, cols, projectName){
  if(!window.XLSX){ toast('Excel library not loaded — please reload the page','error'); return; }
  if(!rows.length){ toast('No rows to export','error'); return; }
  const headers=cols.map(c=>c.l);
  const aoa=[headers];
  rows.forEach(r=>{
    aoa.push(cols.map(c=>{
      let val=r[c.k]||'';
      if(c.k==='drawing_number'&&!val) val=r._dwgName||'';
      return val;
    }));
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=cols.map(()=>({wch:16}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'BOM');
  const safeName=(projectName||'RFQ').replace(/[^\w\-]+/g,'_');
  const fname=`${safeName}_BOM_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb,fname);
  toast(`Exported ${rows.length} of ${totalCount} rows`,'success');
}

// ── Sales Desk → Excel quote export (client-side via SheetJS) ─────────────────
// Replaces the old Print/Save-PDF button. Mirrors the layout/columns/summary rows
// of the Windows app's ui/sales_desk_dialog.py _generate_quote_xlsx (item, drawing#,
// part#, drawing name, customer PN, description, qty, unit, manufacturer,
// priority/Mouser/DigiKey price, part cost, labor time, then a summary block).
// ══════════════════════════════════════════════════════════════════════════════
// SALES DESK — formatted Excel quotation
// ------------------------------------------------------------------------------
// Built with ExcelJS, not SheetJS. The SheetJS community build the app already
// loads cannot write cell styling or embed images at all — those are paid-edition
// features — so a branded, colour-coded sheet is simply not expressible with it.
// ExcelJS is loaded on demand (it's ~950 KB) so it costs nothing until someone
// actually exports.
// ══════════════════════════════════════════════════════════════════════════════
let _exceljsPromise=null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(_exceljsPromise) return _exceljsPromise;
  _exceljsPromise=new Promise((resolve,reject)=>{
    const el=document.createElement('script');
    el.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    el.onload=()=>window.ExcelJS?resolve(window.ExcelJS):reject(new Error('ExcelJS failed to initialise'));
    el.onerror=()=>reject(new Error('Could not load the Excel formatting library — check your connection'));
    document.head.appendChild(el);
  });
  return _exceljsPromise;
}

// Palette. Deliberately the same meanings the app uses on screen, so the
// exported file reads the same way as what the user was just looking at.
const _XL = {
  brand:      'FF1E3A5F',   // header band
  brandLight: 'FFEFF4FA',   // meta block
  bomHead:    'FF2E5E8E',   // BOM column headers
  bomBand:    'FFF7F9FC',   // zebra striping on BOM rows
  tool:       'FFFFFBEB',   // TOOL rows — matches the amber used in Sales Desk
  toolEdge:   'FFF59E0B',
  calc:       'FFF1F5F9',   // cost build-up
  final:      'FF166534',   // FINAL PRICE
  warn:       'FFFEF3C7',
  warnEdge:   'FFF59E0B',
  border:     'FFCBD5E1',
};
const _xlThin={style:'thin',color:{argb:_XL.border}};
const _xlBoxed={top:_xlThin,left:_xlThin,bottom:_xlThin,right:_xlThin};

// Every drawing represented in the quote — used for both the header block and
// the file name, since a quote routinely covers more than one drawing.
function _sdDrawingNumbers(){
  return [...new Set(sdItems.map(r=>String(r.drawing_number||'').trim()).filter(Boolean))];
}
// Windows forbids \ / : * ? " < > | in file names; a drawing number can legally
// contain some of those, so scrub before using it.
function _safeFileName(s){
  return String(s||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim();
}

async function exportSalesDeskExcel(){
  if(!sdItems.length){ toast('No items to export','error'); return; }

  const btn=document.getElementById('btn-sd-export');
  const restore=btn?btn.innerHTML:'';
  if(btn){ btn.disabled=true; btn.textContent='Building…'; }

  try{
    const ExcelJS=await loadExcelJS();
    const {groups,partsTotal,laborCost,subtotal,final,toolsTotal,laborMinutes,missingToolRows}=_sdComputeSummary();
    const dwgs=_sdDrawingNumbers();

    const wb=new ExcelJS.Workbook();
    wb.creator='SpecPrice'; wb.created=new Date();
    const ws=wb.addWorksheet('Quotation',{
      views:[{showGridLines:false}],
      pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,
                 margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.3,footer:0.3}},
    });

    const COLS=['Item','Drawing #','MNF P/N','Description','Manufacturer','QTY','Units',
                'Mouser Cost','Mouser Stock','DigiKey Cost','DigiKey Stock','Priority Cost',
                'Part Cost','Labor Time (min)'];
    const LAST=COLS.length;                 // 14 columns, A..N
    ws.columns=[{width:6},{width:18},{width:24},{width:40},{width:22},{width:9},{width:8},
                {width:13},{width:12},{width:13},{width:12},{width:13},{width:12},{width:15}];

    const merge=(r,c1,c2)=>ws.mergeCells(r,c1,r,c2);
    const fill=(cell,argb)=>{cell.fill={type:'pattern',pattern:'solid',fgColor:{argb}};};

    // ── Header band: logo + title ──────────────────────────────────────────
    // Rows 1-4 are the brand band. The logo is floated over it via addImage,
    // which sits above cells rather than inside one.
    for(let r=1;r<=4;r++){
      merge(r,1,LAST);
      for(let c=1;c<=LAST;c++) fill(ws.getCell(r,c),_XL.brand);
    }
    ws.getRow(1).height=10; ws.getRow(4).height=8;
    ws.getRow(2).height=26; ws.getRow(3).height=18;

    const title=ws.getCell(2,1);
    title.value='PRELIMINARY QUOTATION';
    title.font={name:'Calibri',size:18,bold:true,color:{argb:'FFFFFFFF'}};
    title.alignment={vertical:'middle',horizontal:'center'};

    const sub=ws.getCell(3,1);
    sub.value = dwgs.length ? `Drawing ${dwgs.join(' · ')}` : 'Cable assembly';
    sub.font={name:'Calibri',size:11,color:{argb:'FFBFD4EA'}};
    sub.alignment={vertical:'middle',horizontal:'center'};

    // The same logo shown on the Home screen (companies/{id}.logo_b64).
    if(companyLogoB64){
      try{
        const m=/^data:image\/(png|jpe?g|gif);base64,(.+)$/i.exec(companyLogoB64);
        if(m){
          const ext=m[1].toLowerCase().startsWith('jp')?'jpeg':m[1].toLowerCase();
          const id=wb.addImage({base64:m[2], extension:ext});
          // Anchored to the top-left of the band, sized to sit inside it.
          ws.addImage(id,{tl:{col:0.25,row:0.6},ext:{width:150,height:44}});
        }
      }catch(e){ console.warn('[Export] logo could not be embedded:',e.message); }
    }

    // ── Meta block ────────────────────────────────────────────────────────
    let row=6;
    const meta=[
      ['Date', new Date().toLocaleDateString()],
      ['Prepared by', currentUserEmail||''],
      ['Drawing(s)', dwgs.join(', ')||'—'],
      ['Line items', String(sdItems.length)],
      ['Drawings', String(groups.length)],
    ];
    meta.forEach(([k,v])=>{
      const kc=ws.getCell(row,1); kc.value=k;
      kc.font={bold:true,size:10,color:{argb:'FF334155'}};
      fill(kc,_XL.brandLight);
      merge(row,2,4);
      const vc=ws.getCell(row,2); vc.value=v;
      vc.font={size:10,color:{argb:'FF0F172A'}};
      fill(vc,_XL.brandLight);
      for(let c=1;c<=4;c++) ws.getCell(row,c).border=_xlBoxed;
      row++;
    });
    row++;

    // ══ Per-drawing quotation ══════════════════════════════════════════════
    // A quote covering several drawings is several quotes. Each drawing gets
    // its own BOM block and its own price build-up; the grand total is the sum
    // of those blocks and is never computed separately, so the summary can't
    // disagree with the detail.
    const secTitle=(text,argb)=>{
      merge(row,1,LAST);
      const c=ws.getCell(row,1);
      c.value=text;
      c.font={bold:true,size:11,color:{argb:'FFFFFFFF'}};
      c.alignment={vertical:'middle',indent:1};
      for(let i2=1;i2<=LAST;i2++) fill(ws.getCell(row,i2),argb);
      ws.getRow(row).height=20;
      row++;
    };
    const money=(label,val,opts={})=>{
      merge(row,1,LAST-2);
      const l=ws.getCell(row,1);
      l.value=label;
      l.font={bold:!!opts.bold,size:opts.size||10,color:{argb:opts.fg||'FF334155'}};
      l.alignment={vertical:'middle',horizontal:'right',indent:1};
      const v=ws.getCell(row,LAST-1);
      v.value=val;
      v.numFmt=opts.fmt||'$#,##0.00';
      v.font={bold:opts.bold!==false,size:opts.size||10,color:{argb:opts.fg||'FF0F172A'}};
      v.alignment={vertical:'middle',horizontal:'right'};
      for(let c=1;c<=LAST;c++){
        const cell=ws.getCell(row,c);
        fill(cell,opts.bg||_XL.calc);
        cell.border=_xlBoxed;
      }
      if(opts.height) ws.getRow(row).height=opts.height;
      row++;
    };

    // ── Summary of drawings, first, so the reader sees the shape of the quote
    //    before wading through the parts. Only when there IS more than one.
    if(groups.length>1){
      secTitle(`QUOTATION SUMMARY — ${groups.length} DRAWINGS`,'FF334155');
      const sh=['Drawing #','Rows','Parts Total','Labor Cost','Subtotal','Profit %','FINAL PRICE'];
      sh.forEach((h,k)=>{
        const c=ws.getCell(row,k+1);
        c.value=h; c.font={bold:true,size:10,color:{argb:'FFFFFFFF'}};
        fill(c,_XL.bomHead); c.border=_xlBoxed;
        c.alignment={vertical:'middle',horizontal:k?'center':'left'};
      });
      row++;
      groups.forEach((g,k)=>{
        const vals=[g.dwg,g.rows.length,+g.partsTotal.toFixed(2),+g.laborCost.toFixed(2),
                    +g.subtotal.toFixed(2),g.profitPct/100,+g.final.toFixed(2)];
        vals.forEach((v,ci)=>{
          const c=ws.getCell(row,ci+1);
          c.value=v; c.border=_xlBoxed; c.font={size:10};
          if(ci>=2&&ci!==5) c.numFmt='$#,##0.00';
          if(ci===5) c.numFmt='0%';
          c.alignment={vertical:'middle',horizontal:ci?'right':'left'};
          if(k%2===1) fill(c,_XL.bomBand);
        });
        row++;
      });
      // Grand total sits in the same table, so the columns line up under it.
      const gv=['GRAND TOTAL',sdItems.length,+partsTotal.toFixed(2),+laborCost.toFixed(2),
                +subtotal.toFixed(2),null,+final.toFixed(2)];
      gv.forEach((v,ci)=>{
        const c=ws.getCell(row,ci+1);
        if(v!==null) c.value=v;
        c.font={bold:true,size:11,color:{argb:'FFFFFFFF'}};
        fill(c,_XL.final); c.border=_xlBoxed;
        if(ci>=2&&ci!==5) c.numFmt='$#,##0.00';
        c.alignment={vertical:'middle',horizontal:ci?'right':'left'};
      });
      ws.getRow(row).height=22;
      row+=2;
    }

    let itemNo=0;
    const bomHeaderRow=()=>{
      const hr=row;
      COLS.forEach((h,i2)=>{
        const c=ws.getCell(row,i2+1);
        c.value=h;
        c.font={bold:true,size:10,color:{argb:'FFFFFFFF'}};
        fill(c,_XL.bomHead);
        c.alignment={vertical:'middle',horizontal:i2>=5?'center':'left',wrapText:true};
        c.border=_xlBoxed;
      });
      ws.getRow(row).height=24;
      row++;
      return hr;
    };

    let firstHeaderRow=0;
    groups.forEach(g=>{
      secTitle(`DRAWING ${g.dwg}   —   ${g.rows.length} row${g.rows.length===1?'':'s'}`,'FF334155');
      const hr=bomHeaderRow();
      if(!firstHeaderRow) firstHeaderRow=hr;

      g.rows.forEach((r,i)=>{
        const isTool=_sdIsToolRow(r);
        itemNo++;
        const stockVal=v=>{ const x=r[v]; return (x===undefined||x===null||x==='') ? null : (parseInt(x,10)||0); };
        const vals=[itemNo, r.drawing_number||'', r.part_number||'', r.description||'',
                    r.manufacturer||'',
                    parseFloat(r.qty)||0, r.unit||'',
                    _sdLineCost(r,'mouser_price')||null,  stockVal('mouser_stock'),
                    _sdLineCost(r,'digikey_price')||null, stockVal('digikey_stock'),
                    _sdLineCost(r,'priority_price')||null,
                    +(r.total||0), +(r.labor_total||0)];
        vals.forEach((v,ci)=>{
          const c=ws.getCell(row,ci+1);
          c.value=v;
          c.font={size:10, color:{argb:isTool?'FF92400E':'FF0F172A'}, italic:isTool};
          c.border=_xlBoxed;
          if(ci===7||ci===9||ci===11) c.numFmt='$#,##0.00';
          if(ci===12) c.numFmt='$#,##0.00';
          if(ci===8||ci===10) c.numFmt='#,##0';
          if(ci===13) c.numFmt='0.0';
          if(ci===5)  c.numFmt='#,##0.###';
          let matchFlagged=false;
          if(ci===7||ci===9){
            const cfg = ci===7 ? {code:'mouser_match', mpn:'mouser_mpn', name:'Mouser'}
                               : {code:'digikey_match', mpn:'digikey_mpn', name:'DigiKey'};
            const code=r[cfg.code]||'';
            if(code==='approx'){
              c.font={...c.font, color:{argb:'FF92400E'}};
              matchFlagged=true;
              c.note=`Matched as "${r[cfg.mpn]||''}" on ${cfg.name} — different punctuation/zero-padding to "${r.part_number||''}". Verify before quoting.`;
            } else if(code==='noprice'){
              c.value=null; matchFlagged=true;
              c.note=`${cfg.name} lists this part but publishes no price (non-stocked / quote-only).`;
            }
          }
          c.alignment={vertical:'middle',
                       horizontal: (ci===3||ci===4)?'left':(ci>=5?'right':'left'),
                       wrapText: ci===3};
          if(matchFlagged) fill(c,'FFFFFBEB');
          else if(isTool) fill(c,_XL.tool);
          else if(i%2===1) fill(c,_XL.bomBand);
        });
        if(isTool){
          ws.getCell(row,1).border={..._xlBoxed,left:{style:'medium',color:{argb:_XL.toolEdge}}};
          ws.getCell(row,4).value=`${r.description||''}   [TOOL — not from customer BOM]`;
        }
        row++;
      });

      // This drawing's own price build-up, immediately under its parts.
      money('Parts Total',+g.partsTotal.toFixed(2));
      money(`Labor  (${(+g.laborMinutes).toFixed(1)} min × $${g.rate}/min)`,+g.laborCost.toFixed(2));
      money('Subtotal',+g.subtotal.toFixed(2),{bold:true});
      money(`Profit (${g.profitPct}%)`,+(g.final-g.subtotal).toFixed(2));
      money(`FINAL PRICE — ${g.dwg}`,+g.final.toFixed(2),
            {bold:true,size:13,bg:_XL.final,fg:'FFFFFFFF',height:24});

      if(g.missingToolRows.length){
        merge(row,1,LAST);
        const w=ws.getCell(row,1);
        w.value=`⚠  ${g.dwg}: final price does NOT include ${g.missingToolRows.length} manufacturing tool(s) — quoted separately below`;
        w.font={bold:true,size:12,color:{argb:'FF92400E'}};
        w.alignment={vertical:'middle',indent:1};
        for(let c=1;c<=LAST;c++){
          fill(ws.getCell(row,c),_XL.warn);
          ws.getCell(row,c).border={top:{style:'medium',color:{argb:_XL.warnEdge}},
                                    bottom:{style:'medium',color:{argb:_XL.warnEdge}}};
        }
        ws.getRow(row).height=22; row++;
        g.missingToolRows.forEach(r=>{
          ws.getCell(row,2).value=r.part_number||'';
          merge(row,3,LAST-2);
          ws.getCell(row,3).value=r.description||'';
          const v=ws.getCell(row,LAST-1);
          v.value=+(r.total||0); v.numFmt='$#,##0.00'; v.alignment={horizontal:'right'};
          for(let c=1;c<=LAST;c++){
            const cell=ws.getCell(row,c);
            fill(cell,_XL.tool); cell.border=_xlBoxed; cell.font={size:10,color:{argb:'FF92400E'}};
          }
          row++;
        });
        money(`TOOLS TOTAL — ${g.dwg} (separate)`,+g.toolsTotal.toFixed(2),
              {bold:true,size:11,bg:_XL.warn,fg:'FF92400E',height:20});
      }
      row++;   // breathing room before the next drawing
    });

    // ── Grand total, restated at the end ──
    if(groups.length>1){
      secTitle('GRAND TOTAL — ALL DRAWINGS','FF334155');
      money('Parts Total (all drawings)',+partsTotal.toFixed(2));
      money('Labor Cost (all drawings)',+laborCost.toFixed(2));
      money('Subtotal (all drawings)',+subtotal.toFixed(2),{bold:true});
      money('TOTAL FINAL PRICE',+final.toFixed(2),
            {bold:true,size:15,bg:_XL.final,fg:'FFFFFFFF',height:28});
      if(missingToolRows.length){
        money(`TOOLS TOTAL — all drawings (NOT in the price)`,+toolsTotal.toFixed(2),
              {bold:true,size:12,bg:_XL.warn,fg:'FF92400E',height:22});
      }
      row++;
    }

    if(firstHeaderRow){
      ws.views=[{state:'frozen',ySplit:firstHeaderRow,showGridLines:false}];
    }


    // ── Footer ────────────────────────────────────────────────────────────
    merge(row,1,LAST);
    const foot=ws.getCell(row,1);
    foot.value='Preliminary quotation — prices are indicative and subject to confirmation. '
              +`Generated by SpecPrice v${APP_VER} on ${new Date().toLocaleString()}.`;
    foot.font={size:9,italic:true,color:{argb:'FF64748B'}};
    foot.alignment={vertical:'middle',indent:1};

    // ── Save ──────────────────────────────────────────────────────────────
    // Name carries the drawing number(s) and says plainly that it's preliminary,
    // so the file is identifiable once it's sitting in someone's Downloads.
    const dwgPart = dwgs.length ? _safeFileName(dwgs.slice(0,3).join(' ')) + ' ' : '';
    const fname=`Preliminary Quotation ${dwgPart}${new Date().toISOString().slice(0,10)}.xlsx`
                .replace(/\s+/g,' ');
    const buf=await wb.xlsx.writeBuffer();
    const url=URL.createObjectURL(new Blob([buf],
      {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a');
    a.href=url; a.download=fname; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);

    toast('Quotation downloaded','success');
    logSystemAudit('sales_desk_export',{rows:sdItems.length,drawings:dwgs.join(', '),file:fname},true);
  }catch(e){
    console.error('[Export]',e);
    toast('Export failed: '+e.message,'error');
    logSystemAudit('sales_desk_export',e.message,false);
  }finally{
    if(btn){ btn.disabled=false; btn.innerHTML=restore; }
  }
}

async function renderCustomers(){

      getDocs(query(collection(db,'companies',companyId,'customers'),orderBy('name'))),
      getDocs(collection(db,'companies',companyId,'projects'))
    ]);
    customers=cs.docs.map(d=>({_id:d.id,...d.data()}));
    projects=ps.docs.map(d=>({_id:d.id,...d.data()}));
  } catch(e){ setContent(`<p style="color:red;padding:20px">${e.message}</p>`); return; }

    setContent(`<div style="text-align:center;padding:80px;color:var(--muted)">

            ${(c.contacts||[]).slice(0,2).map(ct=>`<p style="margin-top:2px;font-size:10px">${esc(ct.name)}${ct.email?' · '+esc(ct.email):''}</p>`).join('')}

  document.querySelectorAll('.edit-cust').forEach(btn=>btn.addEventListener('click',()=>{
    const c=customers.find(x=>x._id===btn.dataset.id); if(c) openCustomerModal(c);
  }));

function openCustomerModal(cust={}){
  const isEdit=!!cust._id;
  const contacts=(cust.contacts||[{name:'',email:'',phone:''}]);

  function contactRow(c={},i){
    return `<tr>
      <td><input class="form-input" style="padding:4px 7px;font-size:12px" placeholder="Full name" value="${esc(c.name||'')}" data-f="name" data-ci="${i}"></td>
      <td><input class="form-input" style="padding:4px 7px;font-size:12px" placeholder="email@…" value="${esc(c.email||'')}" data-f="email" data-ci="${i}"></td>
      <td><input class="form-input" style="padding:4px 7px;font-size:12px" placeholder="+972…" value="${esc(c.phone||'')}" data-f="phone" data-ci="${i}"></td>
      <td><button class="btn btn-red btn-sm del-contact" style="padding:3px 6px">✕</button></td>
    </tr>`;
  }

  showModal(`<div class="modal">
    <div class="modal-head"><h3>${isEdit?'Edit':'New'} Customer</h3><button class="close-modal" id="modal-close">✕</button></div>
    <div class="modal-body">
      <div class="form-field">
        <label>Customer Name</label>
        <input class="form-input" id="cust-name-inp" placeholder="e.g. Elbit Systems" value="${esc(cust.name||'')}">

      </div>
      <div class="form-field">
        <label>Customer Icon</label>
        <div style="display:flex;align-items:center;gap:10px">
          <div id="cust-icon-preview" style="width:48px;height:48px;border-radius:8px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0">
            ${cust.icon_b64?`<img src="${cust.icon_b64}" style="width:100%;height:100%;object-fit:cover">`:`<span style="font-size:22px">🏢</span>`}
          </div>
          <input type="file" id="cust-icon-inp" accept="image/*" style="font-size:12px">
          ${cust.icon_b64?`<button type="button" class="btn btn-ghost btn-sm" id="cust-icon-clear">Remove</button>`:''}
        </div>
      </div>
      <div style="margin-top:16px">
        <label style="font-size:12px;font-weight:600;color:var(--blue-dark)">Contacts</label>
        <table style="width:100%;margin-top:8px;font-size:12px">
          <thead><tr style="color:var(--muted)">
            <th style="padding:4px 6px;text-align:left">Name</th>
            <th style="padding:4px 6px;text-align:left">Email</th>
            <th style="padding:4px 6px;text-align:left">Phone</th>
            <th style="width:30px"></th>
          </tr></thead>
          <tbody id="contacts-tbody">
            ${contacts.map((c,i)=>contactRow(c,i)).join('')}
          </tbody>
        </table>
        <button class="btn btn-ghost btn-sm" id="btn-add-contact" style="margin-top:8px">＋ Add Contact</button>
      </div>
    </div>
    <div class="modal-foot" id="modal-foot-cust">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      ${isEdit?`<button class="btn btn-red btn-sm" id="btn-del-cust">Delete</button>`:''}
      <button class="btn btn-green" id="btn-save-cust">${isEdit?'Save Changes':'Create Customer'}</button>
    </div>
  </div>`);

  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('modal-cancel').addEventListener('click',closeModal);

  let contactCount=contacts.length;
  let _custIconB64=cust.icon_b64||'';

  document.getElementById('cust-icon-inp').addEventListener('change',()=>{
    const f=document.getElementById('cust-icon-inp').files[0];
    if(!f) return;
    const reader=new FileReader();
    reader.onload=e=>{
      _custIconB64=e.target.result;
      const prev=document.getElementById('cust-icon-preview');
      if(prev) prev.innerHTML=`<img src="${_custIconB64}" style="width:100%;height:100%;object-fit:cover">`;
    };
    reader.readAsDataURL(f);
  });
  document.getElementById('cust-icon-clear')?.addEventListener('click',()=>{
    _custIconB64='';
    const prev=document.getElementById('cust-icon-preview');
    if(prev) prev.innerHTML=`<span style="font-size:22px">🏢</span>`;
  });

  document.getElementById('btn-add-contact').addEventListener('click',()=>{
    const tb=document.getElementById('contacts-tbody');
    const row=document.createElement('tr');
    row.innerHTML=contactRow({},contactCount++).replace(/^<tr>/,'').replace(/<\/tr>$/,'');
    const tr=document.createElement('tr');
    tr.innerHTML=contactRow({name:'',email:'',phone:''},contactCount-1);
    tb.appendChild(tr);
    tr.querySelector('.del-contact').addEventListener('click',()=>tr.remove());
  });

  document.querySelectorAll('.del-contact').forEach(btn=>
    btn.addEventListener('click',()=>btn.closest('tr').remove()));

  document.getElementById('btn-save-cust').addEventListener('click',async()=>{
    const name=document.getElementById('cust-name-inp').value.trim();
    if(!name){ toast('Customer name is required','error'); return; }
    const rows=[...document.querySelectorAll('#contacts-tbody tr')];
    const custContacts=rows.map(tr=>({
      name:(tr.querySelector('[data-f="name"]')?.value||'').trim(),
      email:(tr.querySelector('[data-f="email"]')?.value||'').trim(),
      phone:(tr.querySelector('[data-f="phone"]')?.value||'').trim()
    })).filter(c=>c.name||c.email||c.phone);
    const btn=document.getElementById('btn-save-cust');
    btn.disabled=true; btn.textContent='Saving…';
    try{
      const col=collection(db,'companies',companyId,'customers');
      if(isEdit){
        await updateDoc(doc(col,cust._id),{name,contacts:custContacts,icon_b64:_custIconB64,updatedAt:serverTimestamp()});
      } else {
        await addDoc(col,{name,contacts:custContacts,icon_b64:_custIconB64,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      }
      toast(isEdit?`Updated "${name}"`:`Customer "${name}" created`,'success');
      logAudit(isEdit?'customer_updated':'customer_created',{name},true);
      closeModal(); renderCustomers();
    }catch(e){ toast('Error: '+e.message,'error'); logAudit(isEdit?'customer_updated':'customer_created',{error:e.message},false); btn.disabled=false; btn.textContent=isEdit?'Save Changes':'Create Customer'; }
  });

  if(isEdit){
    document.getElementById('btn-del-cust')?.addEventListener('click',()=>{
      closeModal(); deleteCustomer(cust._id,cust.name);
    });
  }
}

async function deleteCustomer(id,name){
  if(!confirm(`Delete customer "${name}"?`)) return;
  try{
    await deleteDoc(doc(db,'companies',companyId,'customers',id));
    toast(`Deleted "${name}"`,'success'); logAudit('customer_deleted',{name},true); renderCustomers();
  }catch(e){ toast('Error: '+e.message,'error'); logAudit('customer_deleted',{error:e.message},false); }
}

// ── Distributor API credentials (Mouser / DigiKey) ───────────────────────────
// Unlike the Anthropic key above, these never live in the browser: they
// are POSTed to the apiConfig Cloud Function, which stores them where no client
// can read them back. The UI therefore shows status, never values.
const API_CONFIG_URL='https://us-central1-specprice-236a2.cloudfunctions.net/apiConfig';
async function _apiConfigCall(method, body){
  if(!auth.currentUser) throw new Error('Not signed in');
  const token=await auth.currentUser.getIdToken();
  const init={method, headers:{Authorization:'Bearer '+token}, signal:AbortSignal.timeout(60000)};
  if(body){ init.headers['Content-Type']='application/json'; init.body=JSON.stringify(body); }
  const resp=await fetch(API_CONFIG_URL, init);
  let data=null;
  try{ data=await resp.json(); }catch{}
  if(!resp.ok) throw new Error((data&&data.error)||`HTTP ${resp.status}`);
  return data;
}

async function renderAdminDistributorApiSection(){
  const statusEl=document.getElementById('adm-dist-status');
  const saveBtn=document.getElementById('btn-adm-save-dist');
  const testBtn=document.getElementById('btn-adm-test-dist');
  const testEl=document.getElementById('adm-dist-test');
  if(!statusEl||!saveBtn||!testBtn) return;

  const pill=(ok,label,detail)=>
    `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;`+
    `background:${ok?'#DCFCE7':'#FEE2E2'};color:${ok?'#166534':'#991B1B'}">${ok?'✓':'✕'} ${esc(label)}</span>`+
    (detail?` <span style="color:var(--muted);font-size:10px">${esc(detail)}</span>`:'');

  async function refreshStatus(){
    statusEl.innerHTML='Loading current status…';
    try{
      const s=await _apiConfigCall('GET');
      // "Where did this come from" matters when debugging: a key set with the
      // CLI and one set here look identical until you need to change it.
      const src=o=>o.source==='env-var'?'via env var':(o.source==='ui'?'set here':'');
      const when=s.updatedAt?new Date(s.updatedAt).toLocaleString():'';
      const row=(o,name,h)=>o.configured
        ? `<div>${pill(true,name,[h,src(o)].filter(Boolean).join(' · '))}</div>`
        : `<div><span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:#F1F5F9;color:#64748B">– ${name}</span> <span style="color:var(--muted);font-size:10px">not set up</span></div>`;
      const none=!s.mouser.configured && !s.digikey.configured;
      statusEl.innerHTML=
        `<div style="display:flex;flex-direction:column;gap:6px">
           ${row(s.mouser,'Mouser',s.mouser.hint)}
           ${row(s.digikey,'DigiKey',s.digikey.clientIdHint)}
           <div style="color:var(--muted);font-size:10px">${none
             ? 'Neither vendor is set up yet — add either one to start.'
             : 'Each vendor works on its own — one is enough.'}</div>
           ${when?`<div style="color:var(--muted);font-size:10px">Last changed ${esc(when)}${s.updatedBy?' by '+esc(s.updatedBy):''}</div>`:''}
         </div>`;
    }catch(e){
      // A 404 here almost always means the function hasn't been deployed yet —
      // say so, rather than leaving the admin staring at a raw status code.
      const notDeployed=/404|Failed to fetch|NetworkError/i.test(e.message);
      statusEl.innerHTML=`<span style="color:var(--red)">${esc(notDeployed
        ? 'Cannot reach the apiConfig function — run: firebase deploy --only functions'
        : e.message)}</span>`;
    }
  }

  saveBtn.addEventListener('click',async()=>{
    const mk=document.getElementById('adm-mouser-key').value.trim();
    const di=document.getElementById('adm-dk-id').value.trim();
    const ds=document.getElementById('adm-dk-secret').value.trim();
    // Only send the fields actually filled in — an omitted field means "keep",
    // which is what lets the admin change one credential without re-typing all.
    const body={};
    if(mk) body.mouser_api_key=mk;
    if(di) body.digikey_client_id=di;
    if(ds) body.digikey_client_secret=ds;
    if(!Object.keys(body).length){ toast('Nothing to save — fill in at least one field','warn'); return; }

    saveBtn.disabled=true; saveBtn.textContent='Saving…';
    try{
      const r=await _apiConfigCall('POST',body);
      // Clear the inputs immediately: there is no reason for a secret to sit in
      // a DOM node after it's been stored.
      ['adm-mouser-key','adm-dk-id','adm-dk-secret'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
      toast('Credentials saved','success');
      logAudit('distributor_api_keys_updated',{fields:(r.updated||[]).join(', ')},true);
      await refreshStatus();
    }catch(e){
      toast('Save failed: '+e.message,'error');
      logAudit('distributor_api_keys_updated',e.message,false);
    }finally{ saveBtn.disabled=false; saveBtn.textContent='💾 Save Credentials'; }
  });

  testBtn.addEventListener('click',async()=>{
    testBtn.disabled=true; testBtn.textContent='Testing…';
    testEl.innerHTML='<span style="font-size:11px;color:var(--muted)">Querying both vendors…</span>';
    try{
      const r=await _apiConfigCall('POST',{action:'test'});
      // A vendor you haven't signed up for shows as a neutral dash, not a red
      // ✕ — otherwise a perfectly healthy one-vendor setup looks like a fault.
      const line=(name,v)=>{
        const badge=v.skipped
          ? `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:#F1F5F9;color:#64748B">– ${esc(name)}</span>`
          : pill(v.ok,name);
        return `<div style="margin-bottom:4px">${badge} <span style="font-size:11px;color:${v.skipped?'var(--muted)':'inherit'}">${esc(v.message)}</span></div>`;
      };
      testEl.innerHTML=
        `<div style="border:1px solid var(--border);border-radius:6px;padding:10px 12px">
           <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Test part: ${esc(r.pn)}</div>
           ${line('Mouser',r.mouser)}${line('DigiKey',r.digikey)}
         </div>`;
      logAudit('distributor_api_test',`mouser=${r.mouser.ok} digikey=${r.digikey.ok}`,r.mouser.ok||r.digikey.ok);
    }catch(e){
      testEl.innerHTML=`<span style="color:var(--red);font-size:11px">${esc(e.message)}</span>`;
    }finally{ testBtn.disabled=false; testBtn.textContent='🧪 Test Connection'; }
  });

  refreshStatus();
}

const _ADM_TICKET_CACHE={}; // ticketId -> ticket data (ALL fetched tickets, unfiltered) — used by openAdminReplyModal
let _admTicketsAll=[], _admTicketsFilterUser='', _admTicketsFilterStatus='';
async function renderAdminTicketsSection(){
  const body=document.getElementById('adm-tickets-body');
  if(!body) return;
  body.innerHTML=`<div style="text-align:center;padding:30px"><div class="ring" style="margin:0 auto"></div></div>`;
  try{
    const snap=await getDocs(query(collection(db,'companies',companyId,'support_tickets'),orderBy('createdAt','desc')));

  }catch(e){ body.innerHTML=`<p style="color:red;padding:20px">${esc(e.message)}</p>`; return; }
  Object.keys(_ADM_TICKET_CACHE).forEach(k=>delete _ADM_TICKET_CACHE[k]);
  _admTicketsAll.forEach(t=>_ADM_TICKET_CACHE[t._id]=t);
  if(!_admTicketsAll.length){ body.innerHTML=`<p style="color:var(--muted);font-size:12px;padding:10px 0">No support requests yet.</p>`; return; }
  const users=[...new Set(_admTicketsAll.map(t=>t.user).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if(_admTicketsFilterUser && !users.includes(_admTicketsFilterUser)) _admTicketsFilterUser='';
  body.innerHTML=`
    <div class="toolbar" style="margin-bottom:10px;gap:8px">
      <select class="form-input" id="adm-tickets-filter-user" style="width:auto;min-width:160px">
        <option value="">All Users</option>
        ${users.map(u=>`<option value="${esc(u)}" ${u===_admTicketsFilterUser?'selected':''}>${esc(u)}</option>`).join('')}
      </select>
      <select class="form-input" id="adm-tickets-filter-status" style="width:auto;min-width:140px">
        <option value="">All Statuses</option>
        ${_SUPPORT_STATUSES.map(s=>`<option value="${s}" ${s===_admTicketsFilterStatus?'selected':''}>${_SUPPORT_STATUS_LABEL[s]}</option>`).join('')}
      </select>
      <span class="count-badge" id="adm-tickets-count"></span>
    </div>
    <div class="table-wrap"><table>
    <thead><tr><th>Date/Time</th><th>User</th><th>Message</th><th style="width:130px">Status</th><th style="width:90px"></th></tr></thead>
    <tbody id="adm-tickets-tbody"></tbody>
  </table></div>`;
  document.getElementById('adm-tickets-filter-user').addEventListener('change',e=>{ _admTicketsFilterUser=e.target.value; _admTicketsFilterRows(); });
  document.getElementById('adm-tickets-filter-status').addEventListener('change',e=>{ _admTicketsFilterStatus=e.target.value; _admTicketsFilterRows(); });
  _admTicketsFilterRows();
}
function _admTicketsFilterRows(){
  const tbody=document.getElementById('adm-tickets-tbody');
  const countEl=document.getElementById('adm-tickets-count');
  if(!tbody) return;
  const tickets=_admTicketsAll.filter(t=>{
    if(_admTicketsFilterUser && t.user!==_admTicketsFilterUser) return false;
    if(_admTicketsFilterStatus && (t.status||'open')!==_admTicketsFilterStatus) return false;
    return true;
  });
  if(countEl) countEl.textContent=`${tickets.length} of ${_admTicketsAll.length}`;
  tbody.innerHTML=tickets.length ? tickets.map(t=>`<tr data-id="${esc(t._id)}" style="background:${_SUPPORT_ROW_BG[_SUPPORT_STATUSES.includes(t.status)?t.status:'open']}">
      <td style="white-space:nowrap;font-size:11px;color:var(--muted)">${fmtDateTime(t.createdAt)}</td>
      <td style="font-size:12px">${esc(t.user||'')}</td>
      <td style="font-size:12px;max-width:340px;white-space:pre-wrap">${esc(t.message||'')}${t.adminReply?`<div style="margin-top:4px;padding:4px 6px;background:#f0f7ff;border-radius:4px;font-size:11px"><strong>Reply:</strong> ${esc(t.adminReply)}</div>`:''}</td>
      <td><select class="form-input adm-ticket-status" data-id="${esc(t._id)}" style="padding:3px 6px;font-size:12px;font-weight:700;border:none;border-radius:5px;background:${_SUPPORT_STATUS_COLOR[_SUPPORT_STATUSES.includes(t.status)?t.status:'open']};color:${_SUPPORT_STATUS_TEXT[_SUPPORT_STATUSES.includes(t.status)?t.status:'open']}">
        ${_SUPPORT_STATUSES.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${_SUPPORT_STATUS_LABEL[s]}</option>`).join('')}
      </select></td>
      <td><button class="btn btn-ghost btn-sm adm-ticket-reply" data-id="${esc(t._id)}">💬 Reply</button></td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="5">No tickets match this filter</td></tr>`;
  tbody.querySelectorAll('.adm-ticket-status').forEach(sel=>sel.addEventListener('change',async()=>{
    const id=sel.dataset.id, status=sel.value;
    sel.style.background=_SUPPORT_STATUS_COLOR[status]; sel.style.color=_SUPPORT_STATUS_TEXT[status];
    const rowEl=sel.closest('tr'); if(rowEl) rowEl.style.background=_SUPPORT_ROW_BG[status];
    if(_ADM_TICKET_CACHE[id]) _ADM_TICKET_CACHE[id].status=status;
    const cached=_admTicketsAll.find(t=>t._id===id); if(cached) cached.status=status;
    try{
      await updateDoc(doc(db,'companies',companyId,'support_tickets',id),{status,updatedAt:serverTimestamp()});
      logAudit('ticket_status_changed',{ticketId:id,status},true);
      toast('Status updated','success');
      if(_admTicketsFilterStatus) _admTicketsFilterRows();
    }catch(e){ toast('Error: '+e.message,'error'); }
  }));
  tbody.querySelectorAll('.adm-ticket-reply').forEach(btn=>btn.addEventListener('click',()=>openAdminReplyModal(btn.dataset.id)));
}
function openAdminReplyModal(ticketId){

let _admLogsCache=[], _admLogsFilterQ='';
// Details values (JSON payloads) are often longer than the column — collapsed to
// one ellipsized line by default so the table stays scannable. Two ways to read
// the full value: the "Expand details" toggle below (applies to every row), or
// clicking a single Details cell to expand just that one.
let _admLogsWrapDetails=false;
function _admLogsDetailsStyle(expanded){
  return expanded
    ? 'font-size:11px;color:var(--muted);max-width:420px;white-space:pre-wrap;word-break:break-word;cursor:pointer'
    : 'font-size:11px;color:var(--muted);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer';
}
async function renderAdminLogsSection(){
  const body=document.getElementById('adm-logs-body');
  if(!body) return;
  body.innerHTML=`<div style="text-align:center;padding:30px"><div class="ring" style="margin:0 auto"></div></div>`;
  try{
    const snap=await getDocs(query(collection(db,'companies',companyId,'audit_logs'),orderBy('timestamp','desc'),limit(500)));
    _admLogsCache=snap.docs.map(d=>({_id:d.id,...d.data()}));
  }catch(e){ body.innerHTML=`<p style="color:red;padding:20px">${esc(e.message)}</p>`; return; }

// Builds the toolbar (search box) + table shell ONCE per data load. Typing in the
// search box must NOT rebuild this shell — recreating the <input> node on every
// keystroke was what made the caret jump back to the start each time (the browser
// has no way to preserve cursor position across a full innerHTML replace). Filtering
// now only touches the <tbody> + count badge via _admLogsFilterRows(), same pattern
// as the Part Stock picker's filterRows().
function _renderAdminLogsTable(){
  const body=document.getElementById('adm-logs-body');
  if(!body) return;
  body.innerHTML=`
    <div class="toolbar" style="margin-bottom:8px">
      <div class="search-wrap">
        <input class="search-box" id="adm-logs-search" placeholder='Search — supports AND / OR / NOT / "phrase" / (...)' value="${esc(_admLogsFilterQ)}">
        <button type="button" class="search-clear" id="adm-logs-search-clear" title="Clear">✕</button>
      </div>
      <button class="btn btn-ghost" id="btn-adm-logs-refresh" style="white-space:nowrap">🔄 Refresh</button>
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer"
             title="Show the full Details value on every row instead of one truncated line. You can also click any single Details cell to expand just that row.">
        <input type="checkbox" id="adm-logs-wrap" ${_admLogsWrapDetails?'checked':''} style="width:auto">
        Expand details
      </label>
      <span class="count-badge" id="adm-logs-count"></span>
    </div>
    <div class="table-wrap" style="max-height:60vh"><table>
      <thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Details</th><th style="width:60px">Result</th></tr></thead>
      <tbody id="adm-logs-tbody"></tbody>
    </table></div>`;
  const searchInp=document.getElementById('adm-logs-search');
  wireSearchClear('adm-logs-search','adm-logs-search-clear');
  searchInp.addEventListener('input',debounce(()=>{ _admLogsFilterQ=searchInp.value; _admLogsFilterRows(); },200));
  document.getElementById('btn-adm-logs-refresh').addEventListener('click',()=>renderAdminLogsSection());
  document.getElementById('adm-logs-wrap').addEventListener('change',e=>{
    _admLogsWrapDetails=e.target.checked;
    _admLogsFilterRows();
  });
  _admLogsFilterRows();
}
function _admLogsFilterRows(){
  const tbody=document.getElementById('adm-logs-tbody');
  const countEl=document.getElementById('adm-logs-count');
  if(!tbody) return;
  const predicate=parseBoolQuery(_admLogsFilterQ);
  const rows=_admLogsCache.filter(l=>{
    if(!_admLogsFilterQ.trim()) return true;
    const detailsStr=typeof l.details==='object'?JSON.stringify(l.details):String(l.details||'');
    return predicate([l.user,l.action,detailsStr,l.success?'success':'failed'].map(v=>String(v||'')).join(' | ').toLowerCase());
  });
  tbody.innerHTML=rows.map(l=>{
    const detailsStr = typeof l.details==='object' ? JSON.stringify(l.details,null,_admLogsWrapDetails?1:0) : String(l.details||'');
    return `<tr>
        <td style="white-space:nowrap;font-size:11px;color:var(--muted)">${fmtDateTime(l.timestamp)}</td>
        <td style="font-size:12px">${esc(l.user||'')}</td>
        <td style="font-size:12px;font-family:monospace">${esc(l.action||'')}</td>
        <td class="adm-log-details" data-expanded="${_admLogsWrapDetails?'1':'0'}"
            style="${_admLogsDetailsStyle(_admLogsWrapDetails)}"
            title="Click to expand / collapse">${esc(detailsStr)}</td>
        <td style="text-align:center">${l.success?'<span style="color:#1F8B4C">✓</span>':'<span style="color:#E53E3E">✗</span>'}</td>
      </tr>`;
  }).join('');
  // Per-row expand: lets the user open one long payload without switching the
  // whole table to multi-line mode.
  tbody.querySelectorAll('.adm-log-details').forEach(td=>td.addEventListener('click',()=>{
    const expanded = td.dataset.expanded==='1';
    td.dataset.expanded = expanded?'0':'1';
    td.setAttribute('style',_admLogsDetailsStyle(!expanded));
  }));
  if(countEl) countEl.textContent=`${rows.length} of ${_admLogsCache.length} (most recent 500)`;
}
