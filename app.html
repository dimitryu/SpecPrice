}

// Upsert tool part numbers + descriptions into parts_cache. Existing
// part_number → update description; unknown part_number → create a new row.
// This is deliberately a straight overwrite of description (unlike BOM saves,
// which only fill it in if blank) since the user is explicitly (re-)importing
// a tools catalog and expects its descriptions to take effect.
// own_stock is always set true here — items brought in via this specific
// import are, by definition, tools the company already has in stock (see the
// "Stock" column in _psCellHTML, and Sales Desk's ownership check in
// handleSDFiles, which excludes own_stock=true tool rows from the final price).
async function saveToolsImport(rows){
  await loadParts();
  let updated=0, created=0;
  for(const r of rows){
    const pn=r.part_number.trim();
    if(!pn) continue;
    const existing=allParts.find(p=>String(p.part_number||'').toLowerCase()===pn.toLowerCase());
    try{
      if(existing){
        await updateDoc(doc(db,'companies',companyId,'parts_cache',existing._id),
          {description:r.description||'', own_stock:true, updatedAt:serverTimestamp(), qty:1});
        existing.description=r.description||''; existing.own_stock=true;
        updated++;
      } else {
        const key=pn.replace(/[\/\\#\[\]*?]/g,'_').slice(0,500);
        await setDoc(doc(db,'companies',companyId,'parts_cache',key),{
          part_number:pn, description:r.description||'', drawing_number:'', manufacturer:'',
          unit:'', atlantium_pn:'', price:'', priority_price:'', distributor:'', stock:'', price_description:'', qty:1,
          own_stock:true, updatedAt:serverTimestamp()
        },{merge:true});
        allParts.push({_id:key, part_number:pn, description:r.description||'', own_stock:true, qty:1});
        created++;
      }
    }catch(e){ console.warn('[ToolsImport] save error:',pn,e.message); }
  }
  return {updated, created};
}

// ══════════════════════════════════════════════════════════════════════════════
// SALES DESK
// ══════════════════════════════════════════════════════════════════════════════
const _SD_DEFAULT_COLS=[
  {k:'part_number',    l:'MNF P/N',          w:'110px'},
  {k:'drawing_number', l:'Drawing #',       w:'100px'},
  {k:'description',    l:'Description',     w:'190px',wrap:true},
  {k:'manufacturer',   l:'Manufacturer',    w:'120px'},
  {k:'qty',            l:'QTY',             w:'75px'},
  {k:'unit',           l:'Units',           w:'55px'},
  {k:'priority_price', l:'Priority Cost',  w:'95px'},
  {k:'mouser_price',   l:'Mouser Cost',     w:'95px'},
  {k:'digikey_price',  l:'DigiKey Cost',    w:'95px'},
  {k:'total',          l:'Part Cost',       w:'85px'},
  {k:'labor_time',     l:'Labor Time',      w:'85px'},
];
// Length constants for "mm"-unit (length) rows — Priority lists cable/wire
// pricing per METER, while Mouser and DigiKey quote it per FOOT (see
// _priceTargetQty, which already converts mm→feet when looking those prices up).
// A flat qty×price would overshoot by ~1000x for Priority and ~305x for the
// distributors if the row's mm quantity were multiplied straight against either
// price without first converting it into the unit that price is quoted in.
const MM_PER_METER=1000, MM_PER_FOOT=304.8;
// Every price source the app can quote from. Order matters only for tie-breaks.
const _SD_PRICE_SOURCES=['priority_price','mouser_price','digikey_price'];
// Actual dollar cost of this row if priced from `priceField` — for "pc" (and any
// other non-length) rows the price is already per-piece, so qty multiplies
// directly; for "mm" rows the qty is first converted into whatever unit that
// particular source quotes in.
function _sdLineCost(r, priceField){
  const price=parseFloat(r[priceField])||0;
  if(!price) return 0;
  const qty=parseFloat(r.qty)||1;
  const unit=String(r.unit||'').trim().toLowerCase();
  if(unit==='mm'){
    if(priceField==='priority_price') return price*(qty/MM_PER_METER);
    // Mouser and DigiKey both sell bulk wire by the foot.
    return price*(qty/MM_PER_FOOT);
  }
  return price*qty;
}
// Part Cost is directly editable in the table (see _sdCellHTML 'total' case) —
// r.manual_total, when set, is a straight user-typed override of the whole
// line's cost (not a per-unit price), useful when there's no FC/Priority price
// at all or when the user has a better number (e.g. a vendor quote). Clearing
// the field goes back to the normal auto-calculation below.
// Part Cost uses whichever available source produces the LOWEST actual dollar
// cost for this row (mirrors the Windows app's _update_row_total). Compared on
// real cost, never on the sources' raw per-unit numbers: those aren't on the
// same unit basis for mm rows, so a naive min() would pick per-foot over
// per-metre and understate the line by ~3x.
// r._costSource records which one won, so the UI can say where a number came
// from instead of leaving the user to reverse-engineer it.
function _sdRecalcTotal(r){
  if(r.manual_total!=null && r.manual_total!==''){
    r.total=parseFloat(r.manual_total)||0;
    r._costSource='manual';
    return r.total;
  }
  let best=0, bestField='';
  for(const f of _SD_PRICE_SOURCES){
    const c=_sdLineCost(r,f);
    if(c>0 && (best===0 || c<best)){ best=c; bestField=f; }
  }
  // Only if no real source quoted this part: fall back to the AI's crimp-tool
  // estimate. Deliberately last — a real quote always beats a guess, however
  // close the guess looks.
  if(!best){
    const est=_sdLineCost(r,'est_price');
    if(est>0){ best=est; bestField='est_price'; }
  }
  r.total=best;
  r._costSource=bestField;
  return r.total;
}
// Labor Total = labor_time(min) × qty_for_labor, for "pc"-counted rows only —
// mm/gr rows take the flat-1-minute path below instead, so this only ever
// runs for a per-piece count.
function _sdLaborQtyMultiplier(r){
  const qtyNum=parseFloat(r.qty)||0;
  return qtyNum>0 ? qtyNum : 1;
}
function _sdRecalcLaborTotal(r){
  // The Labor Time column in the table is directly user-editable (see
  // _sdCellHTML 'labor_time' case) — once the user types their own number,
  // r._laborManualOverride is set and that number is used as-is here,
  // exactly like Part Cost's manual_total override. Clearing the field goes
  // back to the auto-calculation below.
  if(r._laborManualOverride) return r.labor_total;
  const lt=parseFloat(r.labor_time)||0;
  // A row's labor_time can ALSO be a genuine AI-computed total from the
  // cable-process analysis (see handleSDFiles), where it already equals
  // unit_minutes × qty_in_drawing — the sum of every manufacturing step the
  // AI tied to this specific row (e.g. the main cable row is exactly where
  // "cut and strip", "braid shield", etc. land). That real, drawing-derived
  // total must win over the mm/gr flat-1-minute floor below — checking unit
  // FIRST would silently throw away legitimate computed minutes just because
  // the row happens to be measured in mm/gr, which is exactly the case for a
  // cable/wire row. Do NOT re-multiply by this row's own qty column either:
  // that column may represent a different quantity concept entirely (e.g.
  // "1 connector housing" whose pins are crimped 20 times), so multiplying
  // again here would silently inflate the total.
  if(r._laborFixedTotal){
    r.labor_total = lt;
    return r.labor_total;
  }
  // Length rows (mm — the system's sole canonical length unit) and bulk-weight
  // rows (gr, treated the same as mm per business rule) that DIDN'T get a real
  // AI-computed total (e.g. a plain length-of-wire stock row with no process
  // steps identified) always take a flat 1 minute of labor instead of scaling
  // with a manually-typed rate × the row's mm/gr quantity — prepping this kind
  // of material takes roughly the same setup time no matter the quantity.
  const unit=String(r.unit||'').trim().toLowerCase();
  if(unit==='mm'||unit==='gr'){
    r.labor_total = 1;
    return r.labor_total;
  }
  // A manually-typed Labor Time is always a PER-UNIT rate that scales with
  // the row's own Sales-Desk quantity (e.g. "apply label" × 8 identical
  // rows) — that multiplication happens here.
  r.labor_total = lt>0 ? lt*_sdLaborQtyMultiplier(r) : 0;
  return r.labor_total;
}
function _sdRecalcRow(r){ _sdRecalcTotal(r); _sdRecalcLaborTotal(r); return r; }
const _SD_UNIT_OPTIONS=['','pc','mm','gr'];
const _TOOL_TAG='<span style="margin-inline-start:6px;padding:1px 6px;border-radius:8px;background:#F59E0B;color:#fff;font-size:9px;font-weight:700;vertical-align:middle">TOOL</span>';
function _sdCellHTML(k,r,i){
  // Does this row have ANY quotable price? Used below to flag rows that still
  // need a number typed in by hand.
  const hasAnyPrice=_SD_PRICE_SOURCES.some(f=>(parseFloat(r[f])||0)>0);
  switch(k){
    // part_number/drawing_number/description/unit are editable text fields
    // (not just for manually-added blank rows — any row can be corrected
    // by hand) so a user can add a row and type its data in directly.
    case 'part_number': return `<input type="text" class="sd-part-number" data-i="${i}" value="${esc(r.part_number||'')}"
           placeholder="Part #" style="width:100%;min-width:80px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;font-size:12px">`;
    case 'drawing_number': return `<input type="text" class="sd-drawing-number" data-i="${i}" value="${esc(r.drawing_number||'')}"
           style="width:100%;min-width:70px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;font-size:12px">`;
    case 'description': return `<span style="display:flex;align-items:center;gap:4px"><input type="text" class="sd-description" data-i="${i}" value="${esc(r.description||'')}"
           style="flex:1;min-width:120px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;font-size:12px">${
           _sdIsToolRow(r)?_TOOL_TAG:''}</span>`;
    case 'qty': return `<input type="number" class="sd-qty" data-i="${i}" value="${r.qty??''}" min="0.001" step="any"
           style="width:60px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;font-size:12px">`;
    case 'manufacturer': return `<input type="text" class="sd-manufacturer" data-i="${i}" value="${esc(r.manufacturer||'')}"
           placeholder="—" style="width:100%;min-width:100px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;font-size:12px">`;
    case 'unit': return `<select class="sd-unit" data-i="${i}" style="padding:2px 4px;border:1px solid var(--border);border-radius:4px;font-size:12px">
           ${_SD_UNIT_OPTIONS.map(u=>`<option value="${u}" ${String(r.unit||'')===u?'selected':''}>${u||'—'}</option>`).join('')}
         </select>`;
    // All price columns share the Database's comparison rule — cheapest green,
    // dearest red — so a price means the same thing on both screens.
    case 'priority_price':
    case 'mouser_price':
    case 'digikey_price': return _priceCellHTML(r,k);
    // Part Cost is always editable — type a number to set/correct it directly
    // (see _sdRecalcTotal). Highlighted cyan when no source has a price and
    // there's no manual override yet, so missing-price rows are easy to spot.
    case 'total': {
      const hasManual = r.manual_total!=null && r.manual_total!=='';
      const noSourcePrice = !hasAnyPrice && !hasManual;
      const ownedNote = _sdIsToolOwned(r)
        ? `<div style="font-size:9px;color:#1F8B4C;font-weight:700;white-space:nowrap" title="This tool is marked in Stock in the Database — not charged in the final price">✓ in stock</div>`
        : '';
      return `<input type="number" class="sd-manual-total" data-i="${i}" value="${r.total?+r.total.toFixed(2):''}"
             min="0" step="any" placeholder="0.00" title="${hasManual?'Manual price override — clear to go back to FC/Priority price':'No FC/Priority price — type one in manually'}"
             style="width:78px;padding:2px 5px;border:1px solid ${noSourcePrice?'#06b6d4':'var(--border)'};border-radius:4px;font-size:12px;font-weight:700;text-align:right;${noSourcePrice?'background:#ecfeff;color:#0e7490':''}">${ownedNote}`;
    }
    // Labor Time shows/edits the row's actual total minutes directly (what
    // used to be the separate read-only "Labor Total" column) — type a number
    // to override the auto-calculated value (see _sdRecalcLaborTotal); clear
    // it to go back to auto (AI cable-process analysis, or the flat 1 min
    // mm/gr rule).
    case 'labor_time': {
      const hasManual = !!r._laborManualOverride;
      return `<input type="number" class="sd-labor-time" data-i="${i}" value="${r.labor_total?+r.labor_total.toFixed(2):''}" min="0" step="any"
           placeholder="min" title="${hasManual?'Manual override — clear to go back to the auto-calculated value':'Auto-calculated — type your own number to override it'}"
           style="width:65px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;font-size:12px">`;
    }
    default: return esc(r[k]);
  }
}
// Manufacturing Routings (the keyword→operation-duration matching system)
// was removed — Labor Time is now filled purely by the AI cable-manufacturing-
// process analysis run per drawing (see aiAnalyzeCableProcess/handleSDFiles)
// or typed in manually. This is kept as a no-op so its existing call sites
// don't need to change.
// ══════════════════════════════════════════════════════════════════════════════
// Labor Time for parts added from the Database
// ------------------------------------------------------------------------------
// Adding a drawing runs the AI cable-process analysis and every row comes back
// with its labor minutes. Adding the same parts from the Database used to give
// zero, because this function was an empty stub — a leftover from when labor
// came from the Manufacturing Routings table, which was removed. Nothing
// replaced it, so the Sales Desk silently quoted those assemblies with no labor
// at all: the parts cost was right and the price was too low.
//
// It now runs the SAME analysis as the drawing path. The one honest difference
// is the input: there is no drawing, so the AI works from the part list alone
// (see _cableProcessPrompt's hasDrawing=false wording). It can read "26 POS"
// out of a description, but it cannot count pins or measure a length off a
// drawing it was never given — so treat these as estimates and adjust the Labor
// Time column where the drawing would have told a different story.
// ══════════════════════════════════════════════════════════════════════════════
// Returns {applied, minutes, reason} so the caller can TELL THE USER what
// happened. The first version returned nothing and swallowed every failure
// path, so "no labor appeared" was indistinguishable from "no AI key", "the
// model returned no steps" and "the request failed" — which is precisely why
// this took two attempts to diagnose.
async function _sdAutoMatchLabor(onProgress){
  if(!anthKey && !geminiKey){
    return {applied:0, minutes:0, reason:'No AI key configured — add one in Admin → AI API Keys'};
  }

  // ── Which rows may this estimate touch? ──
  // Rows whose labor came from an actual DRAWING are off-limits: replacing a
  // figure read from the drawing with a guess made without one is strictly
  // worse. Rows a previous parts-only run produced (_laborFromParts) ARE
  // eligible, because a re-estimate must be able to redo its own work.
  const eligible=sdItems
    .map((r,i)=>({r,i}))
    .filter(({r})=>!r._laborManualOverride && !_sdIsToolRow(r)
                   && (r._laborFromParts || !(parseFloat(r.labor_total)>0)));
  if(!eligible.length){
    return {applied:0, minutes:0, reason:'Every row already has a Labor Time'};
  }
  let applied=0, minutesTotal=0, lastError='';

  // One analysis per drawing, mirroring the drawing path: steps not tied to a
  // single row become that drawing's generalMinutes, and the breakdown modal
  // finds a section by matching drawingName against rows in Sales Desk.
  const groups=new Map();
  for(const item of eligible){
    const key=String(item.r.drawing_number||'').trim();
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(item);
  }

  let groupNo=0;
  const groupCount=groups.size;
  for(const [dwg,members] of groups){
    groupNo++;
    // A 10-second silent pause reads as a broken button, so report which
    // drawing is being worked on as the loop advances.
    if(onProgress) onProgress({done:groupNo, total:groupCount, drawing:dwg, rows:members.length});
    // ── Re-estimating must REPLACE, not accumulate ──
    // Each run used to push a fresh breakdown and add to whatever minutes a row
    // already had. Running it twice on one drawing therefore produced two
    // sections in the modal AND double-counted that drawing's general minutes
    // in Cost Summary (see _sdActiveGeneralLaborMinutes, which sums every
    // matching breakdown) — quietly inflating the quote.
    // Clearing this drawing's previous parts-only result first makes the whole
    // operation idempotent: pressing the button twice gives the same answer.
    _sdLaborBreakdowns=_sdLaborBreakdowns.filter(b=>!(b.fromPartsOnly && b.drawingName===dwg));
    for(const {r} of members){
      if(r._laborFromParts){
        r.labor_time=''; r.labor_total=0;
        delete r._laborFixedTotal; delete r._laborFromParts;
      }
    }
    // A breakdown whose drawingName matches nothing in sdItems would be
    // invisible in the modal and its general minutes uncounted. Rows with no
    // drawing number can't be represented that way, so their steps are all
    // treated as row-tied and no breakdown section is created for them.
    const canTrack=!!dwg;
    try{
      const rowsList=members
        .map(({r},idx)=>`${idx}: ${r.description||r.part_number||''} (qty=${r.qty||''}${r.unit?' '+r.unit:''})`)
        .join('\n');
      const proc=await aiAnalyzeCableProcess('', false, null, rowsList, /*hasDrawing*/false);
      if(!proc || !proc.steps || !proc.steps.length){
        lastError=lastError||'The AI returned no manufacturing steps for these parts';
        continue;
      }

      let generalMinutes=0, rowTiedMinutes=0;
      const displaySteps=[];
      for(const step of proc.steps){
        const unitMins=parseFloat(step.unit_minutes)||0;
        if(!unitMins) continue;
        // Same contract as the drawing path: the AI reports a per-occurrence
        // time and a repeat count separately, and WE multiply. Never trust the
        // model to have done the arithmetic.
        const qtyInDrawing=parseFloat(step.qty_in_drawing)||1;
        const totalMins=unitMins*qtyInDrawing;
        const target=(step.row_idx!=null) ? members[step.row_idx] : null;
        displaySteps.push({operation:step.operation, unitMinutes:unitMins, qty:qtyInDrawing, minutes:totalMins});
        if(target && sdItems[target.i]){
          const row=sdItems[target.i];
          row.labor_time=String((parseFloat(row.labor_time)||0)+totalMins);
          // Already a total for one assembly — _sdRecalcLaborTotal must use it
          // as-is rather than multiplying it by the row's own qty again.
          row._laborFixedTotal=true;
          row._laborFromParts=true;   // this run owns it, so a re-run may redo it
          _sdRecalcLaborTotal(row);
          rowTiedMinutes+=totalMins;
        } else if(canTrack){
          generalMinutes+=totalMins;
        } else {
          // Nowhere to attribute it and no breakdown to hold it — fold it into
          // the first row so the time isn't silently lost from the quote.
          const first=sdItems[members[0].i];
          if(first){
            first.labor_time=String((parseFloat(first.labor_time)||0)+totalMins);
            first._laborFixedTotal=true;
            first._laborFromParts=true;
            _sdRecalcLaborTotal(first);
            rowTiedMinutes+=totalMins;
          }
        }
      }

      if(canTrack){
        _sdLaborBreakdowns.push({
          drawingName: dwg,
          steps: displaySteps,
          rowTiedMinutes,
          seriesTotal: rowTiedMinutes+generalMinutes,
          // Floored at the series total for the same reason as the drawing
          // path: a single stand-alone build can't take LESS than the batch
          // per-unit time, and the AI's estimate is an independent guess.
          singleUnitMinutes: Math.max(parseFloat(proc.single_unit_minutes)||0, rowTiedMinutes+generalMinutes),
          generalMinutes,
          // Marks this section as estimated without a drawing — surfaced in the
          // breakdown modal so the number is never mistaken for a drawing-derived one.
          fromPartsOnly:true,
        });
      }
      for(const {r} of members) r._laborFromParts=true;
      applied+=members.length;
      minutesTotal+=rowTiedMinutes+generalMinutes;
      logSystemAudit('labor_estimate_from_parts',
        {drawing:dwg||'(none)', rows:members.length, steps:displaySteps.length,
         minutes:+(rowTiedMinutes+generalMinutes).toFixed(1)}, true);
    }catch(e){
      lastError=e.message||String(e);
      console.warn('[SD] labor estimate from parts failed:', lastError);
      logSystemAudit('labor_estimate_from_parts', lastError, false);
    }
  }
  return {applied, minutes:minutesTotal,
          reason: applied ? '' : (lastError||'No labor time could be estimated')};
}

// Shows the manufacturing-step breakdown behind the Labor Time number — one
// section per drawing analyzed by aiAnalyzeCableProcess (see handleSDFiles),
// each listing every step + its minutes, the drawing's series (per-unit,
// batch-production) total, and a separate reference figure for what a single
// stand-alone cable would take. Also shows any general/unattributed step time
// and a grand total across everything currently counted in the auto Labor Time.
// ══════════════════════════════════════════════════════════════════════════════
// Labor Time Breakdown — Hebrew translation
// ------------------------------------------------------------------------------
// The fixed labels are translated from a table (instant, free, always correct).
// The operation sentences come from the AI per drawing, so they can't be — those
// go through the AI once and are then cached, keyed by the exact English text.
// Cache lives in localStorage: the same operations recur across drawings, and
// re-paying for a translation the user has already seen would be wasteful and
// slow. The chosen language is remembered the same way, per the request to
// reopen in whatever language was last picked.
// ══════════════════════════════════════════════════════════════════════════════
const _LB_CACHE_KEY='labor_breakdown_tr_cache';
// English ALWAYS on open. The language is a per-viewing choice, not a setting:
// the underlying data is English, and quietly reopening in a translation the
// user picked days ago hides that. They press a button when they want it.
let _lbLang='en';
// The TRANSLATIONS are still cached across sessions — that's a cost/latency
// optimisation, invisible to the user, and unrelated to which language shows.
// Shape: { he:{english:translated}, ru:{...} }
let _lbCache = (()=>{
  try{ const c=JSON.parse(localStorage.getItem(_LB_CACHE_KEY))||{}; return {he:c.he||{}, ru:c.ru||{}}; }
  catch{ return {he:{}, ru:{}}; }
})();
function _lbSaveCache(){
  try{ localStorage.setItem(_LB_CACHE_KEY, JSON.stringify(_lbCache)); }
  catch(e){ console.warn('[Labor] translation cache not saved:', e.message); }
}
// Hebrew reads right-to-left; Russian does not.
function _lbRTL(){ return _lbLang==='he'; }
const _LB_LANG_NAMES={en:'English', he:'עברית', ru:'Русский'};

// Fixed UI strings. Kept as a table rather than sent to the AI so the chrome of
// the dialog never depends on a network call.
const _LB_LABELS={
  he:{
    'Operation':'פעולה',
    'Per op':'לפעולה',
    '×Qty':'× כמות',
    'Total':'סה"כ',
    'min':'דק׳',
    'Row-tied operations':'פעולות המשויכות לשורה',
    '+ General assembly/inspection (not tied to one part)':'+ הרכבה/בדיקה כללית (לא משויך לפריט מסוים)',
    '= Total (series, per unit)':'= סה"כ (סדרה, ליחידה)',
    'Reference: single stand-alone cable':'להשוואה: כבל בודד עצמאי',
    'Total Labor Time (auto)':'סה"כ זמן עבודה (אוטומטי)',
    'Labor Time Breakdown':'פירוט זמן עבודה',
    'Close':'סגור',
    'Translating…':'מתרגם…',
  },
  ru:{
    'Operation':'Операция',
    'Per op':'За опер.',
    '×Qty':'× Кол-во',
    'Total':'Итого',
    'min':'мин',
    'Row-tied operations':'Операции, привязанные к строке',
    '+ General assembly/inspection (not tied to one part)':'+ Общая сборка/контроль (не привязано к детали)',
    '= Total (series, per unit)':'= Итого (серия, на единицу)',
    'Reference: single stand-alone cable':'Для сравнения: одиночный кабель',
    'Total Labor Time (auto)':'Общее время работы (авто)',
    'Labor Time Breakdown':'Детализация времени работы',
    'Close':'Закрыть',
    'Translating…':'Перевод…',
  },
};
// Returns the Hebrew text when available, otherwise the English original.
// Never blocks and never throws: an untranslated string is far better than a
// broken dialog.
function _lbTr(text){
  if(_lbLang==='en') return text;
  const t=String(text||'');
  return (_LB_LABELS[_lbLang]||{})[t] || (_lbCache[_lbLang]||{})[t] || t;
}

// Translates the operation sentences that aren't already cached.
// Batched into ONE request — a call per line would be slow and needlessly
// expensive when a breakdown routinely has a dozen steps.
async function _lbTranslateOperations(texts, lang){
  const bucket=_lbCache[lang] || (_lbCache[lang]={});
  const todo=[...new Set(texts.map(t=>String(t||'').trim()).filter(t=>t && !bucket[t]))];
  if(!todo.length) return true;
  if(!anthKey && !geminiKey) throw new Error('No AI key configured — add one in Admin → AI API Keys');

  const langName = lang==='ru' ? 'Russian' : 'Hebrew';
  const prompt=`Translate each of these manufacturing operation descriptions from English to ${langName}.\n`
    +'These are cable/harness assembly steps. Rules:\n'
    +'- Keep part numbers, standards and units exactly as they are (do NOT translate or transliterate them).\n'
    +'- Technical terms engineers normally say in English (e.g. SMT, PCB, IDC, crimp) may stay in English.\n'
    +'- Return ONLY a JSON array of the translated strings, same order, same length. No commentary.\n\n'
    +JSON.stringify(todo, null, 0);

  let raw='';
  if(anthKey){
    const resp=await _fetchWithRetry('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':anthKey,'anthropic-version':'2023-06-01',
               'anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2048,
                           messages:[{role:'user',content:prompt}]})
    });
    if(!resp.ok){ let m=`Anthropic error ${resp.status}`;
      try{const e=await resp.json(); m=e.error?.message||m;}catch{} throw new Error(m); }
    raw=(await resp.json()).content[0].text;
  } else {
    const resp=await _fetchWithRetry(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
      {method:'POST',headers:{'content-type':'application/json'},
       body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
                            generationConfig:{thinkingConfig:{thinkingBudget:0}}})});
    if(!resp.ok){ let m=`Gemini error ${resp.status}`;
      try{const e=await resp.json(); m=e.error?.message||m;}catch{} throw new Error(m); }
    const d=await resp.json();
    raw=(d.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
  }

  const m=String(raw).match(/\[[\s\S]*\]/);
  if(!m) throw new Error('Translation came back in an unexpected format');
  const arr=JSON.parse(m[0]);
  // A length mismatch means the lines no longer line up with their originals —
  // caching them by position would attach the wrong Hebrew to the wrong step,
  // which is worse than showing English.
  if(!Array.isArray(arr) || arr.length!==todo.length){
    throw new Error(`Translation returned ${Array.isArray(arr)?arr.length:'?'} lines for ${todo.length} operations`);
  }
  todo.forEach((t,i)=>{ const v=String(arr[i]||'').trim(); if(v) bucket[t]=v; });
  _lbSaveCache();
  return true;
}

function openLaborBreakdownModal(){
  const {autoLaborMinutes}=_sdComputeSummary();
  // Only show drawings that still have at least one row in Sales Desk —
  // once every row from a drawing is deleted, its breakdown no longer
  // contributes to the total, so it's dropped from this view too (see
  // _sdActiveGeneralLaborMinutes for the same rule applied to the total).
  const activeBreakdowns = _sdLaborBreakdowns.filter(b=>sdItems.some(r=>String(r.drawing_number||'')===b.drawingName));
  if(!activeBreakdowns.length){
    showModal(`<div class="modal modal-sm">
      <div class="modal-head"><h3>📋 Labor Time Breakdown</h3><button class="close-modal" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <p style="color:var(--muted);font-size:13px">No AI cable-process analysis for the parts currently in Sales Desk — import a drawing via "📎 New Drawing" to get a step-by-step manufacturing breakdown here.</p>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>
    </div>`);
    return;
  }
  const sections = activeBreakdowns.map(b=>`
    <div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <div style="font-weight:700;margin-bottom:6px">${esc(b.drawingName||'(drawing)')}${b.fromPartsOnly
        ? `<span style="margin-inline-start:7px;padding:2px 7px;border-radius:9px;background:#FEF3C7;color:#92400e;font-size:10px;font-weight:700;cursor:help" title="Estimated from the parts list alone — no drawing was analysed, so pin counts and lengths could not be read. Adjust Labor Time where the drawing would say otherwise.">estimated from parts</span>`
        : ''}</div>
      <!-- table-layout:fixed stops the long Operation text from stretching the
           table past the modal and re-introducing the horizontal scrollbar. -->
      <table style="width:100%;font-size:12px;border-collapse:collapse;table-layout:fixed">
        <thead><tr style="text-align:${_lbRTL()?'right':'left'};color:var(--muted)">
          <th style="padding:4px 7px;border-bottom:2px solid var(--border)">${_lbTr('Operation')}</th>
          <th style="padding:4px 7px;text-align:right;width:62px;border-bottom:2px solid var(--border);border-inline-start:1px solid var(--border)">${_lbTr('Per op')}</th>
          <th style="padding:4px 7px;text-align:center;width:52px;border-bottom:2px solid var(--border);border-inline-start:1px solid var(--border)">${_lbTr('×Qty')}</th>
          <th style="padding:4px 7px;text-align:right;width:62px;border-bottom:2px solid var(--border);border-inline-start:1px solid var(--border)">${_lbTr('Total')}</th>
        </tr></thead>
        <tbody>
          ${b.steps.map(s=>{
            const opEn=String(s.operation||'');
            const op=_lbTr(opEn);
            // Operation text is a full sentence and routinely longer than the
            // column. It used to be clipped behind a horizontal scrollbar, so
            // the end of every long step was simply unreadable. Wrap it over as
            // many lines as it needs — vertical space is cheap here, and the
            // whole point of this modal is to READ what the AI decided.
            return `<tr style="vertical-align:top">
              <td style="padding:5px 7px;white-space:normal;word-break:break-word;line-height:1.45;border-bottom:1px solid var(--border)">${esc(op)}</td>
              <td style="padding:5px 7px;text-align:right;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border);border-inline-start:1px solid var(--border)">${s.unitMinutes!=null?(parseFloat(s.unitMinutes)||0).toFixed(2):'—'}</td>
              <td style="padding:5px 7px;text-align:center;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border);border-inline-start:1px solid var(--border)">${s.qty!=null?s.qty:'—'}</td>
              <td style="padding:5px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);border-inline-start:1px solid var(--border)">${(parseFloat(s.minutes)||0).toFixed(1)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      ${b.generalMinutes ? (()=>{
        const rowTied = b.rowTiedMinutes!=null ? b.rowTiedMinutes : (b.seriesTotal-b.generalMinutes);
        // Spelled out as an explicit addition (not just an "of which" aside)
        // so it's visible at a glance that the general assembly/inspection
        // time is already counted INTO the total below, not sitting on top
        // of it as a separate add-on.
        return `<div style="margin-top:4px;font-size:11px;color:var(--muted)">
          <div style="display:flex;justify-content:space-between"><span>${_lbTr('Row-tied operations')}</span><span>${rowTied.toFixed(1)} ${_lbTr('min')}</span></div>
          <div style="display:flex;justify-content:space-between"><span>${_lbTr('+ General assembly/inspection (not tied to one part)')}</span><span>${b.generalMinutes.toFixed(1)} ${_lbTr('min')}</span></div>
        </div>`;
      })() : ''}
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px">
        <strong>${_lbTr('= Total (series, per unit)')}</strong><strong>${b.seriesTotal.toFixed(1)} ${_lbTr('min')}</strong>
      </div>
      <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:12px">
        <span>${_lbTr('Reference: single stand-alone cable')}</span><span>≈ ${b.singleUnitMinutes.toFixed(1)} ${_lbTr('min')}</span>
      </div>
    </div>`).join('');
  showModal(`<div class="modal" style="width:min(94vw,680px)">
    <div class="modal-head">
      <h3>📋 ${_lbTr('Labor Time Breakdown')}</h3>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>
    <!-- overflow-x hidden, not auto: the whole point of the wrapping above is
         that nothing should need horizontal scrolling to be read. -->
    <div class="modal-body" style="max-height:70vh;overflow-y:auto;overflow-x:hidden"
         dir="${_lbRTL()?'rtl':'ltr'}">
      ${sections}
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding-top:8px;border-top:2px solid var(--border)">
        <span>${_lbTr('Total Labor Time (auto)')}</span><span>${autoLaborMinutes.toFixed(1)} ${_lbTr('min')}</span>
      </div>
      <div id="lb-tr-msg" style="margin-top:8px;font-size:11px"></div>
    </div>
    <div class="modal-foot" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--muted)">🌐</span>
      ${['en','he','ru'].map(L=>`<button class="btn ${_lbLang===L?'btn-blue':'btn-ghost'} btn-sm"
          data-lb-lang="${L}" ${_lbLang===L?'disabled':''}
          style="font-size:12px">${_LB_LANG_NAMES[L]}</button>`).join('')}
      <button class="btn btn-ghost" style="margin-left:auto" onclick="closeModal()">${_lbTr('Close')}</button>
    </div>
  </div>`);

  document.querySelectorAll('[data-lb-lang]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const lang=btn.dataset.lbLang;
      if(lang===_lbLang) return;
      const msg=document.getElementById('lb-tr-msg');

      if(lang!=='en'){
        // Only the AI-written operation sentences need a round-trip, and only
        // the ones not already cached for THIS language — so switching back to
        // a language already seen is instant.
        const ops=activeBreakdowns.flatMap(b=>b.steps.map(st=>st.operation||''));
        const bucket=_lbCache[lang]||{};
        const missing=ops.filter(t=>t && !bucket[String(t).trim()]).length;
        if(missing){
          document.querySelectorAll('[data-lb-lang]').forEach(b=>b.disabled=true);
          btn.textContent='…';
          if(msg) msg.innerHTML='<span style="color:var(--muted)">Translating operation descriptions…</span>';
          try{
            await _lbTranslateOperations(ops, lang);
          }catch(e){
            document.querySelectorAll('[data-lb-lang]').forEach(b=>{ b.disabled=(b.dataset.lbLang===_lbLang); });
            btn.textContent=_LB_LANG_NAMES[lang];
            if(msg) msg.innerHTML=`<span style="color:var(--red)">Translation failed — ${esc(e.message)}</span>`;
            logSystemAudit('labor_breakdown_translate', e.message, false);
            return;   // stay put rather than switch to a half-translated view
          }
          logSystemAudit('labor_breakdown_translate', `${missing} operation(s) → ${lang}`, true);
        }
      }
      _lbLang=lang;           // deliberately NOT persisted — see _lbLang above
      closeModal();
      openLaborBreakdownModal();
    });
  });
}
let _sdFilterQ='';

        <ul style="margin:0;padding-inline-start:18px">
          ${d.notes.map(n=>`<li style="font-size:12px;line-height:1.5;${_NOTE_DOC_STD_RE.test(n)?'color:#E53E3E;font-weight:600':'color:var(--text)'}">${esc(n)}</li>`).join('')}
        </ul>
      </div>`).join('')}`;
}

// Sums generalMinutes from every analyzed drawing that still has at least one
// row present in sdItems — once every row belonging to a drawing is deleted
// (individually, or via Clear All), that drawing's un-attributed step time
// drops out of the total too.
function _sdActiveGeneralLaborMinutes(){
  let total=0;
  for(const b of _sdLaborBreakdowns){
    if(!b.generalMinutes) continue;
    if(sdItems.some(r=>String(r.drawing_number||'')===b.drawingName)) total+=b.generalMinutes;
  }
  return total;
}

// A row is a crimp/insertion TOOL line (synthesized by the AI during drawing
// extraction — see _BOM_TEXT_PROMPT/_BOM_VISION_PROMPT rule 5) if its
// description contains the word "TOOL". These get broken out into their own
// "Tools" line in Cost Summary instead of being folded silently into Parts
// Total, since a tool is a one-time purchase for the job, not a per-cable part.
function _sdIsToolRow(r){ return /\btool\b/i.test(String(r.description||'')); }
// A crimp/insertion TOOL row is SYNTHESIZED by the AI — it is not a line that
// appeared on the customer's BOM. It also behaves differently from every other
// row: it never enters the cable price (see _sdComputeSummary). Both facts are
// invisible from the row itself, which has caused the tool to be read as just
// another part. Amber tint + left bar + a TOOL tag, applied everywhere such a
// row is shown, so the distinction is unmissable rather than inferred.
const _TOOL_ROW_STYLE='background:#FFFBEB;box-shadow:inset 3px 0 0 #F59E0B';
const _TOOL_ROW_TITLE='Added automatically by the drawing analysis — not a line from the customer BOM. Tools are quoted separately and never included in the cable price.';
function _toolRowAttrs(r){
  return _sdIsToolRow(r) ? ` style="${_TOOL_ROW_STYLE}" title="${esc(_TOOL_ROW_TITLE)}"` : '';
}

// Whether a TOOL row's part number is marked "in Stock" in the Database RIGHT
// NOW — checked live against allParts every time it's needed (Cost Summary
// calc, the Part Cost column's badge, the Cost Summary stock note), rather
// than being decided once at import time and cached on the row. That matters
// because the user can toggle a part's Stock checkbox in the Database at any
// point AFTER a drawing's tool row is already sitting in the Sales Desk BOM —
// the price exclusion has to react to that immediately, not require deleting
// and re-importing the drawing to pick it up.
function _sdIsToolOwned(r){
  if(!_sdIsToolRow(r)) return false;
  const pn=String(r.part_number||'').trim().toLowerCase();
  if(!pn) return false;
  return allParts.some(p=>String(p.part_number||'').trim().toLowerCase()===pn && p.own_stock);
}

// TOOLS ARE NEVER PART OF THE CABLE PRICE.
// A crimp/insertion tool is a one-time piece of shop equipment, not material
// consumed by the cable, so it must not inflate the per-cable quote either way:
//   • already in Stock  → nothing to buy, nothing to show as owing.
//   • NOT in Stock      → it still has to be purchased before this cable can be
//                         built, so it stays visible as a row and its cost is
//                         reported SEPARATELY (see the warning note in
//                         _sdUpdateSummaryUI) — but it is deliberately kept OUT
//                         of Subtotal/FINAL PRICE.
// toolsTotal below is therefore an informational figure only; it is never added
// into subtotal.
function _sdComputeSummary(){
  let partsTotal=0, autoToolsTotal=0, autoLaborMinutes=0;
  const ownedToolRows=[];   // in Stock — already owned, nothing to buy
  const missingToolRows=[]; // NOT in Stock — must be purchased, quoted separately
  for(const r of sdItems){
    if(_sdIsToolRow(r)){
      if(_sdIsToolOwned(r)) ownedToolRows.push(r);
      else { missingToolRows.push(r); autoToolsTotal+=r.total||0; }
    } else partsTotal+=r.total||0;
    autoLaborMinutes+=r.labor_total||0;
  }
  autoLaborMinutes += _sdActiveGeneralLaborMinutes();
  const laborMinutes = _sdLaborMinutesOverride!=null ? _sdLaborMinutesOverride : autoLaborMinutes;
  const laborCost=laborMinutes*_sdLaborRatePerMin();
  const toolsTotal = _sdToolsTotalOverride!=null ? _sdToolsTotalOverride : autoToolsTotal;
  const subtotal=partsTotal+laborCost; // tools excluded by design — see comment above
  const final=subtotal*(1+_sdProfitPct/100);
  return {partsTotal, toolsTotal, autoToolsTotal, laborMinutes, autoLaborMinutes, laborCost,
          subtotal, final, ownedToolRows, missingToolRows};
}

async function renderSalesDesk(){
  await loadParts();
  setActions('');
  const SD_COLS=loadColOrder('salesdesk',_SD_DEFAULT_COLS);

  // Shown during the AI labor estimate. Kept out of renderSD() so a re-render
  // mid-estimate can't wipe it.
  const _sdLaborBusy=(txt)=>{
    const el=document.getElementById('sd-labor-progress');
    const t=document.getElementById('sd-labor-progress-txt');
    if(!el) return;
    if(txt){ el.style.display='flex'; if(t) t.textContent=txt; }
    else { el.style.display='none'; }
    // Both entry points get disabled — starting a second estimate on top of a
    // running one would interleave two passes over the same rows.
    ['btn-sd-labor','btn-sd-addpick','btn-sd-fc'].forEach(id=>{
      const b=document.getElementById(id); if(b) b.disabled=!!txt;
    });
  };
  // Wraps the estimate with the banner, the progress text and the result
  // message, so the picker and the button behave identically.
  const _sdRunLaborEstimate=async()=>{
    _sdLaborBusy('Estimating labor time with AI — this usually takes 5–15 seconds…');
    try{
      const res=await _sdAutoMatchLabor(({done,total,drawing,rows})=>{
        _sdLaborBusy(total>1
          ? `Estimating labor time — drawing ${done} of ${total} (${drawing||'no drawing #'}, ${rows} rows)…`
          : `Estimating labor time for ${rows} row(s)${drawing?' — '+drawing:''}…`);
      });
      renderSalesDesk();
      if(res && res.applied){
        toast(`Labor estimated — ${res.minutes.toFixed(1)} min across ${res.applied} row(s)`,'success');
      } else if(res && res.reason){
        toast('Labor not estimated: '+res.reason,'warn');
      }
      return res;
    }catch(e){
      toast('Labor estimate failed: '+e.message,'error');
      return null;
    }finally{
      _sdLaborBusy('');
    }
  };

  const _sdUpdateSummaryUI=()=>{
    const {partsTotal,toolsTotal,laborMinutes,laborCost,subtotal,final,ownedToolRows,missingToolRows}=_sdComputeSummary();
    const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent='$'+v.toFixed(2); };
    set('sd-parts-total',partsTotal);
    set('sd-labor-total',laborCost);
    set('sd-subtotal',subtotal);
    set('sd-final',final);
    // Only sync these inputs while they're tracking the auto-sum — once the
    // user has typed their own value (override set), leave the field alone so
    // it doesn't get overwritten mid-edit or reset by an unrelated row change
    // elsewhere in the BOM.
    const toolsInp=document.getElementById('sd-tools-total');
    if(toolsInp && _sdToolsTotalOverride==null) toolsInp.value = toolsTotal ? +toolsTotal.toFixed(2) : '';
    const ltInp=document.getElementById('sd-labor-minutes');
    if(ltInp && _sdLaborMinutesOverride==null) ltInp.value = laborMinutes ? +laborMinutes.toFixed(2) : '';
    // Tools are never included in FINAL PRICE (see _sdComputeSummary). When one
    // is missing from Stock the user still has to buy it before this cable can
    // be built, so say so explicitly and quote the amount separately — a silent
    // exclusion would read as "no tooling needed" and under-quote the job.
    const toolsNote=document.getElementById('sd-tools-note');
    if(toolsNote){
      if(missingToolRows.length){
        const names=missingToolRows.map(r=>r.part_number||r.description||'tool').join(', ');
        toolsNote.style.display='block';
        toolsNote.innerHTML=`⚠ <strong>Final price does NOT include manufacturing tools.</strong><br>
          ${missingToolRows.length} tool${missingToolRows.length>1?'s are':' is'} not in Stock and must be purchased to build this cable —
          estimated <strong>$${toolsTotal.toFixed(2)}</strong>: ${esc(names)}`;
      } else {
        toolsNote.style.display='none';
      }
    }
    // Inline (not a popup) note listing which TOOL rows are currently excluded
    // from the price because they're marked in Stock in the Database — lives
    // right here in Cost Summary and recomputes on every render, so toggling
    // a part's Stock checkbox is reflected immediately without re-importing.
    const stockNote=document.getElementById('sd-tools-stock-note');

      if(ownedToolRows.length){

      } else {
        stockNote.style.display='none';
      }
    }
  };
