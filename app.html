      (csCurrent.ends||[]).forEach((e,k)=>{ if(fig[k+1]) fig[k+1].innerHTML=_csStripSVG(csCurrent,e,csCurrent); });
    }));

  document.querySelectorAll('[data-cs-lang]').forEach(b=>b.addEventListener('click',async()=>{
    const lang=b.dataset.csLang;
    if(lang===_csLang) return;
    // Switching BACK to the language the spec was written in is free — the text
    // is already stored that way.
    if(lang!==_csSrcLang(csCurrent)){
      const ov=(csCurrent.overrides&&csCurrent.overrides[lang])||{};
      const bucket=_csCache[lang]||{};
      const todo=_csProseStrings(csCurrent).filter(t=>!ov[t] && !bucket[t]);
      if(todo.length){
        const old=b.textContent;
        const busy=_CS_LABELS[lang]?.['Translating…']||'Translating…';
        b.textContent=busy;
        document.querySelectorAll('[data-cs-lang]').forEach(x=>x.disabled=true);
        // Chunked, so a long spec shows progress instead of appearing frozen
        // for a minute and then failing.
        const okAll=await _csEnsureLang(csCurrent, lang,
          (n,total)=>{ b.textContent=`${busy} ${Math.round(n/total*100)}%`; });
        if(!okAll){
          b.textContent=old;
          document.querySelectorAll('[data-cs-lang]').forEach(x=>{ x.disabled=(x.dataset.csLang===_csLang); });
          renderCutStripSheet();
          return;
        }
      }
    }
    _csSetLang(lang);   // remembered for next time — see _csLang above
    renderCutStripSheet();
  }));
}

// ══════════════════════════════════════════════════════════════════════════════
// MANUFACTURING INSTRUCTIONS — how the assembly is built
// ══════════════════════════════════════════════════════════════════════════════
// The Cut & Strip screen answers one question: what do I cut, and where do I
// strip it. Everything else the drawing analysis produces — the material list,
// the order of operations, the inspection checks, the tooling — is how the
// thing is BUILT, which is a different document read by a different person at
// a different bench. It used to be printed on the same eleven pages, and the
// two numbers that mattered were lost in it.
//
// So it lives here, as documents of its own. A document can be written from
// scratch, or seeded from a cut & strip specification with one click ("Send to
// Manufacturing Instructions"), after which the two are independent: editing
// the instruction never rewrites the cutting form, and re-analysing a drawing
// never overwrites instructions somebody has since corrected by hand.
//
// Storage note: these share the cut_strip_specs collection, marked kind:'mfg'
// and with an id prefixed mfg_. That is deliberate — it is the one collection
// whose security rule already grants exactly the access these need, so the
// screen works without a rules deployment. Every query on either side filters
// on `kind`.
const MFG_PREFIX='mfg_';
let mfgDocs=[], mfgCurrent=null, _mfgEditing=false, _mfgBackup=null, _mfgListQuery='';
function _mfgIsDoc(d){ return !!d && d.kind==='mfg'; }
function _mfgBlank(){
  return {kind:'mfg', title:'', doc_no:'', revision:'', customer:'', drawing_number:'',
          project:'', form_date:_csToday(), materials:[], steps:[], inspection:[], tools:[],
          notes:'', prepared_by:'', approved_by:''};
}
// Seeded from a cut & strip spec. Copies, never references: an instruction
// document that changed under the operator because an engineer re-ran the
// analysis is worse than no document.
function _mfgFromSpec(spec){
  const d=_mfgBlank();
  d.title=spec.drawing_name||spec.title||spec.drawing_number||'';
  d.doc_no='MI-'+String(spec.drawing_number||'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-01';
  d.revision=spec.revision||'';
  d.customer=spec.customer||spec.project||'';
  d.drawing_number=spec.drawing_number||'';
  d.project=spec.project||'';
  d.materials=(spec.materials||[]).map(m=>({item:m.item??'', part_number:m.part_number||'',
    manufacturer:m.manufacturer||'', description:m.description||'', qty:m.qty??'', ref:m.ref||''}));
  d.steps=(spec.steps||[]).map((s,i)=>({n:s.n??(i+1), title:s.title||'', body:s.body||'', critical:s.critical||''}));
  d.inspection=(spec.inspection||[]).map(c=>String(c||''));
  d.tools=(spec.tools||[]).map(t=>({tool:t.tool||'', setting:t.setting||'', note:t.note||''}));
  d.source_spec=spec._id||'';
  d.standard=spec.standard||'';
  return d;
}
// ── The build sequence, written separately ──────────────────────────────────
// The drawing analysis used to be asked for the cut, the strip, the wiring
// table AND the whole assembly sequence in one reply. That is what kept
// running the answer out of room: the sequence is the longest part of it by
// far, and it was crowding out the dimensions the cutting form exists for —
// so the operator lost the two numbers that mattered in order to gain prose
// that belongs on a different sheet entirely.
//
// So it is written here instead, in its own small request, from the finished
// specification rather than from the drawing. The specification is a few
// hundred characters of structured fact, the answer is a short list, and
// neither end can overflow. It also means re-writing the sequence never risks
// the dimensions: they are already saved.
function _mfgSpecDigest(spec){
  const seg=(_csSegments(spec)||[]).map(s=>{
    const cut=_csCutLength(s, spec);
    return `${s.id||'S'}: ${_csSegLabel(s)}, cut ${_csMM(cut.total)}`;
  });
  const con=(_csConnectors(spec)||[]).map(c=>
    `${c.ref||''} ${c.part_number||''} ${c.type||''} ${c.termination||''}`.trim());
  const strip=(_csSegments(spec)||[]).flatMap(s=>(s.ends||[]).flatMap(e=>
    (e.strip||[]).filter(x=>_csNum(x.value_mm)!=null)
      .map(x=>`${s.id||'S'}/${e.ref||''} ${x.code||''}=${x.value_mm} mm`)));
  const mat=(spec.materials||[]).map(m=>
    `${m.item??''} ${m.part_number||''} ${m.description||''} qty ${m.qty??''} ${m.unit||''}`.trim());
  const notes=(spec.engineering_notes||[]).map(n=>String(n.text||n||'')).filter(Boolean);
  return [
    `HARNESS ${spec.drawing_number||''} ${spec.drawing_name||''} rev ${spec.revision||''}`,
    spec.standard ? `STANDARD ${spec.standard}` : '',
    seg.length    ? 'RUNS\n'+seg.join('\n') : '',
    con.length    ? 'CONNECTORS\n'+con.join('\n') : '',
    strip.length  ? 'STRIP\n'+strip.join('\n') : '',
    mat.length    ? 'BOM\n'+mat.slice(0,40).join('\n') : '',
    notes.length  ? 'DRAWING NOTES\n'+notes.slice(0,12).join('\n') : '',
  ].filter(Boolean).join('\n\n').slice(0, 6000);
}
const _MFG_STEPS_MAX_TOKENS=6000;
async function _mfgWriteSteps(spec, lang){
  if(!anthKey) throw new Error(_AI_NO_KEY);
  const langName=({he:'Hebrew', ru:'Russian', en:'English'})[lang||spec.lang||_CS_SOURCE_LANG]||'Hebrew';
  const prompt=`You are a manufacturing engineer writing the assembly instruction for a wire harness that
has ALREADY been analysed. The cut lengths, strip dimensions and wiring are settled and are given to
you below — do not recalculate them, do not contradict them, and do not repeat the whole dimension
list back. Write only how the thing is BUILT.

Return ONE JSON object and nothing else. Minified: no indentation, no line breaks between fields.
{"steps":[{"n":1,"title":"short imperative title","body":"what to do, one or two sentences an operator can follow","critical":"the one thing that ruins the part if they get it wrong, or omit the key"}],
 "inspection":["one check per line, phrased so it can be ticked off"],
 "tools":[{"tool":"","setting":"","note":""}]}

Limits, and they are limits, not targets: at most 12 steps, at most 8 inspection lines, at most 8
tools, every string at most 160 characters. Omit a key rather than writing an empty string.

The first step is always the cut, and it states the cut length. Then strip, then terminate, then
assemble, then mark, then test. A drawing note that tells the operator to DO something becomes a step
at the point in the sequence where it happens; one that says what to CHECK becomes an inspection line.

Write every human-readable value in ${langName}. Part numbers, connector references, standards and
units stay in their Latin form. Never type a double quote inside a value: in Hebrew write the
gershayim \u05F4 instead.

SPECIFICATION:
${_mfgSpecDigest(spec)}`;
  const resp=await _fetchWithRetry('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'x-api-key':anthKey,'anthropic-version':'2023-06-01',
             'anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:_MFG_STEPS_MAX_TOKENS,
                         temperature:0,messages:[{role:'user',content:prompt}]})
  }, _CS_ANALYSIS_TIMEOUT);
  if(!resp.ok){ let m=`Anthropic error ${resp.status}`;
    try{const e=await resp.json();m=e.error?.message||m;}catch{}
    throw new Error(_csProviderHint('Anthropic', m)); }
  const d=await resp.json();
  const raw=(d.content&&d.content[0]&&d.content[0].text)||'';
  const obj=_csSalvageJson(raw) || {};
  return {
    steps: (Array.isArray(obj.steps)?obj.steps:[]).map((x,i)=>({n:x.n??(i+1),
      title:String(x.title||''), body:String(x.body||''), critical:String(x.critical||'')})),
    inspection: (Array.isArray(obj.inspection)?obj.inspection:[]).map(x=>String(x||'')).filter(Boolean),
    tools: (Array.isArray(obj.tools)?obj.tools:[]).map(x=>({tool:String(x.tool||''),
      setting:String(x.setting||''), note:String(x.note||'')})).filter(t=>t.tool),
  };
}

function _mfgDocId(d){
  const stem=String(d.doc_no||d.drawing_number||d.title||'doc')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || 'doc';
  return MFG_PREFIX+stem.toUpperCase();
}
async function loadMfgDocs(force){
  if(mfgDocs.length && !force) return mfgDocs;
  if(!companyId) return (mfgDocs=[]);
  const snap=await getDocs(query(collection(db,'companies',companyId,'cut_strip_specs'),orderBy('updatedAt','desc')));
  mfgDocs=snap.docs.map(d=>({_id:d.id, ...d.data()})).filter(_mfgIsDoc);
  return mfgDocs;
}

        <td style="text-align:right"><button class="btn btn-ghost btn-sm mfg-del" data-id="${esc(d._id)}"
          data-name="${esc(d.doc_no||d.title||d._id)}" title="Delete">🗑</button></td>
      </tr>`).join('') : `<tr class="empty-row"><td colspan="8">${esc(T('Nothing matches that search'))}</td></tr>`}
      </tbody></table></div>`);
  document.getElementById('mfg-search')?.addEventListener('input',debounce(e=>{
    _mfgListQuery=e.target.value; renderManufacturing();
  },250));
  document.querySelectorAll('.mfg-row').forEach(tr=>tr.addEventListener('click',e=>{
    if(e.target.closest('.mfg-del')) return;
    mfgCurrent=mfgDocs.find(d=>d._id===tr.dataset.id)||null;
    if(mfgCurrent) renderMfgDoc();
  }));
  document.querySelectorAll('.mfg-del').forEach(b=>b.addEventListener('click',async e=>{
    e.stopPropagation();
    if(!confirm(`Delete manufacturing instruction "${b.dataset.name}"? This cannot be undone.`)) return;
    try{
      await deleteDoc(doc(db,'companies',companyId,'cut_strip_specs',b.dataset.id));
      logAudit('mfg_deleted',{id:b.dataset.id},true);
      toast('Deleted','success');
      mfgDocs=[]; renderManufacturing();
    }catch(err){ toast('Error: '+err.message,'error'); }
  }));
}
function _mfgNew(){
  mfgCurrent=_mfgBlank();
  mfgCurrent._id=null;
  _mfgEditing=true; _mfgBackup=null;

}
// Seeding from a specification is a copy, so the picker lists every spec and
// says plainly what will be taken across.
async function _mfgImportModal(){
  showModal(`<div class="modal" style="width:min(94vw,680px)">
    <div class="modal-head"><h3>↧ Start from a Cut &amp; Strip specification</h3><button class="close-modal" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="mfg-imp-body" style="max-height:58vh">
      <div style="text-align:center;padding:30px"><div class="ring" style="margin:0 auto"></div></div>
    </div>
  </div>`);
  const body=document.getElementById('mfg-imp-body');
  let specs=[];
  try{ specs=await loadCutStripSpecs(true); }
  catch(e){ body.innerHTML=`<p style="color:red">${esc(e.message)}</p>`; return; }
  if(!specs.length){ body.innerHTML=`<p style="color:var(--muted);font-size:13px">There are no cut &amp; strip specifications yet.</p>`; return; }
  body.innerHTML=`<p style="font-size:12px;color:var(--muted);margin-bottom:10px">
      The material list is copied into a new instruction document, and the build sequence is written
      from the specification. The specification itself is left untouched.</p>
    <div class="table-wrap"><table><thead><tr><th>Drawing #</th><th>Name</th>
      <th style="width:60px">Steps</th><th style="width:60px">Tools</th><th style="width:90px"></th></tr></thead>
      <tbody>${specs.map(s=>`<tr>
        <td class="cs-ltr">${esc(s.drawing_number||s._id)}</td>
        <td>${esc(s.drawing_name||s.title||'')}</td>
        <td style="text-align:center">${(s.steps||[]).length}</td>
        <td style="text-align:center">${(s.tools||[]).length}</td>
        <td><button class="btn btn-blue btn-sm mfg-imp" data-id="${esc(s._id)}">Use</button></td>
      </tr>`).join('')}</tbody></table></div>`;
  body.querySelectorAll('.mfg-imp').forEach(b=>b.addEventListener('click',async ()=>{
    const spec=specs.find(s=>s._id===b.dataset.id);
    if(!spec) return;
    mfgCurrent=_mfgFromSpec(spec);
    mfgCurrent._id=null;
    _mfgEditing=true; _mfgBackup=null;
    // A specification analysed since the cutting form stopped asking for the
    // build sequence has none to copy. Rather than hand over an empty
    // document, it is written now, from the specification, in its own small
    // request — and if that request fails the document still opens: an empty
    // sequence someone types is a nuisance, a lost import is a re-analysis.
    const needsSteps=!mfgCurrent.steps.length;
    closeModal();
    renderMfgDoc();
    if(!needsSteps){ toast('Content copied — review it and save','success'); return; }
    toast('Writing the build sequence…','info');
    try{
      const w=await _mfgWriteSteps(spec);
      if(mfgCurrent && !mfgCurrent._id){
        mfgCurrent.steps=w.steps; mfgCurrent.inspection=w.inspection; mfgCurrent.tools=w.tools;
        renderMfgDoc();
        logAudit('mfg_steps_written',{drawing:spec.drawing_number, steps:w.steps.length},true);
        toast(w.steps.length ? 'Sequence drafted — review it and save'
                             : 'Content copied — review it and save','success');
      }
    }catch(e){
      console.warn('[Mfg] build sequence', e.message);
      toast('Copied, but the build sequence could not be written: '+e.message,'warn');
    }
  }));
}

function _mfgF(path, value, opts){
  const o=opts||{};
  if(!_mfgEditing) return esc(value==null?'':String(value));
  if(o.area) return `<textarea class="cs-in" data-mfg-path="${esc(path)}" rows="${o.rows||2}" style="width:100%">${esc(value||'')}</textarea>`;
  return `<input class="cs-in" data-mfg-path="${esc(path)}" value="${esc(value==null?'':String(value))}"${
    o.ph?` placeholder="${esc(o.ph)}"`:''}>`;
}

// One generic pass over the form. Every control carries the field it writes to,

// ── PDF export ────────────────────────────────────────────────────────────────
// html2canvas + jsPDF rather than a text-drawing PDF library, specifically
// because of the Hebrew and Russian views: rasterising the already-correct DOM
// keeps RTL, bidi and the SVG diagrams exactly as they appear on screen, which
// text-drawing libraries handle badly or not at all. Both are ~700 KB, so they
// load only when someone actually exports.
let _csPdfPromise=null;
function _csLoadPdfLibs(){
  if(window.html2canvas && window.jspdf) return Promise.resolve();
  if(_csPdfPromise) return _csPdfPromise;
  const one=src=>new Promise((res,rej)=>{
    const el=document.createElement('script'); el.src=src;
    el.onload=res; el.onerror=()=>rej(new Error('Could not load the PDF library — check your connection'));
    document.head.appendChild(el);
  });
  _csPdfPromise=Promise.all([
    window.html2canvas?Promise.resolve():one('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    window.jspdf?Promise.resolve():one('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
  ]).then(()=>{
    if(!window.html2canvas||!window.jspdf) throw new Error('PDF libraries failed to initialise');
  });
  return _csPdfPromise;
}
async function _csExportPDF(){
  const btn=document.getElementById('btn-cs-pdf');
  const sheet=document.getElementById('cs-sheet');
  if(!sheet) return;
  const old=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  // html2canvas measures SVGs by their width/height ATTRIBUTES, not by CSS.
  // These are sized with width:100% and only a viewBox, so without this they
  // rasterise at their intrinsic size — or not at all. Stamped before the
  // capture and stripped again after, so the on-screen layout is untouched.
  const svgs=[...sheet.querySelectorAll('svg')];
  const stamped=svgs.map(s=>{
    const r=s.getBoundingClientRect();
    const had=s.hasAttribute('width');
    if(!had){ s.setAttribute('width', Math.round(r.width)); s.setAttribute('height', Math.round(r.height)); }
    return had;
  });
  try{
    await _csLoadPdfLibs();
    const canvas=await html2canvas(sheet,{scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const M=8, iw=pw-M*2;
    const ih=canvas.height*iw/canvas.width;             // full image height in mm
    const pageH=ph-M*2;
    const pages=Math.max(1, Math.ceil(ih/pageH));
    const sliceCanvasH=Math.floor(canvas.height*pageH/ih);
    for(let p=0;p<pages;p++){
      if(p) pdf.addPage();
      const sy=p*sliceCanvasH;
      const sh=Math.min(sliceCanvasH, canvas.height-sy);
      const slice=document.createElement('canvas');
      slice.width=canvas.width; slice.height=sh;
      slice.getContext('2d').drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
      pdf.addImage(slice.toDataURL('image/jpeg',0.92),'JPEG',M,M,iw, sh*iw/canvas.width);
      pdf.setFontSize(8); pdf.setTextColor(120);
      pdf.text(`${_csT('Page')} ${p+1} ${_csT('of')} ${pages}`, pw-M, ph-3, {align:'right'});
    }
    const dwg=(csCurrent?.drawing_number||'spec').replace(/[^A-Za-z0-9._-]+/g,'_');
    pdf.save(`${dwg}_cut_and_strip.pdf`);
    toast('PDF exported','success');
  }catch(e){
    console.error('[CutStrip PDF]',e);
    toast('PDF export failed: '+e.message,'error');
  }finally{
    svgs.forEach((s,i)=>{ if(!stamped[i]){ s.removeAttribute('width'); s.removeAttribute('height'); } });
    if(btn){ btn.disabled=false; btn.textContent=old; }
  }
}
