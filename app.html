  showModal(`<div class="modal">
    <div class="modal-head"><h3>Add Drawing to ${esc(projectName)}</h3><button class="close-modal" id="modal-close">✕</button></div>
    <div class="modal-body" id="modal-body-inner">
      <div class="form-field" style="margin-bottom:14px">
        <label>Drawing Name / Title</label>
        <input class="form-input" id="drawing-name-inp" placeholder="e.g. KARA-002 or Main Assembly" autocomplete="off">
      </div>
      <div class="drop-zone" id="drop-zone" tabindex="0">
        <span class="icon-big">📄</span>
        <strong>Drop PDF, Image or Excel here</strong>
        <p>or click to browse — you can select multiple files (PDF, PNG, JPG, JPEG, WEBP, BMP, XLSX, XLS, CSV). All selected files are extracted together and shown in one combined review.</p>
        <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.xlsx,.xlsm,.xls,.csv" multiple
               style="display:none">
      </div>
    </div>
    <div class="modal-foot" id="modal-foot">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
    </div>
  </div>`);

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  const dz = document.getElementById('drop-zone');
  const fi = document.getElementById('file-input');
  dz.addEventListener('click', ()=>fi.click());
  dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('dragover');});
  dz.addEventListener('dragleave', ()=>dz.classList.remove('dragover'));
  dz.addEventListener('drop', e=>{
    e.preventDefault();dz.classList.remove('dragover');
    const dwgName=document.getElementById('drawing-name-inp')?.value.trim()||'';
    const files=[...e.dataTransfer.files];
    if(!files.length) return;
    handleFiles(files,projectId,projectName,dwgName);
  });
  fi.addEventListener('change', ()=>{
    if(fi.files.length){
      const dwgName=document.getElementById('drawing-name-inp')?.value.trim()||'';
      handleFiles([...fi.files],projectId,projectName,dwgName);
    }
  });
}

// Extracts BOM rows from ALL selected files (one after another), then shows a single
// combined preview for review. Each row keeps track of which file/drawing it came from
// via drawing_number/revision (parsed from the filename), so on save the rows are
// grouped back into per-drawing RFQ documents.
async function handleFiles(files, projectId, projectName, drawingNameOverride=''){
  if(!files || !files.length) return;
  const body = document.getElementById('modal-body-inner');
  const foot = document.getElementById('modal-foot');
  const allRows = [];
  const errors = [];

  for(let fidx=0; fidx<files.length; fidx++){
    const file = files[fidx];
    const isPDF = file.type==='application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    const isImg = file.type.startsWith('image/');
    const isXls = _isSpreadsheetFile(file);
    if(!isPDF && !isImg && !isXls){ errors.push(`"${file.name}" — not a PDF, image or spreadsheet, skipped`); continue; }

    const filePrefix = files.length>1 ? `File ${fidx+1}/${files.length}: ${esc(file.name)} — ` : '';
    body.innerHTML = `
      <div class="ai-status"><div class="ring"></div><span id="ai-msg">${filePrefix}${isXls?'Reading spreadsheet…':(isPDF?'Extracting PDF text…':'Reading image…')}</span></div>
      <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>`;
    foot.innerHTML = '';
    const setMsg = (m,pct) => {
      const el=document.getElementById('ai-msg'); if(el)el.textContent=filePrefix+m;
      const pb=document.getElementById('prog'); if(pb)pb.style.width=pct+'%';
    };

    try {
      let extractedRows = [];
      let _pdfText='', _pdfTextLen=0, _pdfImages=[];
      if(isXls){
        setMsg('Reading spreadsheet…', 20);
        const sheets = await readExcelSheets(file);
        // Structured parse first — exact and repeatable (see
        // _parseStructuredBOMSheet). AI only for unrecognisable layouts.
        extractedRows = parseExcelSheetsStructured(sheets) || [];
        if(extractedRows.length){
          setMsg(`Parsed ${extractedRows.length} component(s) from the sheet`, 90);
        } else {
          const sheetText = await extractExcelText(file);
          if(!sheetText.trim()) throw new Error('the spreadsheet appears to be empty');
          setMsg('Layout not recognised — asking AI…', 50);
          extractedRows = await aiExtractBOM(sheetText, false, null, file.name, 'excel');
        }
      } else if(isPDF){
        setMsg('Reading PDF pages…', 15);
        const {pageTexts, pageImages} = await extractPDFPages(file);
        _pdfImages = pageImages;
        _pdfText = pageTexts.map((t,i)=>`=== PAGE ${i+1} ===\n${t}`).join('\n\n');
        _pdfTextLen = pageTexts.join('').trim().length;

        // See _findBOMPageIndex — a detected BOM-header page whose OWN text
        // is still very short (just the header, no real rows) is a strong
        // sign this table's cells are graphics, not text: trust vision over
        // the whole-document text blob even if it returned SOME rows, since
        // those are almost certainly pulled from boilerplate elsewhere, not
        // the real table.
        const _bomPageIdx=_findBOMPageIndex(pageTexts);
        const _bomPageSparse=_bomPageIdx>=0 && (pageTexts[_bomPageIdx]||'').trim().length<400;

        if(_pdfTextLen > 50){
          setMsg('Sending text to AI…', 45);
          extractedRows = await aiExtractBOM(_pdfText, false, null, file.name);
        }
        if((!extractedRows.length || _bomPageSparse) && anthKey){
          setMsg('Text extraction found nothing — trying page vision…', 60);
          // Try the detected BOM sheet FIRST, then fall back to the rest of
          // the pages in order.
          const pageOrder=_pdfImages.map((_,idx)=>idx);
          if(_bomPageIdx>=0){
            const pos=pageOrder.indexOf(_bomPageIdx);
            if(pos>0){ pageOrder.splice(pos,1); pageOrder.unshift(_bomPageIdx); }
          }
          for(let k=0;k<pageOrder.length;k++){
            const pi=pageOrder[k];
            const b64=_pdfImages[pi];
            if(!b64) continue;
            setMsg(`Vision analysis: page ${pi+1}/${_pdfImages.length}…`, 60+Math.round(35*k/pageOrder.length));
            const rows=await aiExtractBOM('',true,{b64,mimeType:'image/jpeg'},file.name);
            if(rows.length){ extractedRows=rows; break; }
          }
        }
      } else {
        setMsg('Encoding image…', 20);
        const {b64, mimeType} = await encodeImage(file);
        setMsg('Sending to AI (vision)…', 50);
        extractedRows = await aiExtractBOM('', true, {b64, mimeType}, file.name);
      }

      _normalizeBOMRows(extractedRows);
      // Parse filename: "303-49-00251-00 REV 01 _approved.pdf"
      // → drawingName="303-49-00251-00", revision="REV 01 _approved"
      const _fileBase = file.name.replace(/\.[^.]+$/,'');
      const _spaceIdx = _fileBase.indexOf(' ');
      const effectiveDwgName = (files.length===1 && drawingNameOverride)
        ? drawingNameOverride
        : (_spaceIdx>0 ? _fileBase.slice(0,_spaceIdx) : _fileBase);
      const fileRevision = _spaceIdx>0 ? _fileBase.slice(_spaceIdx+1).trim() : '';
      extractedRows.forEach(r=>{
        if(!r.drawing_number) r.drawing_number=effectiveDwgName;
        if(!r.drawing_name) r.drawing_name=effectiveDwgName;
        if(!r.revision) r.revision=fileRevision;
        _normalizeExtractedRow(r);
      });

      if(!extractedRows.length){
        errors.push(`"${file.name}" — no BOM rows detected`);
      } else {
        allRows.push(...extractedRows);
      }
    } catch(e){
      const hint = e.message==='Failed to fetch'
        ? 'network error — check your internet connection or the Anthropic key'
        : e.message;
      errors.push(`"${file.name}" — ${hint}`);
    }
  }

  if(errors.length) errors.forEach(msg=>toast(msg,'error'));

  const _ringEl=document.querySelector('.ai-status .ring');
  if(_ringEl){_ringEl.style.cssText='width:16px;height:16px;border-radius:50%;background:#1B6B3A;border:none;animation:none;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;line-height:1';
    _ringEl.textContent='✓';}

  if(!allRows.length){
    body.innerHTML = `<p style="color:var(--muted);margin-top:10px">No BOM rows were detected in ${files.length>1?`any of the ${files.length} files`:'this file'}.</p>`;
    foot.innerHTML = `<button class="btn btn-ghost" id="modal-cancel-err">Close</button>`;
    document.getElementById('modal-cancel-err')?.addEventListener('click',closeModal);
    return;
  }

  showBOMPreview(allRows, body, foot,
    `💾 Save to Database + RFQ (${allRows.length} rows${files.length>1?` from ${files.length} files`:''})`,
    async(updatedRows)=>{
      await saveBOMToPartStock(updatedRows, projectName);
      // Group rows by drawing_number so each source file lands in its own RFQ drawing doc
      const byDwg = {};
      updatedRows.forEach(r=>{
        const key = r.drawing_number || projectName;
        (byDwg[key]=byDwg[key]||[]).push(r);
      });
      for(const dwgName in byDwg){
        await saveBOMToRFQSilent(byDwg[dwgName], projectId, dwgName);
      }
      toast(`Saved ${updatedRows.length} BOM rows across ${Object.keys(byDwg).length} drawing(s)`,'success');
      logAudit('rfq_bom_saved',{rows:updatedRows.length,drawings:Object.keys(byDwg).length,project:projectName},true);
      closeModal();
      renderRFQDetail(projectId, projectName);
    }
  );
}

// showBOMPreview(rows, body, foot, btnLabel, saveCallback)
// saveCallback(updatedRows) is called when user clicks Save
function showBOMPreview(rows, body, foot, btnLabel, saveCallback){
  const PCOLS=['item','drawing_number','revision','part_number','drawing_name','atlantium_pn','description','qty','unit','manufacturer','pin_count'];
  const PLABELS=['Item','Drawing #','Revision','MNF P/N','Dwg Name','Cust PN','Description','QTY','Units','Manufacturer','Pins'];
  // "price" is intentionally NOT a visible/editable column here — it's only
  // ever populated on a synthesized crimp-tool row (see _BOM_TEXT_PROMPT/
  // _BOM_VISION_PROMPT rule 5) and showing an empty Price column for every
  // normal part is just clutter. It's still carried through to saveCallback
  // via the stable data-i index below, so the tool row's estimate still reaches
  // the Database's est_price field (see saveBOMToPartStock).

  // Expand modal for comfortable editing
  const modalEl=body.closest('.modal');
  if(modalEl){ modalEl.style.width='min(94vw,1200px)'; modalEl.style.maxWidth='1200px'; }

  // Tool rows are highlighted here too — this preview is the moment the user
  // first sees them, and it's the only place they can be removed before they
  // reach the Database. Discovering a synthesized row later, in a quote, is far
  // more confusing than seeing it flagged at the point it's introduced.
  const tBody = rows.map((r,i)=>`<tr data-i="${i}"${_toolRowAttrs(r)}>
    ${PCOLS.map(k=>`<td contenteditable="true" data-k="${k}" data-i="${i}" style="min-width:70px">${esc(r[k]||'')}${
      k==='description' && _sdIsToolRow(r) ? _TOOL_TAG : ''}</td>`).join('')}
    <td><button class="btn btn-red btn-sm" onclick="this.closest('tr').remove()">✕</button></td>
  </tr>`).join('');

  body.innerHTML = `
    <div class="ai-status" style="margin-bottom:10px">
      <div style="width:16px;height:16px;border-radius:50%;background:#1B6B3A;border:none;animation:none;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;line-height:1">✓</div>
      <span>${rows.length} rows extracted — click any cell to edit before saving</span>
    </div>
    <div class="table-wrap" style="max-height:calc(85vh - 175px);overflow:auto"><table>
      <thead><tr>${PLABELS.map(l=>`<th>${l}</th>`).join('')}<th></th></tr></thead>
      <tbody id="preview-tbody">${tBody}</tbody>
    </table></div>`;

  foot.innerHTML = `
    <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
    <button class="btn btn-green" id="btn-save-bom">${btnLabel||'💾 Save'}</button>`;

  document.getElementById('modal-cancel').addEventListener('click',closeModal);
  document.getElementById('btn-save-bom').addEventListener('click',async()=>{
    const updatedRows=[];
    document.querySelectorAll('#preview-tbody tr').forEach(tr=>{
      const row={};
      tr.querySelectorAll('td[contenteditable]').forEach(td=>{row[td.dataset.k]=td.textContent.trim();});
      // Carry over the hidden "price" field (not a visible column — see above)
      // from the original row, keyed by the stable data-i index so it survives
      // even though it's not one of the contenteditable cells.
      const origIdx=+tr.dataset.i;
      if(rows[origIdx] && rows[origIdx].price) row.price=rows[origIdx].price;
      // QVL alternatives likewise aren't an editable column, but losing them
      // here would silently reduce the part to whichever alternative happened
      // to be listed first — the exact behaviour we're replacing.
      if(rows[origIdx] && (rows[origIdx].alt_mpns||[]).length) row.alt_mpns=rows[origIdx].alt_mpns;
      if(Object.values(row).some(v=>v)) updatedRows.push(row);
    });
    if(!updatedRows.length){ toast('No rows to save','error'); return; }
    const btn=document.getElementById('btn-save-bom');
    if(btn){btn.disabled=true;btn.textContent='Saving…';}
    try{ await saveCallback(updatedRows); }
    catch(e){ toast('Save error: '+e.message,'error'); if(btn){btn.disabled=false;btn.textContent=btnLabel||'💾 Save';} }
  });
}

// Writes rows into a single named drawing document under an RFQ (creating or
// merging into an existing drawing of that name). No UI side-effects — callers
// (which may invoke this once per drawing when saving a multi-file batch) are
// responsible for toasts/closing the modal/re-rendering once all groups are saved.
async function saveBOMToRFQSilent(rows, projectId, drawingName){
  const col=collection(db,'companies',companyId,'projects',projectId,'drawings');
  const existSnap=await getDocs(col);
  const existing=existSnap.docs.find(d=>(d.data().name||'')===(drawingName));
  if(existing){
    const oldItems=existing.data().items||[];
    await updateDoc(existing.ref,{items:[...oldItems,...rows], updatedAt:serverTimestamp()});
  } else {
    await addDoc(col,{name:drawingName, items:rows, updatedAt:serverTimestamp()});
  }
  await updateDoc(doc(db,'companies',companyId,'projects',projectId),{updatedAt:serverTimestamp()});
}

// ── BOM row normalization ─────────────────────────────────────────────────────
// If drawing_number empty, fall back to drawing_name (per user requirement)
function _normalizeBOMRows(rows){
  rows.forEach(r=>{
    if(!r.drawing_number && r.drawing_name) r.drawing_number=r.drawing_name;
  });
  // A crimp/insertion TOOL row is synthesized fresh by the AI for EVERY
  // connector row that needs one (see _BOM_TEXT_PROMPT/_BOM_VISION_PROMPT rule
  // 5) — so a drawing with two different connectors that both happen to take
  // the SAME hand tool (e.g. two MICROFIT 3.0 connectors both needing the same
  // extraction tool) correctly produces two synthesized rows sharing one part
  // number, from the AI's per-connector point of view. But a tool is a
  // durable, one-time purchase, not a consumable that scales with how many
  // connectors use it — so the BOM should only ever list it once. Collapse
  // repeated TOOL rows that share a part number down to their first
  // occurrence; rows with no part_number are left alone (no reliable key to
  // dedupe on, and removing the wrong one would silently drop a real tool).
  const seenToolPn = new Set();
  const deduped = rows.filter(r=>{
    if(!_sdIsToolRow(r)) return true;
    const pn=String(r.part_number||'').trim().toLowerCase();
    if(!pn) return true;
    if(seenToolPn.has(pn)) return false;
    seenToolPn.add(pn);
    return true;
  });
  rows.length=0;
  rows.push(...deduped);
  return rows;
}

// ── System-wide unit canonicalization ─────────────────────────────────────────
// The ENTIRE system (BOM/drawing extraction, RFQ, Sales Desk, Database, Priority
// import) only ever stores exactly 3 canonical units, always lowercase:
//   pc  — piece count
//   mm  — millimeters (the sole length unit)
//   gr  — grams (weight — treated like a length unit for LABOR/FC purposes)
// Any other unit that's recognized coming in gets folded into one of these
// three, rescaling QTY wherever the conversion actually changes the physical
// quantity (M/m and cm really do need their qty rescaled — EA/GM are pure
// relabels of the exact same count):
//   M / m / meter(s)      → mm   (× 1000 — 1 m = 1000 mm)
//   cm / centimeter(s)    → mm   (× 10   — 1 cm = 10 mm)
//   EA / ea               → pc   (relabel only — same count)
//   GR / gm / g / gram(s) → gr   (relabel only — already grams)
//   pc / mm / gr          → unchanged (already canonical)
//   anything else         → unit cleared to '' (never guessed)
// This runs once, at the point a row FIRST enters the system (BOM extraction),
// so qty is already correctly rescaled by the time it reaches the RFQ/BOM view,
// Sales Desk, or the Database — the Database's own qty=1 pin (see
// saveBOMToPartStock) happens independently and doesn't need to re-rescale.
function _normalizeUnitQty(qty, rawUnit){
  const u=String(rawUnit||'').trim().toLowerCase();
  const n=parseFloat(qty);
  const hasNum=!isNaN(n);
  switch(u){
    case 'pc': case 'mm': case 'gr': return {qty, unit:u};
    case 'm': case 'meter': case 'meters':
      return {qty: hasNum ? n*1000 : qty, unit:'mm'};
    case 'cm': case 'centimeter': case 'centimeters':
      return {qty: hasNum ? n*10 : qty, unit:'mm'};
    case 'ea': return {qty, unit:'pc'};
    case 'gm': case 'g': case 'gram': case 'grams':
      return {qty, unit:'gr'};
    default: return {qty, unit:''};
  }
}
// AI BOM extraction sometimes returns a length/weight value as a single QTY
// string like "500mm", "2.5M" or "10cm" instead of a separate qty + unit —
// detect a unit suffix embedded directly in the QTY string first (it's the
// more authoritative signal, since it came from the same cell), then run
// whatever unit we ended up with (embedded or from the row's own "unit"
// field) through the canonical normalizer above.
function _normalizeExtractedRow(r){
  let qty=r.qty, unit=r.unit;
  const raw=String(r.qty??'').trim();
  const m=raw.match(/^([\d.,]+)\s*([a-zA-Z]+)$/);
  if(m){ qty=parseFloat(m[1].replace(/,/g,''))||raw; unit=m[2]; }
  const norm=_normalizeUnitQty(qty, unit);
  r.qty=norm.qty; r.unit=norm.unit;
}
// Database-layer safety net: by the time a row reaches saveBOMToPartStock it
// should already be canonical (normalized at extraction time above), but this
// re-runs the same fold defensively for any path that might bypass it (manual
// entry, older cached rows, etc). Qty is ignored here since the Database always
// pins qty to 1 regardless (see saveBOMToPartStock) — only the unit label matters.
function _dbNormalizeUnit(rawUnit){
  return _normalizeUnitQty(1, rawUnit).unit;
}

// ── Save BOM rows to Part Stock (parts_cache) ─────────────────────────────────
// Upserts each row by part_number; never overwrites existing price/stock/distributor.
// rfqName (optional): when the BOM being saved belongs to a specific RFQ (i.e. this
// was called from the "Add Drawing" flow inside an RFQ, not the standalone Sales
// Desk "From File" import), that RFQ's name is added to the part's rfq_names array
// — a part_number can be referenced by more than one RFQ, so this is a set, not a
// single value, and existing entries are always preserved (arrayUnion).
async function saveBOMToPartStock(rows, rfqName=''){
  let created=0;
  for(const r of rows){
    const pn=(r.part_number||'').trim();
    if(!pn) continue;
    // Firestore doc IDs can't have / ; replace unsafe chars
    const key=pn.replace(/[\/\\#\[\]*?]/g,'_').slice(0,500);
    const ref=doc(db,'companies',companyId,'parts_cache',key);
    try{
      const snap=await getDoc(ref);
      if(snap.exists()){
        // Merge — only fill in fields that are currently empty. QTY is the
        // one exception: the Database always shows 1 (it's a master catalog,
        // not a per-order tally), so every save re-pins it regardless.
        const d=snap.data();
        const patch={updatedAt:serverTimestamp(), qty:1};
        if(r.description && !d.description) patch.description=r.description;
        if(r.drawing_number && !d.drawing_number) patch.drawing_number=r.drawing_number;
        if(r.drawing_name && !d.drawing_name) patch.drawing_name=r.drawing_name;
        if(r.manufacturer && !d.manufacturer) patch.manufacturer=r.manufacturer;
        if(r.unit && !d.unit) patch.unit=_dbNormalizeUnit(r.unit);
        if(r.atlantium_pn && !d.atlantium_pn) patch.atlantium_pn=r.atlantium_pn;
        if(r.pin_count && !d.pin_count) patch.pin_count=r.pin_count;
        // Refresh the approved-alternatives list whenever an import supplies
        // one — a newer QVL may have added or withdrawn a manufacturer.
        if((r.alt_mpns||[]).length>1) patch.alt_mpns=r.alt_mpns;
        // r.price only ever arrives set on a synthesized crimp-tool BOM row (see
        // _BOM_TEXT_PROMPT/_BOM_VISION_PROMPT rule 5). It's an AI ESTIMATE, not a
        // distributor quote, so it goes in its own field rather than sitting in a
        // price column next to real Mouser/DigiKey numbers — a guess and a quote
        // shouldn't be indistinguishable. Sales Desk uses it only as a last
        // resort when no real source has a price (see _sdRecalcTotal).
        if(r.price && !d.est_price) patch.est_price=parseFloat(r.price)||'';
        if(rfqName && !(d.rfq_names||[]).includes(rfqName)) patch.rfq_names=arrayUnion(rfqName);
        await updateDoc(ref,patch);
      } else {
        await setDoc(ref,{
          part_number:pn, description:r.description||'',
          drawing_number:r.drawing_number||'', drawing_name:r.drawing_name||'', manufacturer:r.manufacturer||'',
          unit:_dbNormalizeUnit(r.unit)||'', atlantium_pn:r.atlantium_pn||'', qty:1,
          pin_count:r.pin_count||'',
          alt_mpns:(r.alt_mpns||[]).length>1?r.alt_mpns:[],
          est_price:r.price?(parseFloat(r.price)||''):'', stock:'', price_description:'',
          rfq_names: rfqName ? [rfqName] : [],
          updatedAt:serverTimestamp()
        });
        created++;
      }
    }catch(e){ console.warn('[PartStock] save error:',pn,e.message); }
  }
  // Refresh in-memory parts list so SD search sees new entries
  await loadParts();
  return created;
}

// ── PDF extraction: text + render pages as PNG images (like Windows app) ────────
async function extractPDFPages(file){
  if(!window.pdfjsLib) throw new Error('PDF.js not loaded — please reload the page and try again.');
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc)
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:ab}).promise;
  const pageTexts=[], pageImages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    // -- Text --
    const content = await page.getTextContent();
    const cells = content.items.map(it=>({x:it.transform[4],y:it.transform[5],str:it.str}));
    cells.sort((a,b)=>b.y-a.y||a.x-b.x);
    let lastY=null, line='', lines=[];
    for(const it of cells){
      if(lastY!==null && Math.abs(it.y-lastY)>4){lines.push(line);line='';}
      line+=(line?' ':'')+it.str; lastY=it.y;
    }
    if(line) lines.push(line);
    pageTexts.push(lines.join('\n'));
    // -- Render page as JPEG, capped to a max dimension. An earlier version of
    // this rendered at a smaller size (1600px/q0.75) on the theory that an
    // oversized payload was causing "Failed to fetch" errors — that turned
    // out to be wrong (the real cause was a CORS header bug in the Anthropic
    // fetch call, since fixed), so this was needlessly hurting legibility of
    // dense multi-column tables (e.g. an Assembly Parts List with many small-
    // print rows) when read via vision. Now rendered larger/sharper by
    // default for better OCR-style accuracy; the size-safety fallback below
    // only kicks in if a page is genuinely huge. --
    const _renderAt=async(maxDim,quality)=>{
      const baseVp = page.getViewport({scale:1});
      const scale = Math.min(3, maxDim/Math.max(baseVp.width, baseVp.height));
      const vp = page.getViewport({scale});
      const canvas = document.createElement('canvas');
      canvas.width=vp.width; canvas.height=vp.height;
      await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise;
      return canvas.toDataURL('image/jpeg',quality).split(',')[1];
    };
    try{
      let b64 = await _renderAt(2400,0.88);
      // base64 is ~4/3 the binary size; ~4,000,000 chars ≈ ~3MB binary — only
      // step down for genuinely huge pages, not as a matter of course.
      if(b64.length>4000000){
        console.warn('[PDF render] page',i,'still large at',(b64.length/1e6).toFixed(1),'MB base64 — re-rendering smaller');
        b64 = await _renderAt(1600,0.75);
      }
      console.log('[PDF render] page',i,'final image size:',(b64.length/1e6).toFixed(2),'MB base64');
      pageImages.push(b64);
    }catch(e){ pageImages.push(null); }
  }
  return {pageTexts, pageImages};
}

// Multi-page drawings often put the actual BOM / Assembly Parts List table on
// its own sheet (frequently the LAST page) — but that table's CELLS are very
// often rendered as vector/raster graphics by the CAD tool, not real text,
// even though the sheet's own header/title IS real text (e.g. a page whose
// pdf.js text layer is just "Assembly Parts List / Rev: / Status: Item
// Name:" with none of the actual part numbers or item rows). Detect which
// page is meant to be the BOM sheet by that header, so vision analysis can be
// pointed at it directly and given priority — a whole-document text blob
// that happens to have SOME real text elsewhere (title block boilerplate,
// revision history, etc.) can otherwise return non-empty but WRONG rows,
// silently skipping the vision fallback that would have found the real table.
const _BOM_PAGE_HEADER_RE=/assembly\s*parts\s*list|bill\s*of\s*material(?:s)?|\bbom\b/i;
function _findBOMPageIndex(pageTexts){
  return pageTexts.findIndex(t=>_BOM_PAGE_HEADER_RE.test(t||''));
}

// ── Image encoding ─────────────────────────────────────────────────────────────
function encodeImage(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const url=e.target.result;
      res({b64:url.split(',')[1], mimeType:url.split(';')[0].slice(5)});
    };
    reader.onerror=rej;
    reader.readAsDataURL(file);
  });
}
// ── Generic file → base64 (for PDF vision) ──────────────────────────────────
function fileToB64(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>res(e.target.result.split(',')[1]);
    reader.onerror=rej;
    reader.readAsDataURL(file);
  });
}

// ── AI BOM extraction (Anthropic) ─────────────────────────────────────────────
// Text prompt — same as Windows app ai_extractor.py
// ── Spreadsheet (.xlsx/.xls/.csv) BOM import ─────────────────────────────────
// Matched on extension rather than MIME type: browsers report spreadsheets
// inconsistently (and often as application/octet-stream when the file came off
// a network share or an ERP export), so the extension is the reliable signal.
function _isSpreadsheetFile(file){
  return /\.(xlsx|xlsm|xls|csv)$/i.test(file?.name||'');
}
// Reads every sheet into a plain pipe-delimited text grid (row number prefixed)
// and hands it to the AI the same way PDF page text is handled. Deliberately NOT
// a hard-coded parser for one customer's export layout: column names, sheet
// order and row hierarchy vary per customer, and the AI already knows how to
// find a BOM table — this just gets the cells in front of it losslessly.
// Blank rows/columns are dropped so the payload stays small.
// When on, sub-assembly / internal-document rows (SpecTdp, DocumentTdp and
// their Revisions) are imported alongside the real purchasable components.
// Off by default: those rows have no manufacturer and no price, so they'd only
// add noise to a quote — but some assemblies legitimately need them listed.
// Every row from the sheet is now imported, always. The old checkbox made the
// user decide up-front whether sub-assembly/document rows mattered — a question
// they couldn't answer before seeing the parts. Importing everything and letting
// the cheapest-QVL-alternative logic price it is both simpler and safer: a row
// that turns out to be irrelevant can be deleted in the review step, whereas a
// row that was never imported is invisible.
const _xlsIncludeSubAssemblies=true;

// Column-name aliases for the deterministic spreadsheet parser below. Matched
// case-insensitively against the detected header row.
const _XLS_COL_ALIASES={
  internal_pn : ['part num','part number','partnumber','part no','item id','catalog','catalog no','internal pn','cust pn','customer pn','מק"ט','מקט'],
  name        : ['name','title','part name'],
  description : ['description','desc','long description','item description','תיאור','תאור'],
  uom         : ['uom','unit','units','u/m','unit of measure',"יח'"],
  type        : ['type','row type','record type','level type'],
  mfpn        : ['mfpn','mpn','mfg pn','mfr pn','manufacturer pn','manufacturer part number','vendor pn','nfpn'],
  vendor      : ['vendor','manufacturer','mfg','supplier','maker','יצרן','ספק'],
  qty         : ['qty','quantity',"no. req'd",'no req','amount','usage','required','כמות'],
  item        : ['item','item no','seq','#','no.','line'],
  status      : ['nfpn status','status','approval','approval status'],
};
// Row-TYPE semantics in hierarchical ERP/PLM exports (ELBIT "BOM QVL Report"
// and friends). Classified with ANCHORED patterns on purpose: a loose
// substring test is actively dangerous here — "StdPart" happens to contain the
// letters "tdp", so a /tdp/ test silently swallows every real component.
// Returns: 'vendor' | 'subassembly' | 'component'.
function _xlsClassifyType(rawType){
  // "<Type> Revision" rows restate an existing row — same class, handled as a
  // duplicate by the caller — so strip the suffix before classifying.
  const t=String(rawType||'').trim().toLowerCase().replace(/\s+revision$/,'').trim();
  if(!t) return 'component';                                          // no type column at all
  if(/^(qvl|avl)$|qualified\s*vendor|approved\s*vendor/.test(t)) return 'vendor';
  if(/^std\s*part$|^part$|^component$|^item$/.test(t)) return 'component';
  if(/tdp$|^document|^spec\b|^assembly$|^drawing$|^phantom$/.test(t)) return 'subassembly';
  return 'component';
}
const _XLS_TYPE_REVISION=/\srevision$/i;

// Pulls the top-level assembly / drawing number out of the report BANNER — the
// rows ABOVE the column header, where ERP exports print things like
// "Part Number: | 20583410900". Handles both layouts: the label and value in
// separate cells, and both crammed into one cell ("Part Number: 20583410900").
// This becomes the Drawing # on every extracted row, which is far more useful
// than the filename fallback (these files are often exported with an opaque
// machine-generated name).
const _XLS_BANNER_PN_LABEL=/^(part\s*(number|num|no\.?)|assembly\s*(number|no\.?)?|assy|top\s*level|drawing\s*(number|no\.?|#)|dwg\s*(no\.?|#)?)\s*:?\s*$/i;
const _XLS_BANNER_PN_INLINE=/^(?:part\s*(?:number|num|no\.?)|assembly(?:\s*(?:number|no\.?))?|assy|drawing\s*(?:number|no\.?|#)|dwg\s*(?:no\.?|#)?)\s*[:\-]\s*(.+)$/i;
function _xlsFindReportPartNumber(rows, hdrIdx){
  for(let i=0;i<hdrIdx;i++){
    const row=rows[i]||[];
    for(let c=0;c<row.length;c++){
      const v=String(row[c]??'').trim();
      if(!v) continue;
      // "Part Number: 20583410900" all in one cell
      const inline=v.match(_XLS_BANNER_PN_INLINE);
      if(inline && inline[1].trim()) return inline[1].trim();
      // "Part Number:" in this cell, value in the next non-empty one
      if(_XLS_BANNER_PN_LABEL.test(v)){
        for(let k=c+1;k<row.length;k++){
          const nv=String(row[k]??'').trim();
          if(nv) return nv;
        }
      }
    }
  }
  return '';
}

// Deterministic BOM extraction from a spreadsheet grid.
// Why not just ask the AI: these exports are a mechanical transformation —
// find the header, fold vendor child rows into their parent, drop the row
// types that aren't real parts, dedupe. An LLM does that inconsistently on a
// long sheet (it returned 8 rows for a file with 5 unique components), while
// the rules themselves are exact. The AI is kept only as a fallback for files
// with no recognisable header row (see handleFiles/handleSDFiles).
// Returns null when the sheet doesn't look like a structured BOM at all.
function _parseStructuredBOMSheet(rows){
  const norm=s=>String(s??'').trim().toLowerCase();
  // 1. Find the header row — the first row within the top 30 that matches at
  //    least two known column names (a title/date banner won't).
  let hdrIdx=-1, colMap=null;
  for(let i=0;i<Math.min(30,rows.length);i++){
    const cells=(rows[i]||[]).map(norm);
    const map={};
    cells.forEach((c,ci)=>{
      if(!c) return;
      for(const key in _XLS_COL_ALIASES){
        if(map[key]!==undefined) continue;
        if(_XLS_COL_ALIASES[key].includes(c)) map[key]=ci;
      }
    });
    const hits=Object.keys(map).length;
    if(hits>=2 && (map.internal_pn!==undefined||map.mfpn!==undefined||map.description!==undefined||map.name!==undefined)){
      hdrIdx=i; colMap=map; break;
    }
  }
  if(hdrIdx<0) return null;

  // Top-level assembly number from the banner above the header — stamped onto
  // every row as its Drawing #.
  const reportPN=_xlsFindReportPartNumber(rows, hdrIdx);
  const cell=(row,key)=>colMap[key]===undefined?'':String(row[colMap[key]]??'').trim();
  const out=[];          // components in first-seen order
  const byKey=new Map(); // dedupe key -> row already emitted
  let current=null;      // last emitted component, for attaching its vendor rows

  for(let i=hdrIdx+1;i<rows.length;i++){
    const row=rows[i]||[];
    if(!row.some(c=>String(c??'').trim())) continue;
    const type=cell(row,'type');
    const pn=cell(row,'internal_pn');
    const nm=cell(row,'name');
    const desc=cell(row,'description');
    const kind=_xlsClassifyType(type);

    // ── Vendor / QVL child row: not its own BOM line. Supplies a manufacturer
    //    PN + name for the component above it.
    //
    //    A QVL (Qualified Vendor List) deliberately names SEVERAL approved
    //    manufacturers for one customer part — they are interchangeable by the
    //    customer's own engineering approval, so the right one to buy is simply
    //    the cheapest available. We therefore collect them ALL into alt_mpns
    //    instead of taking the first and discarding the rest; Check Price prices
    //    every alternative and keeps the cheapest (see checkOne).
    //
    //    MNF P/N takes the MFPN (a real manufacturer number like
    //    "GRM426X7R103K50") rather than the customer's internal catalog number
    //    — that's the value a distributor can actually price. The internal
    //    number stays in Customer PN. See the no-vendor-row fallback below for
    //    the case where a component has no MFPN at all.
    if(kind==='vendor'){
      if(current){
        const mfpn=cell(row,'mfpn');
        if(mfpn){
          current.alt_mpns = current.alt_mpns || [];
          // Some exports restate the same approved part on several lines.
          if(!current.alt_mpns.some(a=>a.mpn.toLowerCase()===mfpn.toLowerCase())){
            current.alt_mpns.push({mpn:mfpn, manufacturer:cell(row,'vendor')});
          }
          // First one is the provisional pick, so the row is usable before any
          // price check has run.
          if(!current.part_number){
            current.part_number = mfpn;
            current.manufacturer = cell(row,'vendor');
          }
        }
      }
      continue;
    }
    // ── Sub-assembly / internal document row.
    const isSub = kind==='subassembly';
    if(isSub && !_xlsIncludeSubAssemblies){ current=null; continue; }
    // A "... Revision" row is a historical restatement of the row it belongs
    // to — never a separate part. Skip, but keep `current` so any vendor rows
    // that follow still attach to the right component.
    if(_XLS_TYPE_REVISION.test(type)) continue;
    // Must carry some identity to be a real row.
    if(!pn && !nm && !desc) continue;

    const key=(pn||nm||desc).toLowerCase();
    if(byKey.has(key)){ current=byKey.get(key); continue; } // already emitted — reuse for vendor attachment

    const rec={
      item:cell(row,'item'),
      atlantium_pn:pn,
      part_number:'',                    // filled from the QVL row that follows
      manufacturer:'',
      // Prefer the longer of Name / Description — exports often truncate one.
      description:(desc.length>nm.length?desc:nm)||nm||desc,
      qty:cell(row,'qty')||'1',          // these exports frequently have no qty column
      unit:cell(row,'uom'),
      // Drawing # comes from the report banner; Dwg Name is deliberately left
      // empty so the caller fills it from the FILE NAME (same as PDF imports).
      drawing_number:reportPN, drawing_name:'',
      pin_count:'', price:'',
      alt_mpns:[],                       // every approved manufacturer PN (QVL)
      _isSubAssembly:!!isSub,
    };
    out.push(rec); byKey.set(key,rec); current=rec;
  }
  // Fallback for components the export lists with NO vendor/QVL row at all:
  // rather than leave MNF P/N blank, fall back to the sheet's own part number.
  // It's the only identifier such a row has, and a blank MNF P/N would make the
  // line unpriceable AND unsearchable. Customer PN is cleared in that case so
  // the same value isn't shown twice in two different columns.
  for(const r of out){
    if(!r.part_number && r.atlantium_pn){
      r.part_number = r.atlantium_pn;
      r.atlantium_pn = '';
    }
    // A single alternative is not a choice — drop the list so downstream code
    // only ever sees alt_mpns when there's genuinely something to compare.
    if((r.alt_mpns||[]).length<2) r.alt_mpns=[];
    delete r._hasVendorRow;
  }
  return out.length?out:null;
}

// Reads every sheet into raw row arrays — the shared input for both the
// deterministic parser and the AI text fallback.
async function readExcelSheets(file){
  if(!window.XLSX) throw new Error('Excel library not loaded — please reload the page');
  const ab=await file.arrayBuffer();
  const wb=XLSX.read(ab,{type:'array'});
  return wb.SheetNames.map(name=>({
    name,
    rows: XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''})
  }));
}
// Runs the deterministic parser over each sheet, returning the first sheet that
// yields real BOM rows. null → hand the file to the AI instead.
function parseExcelSheetsStructured(sheets){
  for(const s of sheets){
    const rows=_parseStructuredBOMSheet(s.rows);
    if(rows && rows.length) return rows;
  }
  return null;
}

async function extractExcelText(file){
  if(!window.XLSX) throw new Error('Excel library not loaded — please reload the page');
  const ab=await file.arrayBuffer();
  const wb=XLSX.read(ab,{type:'array'});
  const out=[];
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});
    const lines=[];
    rows.forEach((row,i)=>{
      const cells=(row||[]).map(c=>String(c??'').trim());
      while(cells.length && !cells[cells.length-1]) cells.pop(); // trim trailing empties
      if(!cells.some(c=>c)) return;                              // skip fully blank rows
      lines.push(`r${i+1}: ${cells.join(' | ')}`);
    });
    if(lines.length) out.push(`=== SHEET "${name}" ===\n${lines.join('\n')}`);
  }
  return out.join('\n\n');
}

// Spreadsheet BOM exports (ERP/PLM reports) are structured very differently from
// a drawing's parts list: they often carry a row-TYPE column where only some row
// types are real purchasable components, and manufacturer data lives on separate
// child rows beneath each component. This prompt teaches that shape explicitly,
// using the ELBIT "BOM QVL Report" layout as the worked example, and encodes the
// mapping decisions agreed with the user (StdPart rows only; first QVL row wins;
// qty defaults to 1 when the export has no quantity column at all).
const _BOM_EXCEL_PROMPT = (filename) =>
  `You are an expert at reading Bill of Materials (BOM) exports from ERP/PLM systems that arrive as spreadsheets.

TASK: Extract the real component rows from the spreadsheet grid below. Each line is one spreadsheet row: "r<N>: cell | cell | cell".

UNDERSTANDING THE LAYOUT:
- A header row (often NOT row 1 — earlier rows hold a report title, top-level part number, date, etc.) names the columns. Find it first and map columns by NAME, not by position.
- Many exports are HIERARCHICAL: a component row is followed by one or more CHILD rows that describe it further (approved manufacturers/vendors). Child rows are recognisable because their key identity columns are blank while a type/category column marks them as vendor entries.

ROW-TYPE COLUMN (e.g. a column literally named "Type"): treat its values as follows —
- "StdPart" → a REAL purchasable component. THIS is what becomes a BOM row.
- "Qualified Vendor List" (QVL) → NOT its own BOM row. It supplies the manufacturer part number and manufacturer NAME for the StdPart row directly above it. If a component has SEVERAL QVL rows, use the FIRST one that appears and ignore the rest.
- "StdPart Revision", "SpecTdp", "SpecTdp Revision", "DocumentTdp", "DocumentTdp Revision" → internal sub-assembly / drawing / document references. SKIP these entirely — they are not purchasable components.
- If there is no type column at all, just extract every genuine data row of the BOM table.

DEDUPLICATION: these exports repeat the same component many times (once per place it's used). Output each distinct component ONCE only, keyed on its part identity.

FIELD MAPPING (map by column name; names vary between systems):
- "atlantium_pn" → the customer's/company's internal part number — look for: PART NUM, PART NUMBER, ITEM ID, CATALOG, INTERNAL PN, CUST PN
- "part_number" → the MANUFACTURER part number, taken from the component's first QVL/vendor child row — look for: MFPN, MPN, MFG PN, MANUFACTURER PN, VENDOR PN. If the component has no vendor row at all, leave "" .
- "manufacturer" → manufacturer/vendor name from that same QVL row — look for: VENDOR, MANUFACTURER, MFG, SUPPLIER
- "description" → the component's descriptive text — look for: DESCRIPTION, NAME, DESC. Prefer the longer/fuller of the two if both exist.
- "qty" → quantity — look for: QTY, QUANTITY, NO. REQ'D, AMOUNT, USAGE. **If the export has NO quantity column anywhere, use "1" for every row.**
- "unit" → unit of measure — look for: UOM, UNIT, U/M. The ONLY valid values are "pc", "mm", "cm", "ea", "gm", "M". Map "each"/"EA"→"pc" and "FT"/"FEET"→"" (leave empty — a foot isn't one of the valid units; the app converts lengths separately). Anything unrecognised → "".
- "item" → the row's sequence number if the sheet has one, else ""
- "drawing_number" / "drawing_name" → the top-level assembly part number / title if the report header states one (e.g. a "Part Number:" cell near the top), else ""
- "pin_count" → number of pins/positions/contacts for connector components, if stated or reliably inferable from the part number/description of a known connector series. Else "".
- "price" → always "" here (spreadsheet BOM exports don't carry pricing; the app prices parts separately). The ONLY exception is a synthesized crimp-tool row — see below.

${_BOM_TOOL_RULE_SECTION}

RULES:
1. Output ONE row per distinct real component — do not repeat a component that appears multiple times in the sheet
2. Never output a QVL/vendor child row as its own BOM row — fold it into its parent component
3. Never output sub-assembly/document rows (SpecTdp/DocumentTdp and their Revisions)
4. Read part numbers character by character — they are precise: do NOT guess or correct them
5. If a field is genuinely absent, use empty string "" (except qty — see the qty rule above)

Return ONLY a valid JSON array, no explanations.
Example: [{"item":"","atlantium_pn":"00050470N","part_number":"GRM426X7R103K50","drawing_number":"20583410900","drawing_name":"","description":"CAP CHIP CER 10NF 50V 10% 1206","qty":"1","unit":"pc","manufacturer":"MURATA ELECT.NORTH AMERICA LTD","pin_count":"","price":""}]
If no BOM is found, return: []

SPREADSHEET (file: ${filename}):`;

// Shared by BOTH BOM prompts (text + vision) — kept as its own constant so the
// Settings > AI Prompts panel can show it as a standalone topic, and so the
// rule can only ever be edited in one place (the two prompts must never drift
// apart on how tools are detected/priced).
const _BOM_TOOL_RULE_SECTION =
  `CRIMP/INSERTION TOOL ROWS — MANDATORY, CHECK EVERY ROW: this is a required
step, not optional — after extracting the BOM, go back through EVERY row that
has a "pin_count" value (any connector with pins/positions/contacts) and, for
EACH one, add ONE EXTRA ROW right after it for the crimping/insertion tool
that connector needs, using your knowledge of that connector manufacturer's
tooling. Do this for every qualifying connector row, not just the first one
you notice. Only add a tool row when you're reasonably confident of the exact
tool part number (never invent a plausible-looking one — if genuinely unsure
for a specific connector, skip just that one). For the tool row: "part_number"
= the tool's manufacturer part number, "description" = a short description
containing the word "TOOL" (e.g. "CRIMP TOOL for <connector series>"),
"qty"="1", "unit"="pc", "price" = the tool's approximate USD list price
(plain number, no currency symbol), "pin_count"="", "item"="".`;

const _BOM_TEXT_PROMPT = (filename) =>
  `You are an expert at extracting Bill of Materials (BOM) tables from engineering drawings.

TASK: Extract ALL rows from the BOM table in the text below. Do NOT stop early — even if there are 30+ rows.

FINDING THE RIGHT TABLE: A multi-page drawing package often has SEVERAL tables —
a title block, a sheet/revision record, a hole chart, etc. — but only ONE of

table that lacks real item numbers and part numbers, even if it superficially

- "item" → row number (1, 2, 3 ...) — look for: ITEM, #, NO., SEQ

${_BOM_TOOL_RULE_SECTION}

Return ONLY a valid JSON array, no explanations.

let _dbgLastAI='';
function _parseAIJson(raw){
  _dbgLastAI=raw;
  const m=raw.match(/\[[\s\S]*\]/);
  if(!m){console.warn('[AI] no JSON array. Raw:',raw.slice(0,300));return[];}
  try{return JSON.parse(m[0]);}
  catch(e){console.warn('[AI] parse error:',e.message,'at:',m[0].slice(0,200));return[];}
}

// Retries a fetch() once after a short delay if it fails at the network
// level (a TypeError — connection refused, CORS block, DNS failure, offline)
// rather than coming back with a normal HTTP response. That kind of failure
// surfaces to the user as an unhelpful generic "Failed to fetch" with no
// status code at all, and is often just a transient blip — a single retry
// resolves most of them. Deliberately does NOT retry on a real HTTP error
// response (4xx/5xx): those are genuine API errors (bad key, rate limit,
// oversized request) that a retry wouldn't fix.
async function _fetchWithRetry(url, opts, timeoutMs){
  // A timeout turns an indefinite hang (e.g. a large image upload stalling on a
  // slow connection) into a clear, bounded failure instead of the tab just
  // spinning forever — and it's a DIFFERENT error class (AbortError) from the
  // network-level TypeError this function otherwise retries, so the two failure
  // modes stay distinguishable in the message shown to the user.
  //
  // The budget is per-call because the calls are not comparable. Extracting a
  // BOM is a short request; asking for a full cut & strip specification means
  // reading a whole drawing AND generating several thousand tokens of
  // structured JSON, which legitimately takes longer than a minute on a big
  // sheet. A single shared 60s ceiling failed that work as if it had hung,
  // when it was simply still going.
  const ms = timeoutMs || 60000;
  const secs = Math.round(ms/1000);
  const withTimeout = (o)=>({...o, signal:o.signal||AbortSignal.timeout(ms)});
  const timedOut = ()=> new Error(
    `The AI provider did not finish within ${secs}s. The drawing may be very dense, or the connection slow — try again, or use a sharper/simpler drawing file.`);
  try{ return await fetch(url, withTimeout(opts)); }
  catch(e){
    if(e && e.name==='TimeoutError') throw timedOut();
    if(!(e instanceof TypeError)) throw e;
    await new Promise(res=>setTimeout(res,1200));
    try{ return await fetch(url, withTimeout(opts)); }
    catch(e2){
      if(e2 && e2.name==='TimeoutError') throw timedOut();
      throw new Error(`Network error reaching the AI provider — check your internet connection and try again. (${e2.message})`);
    }
  }
}

// sourceType: 'drawing' (default — PDF text or page image) or 'excel'
// (spreadsheet grid from extractExcelText, which needs its own prompt).
async function aiExtractBOM(text, isImage, imgData, filename, sourceType='drawing'){
  try{
    if(!anthKey) throw new Error(_AI_NO_KEY);
    const rows=await _anthropicBOM(text, isImage, imgData, filename, sourceType);
    logSystemAudit('drawing_bom_search',{filename,provider:'anthropic',mode:sourceType==='excel'?'excel':(isImage?'vision':'text'),rowsFound:rows.length},true);
    return rows;
  }catch(e){
    logSystemAudit('drawing_bom_search',{filename,error:e.message},false);
    throw e;
  }
}
// Text-mode prompt for whichever kind of file this is. Spreadsheets get a much
// bigger slice (100k chars) than a drawing's text layer: an ERP BOM export can
// legitimately run to hundreds of rows, and truncating it silently drops parts.
function _bomTextPromptFor(sourceType, filename){
  return sourceType==='excel' ? _BOM_EXCEL_PROMPT(filename) : _BOM_TEXT_PROMPT(filename);
}
function _bomTextLimitFor(sourceType){ return sourceType==='excel' ? 100000 : 30000; }

async function _anthropicBOM(text, isImage, imgData, filename, sourceType='drawing'){
  const messages = isImage ? [{role:'user',content:[
    {type:'image',source:{type:'base64',media_type:imgData.mimeType,data:imgData.b64}},
    {type:'text',text:_BOM_VISION_PROMPT}
  ]}] : [{role:'user', content: _bomTextPromptFor(sourceType,filename)+'\n'+text.slice(0,_bomTextLimitFor(sourceType))}];
  const resp = await _fetchWithRetry('https://api.anthropic.com/v1/messages',{
    method:'POST',

// ── Sales Desk only: AI cable-manufacturing-process analysis ─────────────────
// Given the SAME drawing content already used for BOM extraction, ask the AI
// to work out the actual manufacturing steps needed to build this cable
// assembly (cut/strip, crimp, insert, heat-shrink, label, test, etc.) and the
// time each step takes — assuming SERIES/BATCH production (steady-state per-
// unit time, not one-off setup time). Each step is attributed to whichever
// extracted BOM row it belongs to (by index) so its time can be dropped
// straight into that row's Labor Time; steps that aren't tied to one specific
// part (general assembly/inspection) come back with row_idx:null. A separate,
// higher single_unit_minutes figure is also returned purely as a reference
// ("what would ONE stand-alone cable take, with no batch efficiency").
// hasDrawing=false is the "Add from Database" path: there is no drawing, only
// the chosen parts. It gets its OWN prompt rather than a reworded version of
// this one — see _partsOnlyProcessPrompt for why that matters.
function _cableProcessPrompt(rowsList, hasDrawing=true){
  if(!hasDrawing) return _partsOnlyProcessPrompt(rowsList);
  return `You are a cable/wire-harness manufacturing process engineer. Look at this cable assembly drawing and work out the manufacturing steps required to build it, with the time (in minutes) each step takes.

IMPORTANT: Assume SERIES/BATCH production — this is one of many identical units in an ongoing production run, so use realistic steady-state per-unit time (do NOT include one-off first-article setup/changeover time in these step times).

The assembly's BOM rows are (index: description (qty unit)):
${rowsList}

For each manufacturing step (e.g. cut/strip the cable, crimp pins into a connector, insert contacts into a housing, heat-shrink a boot or tubing, apply a label, solder, twist/braid, final test/inspection, etc.), return:
- "operation": short description of the step
- "row_idx": the index (from the BOM list above) of the row this step's labor belongs to — or null if it's a general assembly/test step not tied to one specific part
- "unit_minutes": time in minutes for ONE SINGLE OCCURRENCE of this step (a plain number) — e.g. the time to crimp exactly ONE contact, strip exactly ONE wire, apply exactly ONE label. Always the time for one repetition, never a pre-multiplied total.
- "qty_in_drawing": how many times this exact operation must be repeated to build ONE complete assembly, READ DIRECTLY FROM THE DRAWING (e.g. count the actual pins/contacts/wires shown, not the BOM row's own quantity field, which may describe something else entirely — a connector housing row might have BOM qty=1 while its pins are crimped 20 times). Use 1 for a step that happens exactly once regardless of any part count (e.g. one cable is cut once even though its length is 230mm, one housing is assembled once, one final inspection). For row_idx:null (general) steps this is almost always 1.

CRITICAL: unit_minutes and qty_in_drawing must be reported SEPARATELY and never combined into one number — the app computes unit_minutes × qty_in_drawing itself.

Also return:
- "single_unit_minutes": a reference estimate (in total, already accounting for every repeat operation like crimping every contact) for building just ONE stand-alone cable with no batch efficiency (includes setup/changeover overhead a series run wouldn't need) — for comparison only.

Return ONLY valid JSON, no explanation, in exactly this shape:
{"steps":[{"operation":"Strip and cut main cable","unit_minutes":2,"qty_in_drawing":1,"row_idx":0},{"operation":"Crimp one contact","unit_minutes":0.15,"qty_in_drawing":20,"row_idx":1}],"single_unit_minutes":15}

If you can't confidently determine any steps from this drawing, return {"steps":[],"single_unit_minutes":0}`;
}
// Throws (rather than returning null) when the reply can't be read, so the
// caller can tell three very different situations apart:
//   • the model answered "no steps"          → proc.steps.length === 0
//   • the model's answer was unreadable      → throws, provider falls back
//   • the request itself failed              → throws with the HTTP error
// Returning null for all three is what made "no manufacturing steps" the
// catch-all message for problems that had nothing to do with the parts.
// Asking the drawing prompt to work without a drawing is what produced
// "the AI returned no manufacturing steps". That prompt opens with "look at
// this cable assembly drawing", tells the model to count pins off it, and ends
// with an explicit "if you can't tell, return an empty list". Given a parts
// list and no drawing — and a BOM that is an RF/PCB assembly rather than a
// classic wire harness — returning nothing was the model following instructions.
//
// This version never mentions a drawing, isn't limited to cable harnesses,
// states that every physical part carries assembly time, and makes an empty
// answer the wrong one rather than the safe one.
function _partsOnlyProcessPrompt(rowsList){
  return `You are a manufacturing process engineer estimating assembly labor for an electro-mechanical build — a cable harness, wire assembly, connector/PCB assembly, or any mix of these.

You are given the BOM below. There is NO drawing. Estimate the manufacturing steps needed to build ONE complete assembly from these parts, and how long each step takes.

IMPORTANT: Assume SERIES/BATCH production — one of many identical units in an ongoing run — so use realistic steady-state per-unit times and exclude one-off first-article setup.

BOM rows (index: description (qty unit)):
${rowsList}

Every physical part in a BOM takes SOME labor to handle, position, join and verify. Typical steps: cut and strip wire or cable, crimp a contact, insert contacts into a housing, mate and lock connectors, solder a through-hole or SMT joint, place a PCB component, fit a boot or heat-shrink, apply a label or marker, dress and tie a bundle, torque a fastener, apply conformal coating, continuity or electrical test, final visual inspection.

For each step return:
- "operation": short description of the step
- "row_idx": index (from the list above) of the row this step's labor belongs to — or null for a general assembly/test/inspection step not tied to one part
- "unit_minutes": minutes for ONE SINGLE OCCURRENCE (e.g. crimping exactly ONE contact, soldering exactly ONE joint). Never a pre-multiplied total.
- "qty_in_drawing": how many times that operation repeats to build ONE assembly. With no drawing, base this on the row's own quantity and on what the description states — "SOCKET RECTANG 26 F" implies 26 contacts, "RECEPT RECT 40 C" implies 40 positions. If the description gives no count, use the row's quantity, or 1. Do not invent counts the BOM does not support.

CRITICAL: unit_minutes and qty_in_drawing must be SEPARATE numbers — the app multiplies them itself. Never combine them into one figure.

Also return:
- "single_unit_minutes": total reference time to build ONE stand-alone unit including the setup overhead a batch run would not pay per unit — for comparison only.

Return ONLY valid JSON, no explanation, in exactly this shape:
{"steps":[{"operation":"Solder one SMT receptacle to PCB","unit_minutes":0.4,"qty_in_drawing":40,"row_idx":0},{"operation":"Cut and dress flat cable","unit_minutes":2,"qty_in_drawing":1,"row_idx":1},{"operation":"Final visual inspection","unit_minutes":3,"qty_in_drawing":1,"row_idx":null}],"single_unit_minutes":25}

An empty "steps" list is almost never correct: a BOM of real parts always requires assembly labor, and a rough estimate is far more useful than none. Return an empty list ONLY if the BOM contains no physical parts at all (documents or specifications only).`;
}

function _parseCableProcessJson(raw){
  const text=String(raw||'').trim();
  if(!text) throw new Error('The AI returned an empty response');
  const m=text.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('No JSON in the AI response: '+text.slice(0,140));
  let obj;
  try{ obj=JSON.parse(m[0]); }
  catch(e){ throw new Error('Malformed JSON from the AI: '+m[0].slice(0,140)); }
  if(!obj || !Array.isArray(obj.steps)){
    throw new Error('AI response had no "steps" array: '+m[0].slice(0,140));
  }
  return obj;
}
async function _anthropicCableProcess(text, isImage, imgData, rowsList, hasDrawing=true){

  const resp = await _fetchWithRetry('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'x-api-key':anthKey,'anthropic-version':'2023-06-01',
             'anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    // temperature 0. Anthropic defaults to 1.0, i.e. maximum sampling
    // variability — which is why pressing Estimate Labor twice produced
    // materially different minutes for the same parts. Estimating assembly
    // time is not a creative task: the same BOM should give the same answer,
    // and a number that moves every time it's asked can't be trusted or

    body:JSON.stringify({model:'claude-haiku-4-5-20251001', max_tokens:2048, temperature:0, messages})
  });
  if(!resp.ok){let m=`Anthropic error ${resp.status}`;

// Broad match for "this note references a document or standard" — spec/dwg/
// procedure keywords plus common standard-body prefixes (MIL-, IPC, ASTM,
// ANSI, ISO, NASM, AS9100-style, SAE, J-STD, QQ-, MS-part-number style).
const _NOTE_DOC_STD_RE=/\b(spec(?:ification)?s?|standards?|std\.?|dwg\.?|drawing|document|doc\.?|procedures?|proc\.?|per\s+(?:mil|astm|ipc|ansi|iso|as|ms|nas|sae|j-?std|qq)|mil-[a-z]?-?\d|ipc[\/-]|astm|ansi|iso\s*\d|nasm\d|as\d{3,4}|j-?std|qq-|ms\d{4,5}|sae\s*[a-z]*\d)\b/i;
