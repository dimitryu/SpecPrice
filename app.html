RULES — these matter more than completeness:

1. A LABEL TABLE IS NOT A CONNECTOR LIST. Read this before anything else.
   Many drawings carry a LABEL TABLE / MARKING TABLE: single letters A, B, C … each with the TEXT to
   print on a marker sleeve. Those letters identify SLEEVES placed along the cable — they are markers,
   and they belong in "markers" with their text in "text_lines". They are NOT connectors and must never
   become entries in "connectors" or appear as "from"/"to" on a segment.
   EVERY ROW OF THAT TABLE MUST APPEAR IN "markers" — all of them, not the ones that were easy to place.
   A marking table with rows B, C, D, E and F produces FIVE markers. If a label's position is described in
   words rather than dimensioned ("place E on the soldering points", "as close as possible to the
   connector"), still create the marker: put the words in "position", leave "distance_mm" null, and add an
   open item asking for the dimension. A label left out is a label the operator never fits.

   Connectors come from the PART LIST and from the connector bodies drawn on the assembly view.

   USE THE DESIGNATOR PRINTED NEXT TO EACH CONNECTOR BODY, EXACTLY AS DRAWN. If the assembly view labels
   the fans P2, P3, P4 then those are their refs — do not renumber them, do not shift them, and do not
   take them from a different table. Copy the qualifier too when there is one: "P2 (FAN1)" tells the
   operator which physical part it is, so keep it in "description".
   If the WIRING TABLE uses different designators from the assembly view (a real drawing may say P2/P3/P4
   on the picture and P3/P4/P5 in the table), follow the ASSEMBLY VIEW, and record the disagreement in
   "discrepancies" naming both. Do not quietly pick one — an operator plugging into the wrong fan is a
   fault nobody catches until the unit is running.
   Only invent a name (DB9, RJ45, OPEN) when the drawing genuinely prints none.

   A LABEL AND A CONNECTOR ARE AT DIFFERENT PLACES. The marking table says which text goes on which
   label; the assembly view says WHERE on the cable that label sits. Read the position off the assembly
   view — which run it is on, which connector it is measured from — not off the table. A label drawn
   near the fan end does not belong at the plug end because the table happens to list it first.

   LIST THE CONNECTORS IN THE ORDER THEY APPEAR ON THE DRAWING, top to bottom on the assembly view
   (so P2, P3, P4 if that is how they are stacked). The generated figure stacks its branches in this
   order, so listing them in a different order silently redraws the harness in a shape the operator
   cannot match against the drawing in front of them.

2. BUNDLING IS NOT A BREAKOUT. Get this right before you assign any length.
   Wires that simply run side by side — laced, taped, tied or sleeved together — are still SEPARATE runs.
   Each one goes the whole way from its connector to its connector, and each carries its OWN full length.
   Model that as one segment per destination, from connector to connector, with no breakout at all.
   A drawing that shows three fans on one plug with lengths 180, 180 and 200 has THREE runs of 180, 180
   and 200 — not a shared trunk with stubs hanging off it.
   Use a "breakouts" node ONLY when a SINGLE jacketed cable physically splits and its conductors leave in
   different directions — and in that case the drawing dimensions the trunk separately from the branches.
   When in doubt, do not create a breakout: separate full-length runs are always safe to cut, whereas a
   wrongly split run tells the operator to cut a wire far too short, and short wire is scrap.
   And when there IS a breakout, model it as a node: the trunk is a segment from the far connector to the
   breakout id, and each branch is a segment from that id to whatever it ends at. Do NOT chain the
   connectors together (A→B→C) when the drawing shows them fanning from one point — that describes a
   different harness from the one on the paper.

3. NOT EVERY BRANCH ENDS IN A CONNECTOR. A branch can finish as OPEN WIRES, a splice, or ring terminals.
   Give it a connectors[] entry with the matching "kind" and a ref like "OPEN", so the run has somewhere
   to end and the operator is told how to finish it. For open wires, say in the segment's
   "shield_treatment" or the steps what is stripped, tinned and how far the wires are separated.

4. LENGTHS ON A DRAWING ARE END TO END. This is the single most common way to get a harness wrong.
   A dimension arrow runs from one connector to another connector. "200 mm" means: from THAT connector to
   THAT connector, the whole way. It never means "as far as the point where the bundle separates".
   So "finished_length_mm" on a segment is the FULL length of that run, connector to connector, exactly as
   the arrow measures it — and a wiring-table "Length (mm)" column is the same thing, per wire.
   Record every dimension you can see in "route_dimensions" as it appears, saying what it spans:
     "route_dimensions":[ {"from":"P1","to":"P4","mm":200,"what":"overall, longest run"},
                          {"from":"P1","to":"P2","mm":180,"what":""} ]
   Then make each segment's finished_length_mm agree with the dimension that measures it. Never put the
   overall length on every run, and never leave a run without the length that is actually drawn for it.
   If a genuine trunk exists, the trunk gets its own dimension and the branches get theirs; if the drawing
   only gives end-to-end figures, model separate full-length runs (see rule 2) so nothing has to be guessed.
   Contradictory dimensions go in "discrepancies" — do not silently pick one.
   CHECK EVERY ROUTE DIMENSION AGAINST THE WIRING TABLE. The wiring table lists a length per connector
   column, and that is the arbiter of WHICH run a dimension belongs to. If the table says the Fan3
   column is 200 and the other two are 180, then the 200 mm arrow spans the Fan3 connector to P1 — even
   if the arrow is drawn nearer the top of the picture. Map the table's column headers onto the assembly
   view's designators first, put that mapping in "discrepancies" when the two disagree, and only then
   decide which connector each dimension reaches. Attaching a 200 to the wrong fan gives one run 20 mm
   too much and another 20 mm too little, and only one of those two errors is recoverable.
   When several runs are laced, taped or sleeved together over their common stretch, that is a BUNDLE:
   fill in "bundle" with the connector they run into, how far back the lacing goes, and what holds them.
   The runs stay separate full-length cables in "segments" — bundling changes how the harness is
   assembled and drawn, never how long any wire is cut.
   Set "overall_length_mm" to the largest end-to-end dimension the drawing gives: the length of the whole
   harness, the figure a planner quotes and a stores clerk checks against. On the fan harness above that
   is 200, the longest run — not the sum of the runs, and not the shortest one.

5. DECLARE YOUR COUNTS, THEN MATCH THEM. Before writing the arrays, count on the drawing: how many rows
   the marking/label table has, how many distinct connector references the assembly view and part list
   show, and how many separate cable runs there are. Put those three numbers in "counts".
   Then make the arrays match them exactly — five marking-table rows means five entries in "markers",
   four connector refs means four entries in "connectors". The sheet compares your arrays against your
   own counts and shows the operator any gap, so a dropped label or connector is visible rather than
   silent. Getting the count right matters more than getting every field of every entry right: an entry
   with an open item is workable, a missing entry is invisible.

6. COUNT THE CABLES AND THE CONNECTORS FIRST, AND COVER ALL OF THEM.
   Look at the assembly view and count every connector body and every separate cable run. A harness with
   three connectors and two cable runs gets THREE entries in "connectors" and TWO in "segments" —
   one segment per cable run, each naming the two connectors it links. Do NOT collapse a branched
   harness into a single cable with two ends, and do not stop after the first run you recognise.
   Cross-check your count against the part list quantities: a connector with QTY 2 is fitted at two
   places, and a wiring table with two destination columns means two runs.
   If a connector or a cable run appears on the drawing but you cannot work out its details, still list
   it, fill in what you can, and put the gap in "open_items" — a missing run is far worse than a thin one.

7. DRAWING NUMBER vs NAME vs PROJECT. The title block has all three and they are different things.
   "drawing_number" is this harness's own part number (DRAWING NO). "drawing_name" is its description.
   "project" is the programme it belongs to. Never put the project name in drawing_number.

8. READ THE ENGINEERING NOTES BLOCK. Almost every drawing carries one, and it is where the
   instructions live that are nowhere else on the sheet: the workmanship standard, whether the stated
   length includes the connectors, which item is the lacing cord, where each label goes, where glue may
   and may not reach, what to check afterwards. An operator working only from the dimensions will get a
   part that measures correctly and is still rejected.
   Put EVERY note in "engineering_notes", keeping its number. Then, for each note that tells the operator
   to DO something, also write it into "steps" at the point in the sequence where it happens — a note
   saying "tie all wires together at these points" is a step, not a footnote — and into "inspection" when
   it is something to check. A note that only gives background (what "##" stands for, "see PIC 1") stays
   in "engineering_notes" alone with "action":"".
   If a note contradicts a dimension or a table, that goes in "discrepancies".

9. CONFIRMED vs DERIVED. Set "confirmed": true ONLY when the value is printed on the drawing, or comes
   from a manufacturer datasheet you actually know for that exact part number. If you calculated it,
   inferred it from connector geometry, or took it from a similar part, set "confirmed": false and say
   so plainly in "basis". A wrong strip dimension destroys parts — never dress up a guess as a fact.

10. Still give a number. When a dimension is not confirmed, provide your best engineering proposal anyway
   with confirmed:false, so the sheet is usable while engineering verifies it. Only use null when you
   have no defensible basis at all.

11. OPEN ITEMS. Every unconfirmed dimension gets an entry in "open_items" naming what is unverified, why,
   and the action that closes it.

12. DISCREPANCIES. Report contradictions in the drawing rather than silently picking one: file name vs
   title block, balloon numbers vs part-list item numbers, dimensions that do not add up, a wiring table
   with more wires than the connector has positions. Do not "fix" them.

13. CUT LENGTH vs FINISHED LENGTH — per segment, and it is what the operator actually cuts.
   "finished_length_mm" is the length AS DIMENSIONED ON THE DRAWING for that run, and "length_basis"
   says what that dimension measures:
     - "to_jacket_end"    the dimension runs to where the JACKET ends at each end. THIS IS THE DEFAULT
                          for this shop — use it unless the drawing plainly says otherwise. Leaving the
                          field out, or saying "unclear", is treated as this too.
     - "cable_only"       the dimension is the bare cable, connectors excluded
     - "over_connectors"  the dimension spans the whole run, connector face to connector face
     - "unclear"          the drawing does not say
   "cut_length_mm" is ALWAYS finished_length_mm + sum of allowances + trim_allowance_mm, and must equal
   that sum exactly — do not report a cut length that contradicts its own parts.
   UNDER "to_jacket_end" THE APP DOES THE ADDING, NOT YOU. Each end costs the jacket strip plus a fixed
   1.5 mm handling margin, and the app reads the strip straight out of "strip" on that end. So a 180 mm
   run with an 8 mm jacket strip at both ends is cut at 180 + (8 + 1.5) + (8 + 1.5) = 199 mm, and you
   supply only the 180 and the 8s. Do NOT also put those 8s in "allowances" — you would be handing over
   the same number twice and the app would add it twice.
   Leave "allowances" for something genuinely extra that the drawing calls for and that nothing else
   accounts for, such as a service loop. Most runs have none, and an empty list is the right answer.
   A genuine extra belongs to the RUN, so leave its "ref" empty. An allowance naming an END is taken to
   be another attempt at that end's cost, which the app has already worked out — it is struck through on
   the sheet rather than added, because adding both is the same double count wearing a different name.

   AN ALLOWANCE IS CABLE YOU WOULD NOT OTHERWISE HAVE. Ask one question of every entry: does this make
   the piece coming off the reel LONGER? Only two things do — cable that disappears inside the connector
   body (insertion depth), and slack the drawing calls for. Squaring and re-stripping is material cut
   off, so it goes in trim_allowance_mm.
   A STRIP DIMENSION IS NOT AN ALLOWANCE. Stripping removes jacket; it removes no length. A conductor
   bared 8 mm back from the end is still in the same place it was — the cable is not one millimetre
   shorter for it, so nothing has to be added to compensate. Putting an 8 mm strip into "allowances"
   alongside the 4 mm insertion depth counts the same end twice and sends the operator 8 mm of scrap
   per end. Strip dimensions belong in "strip" on the end, and nowhere else.
     - length_basis "cable_only" with nothing else consuming cable may legitimately give 0 allowances —
       say so in "reason" rather than inventing a number. Zero is a real answer here and often the right
       one; a fabricated allowance is worse than an honest zero with an open item against it.
     - length_basis "over_connectors" means the cable is SHORTER than the dimension: use NEGATIVE mm.
     - Insertion depth comes from the connector's assembly spec. Without it, give a defensible estimate,
       set confirmed:false, and say what it was derived from.

14. MULTI-CONDUCTOR CABLE. Fill in "conductors" from the wiring table: one entry per wire, with its
   signal name, colour, AWG and the pin it lands on at each end. This table IS the work instruction for
   a crimped harness — an operator cannot terminate without it, so do not leave it empty when the
   drawing has a wiring table. "conductor_strip_mm" is how much insulation comes off each individual
   wire for its contact (a different, much smaller number than the jacket strip "A").
   Say in "shield_treatment" what happens to the shield and drain wire at each end — grounded to a pin,
   cut back and insulated, or terminated to a ferrule. Getting this wrong is a functional failure that
   inspection will not catch.

15. LAYERS run OUTERMOST FIRST. For single_wire there are two layers (insulation, conductor) and only
   strip code "A". For a shielded multi-conductor cable list jacket, shield, and conductor insulation.

16. STRIP CODES. "A" is always measured from the cable end. "derived":true marks a dimension that is
    arithmetic from the others (like C = A − B) rather than an independent setting.

17. NEVER PUT A DIMENSION IN THE PROSE THAT IS NOT IN THE FIELDS. The sheet computes its tables and its
   figures from the structured values, so those always agree with each other. Step text does not — it is
   whatever you wrote. If a step says "allow 4 mm at each end" while "strip" says 8, the operator has two
   different instructions and no way to tell which is real.
   So: every millimetre figure you write into a step, a check or a note must be one you also put in a
   field — a strip value, a finished length, a cut length, a marker distance. Better still, refer to it by
   name: "cut to the length in the cut table", "strip to dimension A". The sheet flags any number in your
   prose that it cannot find among its own, so an invented one will be visible.

18. STEPS. Write for someone holding the cable, not for an engineer. Tag each step with the "segment"
    it belongs to when the harness has more than one, so the operator knows which run they are on.
    Include threading sleeves on BEFORE connectors if the assembly has sleeves — that mistake scraps
    the cable. Every segment must be covered by the steps, not just the first one.

19. Units in millimetres throughout.
${langTail}`;
}

const _CS_TRUNCATED='The analysis was cut off before it finished — this drawing produces more detail than one reply can hold. Try again; if it keeps happening, split the drawing or analyse it in English (Hebrew costs about twice the space).';
// Unbalanced braces mean the JSON stopped mid-object. Saying "malformed" for
// that sends the user looking for a bad drawing when the reply was simply
// unfinished, which is a different problem with a different fix.
function _csLooksTruncated(text){
  let depth=0, inStr=false, esc=false;
  for(const ch of String(text||'')){
    if(esc){ esc=false; continue; }
    if(ch==='\\'){ esc=true; continue; }
    if(ch==='"'){ inStr=!inStr; continue; }
    if(inStr) continue;
    if(ch==='{') depth++;
    else if(ch==='}') depth--;
  }
  return inStr || depth>0;
}
function _csParse(raw){
  const text=String(raw||'').trim();
  if(!text) throw new Error('The AI returned an empty response');
  const m=text.match(/\{[\s\S]*\}/);
  if(!m){
    if(_csLooksTruncated(text)) throw new Error(_CS_TRUNCATED);
    throw new Error('No JSON in the AI response: '+text.slice(0,160));
  }
  let obj;
  try{ obj=JSON.parse(m[0]); }
  catch(e){
    if(_csLooksTruncated(text)) throw new Error(_CS_TRUNCATED);
    throw new Error('Malformed JSON from the AI: '+m[0].slice(0,160));
  }
  if(!obj || typeof obj!=='object') throw new Error('AI response was not an object');
  if(!Array.isArray(obj.steps) || !obj.steps.length)
    throw new Error('AI response had no operation steps — the drawing may not be a cable/harness drawing');
  // Normalise the shapes the renderer indexes into, so a partial response
  // degrades to a thinner sheet rather than throwing halfway through drawing.
  obj.ends       = Array.isArray(obj.ends) ? obj.ends : [];
  obj.sleeves    = Array.isArray(obj.sleeves) ? obj.sleeves : [];
  obj.markers    = Array.isArray(obj.markers) ? obj.markers : [];
  obj.engineering_notes = Array.isArray(obj.engineering_notes) ? obj.engineering_notes : [];
  if(obj.bundle && typeof obj.bundle!=='object') obj.bundle=null;
  obj.materials  = Array.isArray(obj.materials) ? obj.materials : [];
  obj.inspection = Array.isArray(obj.inspection) ? obj.inspection : [];
  obj.tools      = Array.isArray(obj.tools) ? obj.tools : [];
  obj.open_items = Array.isArray(obj.open_items) ? obj.open_items : [];
  obj.discrepancies = Array.isArray(obj.discrepancies) ? obj.discrepancies : [];
  obj.cable      = obj.cable && typeof obj.cable==='object' ? obj.cable : {};
  obj.cable = obj.cable && typeof obj.cable==='object' ? obj.cable : {};
  obj.cable.layers = Array.isArray(obj.cable.layers) ? obj.cable.layers : [];
  obj.cable.allowances = Array.isArray(obj.cable.allowances) ? obj.cable.allowances : [];
  obj.ends.forEach(e=>{ e.strip = Array.isArray(e.strip) ? e.strip : []; });
  _csNormalize(obj);
  _csSyncCutLength(obj);
  return obj;
}

async function _csAnthropic(text, isImage, imgData, lang){
  const prompt=_csPrompt(lang);
  const messages = isImage
    ? [{role:'user',content:[{type:'image',source:{type:'base64',media_type:imgData.mimeType,data:imgData.b64}},
                             {type:'text',text:prompt}]}]
    : [{role:'user', content: prompt+'\n\nDRAWING TEXT:\n'+String(text||'').slice(0,24000)}];
  const resp=await _fetchWithRetry('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'x-api-key':anthKey,'anthropic-version':'2023-06-01',
             'anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    // temperature 0 for the same reason as the labor estimate: reading
    // dimensions off a drawing is not a creative task, and a spec that comes
    // back different every time it is run cannot be checked against itself.
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:_CS_MAX_TOKENS,temperature:0,messages})
  }, _CS_ANALYSIS_TIMEOUT);
  if(!resp.ok){let m=`Anthropic error ${resp.status}`;
    try{const e=await resp.json();m=e.error?.message||m;}catch{}throw new Error(_csProviderHint('Anthropic', m));}
  const data=await resp.json();
  // Truncation is reported by the provider, so say so rather than letting the
  // JSON parser report a syntax error for a reply that was simply unfinished.
  if(data.stop_reason==='max_tokens') throw new Error(_CS_TRUNCATED);
  return _csParse(data.content[0].text);
}
// A rejected KEY is not a transient failure — it will be rejected identically on
// every subsequent drawing. Retrying it each time just spends a round-trip
// before the fallback, on a screen where the total wait already matters. So a
// credential-class failure parks that provider for the rest of the session;
// anything else (a timeout, a bad response) is treated as transient and retried
// normally. Cleared by a reload, which is also what happens after fixing the key.
let _csDeadProviders={};
function _csIsKeyError(msg){
  return /service account is deleted or disabled|API key not valid|API_KEY_INVALID|invalid x-api-key|authentication_error|401|403/i.test(String(msg||''));
}

async function aiAnalyzeCutStrip(text, isImage, imgData, lang){
  if(!anthKey) throw new Error(_AI_NO_KEY);
  if(_csDeadProviders.anthropic) throw new Error(_csDeadProviders.anthropic);
  let spec;
  try{ spec=await _csAnthropic(text,isImage,imgData,lang); }
  catch(e){
    if(_csIsKeyError(e.message)) _csDeadProviders.anthropic=e.message;
    throw e;
  }
  // Records which language the prose is written in, so _csP knows when there is
  // nothing to translate and the sheet can be reopened years later without
  // guessing.
  spec.lang = lang || _CS_SOURCE_LANG;
  spec.cut_model = _CS_CUT_MODEL;
  return spec;
}

// The drawing itself, with the few numbers it does not carry: the CUT length of
// each run, allowances included. Everything else on the sheet already exists on
// the drawing, so nothing is redrawn and nothing is covered.
//
// A callout is pinned to the run only when the analysis gave a point AND said it
// was sure. Otherwise it drops to the numbered list underneath, which is always
// rendered in full — so every run is accounted for whether it got a pin or not.
function _csCallouts(spec){
  return _csSegments(spec).map((seg,i)=>
    ({n:i+1, seg, cut:_csCutLength(seg, spec), label:_csSegLabel(seg)}));
}

function _csSourceFigure(spec){
  if(!spec || !spec.source_image) return '';
  const T=_csT, rtl=_csRTL()?' dir="rtl"':'';
  const calls=_csCallouts(spec);
  return `
  <figure class="cs-fig" style="margin:0">
    <img src="data:image/jpeg;base64,${esc(spec.source_image)}" alt=""
         style="display:block;max-width:100%;height:auto;border:1px solid #CBD5E1;border-radius:4px"/>
    ${_csAllowanceDoubles(spec).length ? `
    <div class="cs-box cs-stop" style="margin-bottom:10px">
      <b>${esc(T('A strip dimension looks like it was also counted as an allowance'))}</b>
      <ul>${_csAllowanceDoubles(spec).map(d=>`<li><span class="cs-ltr"><b>${esc(d.seg)} · ${esc(d.ref)}</b>:
        ${esc(T('the allowance'))} <b>${d.mm} mm</b> ${esc(T('is the same as strip dimension'))}
        <b>${esc(d.code)}</b></span>${d.reason?` — ${esc(_csP(d.reason))}`:''}</li>`).join('')}</ul>
      <p>${esc(T('Stripping removes jacket, not length — a bared conductor is still where it was. If this is the strip counted twice, the cut length is too long by that much at each end. Check before cutting.'))}</p>
    </div>` : ''}
    <table class="cs-tbl" style="margin-top:10px"><thead><tr>
      <th style="width:6%">#</th><th style="width:22%">${esc(T('Cable run'))}</th>
      <th style="width:14%">${esc(T('Finished'))}</th><th style="width:15%">${esc(T('Cut length'))}</th>
      <th style="width:43%">${esc(T('How it adds up'))}</th></tr></thead>
      <tbody>${calls.map(c=>`<tr>
        <td class="cs-ctr cs-ltr"><b>${c.n}</b></td>
        <td class="cs-ltr">${esc(c.seg.id||'')} · ${esc(c.label)}</td>
        <td class="cs-ctr cs-ltr cs-nowrap">${esc(_csMM(c.cut.finished))}</td>
        <td class="cs-ctr cs-ltr cs-nowrap"><b style="color:#7C2D12">${esc(_csMM(c.cut.total))}</b></td>
        <td class="cs-ltr" style="font:12px/1.4 monospace">${esc(_csCutFormula(c.seg, spec))}</td></tr>`).join('')}
      </tbody></table>
    <figcaption style="font-size:11.5px;color:#64748B;margin-top:6px"${rtl}>${
      esc(T('The drawing as supplied, with the title block masked. Nothing is drawn over the harness; the cut lengths are in the table above.'))}</figcaption>
  </figure>`;
}

// ── Generated diagrams ────────────────────────────────────────────────────────
// Drawn FROM the spec, not from a fixed template: every connector on the drawing
// gets a body, every cable run gets a line scaled to its real length, and sleeves
// and markers land at their real distances. That way the picture and the numbers
// cannot disagree — which is the whole reason for drawing it rather than just
// tabulating it.

const _CS_SVG={ x0:200, x1:772, w:1000 };   // right margin leaves room for the CUT callout
// Everything drawn into an SVG goes through here. AI output can contain < & "
// and an unescaped one silently breaks the whole figure.
function _csSvgTxt(s){ return esc(String(s||'')); }

function _csConnBox(x, y, ref, pn, side, kind){
  // Open wires are not a connector body — drawing one would tell the operator to
  // fit something that does not exist.
  if(kind==='open_wires'){
    let w='';
    for(let i=0;i<5;i++){ const wy=y-16+i*8;
      w+=`<line x1="${x-46}" y1="${wy}" x2="${x}" y2="${y}" stroke="#94A3B8" stroke-width="2"/>`; }
    return w+`<text x="${x-52}" y="${y-24}" text-anchor="end" font-size="12.5" font-weight="800" fill="#1E293B">${_csSvgTxt(ref)}</text>`;
  }
  return _csConnBoxPlain(x,y,ref,pn,side);
}
function _csConnBoxPlain(x, y, ref, pn, side){
  // side: 'left' = cable leaves to the right, 'right' = cable arrives from the left
  const bw=46, bh=34, sh=12;
  const bx = (side==='left') ? x-bw : (side==='right2' ? x-bw : x);
  const g = `<g stroke="#1E293B" stroke-width="1.6" fill="#E2E8F0">
      <rect x="${bx}" y="${y-bh/2}" width="${bw}" height="${bh}"/>
      <rect x="${(side==='left')?bx-sh:(side==='right2'?bx-sh:bx+bw)}" y="${y-bh/2+6}" width="${sh}" height="${bh-12}" fill="#94A3B8"/>
    </g>
    <text x="${bx+bw/2}" y="${y-bh/2-8}" text-anchor="middle" font-size="14" font-weight="800" fill="#1E293B">${_csSvgTxt(ref)}</text>`;
  return g + (pn ? `<text x="${bx+bw/2}" y="${y+bh/2+15}" text-anchor="middle" font-size="10" font-family="monospace" fill="#64748B">${_csSvgTxt(pn)}</text>` : '');
}

// Each marker is placed on exactly one run: the one it names, else the first run
// that actually touches the end it is measured from, else the first run. Returns
// a map keyed by segment id so the renderer never has to guess twice.
function _csMarkersBySeg(spec){
  const segs=_csSegments(spec), by={};
  segs.forEach(sg=>{ by[sg.id]=[]; });
  const eq=(a,b)=>String(a||'').toUpperCase()===String(b||'').toUpperCase();
  (spec.markers||[]).forEach(mk=>{
    let sg = mk.segment && segs.find(x=>x.id===mk.segment);
    if(!sg) sg = segs.find(x=>eq(x.from,mk.from_end)||eq(x.to,mk.from_end));
    if(!sg) sg = segs[0];
    if(sg) (by[sg.id]=by[sg.id]||[]).push(mk);
  });
  return by;
}

function _csHarnessSVG(spec){
  const T=_csT, rtlAttr=_csRTL()?' direction="rtl"':'';
  const segs=_csSegments(spec), conns=_csConnectors(spec);
  const marksBySeg=_csMarkersBySeg(spec);
  const pnOf=ref=>(conns.find(c=>String(c.ref||'').toUpperCase()===String(ref||'').toUpperCase())||{}).part_number||'';
  const kindOf=ref=>(conns.find(c=>String(c.ref||'').toUpperCase()===String(ref||'').toUpperCase())||{}).kind||'connector';
  if(!segs.length) return `<svg viewBox="0 0 1000 60" xmlns="http://www.w3.org/2000/svg"><text x="500" y="35" text-anchor="middle" font-size="13" fill="#64748B">—</text></svg>`;

  // The layout follows the drawing rather than an abstract graph: whatever the
  // branches fan out from sits in the middle, the longest run off it goes right
  // as the trunk, and the rest stack on the left. On a breakout harness that
  // reproduces the shape an operator already recognises — connectors on one
  // side, one long trunk to the far connector on the other.
  const brk=_csBreakouts(spec).map(b=>String(b.id));
  const touch={};
  segs.forEach(sg=>{ [sg.from,sg.to].filter(Boolean).forEach(r=>{ touch[r]=(touch[r]||0)+1; }); });
  const hub = brk.find(id=>touch[id]) || Object.keys(touch).sort((a,b)=>touch[b]-touch[a])[0];
  const hubIsBreakout=_csIsBreakout(spec, hub);

  const attached=segs.filter(sg=>String(sg.from)===hub||String(sg.to)===hub);
  const rest    =segs.filter(sg=>!attached.includes(sg));
  const row=sg=>{ const far=String(sg.from)===hub?sg.to:sg.from;
                  return {seg:sg, far, len:_csCutLength(sg, spec).total, fin:_csNum(sg.finished_length_mm)}; };
  let rows=attached.map(row);
  // Stack the branches in the order the DRAWING lists them, not by length. The
  // connector list is read off the assembly view top to bottom, so following it
  // puts P2/P3/P4 where the operator expects them; sorting by length reshuffled
  // them to P2/P4/P3 and stopped the figure matching the drawing it came from.
  const ordOf=ref=>{
    const i=conns.findIndex(c=>String(c.ref||'').toUpperCase()===String(ref||'').toUpperCase());
    return i<0 ? 999 : i;
  };
  rows.sort((a,b)=>ordOf(a.far)-ordOf(b.far));
  // The trunk is the longest run off a breakout; it is drawn to the right alone.
  const trunk = (hubIsBreakout && rows.length>1)
    ? rows.splice(rows.reduce((bi,r,i,arr)=>(_csNum(r.len)||0)>(_csNum(arr[bi].len)||0)?i:bi,0),1)[0]
    : null;
  const branches=rows.concat(rest.map(sg=>({seg:sg, far:sg.to, len:_csCutLength(sg, spec).total, fin:_csNum(sg.finished_length_mm), _loose:true})));

  const bundled = !hubIsBreakout && branches.length>1;
  const bundleMarks = bundled
    ? (spec.markers||[]).filter(m=>
        String(m.from_end||'').toUpperCase()===String(hub||'').toUpperCase() && _csNum(m.distance_mm)==null)
    : [];
  // Drawn once, on the bundle — so they must not also be drawn on a run.
  Object.keys(marksBySeg).forEach(k=>{
    marksBySeg[k]=marksBySeg[k].filter(m=>!bundleMarks.includes(m));
  });

  const maxLen=Math.max(...segs.map(sg=>_csNum(_csCutLength(sg, spec).total)||0), 1);
  const TOP=76, HUBX=560, LEFT=150;
  // A run carrying five label dimensions needs more vertical room than one
  // carrying none. A fixed row height was letting the lower annotations of one
  // run land on top of the next run's cable — which is how a 200 mm dimension
  // ended up looking like it belonged to the 180 mm branch below it.
  const rowH=r=>{
    const marks=(marksBySeg[r.seg.id]||[]).length;
    const cut=_csCutLength(r.seg, spec);
    // Room for: the length dimension (y+46), the annotation stack starting at
    // y+70, one line per label, and clearance for the NEXT run's own caption,
    // which is drawn 16px above its cable. Too small and the last note lands on
    // the next run's title — which is what "F" was doing to "S2 · MR3010E".
    return 96 + marks*20 + ((cut.hasBreakdown&&cut.added!==0)?32:0);
  };
  const heights=branches.map(rowH);
  const rowY=[]; let acc=TOP+16;
  heights.forEach(h=>{ rowY.push(acc); acc+=h; });
  const bodyH=Math.max(acc-TOP-16, 100);
  const H = TOP + bodyH + (trunk?90:46) + 56 + (segs.length===1?26:0);
  const hubY = branches.length ? (rowY[0]+rowY[rowY.length-1])/2 : TOP+16;

  const W=1180, RIGHT=W-120;
  let g='';

  // Where two or more runs arrive at the same connector and the drawing says
  // they are laced together, the common stretch is ONE bundle. Draw it as one.
  const MERGEX = HUBX-150;
  if(bundled){
    g+=`<line x1="${MERGEX}" y1="${hubY}" x2="${HUBX-18}" y2="${hubY}" stroke="#334155" stroke-width="15" stroke-linecap="round"/>
        <line x1="${MERGEX}" y1="${hubY}" x2="${HUBX-18}" y2="${hubY}" stroke="#94A3B8" stroke-width="9" stroke-linecap="round"/>`;
    const bn=spec.bundle||{};
    const meth=[_csP(bn.method||''), bn.part_number||''].filter(Boolean).join(' · ');
    // Clear of the connector's own ref, which _csConnBoxPlain sets at y-bh/2-8.
    g+=`<text x="${(MERGEX+HUBX)/2}" y="${hubY-44}" text-anchor="middle" font-size="11" font-weight="700" fill="#334155"${rtlAttr}>${
      _csSvgTxt(T('Laced into one bundle'))}${meth?` — ${_csSvgTxt(meth)}`:''}</text>`;
    if(_csNum(bn.length_mm)!=null)
      // Under the caption, not under the cable: the connector's part number is
      // already printed below the bundle line.
      g+=`<text x="${(MERGEX+HUBX)/2}" y="${hubY-28}" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#64748B">${
        _csNum(bn.length_mm)} mm</text>`;
  }

  // hub itself
  if(hubIsBreakout){
    g+=`<ellipse cx="${HUBX}" cy="${hubY}" rx="15" ry="26" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.6"/>
        <text x="${HUBX}" y="${hubY-34}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155"${rtlAttr}>${_csSvgTxt(T('Breakout'))}</text>
        <text x="${HUBX}" y="${hubY+45}" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#64748B">${_csSvgTxt(hub)}</text>`;
  } else {
    g+=_csConnBox(HUBX, hubY, hub, pnOf(hub), 'left', kindOf(hub));
  }

  // branches fan out to the LEFT of the hub, stacked
  branches.forEach((r,i)=>{
    const y=rowY[i];
    const x0=LEFT;
    const sx = bundled ? MERGEX : HUBX-18;
    const path=`M ${sx} ${hubY} Q ${sx-40} ${hubY} ${sx-60} ${(hubY+y)/2} Q ${sx-80} ${y} ${sx-110} ${y} L ${x0+52} ${y}`;
    g+=`<path d="${path}" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
        <path d="${path}" fill="none" stroke="#CBD5E1" stroke-width="3.4" stroke-linecap="round"/>`;
    g+=_csConnBox(x0+52, y, r.far, pnOf(r.far), 'right2', kindOf(r.far));
    g+=_csRunAnnot(spec, r, x0+52, sx-110, y, rtlAttr, T, false, segs.length===1, marksBySeg[r.seg.id]);
  });

  // trunk runs right
  if(trunk){
    const y=hubY;
    g+=`<line x1="${HUBX+18}" y1="${y}" x2="${RIGHT}" y2="${y}" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
        <line x1="${HUBX+18}" y1="${y}" x2="${RIGHT}" y2="${y}" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>`;
    g+=_csConnBox(RIGHT, y, trunk.far, pnOf(trunk.far), 'right', kindOf(trunk.far));
    g+=_csRunAnnot(spec, trunk, HUBX+18, RIGHT, y, rtlAttr, T, true, segs.length===1, marksBySeg[trunk.seg.id]);
  }

  // Labels measured from the shared connector belong on the bundle, not hanging
  // off one arbitrary branch — that is where the drawing prints them.
  if(bundled){
    bundleMarks.forEach((mk,k)=>{
      const x=HUBX-95-k*34;      // clear of the connector body at HUBX
      if(x<=MERGEX+8) return;
      g+=`<rect x="${(x-8).toFixed(1)}" y="${hubY-14}" width="16" height="28" fill="#fff" stroke="#1E293B" stroke-width="1.2"/>
          <text x="${x.toFixed(1)}" y="${hubY+5}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0F172A">${_csSvgTxt(mk.label||'')}</text>`;
      if(mk.position)
        g+=`<line x1="${x.toFixed(1)}" y1="${hubY+15}" x2="${x.toFixed(1)}" y2="${hubY+34+k*17}" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>
            <text x="${x.toFixed(1)}" y="${hubY+46+k*17}" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309"${rtlAttr}>${
              _csSvgTxt(_csP(mk.position))}</text>`;
    });
  }

  // The overall length, spanning the picture the way the drawing dimensions it.
  const ov=_csOverall(spec);
  if(ov.value!=null){
    const oy=H-58;
    g+=`<line x1="60" y1="${oy}" x2="${W-60}" y2="${oy}" stroke="#0F172A" stroke-width="1.4" marker-start="url(#csArL)" marker-end="url(#csAr)"/>
        <rect x="${W/2-150}" y="${oy-13}" width="300" height="22" fill="#fff"/>
        <text x="${W/2}" y="${oy-19}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748B"${rtlAttr}>${
          _csSvgTxt(T('Overall length'))}</text>
        <text x="${W/2}" y="${oy+5}" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0F172A" font-family="monospace">${ov.value} mm${
          ov.span?`  (${_csSvgTxt(ov.span)})`:''}</text>`;
  }
  // A label the model could not place on any run still has to reach the operator.
  const segIds=segs.map(x=>x.id);
  const unplaced=(spec.markers||[]).filter(m=>m.segment && !segIds.includes(m.segment));
  if(unplaced.length){
    g+=`<text x="30" y="${H-28}" font-size="10.5" font-weight="700" fill="#B45309"${rtlAttr}>${
      _csSvgTxt(T('Labels not placed on the figure'))}: ${_csSvgTxt(unplaced.map(m=>m.label||'?').join(', '))}</text>`;
  }

  const anyTBC=(spec.markers||[]).some(m=>m.confirmed===false);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Heebo, Public Sans, Arial, sans-serif" direction="ltr">
    <defs>
      <marker id="csAr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0F172A"/></marker>
      <marker id="csArL" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#0F172A"/></marker>
      <pattern id="csHatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#334155" stroke-width="2.4"/></pattern>
    </defs>
    ${g}
    <text x="30" y="${H-12}" font-size="10.5" fill="#64748B"${rtlAttr}>${_csSvgTxt(T('All dimensions in millimetres. Not to scale.'))}</text>
    ${anyTBC?`<text x="${W/2}" y="${H-12}" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626"${rtlAttr}>* ${_csSvgTxt(T('TO BE CONFIRMED'))}</text>`:''}
    <text x="${W-20}" y="${H-12}" text-anchor="end" font-size="10.5" font-weight="700" fill="#64748B">${_csSvgTxt(spec.drawing_number||'')} · FIG. 1</text>
  </svg>`;
}

// Everything drawn along one run: its id and cable, the sleeves and markers
// that sit on it, the dimensioned length, and the cut length when they differ.
function _csRunAnnot(spec, r, xFarEnd, xHubEnd, y, rtlAttr, T, isTrunk, showFormula, marks){
  const seg=r.seg, cut=_csCutLength(seg, spec);
  const len=_csNum(r.len)||0;
  const xa=Math.min(xFarEnd,xHubEnd), xb=Math.max(xFarEnd,xHubEnd);
  const scale=len>0 ? (xb-xa)/len : 0;
  // A distance is measured from a NAMED end, so it has to be laid off from that
  // end's own x — not from whichever end happens to be on the left of the page.
  const dir=xHubEnd>xFarEnd ? 1 : -1;   // +1 when the hub is to the right
  const at=(fromEnd, mm)=>{
    const d=(_csNum(mm)||0)*scale;
    return String(fromEnd||'').toUpperCase()===String(r.far).toUpperCase()
      ? xFarEnd + dir*d          // measured from the far connector, inwards
      : xHubEnd - dir*d;         // measured from the shared end, inwards
  };
  const anchorOf=fromEnd=>String(fromEnd||'').toUpperCase()===String(r.far).toUpperCase() ? xFarEnd : xHubEnd;
  let g=`<text x="${(xa+xb)/2}" y="${y-16}" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">${
    _csSvgTxt(seg.id||'')}${seg.cable_part_number?` · ${_csSvgTxt(seg.cable_part_number)}`:''}</text>`;

  (spec.sleeves||[]).filter(sl=>!sl.segment||sl.segment===seg.id).forEach(sl=>{
    // (sleeves stay per-segment: unlike labels they are always dimensioned)
    const w=Math.max(6,(_csNum(sl.length_mm)||0)*scale);
    // The sleeve starts at its distance and occupies w INWARDS from that end.
    const x0s=at(sl.from_end, sl.distance_mm);
    const inward=(anchorOf(sl.from_end)===xFarEnd) ? dir : -dir;
    const x=inward>0 ? x0s : x0s-w;
    g+=`<rect x="${x.toFixed(1)}" y="${y-11}" width="${w.toFixed(1)}" height="22" fill="url(#csHatch)" stroke="#1E293B" stroke-width="1"/>`;
  });

  const ly=y+46;   // clears the connector part number, which sits at y+30
  g+=`<line x1="${xa}" y1="${ly}" x2="${xb}" y2="${ly}" stroke="#0F172A" stroke-width="1.2" marker-start="url(#csArL)" marker-end="url(#csAr)"/>
      <rect x="${((xa+xb)/2-54)}" y="${ly-12}" width="108" height="19" fill="#fff"/>
      <text x="${((xa+xb)/2).toFixed(1)}" y="${ly+4}" text-anchor="middle" font-size="13" font-weight="800" fill="#0F172A">${
        cut.hasBreakdown&&cut.added!==0 ? cut.finished+' mm' : (_csNum(r.len)!=null?r.len+' mm':'? mm')}</text>`;
  let dimY=ly+24;
  if(cut.hasBreakdown && cut.added!==0){
    g+=`<rect x="${((xa+xb)/2-92)}" y="${dimY-13}" width="184" height="20" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
        <text x="${((xa+xb)/2).toFixed(1)}" y="${dimY+1}" text-anchor="middle" font-size="11" font-weight="700" fill="#7C2D12"${rtlAttr}>${
          _csSvgTxt(T('CUT'))} ${cut.total} mm</text>`;
    dimY+=24;
    // The full sum is printed on the figure only when there is one run to print
    // it for. On a breakout harness four formulas would bury the drawing, and
    // each run's cut-length table carries its own arithmetic anyway.
    if(showFormula){
      g+=`<text x="${((xa+xb)/2).toFixed(1)}" y="${dimY}" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#7C2D12">${_csSvgTxt(_csCutFormula(seg, spec))}</text>`;
      dimY+=22;
    }
  }
  const undim=(marks||[]).filter(m=>_csNum(m.distance_mm)==null);
  (marks||[]).forEach((mk,mi)=>{
    const anchor=anchorOf(mk.from_end), bad=mk.confirmed===false, col=bad?'#DC2626':'#334155';
    let x;
    if(_csNum(mk.distance_mm)==null){
      // No dimension: park it a readable step in from its end, clear of the
      // connector body, and step each further one along so they do not stack.
      const k=undim.indexOf(mk);
      x = anchor + ((anchor===xFarEnd) ? dir : -dir) * (46 + k*30);
    } else {
      x = at(mk.from_end, mk.distance_mm);
    }
    g+=`<rect x="${(x-7).toFixed(1)}" y="${y-13}" width="14" height="26" fill="#fff" stroke="#1E293B" stroke-width="1.2"/>
        <text x="${x.toFixed(1)}" y="${y+4}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0F172A">${_csSvgTxt(mk.label||'')}</text>`;
    if(_csNum(mk.distance_mm)==null){
      // No dimension on the drawing — a tick to the cable plus the placement
      // note in words, so the operator still knows where the label goes.
      g+=`<line x1="${x.toFixed(1)}" y1="${y+13}" x2="${x.toFixed(1)}" y2="${(dimY-9).toFixed(1)}" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>`;
      if(mk.position)
        g+=`<text x="${x.toFixed(1)}" y="${dimY+3}" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309"${rtlAttr}>${
          _csSvgTxt(_csP(mk.position))}</text>`;
      dimY+=20; return;
    }
    g+=`<line x1="${Math.min(anchor,x).toFixed(1)}" y1="${dimY}" x2="${Math.max(anchor,x).toFixed(1)}" y2="${dimY}" stroke="${col}" stroke-width="1" marker-start="url(#csArL)" marker-end="url(#csAr)"/>
        <rect x="${((anchor+x)/2-22).toFixed(1)}" y="${dimY-10}" width="44" height="17" fill="#fff"/>
        <text x="${((anchor+x)/2).toFixed(1)}" y="${dimY+3}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${col}">${_csNum(mk.distance_mm)??'?'}${bad?' *':''}</text>`;
    dimY+=20;
  });
  return g;
}

// Stepped strip profile for one end of one segment. Driven by the segment's layer
// list and its strip dimensions: cuts sorted ascending from the tip give the
// boundary between one layer and the next, so a 3-layer coax draws 3 steps and a
// 2-layer wire draws 2, with no special-casing.
function _csStripSVG(seg, end, spec){
  const T=_csT, rtlAttr=_csRTL()?' direction="rtl"':'';
  const allLayers=(seg?.layers||[]).slice();         // outermost first
  const cuts0=(end?.strip||[]).filter(s=>!s.derived && _csNum(s.value_mm)>0);
  // One cut makes one step, so only as many layers as there are steps can be
  // drawn. A 4-conductor cable listing jacket + shield + insulation but stripped
  // with a single jacket dimension used to draw all three on top of each other;
  // taking the outermost (cuts+1) gives jacket back, shield exposed — which is
  // what removing the jacket actually reveals.
  const layers=allLayers.slice(0, Math.max(2, cuts0.length+1));
  const inner=layers.slice().reverse();              // innermost first
  const cuts=(end?.strip||[]).filter(s=>!s.derived && _csNum(s.value_mm)>0)
                            .map(s=>({code:s.code,mm:_csNum(s.value_mm),confirmed:s.confirmed!==false}))
                            .sort((a,b)=>a.mm-b.mm);
  if(!inner.length || !cuts.length) return '';

  const X_TIP=910, X_BACK=80;
  const maxMM=cuts[cuts.length-1].mm;
  const S=maxMM>0 ? 410/maxMM : 1;
  const maxOD=Math.max(...layers.map(l=>_csNum(l.od_mm)||1), 1);
  const H=72, CY=132;

  let g='', prev=0;
  inner.forEach((layer,i)=>{
    const to = i<cuts.length ? cuts[i].mm : null;
    const xR = X_TIP - prev*S;
    const xL = to==null ? X_BACK : X_TIP - to*S;
    const od = _csNum(layer.od_mm)||maxOD;
    const h  = Math.max(10, H*(od/maxOD));
    const fill = i===0 ? '#FCD34D' : (i===inner.length-1 ? '#CBD5E1' : '#F1F5F9');
    const stroke = i===0 ? '#92400E' : '#475569';
    g+=`<rect x="${xL.toFixed(1)}" y="${(CY-h/2).toFixed(1)}" width="${(xR-xL).toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
    const cx=(xL+xR)/2, above=i%2===1;
    g+=`<text x="${cx.toFixed(1)}" y="${above?(CY-h/2-16):(CY+h/2+20)}" text-anchor="middle" font-size="12" font-weight="700" fill="${i===0?'#92400E':'#1E293B'}"${rtlAttr}>${_csSvgTxt(_csP(layer.name||''))}</text>`;
    if(_csNum(layer.od_mm)!=null)
      g+=`<text x="${cx.toFixed(1)}" y="${above?(CY-h/2-3):(CY+h/2+35)}" text-anchor="middle" font-size="10.5" fill="#475569">Ø ${_csNum(layer.od_mm)} mm</text>`;
    prev = to==null ? prev : to;
  });

  const faceX=[X_TIP, ...cuts.map(c=>X_TIP-c.mm*S)];
  faceX.forEach(x=>{ g+=`<line x1="${x.toFixed(1)}" y1="${CY-H/2-4}" x2="${x.toFixed(1)}" y2="${CY+H/2+4}" stroke="#DC2626" stroke-width="3"/>`; });

  let y=CY+H/2+62;
  cuts.slice().reverse().forEach(c=>{
    const x=X_TIP-c.mm*S, col=c.confirmed?'#0F172A':'#DC2626';
    g+=`<line x1="${x.toFixed(1)}" y1="${y}" x2="${X_TIP}" y2="${y}" stroke="${col}" stroke-width="1.3" marker-start="url(#csAr2L)" marker-end="url(#csAr2)"/>
        <line x1="${x.toFixed(1)}" y1="${CY+H/2+4}" x2="${x.toFixed(1)}" y2="${y+6}" stroke="${col}" stroke-width=".9" stroke-dasharray="3 3"/>
        <rect x="${((x+X_TIP)/2-60).toFixed(1)}" y="${y-13}" width="120" height="22" fill="#fff"/>
        <text x="${((x+X_TIP)/2).toFixed(1)}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="800" fill="${col}">${_csSvgTxt(c.code)} = ${c.mm} mm${c.confirmed?'':' *'}</text>`;
    y+=30;
  });

  // Individual conductors fanning out of the jacket — the thing a crimped
  // multi-conductor harness actually needs and a coax sheet never showed.
  const cs=_csNum(seg?.conductor_strip_mm);
  if(cs>0 && (seg?.conductors||[]).length){
    const n=Math.min(seg.conductors.length,8);
    const x0=X_TIP-cuts[cuts.length-1].mm*S;
    seg.conductors.slice(0,n).forEach((w,i)=>{
      const wy=CY-((n-1)/2)*13 + i*13;
      g+=`<line x1="${x0.toFixed(1)}" y1="${CY}" x2="${(x0+40).toFixed(1)}" y2="${wy.toFixed(1)}" stroke="#94A3B8" stroke-width="2"/>
          <line x1="${(x0+40).toFixed(1)}" y1="${wy.toFixed(1)}" x2="${X_TIP-cs*S}" y2="${wy.toFixed(1)}" stroke="#94A3B8" stroke-width="3"/>
          <line x1="${X_TIP-cs*S}" y1="${wy.toFixed(1)}" x2="${X_TIP}" y2="${wy.toFixed(1)}" stroke="#FCD34D" stroke-width="3"/>
          <text x="${X_TIP+8}" y="${(wy+3.5).toFixed(1)}" font-size="10" font-family="monospace" fill="#475569">${_csSvgTxt(w.color||w.name||'')}</text>`;
    });
    g+=`<line x1="${X_TIP-cs*S}" y1="${CY-((n-1)/2)*13-12}" x2="${X_TIP-cs*S}" y2="${CY+((n-1)/2)*13+12}" stroke="#DC2626" stroke-width="2"/>
        <text x="${(X_TIP-cs*S/2).toFixed(1)}" y="${y+4}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${seg.conductor_strip_confirmed?'#0F172A':'#DC2626'}"${rtlAttr}>${
          _csSvgTxt(T('Each conductor'))}: ${cs} mm${seg.conductor_strip_confirmed?'':' *'}</text>`;
    y+=16;
    // Read off the picture, 8 and 2 look like 10. They are not: the conductor is
    // bared WITHIN the length the jacket already exposes, so it adds nothing to
    // what has to be cut. Saying so on the figure is the difference between a
    // number an operator trusts and one they have to reason about.
    g+=`<text x="${(X_TIP-cs*S/2).toFixed(1)}" y="${y+4}" text-anchor="middle" font-size="10.5" fill="#7C2D12"${rtlAttr}>${
      _csSvgTxt(T('measured inside A — it adds nothing to the cut length'))}</text>`;
    y+=24;
  }

  // The one number this end contributes to the cut length, spelled out exactly as
  // the cut table spells it. Both read the same fields, so they cannot disagree —
  // and now the operator can see that without holding two pages side by side.
  const _ec=(_csCutLength(seg, spec).endCosts||[])
    .find(e=>String(e.ref||'').toUpperCase()===String(end?.ref||'').toUpperCase());
  if(_ec){
    g+=`<rect x="300" y="${y-2}" width="400" height="26" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
        <text x="500" y="${y+15}" text-anchor="middle" font-size="12" font-weight="700" fill="#7C2D12"${rtlAttr}>${
          _csSvgTxt(T('This end adds to the cut length'))}: <tspan font-family="monospace" direction="ltr">${
          _ec.strip} + ${_ec.margin} = ${_ec.mm} mm</tspan></text>`;
    y+=34;
  }

  const h=y+40;
  return `<svg viewBox="0 0 1000 ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Heebo, Public Sans, Arial, sans-serif" direction="ltr">
    <defs>
      <marker id="csAr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0F172A"/></marker>
      <marker id="csAr2L" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#0F172A"/></marker>
    </defs>
    <text x="80" y="34" font-size="15" font-weight="800" fill="#1E293B">${_csSvgTxt(seg?.id||'')} — ${_csSvgTxt(end?.ref||'')}</text>
    ${g}
    <text x="500" y="${h-22}" text-anchor="middle" font-size="11.5" fill="#7F1D1D"${rtlAttr}>${_csSvgTxt(T('Red faces = every cut square to the axis, free of burrs and nicks.'))}</text>
    ${cuts.some(c=>!c.confirmed)||(cs>0&&!seg.conductor_strip_confirmed)
      ? `<text x="500" y="${h-6}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#DC2626"${rtlAttr}>* ${_csSvgTxt(T('TO BE CONFIRMED'))}</text>` : ''}
  </svg>`;
}

// ── Rendering: list ───────────────────────────────────────────────────────────
async function loadCutStripSpecs(force){
  if(csSpecs.length && !force) return csSpecs;
  if(!companyId) return (csSpecs=[]);
  const snap=await getDocs(query(collection(db,'companies',companyId,'cut_strip_specs'),orderBy('updatedAt','desc')));
  // Migrated on read so a spec saved under the old single-cable shape renders
  // through exactly the same code path as one made today.
  csSpecs=snap.docs.map(d=>_csNormalize({_id:d.id, ...d.data()}));
  return csSpecs;
}

function _csTBCCount(spec){
  let n=0;
  _csSegments(spec).forEach(seg=>{
    (seg.ends||[]).forEach(e=>(e.strip||[]).forEach(x=>{ if(x.confirmed===false) n++; }));
    (seg.allowances||[]).forEach(a=>{ if(a.confirmed===false) n++; });
    if(seg.cut_length_tolerance_confirmed===false && _csNum(seg.cut_length_tolerance_mm)!=null) n++;
    if(seg.trim_allowance_confirmed===false && (_csNum(seg.trim_allowance_mm)||0)!==0) n++;
    if(seg.conductor_strip_confirmed===false && _csNum(seg.conductor_strip_mm)!=null) n++;
  });
  (spec.markers||[]).forEach(m=>{ if(m.confirmed===false) n++; });
  return n;
}

  if(!list.length){
    setContent(`<div class="card" style="max-width:640px;margin:30px auto;text-align:center;padding:40px 30px">
      <div style="font-size:44px;margin-bottom:10px">✂️</div>
      <h3 style="margin-bottom:6px">No cut &amp; strip specifications yet</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:20px">

        verbal steps plus scaled diagrams carrying the actual cut, strip and marker dimensions.</p>
      <button class="btn btn-blue" id="btn-cs-new2">＋ New from Drawing</button>
    </div>`);

  }

  setContent(`<div class="card">
    <table class="tbl"><thead><tr>
      <th>Drawing #</th><th>Name</th><th>Project</th><th style="text-align:center">Runs</th>
      <th style="text-align:center">Connectors</th><th style="text-align:center">Unverified dims</th>
      <th>Updated</th><th style="width:150px"></th>
    </tr></thead><tbody>
    ${list.map(s=>{
      const tbc=_csTBCCount(s);
      return `<tr>
        <td style="font-weight:700">${esc(s.drawing_number||s._id)}</td>
        <td class="cs-ltr" style="font-size:12.5px">${esc(s.drawing_name||s.title||'')}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(s.project||'')}</td>
        <td style="text-align:center">${_csSegments(s).length||'—'}</td>
        <td style="text-align:center">${_csConnectors(s).length||'—'}</td>
        <td style="text-align:center">${tbc
            ? `<span style="background:#DC2626;color:#fff;border-radius:3px;padding:2px 8px;font-size:11px;font-weight:700">${tbc} TBC</span>`
            : `<span style="color:#15803D;font-weight:700">✓</span>`}</td>
        <td style="font-size:12px;color:var(--muted)">${s.updatedAt?.toDate ? esc(s.updatedAt.toDate().toLocaleString()) : ''}</td>
        <td style="text-align:right">
          <button class="btn btn-sm btn-blue cs-open" data-id="${esc(s._id)}">Open</button>
          <button class="btn btn-sm btn-ghost cs-del" data-id="${esc(s._id)}">🗑</button>
        </td></tr>`;
    }).join('')}

  document.querySelectorAll('.cs-open').forEach(b=>b.addEventListener('click',async()=>{
    const s=csSpecs.find(x=>x._id===b.dataset.id);
    if(!s) return;
    csCurrent=s; _csEditing=false; _csEditBackup=null;
    // Hebrew is the default, so the translation has to be in hand BEFORE the
    // first paint — otherwise the sheet flashes up half English.
    b.disabled=true; b.textContent=_csT('Translating…');
    await _csEnsureLang(s, _csLang);

  document.querySelectorAll('.cs-del').forEach(b=>b.addEventListener('click',async()=>{
    const s=csSpecs.find(x=>x._id===b.dataset.id);
    if(!s || !confirm(`Delete the cut & strip specification for ${s.drawing_number||s._id}?`)) return;
    try{
      await deleteDoc(doc(db,'companies',companyId,'cut_strip_specs',s._id));
      toast('Specification deleted','success');
      renderCutStrip();
    }catch(e){ toast('Error: '+e.message,'error'); }

function openCSFileModal(){
  showModal(`<div class="modal">
    <div class="modal-head"><h3>New Cut &amp; Strip Specification</h3><button class="close-modal" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="cs-modal-body">
      <div class="drop-zone" id="cs-drop-zone" tabindex="0">
        <span class="icon-big">✂️</span>
        <strong>Drop a cable or harness drawing here</strong>
        <p>PDF / PNG / JPG — one drawing at a time. The analysis reads the cut length, strip dimensions,
           sleeve and marker positions, then builds a bench sheet with diagrams.</p>
        <input type="file" id="cs-file-input" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>
  </div>`);
  const dz=document.getElementById('cs-drop-zone'), fi=document.getElementById('cs-file-input');
  dz.addEventListener('click',()=>fi.click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');
    if(e.dataTransfer.files.length) handleCSFile(e.dataTransfer.files[0]);});
  fi.addEventListener('change',()=>{ if(fi.files.length) handleCSFile(fi.files[0]); });
}

async function handleCSFile(file){
  const body=document.getElementById('cs-modal-body');
  const foot=document.querySelector('#modal-bg .modal-foot');
  const isPDF=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  const isImg=file.type.startsWith('image/');
  if(!isPDF && !isImg){ toast('Drop a PDF or an image of the drawing','error'); return; }

  body.innerHTML=`<div class="ai-status"><div class="ring"></div><span id="cs-msg">Reading drawing…</span></div>
    <div class="progress-bar"><div class="progress-fill" id="cs-prog"></div></div>`;
  if(foot) foot.innerHTML='';
  const setM=(m,p)=>{ const e=document.getElementById('cs-msg'); if(e)e.textContent=m;
                      const b=document.getElementById('cs-prog'); if(b)b.style.width=p+'%'; };

  try{
    let text='', isImage=false, imgData=null, rawImage=null;
    if(isPDF){
      setM('Extracting drawing…',20);
      const {pageTexts,pageImages}=await extractPDFPages(file);
      text=pageTexts.join('\n');
      // Vision on page 1 is the right default here, unlike BOM extraction: the
      // cut length, strip callouts and marker positions live on the assembly
      // view, and reading them needs the picture, not the text layer.
      if(pageImages[0]){
        const small=await _csShrinkJpeg(pageImages[0], _CS_IMG_MAXDIM, _CS_IMG_QUALITY);
        console.log('[CutStrip] drawing image',(pageImages[0].length/1e6).toFixed(2),'MB →',
                    (small.length/1e6).toFixed(2),'MB base64');
        isImage=true; imgData={mimeType:'image/jpeg', b64:small};
        rawImage=pageImages[0];
      }
    } else {
      setM('Reading image…',20);
      imgData=await encodeImage(file); isImage=true;
      rawImage=(imgData && imgData.b64) || null;
    }

    // Generated straight into the display language. No translation pass on the
    // normal path — see _csPrompt for why that matters.
    // Always analysed in Hebrew, whatever the screen is set to. One source
    // language keeps every spec written the same way — comparable, editable in
    // one place, and translated through one path instead of two. English and
    // Russian are translations of it, produced on demand by the language
    // buttons, exactly like each other.
    setM('Analysing cut & strip requirements… a dense drawing can take up to 2 minutes — leave this open',55);
    const spec=await aiAnalyzeCutStrip(text, isImage, imgData, _CS_SOURCE_LANG);
    // The drawing is only kept once the analysis has said where the customer's
    // branding is. No boxes, no stored copy — the sheet says so rather than
    // quietly publishing someone else's logo to the shop floor.
    if(rawImage){
      const img=await _csRefImage(rawImage);
      if(img) spec.source_image=img;
      else spec.source_image_skipped='the drawing could not be prepared for storage — it was too large, or the title block could not be masked';
    }

    // A drawing number is what the sheet is filed and found under. Falling back
    // to the file name is better than an "UNTITLED" doc, but it is recorded as a
    // discrepancy so nobody mistakes the file name for the title-block number.
    if(!String(spec.drawing_number||'').trim()){
      const fromName=file.name.replace(/\.[^.]+$/,'').trim();
      spec.drawing_number=fromName;
      spec.discrepancies.push({what:'No drawing number found in the title block',
        detail:`Filed under the file name "${fromName}". Confirm the real drawing number before this sheet is used.`});
    }
    // The same check the operator would make by eye, done every time: the file
    // name and the title block disagreeing is a common and expensive mix-up.
    const fileStem=file.name.replace(/\.[^.]+$/,'').trim();
    const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(fileStem && norm(fileStem) && !norm(fileStem).includes(norm(spec.drawing_number))
       && !norm(spec.drawing_number).includes(norm(fileStem))){
      spec.discrepancies.push({what:'File name does not match the title block',
        detail:`File is named "${fileStem}" but the title block reads "${spec.drawing_number}". This sheet follows the title block — confirm which is correct before the label is printed.`});
    }

    spec.source_file=file.name;
    spec.spec_no='CS-'+_csDocId(spec.drawing_number)+'-01';

    setM('Saving…',90);
    const id=_csDocId(spec.drawing_number);
    await setDoc(doc(db,'companies',companyId,'cut_strip_specs',id),
      {...spec, updatedAt:serverTimestamp(), createdBy:currentUserEmail||''}, {merge:false});
    logAudit('cut_strip_generated',{drawing:spec.drawing_number, unverified:_csTBCCount(spec)},true);

    csSpecs=[]; await loadCutStripSpecs(true);
    csCurrent=csSpecs.find(s=>s._id===id) || {_id:id, ...spec};
    _csEditing=false; _csEditBackup=null;

    // Only when the operator is reading in something other than the source.
    if(_csLang!==_CS_SOURCE_LANG){
      setM('Translating…',94);
      await _csEnsureLang(csCurrent, _csLang, (n,t)=>setM(`Translating… ${Math.round(n/t*100)}%`, 94+Math.round(n/t*5)));
    }
    closeModal();
    toast(`Specification created for ${spec.drawing_number}`,'success');
    renderCutStripSheet();
  }catch(e){
    console.error('[CutStrip]',e);
    logAudit('cut_strip_generated',{file:file.name, error:e.message},false);
    body.innerHTML=`<div class="card" style="border-color:var(--danger)">
      <strong style="color:var(--danger)">Analysis failed</strong>
      <p style="font-size:13px;margin-top:8px">${esc(e.message)}</p>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">
        Nothing was saved. If the drawing is a scan, a sharper image usually fixes this.</p></div>`;
    if(foot) foot.innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
  }
}

// ── Rendering: the sheet ──────────────────────────────────────────────────────
function _csTBC(){ return `<span class="cs-tag cs-tbc">${esc(_csT('TO BE CONFIRMED'))}</span>`; }
function _csDim(value, confirmed){
  const v=_csNum(value);
  const txt = v==null ? '—' : v+' mm';
  return confirmed===false
    ? `<span style="color:#DC2626;font-weight:700">${esc(txt)}</span> ${_csTBC()}`

// ── Editing ───────────────────────────────────────────────────────────────────
// The single most valuable edit on this screen is an engineer receiving the
// manufacturer's assembly spec, typing the real strip dimension in, and ticking
// Confirmed — at which point the red TBC marking disappears from the table AND
// from the diagrams, because both read the same field. That loop is what turns
// a provisional sheet into a released one, so it has to be two clicks, not a
// re-analysis.
//
// Every editable control carries where it writes back to, so collection is one
// generic pass over the DOM rather than a bespoke reader per field.
let _csEditing=false;
let _csEditBackup=null;   // deep copy taken on entering edit mode, for Cancel

function _csGetPath(o,path){
  return path.split('.').reduce((a,k)=>(a==null?a:a[k]), o);
}
function _csSetPath(o,path,val){
  const p=path.split('.');
  let cur=o;
  for(let i=0;i<p.length-1;i++){ cur=cur[p[i]]; if(cur==null) return false; }
  cur[p[p.length-1]]=val;
  return true;
}

// Renders a value as plain text, or as an input when editing.
function _csFNum(path, value, unit){
  if(!_csEditing) return `<span class="cs-ltr">${esc(_csNum(value)==null?'—':value+(unit||''))}</span>`;
  return `<input class="cs-in cs-in-num" type="number" step="any" data-cs-path="${esc(path)}" data-cs-type="num"
            value="${_csNum(value)==null?'':esc(value)}">${unit?`<span class="cs-unit">${esc(unit)}</span>`:''}`;
}
// Language-independent strings — part numbers, refs, codes, settings. Saved as
// typed, in whatever language the sheet happens to be showing.
function _csFRaw(path, value){
  if(!_csEditing) return esc(value||'');
  return `<input class="cs-in cs-ltr" type="text" data-cs-path="${esc(path)}" data-cs-type="raw" value="${esc(value||'')}">`;
}
// Prose. Displayed translated; edited in whatever language is on screen. See
// _csCollectEdits for where the edit actually lands.
function _csFText(path, source, multiline){
  const shown=_csP(source||'');
  if(!_csEditing) return esc(shown);
  const a=`data-cs-path="${esc(path)}" data-cs-type="text" data-cs-en="${esc(source||'')}"`;
  return multiline
    ? `<textarea class="cs-in" rows="${Math.min(6,Math.max(2,Math.ceil((shown.length||1)/90)))}" ${a}>${esc(shown)}</textarea>`
    : `<input class="cs-in" type="text" ${a} value="${esc(shown)}">`;
}
function _csFChk(path, checked, label){
  if(!_csEditing) return '';
  return `<label class="cs-chk-lbl"><input type="checkbox" data-cs-path="${esc(path)}" data-cs-type="bool"
            ${checked===true?'checked':''}> ${esc(label)}</label>`;
}
function _csDelBtn(act, idx){
  return _csEditing ? `<button class="cs-del-btn" data-cs-act="${esc(act)}" data-cs-idx="${idx}"
    title="${esc(_csT('Remove'))}">✕</button>` : '';
}

// C = A − B and friends. Without this, editing A from 4.0 to 4.5 would leave a
// derived dimension that no longer adds up, and the sheet would quietly
// contradict its own arithmetic — exactly the kind of error a work instruction
// must never contain.
function _csRecomputeDerived(end){
  const rows=end.strip||[];
  const real=rows.filter(r=>!r.derived && _csNum(r.value_mm)!=null)
                 .map(r=>_csNum(r.value_mm)).sort((a,b)=>b-a);
  if(real.length<2) return;
  rows.filter(r=>r.derived).forEach(r=>{
    r.value_mm = Math.round((real[0]-real[1])*1000)/1000;
    // A derived value is only as trustworthy as the values it came from.
    r.confirmed = rows.filter(x=>!x.derived).every(x=>x.confirmed===true);
  });
}

// One pass over the DOM, writing every control back into csCurrent.
function _csCollectEdits(){
  const spec=csCurrent; if(!spec) return;
  spec.overrides = spec.overrides || {};
  document.querySelectorAll('#cs-sheet [data-cs-path]').forEach(el=>{
    const path=el.dataset.csPath, type=el.dataset.csType;
    if(type==='bool'){ _csSetPath(spec, path, !!el.checked); return; }
    if(type==='num'){
      const v=el.value.trim();
      _csSetPath(spec, path, v==='' ? null : (Number.isFinite(parseFloat(v))?parseFloat(v):null));
      return;
    }
    if(type==='raw'){ _csSetPath(spec, path, el.value.trim()); return; }
    // type === 'text'
    const src=el.dataset.csEn||'';                 // the STORED text this field renders
    const val=(el.value!=null?el.value:el.textContent).trim();
    if(_csLang===_csSrcLang(spec)){
      // Editing in the language the spec is written in — this IS the source, so
      // write it straight through.
      if(val===src) return;
      _csSetPath(spec, path, val);
      // The old source string is gone, so any translation stored against it is
      // orphaned. Drop it rather than shipping wording that can never be reached.
      ['he','ru','en'].forEach(L=>{ if(spec.overrides[L]) delete spec.overrides[L][src]; });
    } else {
      // Editing a translation — keep the source intact and save the corrected
      // wording against it, so the fix survives re-opening.
      if(val===_csP(src)) return;
      (spec.overrides[_csLang] = spec.overrides[_csLang] || {})[src] = val;
    }
  });
  _csSegments(spec).forEach(seg=>(seg.ends||[]).forEach(_csRecomputeDerived));
  _csSyncCutLength(spec);
}

function _csEnterEdit(){
  _csEditBackup=JSON.parse(JSON.stringify(csCurrent));
  _csEditing=true;
  renderCutStripSheet();
}
function _csCancelEdit(){
  if(_csEditBackup) csCurrent=_csEditBackup;
  _csEditBackup=null; _csEditing=false;
  renderCutStripSheet();
}
async function _csSaveSpec(){
  const btn=document.getElementById('btn-cs-save');
  if(btn){ btn.disabled=true; btn.textContent=_csT('Saving…'); }
  try{
    _csCollectEdits();
    const {_id, ...body}=csCurrent;
    await setDoc(doc(db,'companies',companyId,'cut_strip_specs',_id),
      {...body, edited_by:currentUserEmail||'', edited_at:new Date().toISOString(),
       updatedAt:serverTimestamp()}, {merge:false});
    csCurrent.edited_by=currentUserEmail||'';
    csCurrent.edited_at=new Date().toISOString();
    logAudit('cut_strip_edited',{drawing:csCurrent.drawing_number, unverified:_csTBCCount(csCurrent)},true);
    csSpecs=[];                       // list is now stale
    _csEditBackup=null; _csEditing=false;
    toast('Specification saved','success');
    renderCutStripSheet();
  }catch(e){
    logAudit('cut_strip_edited',{drawing:csCurrent?.drawing_number, error:e.message},false);
    toast('Save failed: '+e.message,'error');
    // Deliberately stays in edit mode — dropping the user's unsaved changes
    // because the network hiccuped would be worse than the failed save.
    if(btn){ btn.disabled=false; btn.textContent='💾 '+_csT('Save'); }
  }
}

// ── PDF export ────────────────────────────────────────────────────────────────
// html2canvas + jsPDF rather than a text-drawing PDF library, specifically
// because of the Hebrew and Russian views: rasterising the already-correct DOM
// keeps RTL, bidi and the SVG diagrams exactly as they appear on screen, which
// text-drawing libraries handle badly or not at all. Both are ~700 KB, so they
// load only when someone actually exports.
let _csPdfPromise=null;
function _csLoadPdfLibs(){
  if(window.html2canvas && window.jspdf) return Promise.resolve();
  if(_csPdfPromise) return _csPdfPromise;
  const one=src=>new Promise((res,rej)=>{
    const el=document.createElement('script'); el.src=src;
    el.onload=res; el.onerror=()=>rej(new Error('Could not load the PDF library — check your connection'));
    document.head.appendChild(el);
  });
  _csPdfPromise=Promise.all([
    window.html2canvas?Promise.resolve():one('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    window.jspdf?Promise.resolve():one('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
  ]).then(()=>{
    if(!window.html2canvas||!window.jspdf) throw new Error('PDF libraries failed to initialise');
  });
  return _csPdfPromise;
}
async function _csExportPDF(){
  const btn=document.getElementById('btn-cs-pdf');
  const sheet=document.getElementById('cs-sheet');
  if(!sheet) return;
  const old=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  // html2canvas measures SVGs by their width/height ATTRIBUTES, not by CSS.
  // These are sized with width:100% and only a viewBox, so without this they
  // rasterise at their intrinsic size — or not at all. Stamped before the
  // capture and stripped again after, so the on-screen layout is untouched.
  const svgs=[...sheet.querySelectorAll('svg')];
  const stamped=svgs.map(s=>{
    const r=s.getBoundingClientRect();
    const had=s.hasAttribute('width');
    if(!had){ s.setAttribute('width', Math.round(r.width)); s.setAttribute('height', Math.round(r.height)); }
    return had;
  });
  try{
    await _csLoadPdfLibs();
    const canvas=await html2canvas(sheet,{scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const M=8, iw=pw-M*2;
    const ih=canvas.height*iw/canvas.width;             // full image height in mm
    const pageH=ph-M*2;
    const pages=Math.max(1, Math.ceil(ih/pageH));
    const sliceCanvasH=Math.floor(canvas.height*pageH/ih);
    for(let p=0;p<pages;p++){
      if(p) pdf.addPage();
      const sy=p*sliceCanvasH;
      const sh=Math.min(sliceCanvasH, canvas.height-sy);
      const slice=document.createElement('canvas');
      slice.width=canvas.width; slice.height=sh;
      slice.getContext('2d').drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
      pdf.addImage(slice.toDataURL('image/jpeg',0.92),'JPEG',M,M,iw, sh*iw/canvas.width);
      pdf.setFontSize(8); pdf.setTextColor(120);
      pdf.text(`${_csT('Page')} ${p+1} ${_csT('of')} ${pages}`, pw-M, ph-3, {align:'right'});
    }
    const dwg=(csCurrent?.drawing_number||'spec').replace(/[^A-Za-z0-9._-]+/g,'_');
    pdf.save(`${dwg}_cut_and_strip.pdf`);
    toast('PDF exported','success');
  }catch(e){
    console.error('[CutStrip PDF]',e);
    toast('PDF export failed: '+e.message,'error');
  }finally{
    svgs.forEach((s,i)=>{ if(!stamped[i]){ s.removeAttribute('width'); s.removeAttribute('height'); } });
    if(btn){ btn.disabled=false; btn.textContent=old; }
  }
}

</script>
</body>
