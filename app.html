<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecPrice</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sidebar-w: 220px;
      --topbar-h: 52px;
      --blue-dark:  #1F3A5F;
      --blue-mid:   #2E75B6;
      --blue-light: #EBF3FB;
      --text:       #1A202C;
      --muted:      #718096;
      --border:     #CBD5E0;
      --green:      #1B6B3A;
      --green-bg:   #D4EDDA;
      --red:        #9B1C1C;
      --red-bg:     #FDE8E8;
      --row-alt:    #F0F6FB;
    }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ── Splash ── */
    #splash { position:fixed; inset:0; background:var(--blue-dark); display:flex; align-items:center;
              justify-content:center; flex-direction:column; gap:16px; z-index:999; }
    #splash h1 { color:#fff; font-size:22px; font-weight:700; }
    .ring { width:34px; height:34px; border:3px solid rgba(255,255,255,.2); border-top-color:#fff;
            border-radius:50%; animation:spin .8s linear infinite; }

    /* ── Shell ── */
    #shell { display:flex; height:100vh; }
    /* The old persistent-sidebar CSS (aside/.sb-brand/.sb-company/.nav-item/
       .sb-foot/#user-email-sb/.btn-signout) was removed along with the
       sidebar itself when the app moved to the role-gated Home-screen hub
       model — the Home screen's Sign Out button uses .btn/.btn-ghost. */

    /* ── Main ── */
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .topbar { height:var(--topbar-h); background:#fff; border-bottom:1px solid var(--border);
              display:flex; align-items:center; padding:0 18px; gap:10px; flex-shrink:0; }
    .topbar h2 { font-size:15px; font-weight:700; color:var(--blue-dark); flex:1; }
    #content { flex:1; overflow:auto; padding:18px; background:#F7FAFC; }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border:none;
           border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:opacity .12s; }
    .btn:hover:not(:disabled) { opacity:.85; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-blue   { background:var(--blue-mid); color:#fff; }
    .btn-green  { background:#1F8B4C; color:#fff; }
    .btn-red    { background:#E53E3E; color:#fff; }
    .btn-ghost  { background:var(--blue-light); color:var(--blue-dark); }
    .btn-purple { background:#7C3AED; color:#fff; }
    .btn-sm     { padding:4px 9px; font-size:11px; }

    /* ── Toolbar ── */
    .toolbar { display:flex; align-items:center; gap:9px; margin-bottom:13px; flex-wrap:wrap; }
    .search-box { flex:1; min-width:200px; padding:7px 11px; border:1.5px solid var(--border);
                  border-radius:7px; font-size:13px; outline:none; color:var(--text); }
    .search-box:focus { border-color:var(--blue-mid); box-shadow:0 0 0 3px rgba(46,117,182,.1); }
    .count-badge { font-size:11px; color:var(--muted); white-space:nowrap; }

    /* ── Search clear (✕) button ── */
    .search-wrap { position:relative; flex:1; min-width:200px; }
    .search-wrap .search-box { width:100%; min-width:0; padding-right:28px; }
    .search-clear { position:absolute; right:4px; top:50%; transform:translateY(-50%);
                     background:none; border:none; color:var(--muted); cursor:pointer;
                     font-size:13px; padding:4px 6px; border-radius:4px; line-height:1;
                     display:none; align-items:center; justify-content:center; }
    .search-clear:hover { background:var(--blue-light); color:var(--text); }
    .search-clear.show { display:flex; }

    /* ── Tables ── */
    /* Bounded so the box itself scrolls internally once rows overflow it — this is what
       makes `thead th { position:sticky }` below actually stick (a sticky element only
       sticks within its nearest ancestor that truly scrolls; with no height cap here the
       box just grows forever and the whole page scrolls instead, taking the toolbar/search
       row and header along with it). Modals that embed a table override this max-height
       inline with their own (smaller) value — this default only applies to the main
       Part Stock / RFQ BOM table views. */
    .table-wrap { overflow:auto; border-radius:8px; border:1px solid var(--border); background:#fff;
                  scrollbar-width:auto; max-height:calc(100vh - 250px); }
    .table-wrap::-webkit-scrollbar { height:12px; width:12px; }
    .table-wrap::-webkit-scrollbar-track { background:#EDF2F7; }
    .table-wrap::-webkit-scrollbar-thumb { background:var(--blue-mid); border-radius:6px; border:2px solid #EDF2F7; }
    .table-wrap::-webkit-scrollbar-thumb:hover { background:var(--blue-dark); }
    .tbl-scroll-btn { background:var(--blue-light); color:var(--blue-dark); border:1px solid var(--border);
                       border-radius:6px; width:28px; height:28px; cursor:pointer; font-size:13px;
                       flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
    .tbl-scroll-btn:hover { background:var(--blue-mid); color:#fff; }
    .pager { display:flex; align-items:center; gap:5px; margin-top:10px; flex-wrap:wrap; }
    .pager-btn { min-width:28px; padding:0 6px; }
    .pager-btn.pager-active { background:var(--blue-mid); color:#fff; }
    .pager-ellipsis { color:var(--muted); padding:0 3px; font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:12.5px; }
    thead th { position:sticky; top:0; z-index:2; background:var(--blue-mid); color:#fff;
               font-weight:600; padding:7px 9px; text-align:left; white-space:nowrap;
               cursor:pointer; user-select:none; border-right:1px solid rgba(255,255,255,.25); }
    thead th:last-child { border-right:none; }
    thead th:hover { background:#1F5B92; }
    thead th.col-dragging { opacity:.4; }
    thead th.col-drop-target { box-shadow:inset 0 0 0 2px #fff; }
    tbody tr:nth-child(odd)  { background:#FFFFFF; }
    tbody tr:nth-child(even) { background:var(--row-alt); }
    tbody tr:hover { background:#D6EAF8 !important; }
    td { padding:5px 9px; border-bottom:1px solid #EDF2F7; border-right:1px solid #E2E8F0;
         white-space:nowrap; vertical-align:middle; }
    td:last-child { border-right:none; }
    td.wrap { white-space:normal; max-width:240px; line-height:1.3; }
    td[contenteditable="true"] { outline:2px solid var(--blue-mid); outline-offset:-2px;
                                  background:#FFFDE7 !important; min-width:60px; }
    .price-green { color:var(--green); background:var(--green-bg); font-weight:600;
                   border-radius:4px; padding:1px 6px; }
    .price-red   { color:var(--red);   background:var(--red-bg);   font-weight:600;
                   border-radius:4px; padding:1px 6px; }
    .empty-row td { text-align:center; padding:40px; color:var(--muted); border-right:none; }

    /* ── Cards ── */
    .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
    .rfq-card { background:#fff; border:1px solid var(--border); border-radius:9px;
                padding:14px 16px; cursor:pointer; transition:box-shadow .12s, border-color .12s;
                animation:fadeIn .2s; display:flex; align-items:flex-start; gap:12px; }
    .rfq-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); border-color:var(--blue-mid); }
    .rfq-card-body { flex:1; min-width:0; }
    .rfq-card h3 { font-size:13px; font-weight:700; color:var(--blue-dark);
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rfq-card p  { font-size:11px; color:var(--muted); margin-top:3px; }
    .rfq-card-icon { font-size:24px; flex-shrink:0; }

    /* ── Back / Breadcrumb ── */
    .breadcrumb { display:flex; align-items:center; gap:6px; margin-bottom:13px; font-size:12px; }
    .breadcrumb a { color:var(--blue-mid); cursor:pointer; }
    .breadcrumb a:hover { text-decoration:underline; }
    .breadcrumb span { color:var(--muted); }

    /* ── Drop zone ── */
    .drop-zone { border:2px dashed var(--border); border-radius:10px; padding:40px 20px;
                 text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
    .drop-zone:hover, .drop-zone.dragover { border-color:var(--blue-mid); background:var(--blue-light); }
    .drop-zone p { color:var(--muted); font-size:13px; margin-top:8px; }
    .drop-zone .icon-big { font-size:40px; display:block; margin-bottom:8px; }

    /* ── Cut & Strip specification sheet ──────────────────────────────────────
       Deliberately styled like a controlled document rather than like the rest
       of the app: this page gets printed and taped to a bench, so it has to read
       the same on paper as on screen. Everything is scoped under .cs-sheet so it
       can't leak into the other views. */
    .cs-sheet { max-width:1080px; margin:0 auto 40px; background:#fff; color:#0F172A;
                font-size:15px; line-height:1.6;
                box-shadow:0 1px 3px rgba(0,0,0,.10), 0 6px 24px rgba(0,0,0,.06); }
    .cs-pad { padding:0 34px; }
    .cs-banner { background:repeating-linear-gradient(135deg,#FDE68A,#FDE68A 14px,#FCD34D 14px,#FCD34D 28px);
                 color:#78350F; font-weight:800; font-size:12.5px; text-align:center;
                 padding:10px 34px; border-bottom:2px solid #B45309; }
    .cs-tb { display:grid; grid-template-columns:1.5fr 1fr; border-bottom:3px solid #1E293B; }
    .cs-tb-l { padding:22px 34px 18px; }
    .cs-tb-r { padding:18px 26px; background:#F8FAFC; }
    .cs-sheet[dir="ltr"] .cs-tb-r { border-left:1px solid #E4E5E7; }
    .cs-sheet[dir="rtl"] .cs-tb-r { border-right:1px solid #E4E5E7; }
    .cs-doc-t { font-size:24px; font-weight:800; letter-spacing:-.01em; }
    .cs-doc-s { font-size:14px; color:#334155; margin-top:3px; }
    .cs-kv { display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:13px; margin:0; }
    .cs-kv dt { color:#334155; font-weight:500; }
    .cs-kv dd { margin:0; font-weight:700; }
    .cs-h2 { font-size:13px; font-weight:800; color:#fff; background:#1E293B;
             padding:8px 34px; margin:30px 0 16px; }
    .cs-sheet[dir="ltr"] .cs-n { opacity:.55; margin-right:11px; font-family:monospace; }
    .cs-sheet[dir="rtl"] .cs-n { opacity:.55; margin-left:11px; font-family:monospace;
                                 direction:ltr; display:inline-block; }
    .cs-h3 { font-size:15px; font-weight:700; margin:22px 0 8px; }
    /* Part numbers, dimensions and codes must not be reordered by the bidi
       algorithm when the sheet is shown in Hebrew — an SMP part number printed
       backwards is a wrong part number. */
    /* THE table bug. This class exists to hold a Latin part number upright inside
       Hebrew text, and it was doing that with display:inline-block. Put it on a
       <td> — which 65 cells in the sheet do — and the cell stops being a table
       cell: the row falls apart and every cell lands on its own line, keeping its
       column but dropping a step each time. unicode-bidi:isolate already does the
       whole job on any display type, so the display override goes, and the cells
       that need it get it explicitly. */
    .cs-ltr { direction:ltr; unicode-bidi:isolate;
              font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
    span.cs-ltr, b.cs-ltr, i.cs-ltr { display:inline-block; }
    .cs-tbl td.cs-ltr, .cs-tbl th.cs-ltr { display:table-cell; }
    .cs-ctr { text-align:center; }
    .cs-tbl { width:100%; border-collapse:collapse; font-size:13px;
              table-layout:fixed; }
    /* Long part numbers and formulas wrap inside their own cell instead of
       widening it past the header it belongs under. */
    .cs-tbl td, .cs-tbl th { overflow-wrap:anywhere; word-break:break-word; }
    /* A dimension must never break across two lines — "190" above "mm" reads as
       two numbers. */
    .cs-tbl td.cs-nowrap { white-space:nowrap; }
    /* The strip codes now live inline with their description instead of in a
       column of their own, which was pushing every row onto two lines. */
    .cs-code { display:inline-block; min-width:18px; padding:1px 5px; margin-inline-end:5px;
               background:#1E293B; color:#fff; border-radius:3px; font:700 11px/1.5 monospace;
               text-align:center; direction:ltr; }
    .cs-tbl th { background:#F1F2F3; padding:8px 10px; font-weight:700; font-size:12px;
                 color:#334155; border:1px solid #E4E5E7; }
    .cs-sheet[dir="ltr"] .cs-tbl th { text-align:left; }
    .cs-sheet[dir="rtl"] .cs-tbl th { text-align:right; }
    .cs-tbl td { padding:8px 10px; border:1px solid #E4E5E7; vertical-align:top; }
    .cs-tbl tr:nth-child(even) td { background:#FBFCFD; }
    .cs-note { font-size:12.5px; color:#334155; margin-top:7px; }
    /* The one number the operator acts on. */
    .cs-tbl tr.cs-cut-row td { background:#FEF3C7 !important; border-top:2px solid #B45309; }
    @media print { .cs-tbl tr.cs-cut-row td { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
    .cs-box { padding:14px 18px; margin:0 0 16px; font-size:14px; }
    .cs-sheet[dir="ltr"] .cs-box { border-left:4px solid; }
    .cs-sheet[dir="rtl"] .cs-box { border-right:4px solid; }
    .cs-box b { display:block; margin-bottom:5px; font-weight:800; }
    .cs-box p { margin:0; }
    .cs-box ul { margin:8px 0 0; padding-inline-start:20px; padding-inline-end:0; }
    .cs-box li { margin:4px 0; }
    .cs-stop { border-color:#DC2626; background:#FEE2E2; color:#7F1D1D; }
    .cs-warn { border-color:#B45309; background:#FEF3C7; color:#78350F; }
    .cs-tag { display:inline-block; font-family:ui-monospace,Menlo,Consolas,monospace;
              font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:3px;
              white-space:nowrap; direction:ltr; }
    .cs-tbc { background:#DC2626; color:#fff; }
    .cs-dim { background:#DBEAFE; color:#1D4ED8; border:1px solid #93C5FD; }
    .cs-fig { margin:0 0 20px; border:1px solid #E4E5E7; background:#fff; }
    .cs-fig svg { display:block; width:100%; height:auto; }
    .cs-step { display:grid; grid-template-columns:40px 1fr; gap:15px;
               padding:15px 0; border-top:1px solid #E4E5E7; }
    .cs-step:last-child { border-bottom:1px solid #E4E5E7; }
    .cs-step-n { width:34px; height:34px; border-radius:50%; background:#1E293B; color:#fff;
                 display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
    .cs-step h4 { margin:0 0 4px; font-size:15px; font-weight:700; }
    .cs-crit { margin-top:7px; color:#B91C1C; font-weight:600; font-size:13.5px; }
    .cs-chk { list-style:none; padding:0; margin:0; font-size:14px; }
    .cs-chk li { display:grid; grid-template-columns:20px 1fr; gap:11px;
                 padding:8px 0; border-bottom:1px dashed #E4E5E7; }
    .cs-b { width:15px; height:15px; border:2px solid #334155; margin-top:4px; }
    .cs-sig { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:26px; }
    .cs-sig div { border-top:1px solid #1E293B; padding-top:7px; font-size:12px;
                  color:#334155; font-weight:600; min-height:56px; }
    .cs-foot { margin-top:28px; padding:12px 0 26px; border-top:1px solid #E4E5E7;
               font-size:11.5px; color:#334155; display:flex; justify-content:space-between; gap:18px; }

    /* ── Edit mode ── */
    .cs-edit-bar { background:#EFF6FF; border-bottom:1px solid #BFDBFE; color:#1E3A8A;
                   padding:10px 34px; font-size:12.5px; display:flex; flex-wrap:wrap;
                   align-items:center; gap:6px 16px; }
    .cs-edit-bar b { font-weight:800; }
    .cs-edit-lang { opacity:.8; font-style:italic; }
    .cs-in { font:inherit; font-size:13px; color:#0F172A; background:#fff;
             border:1px solid #93C5FD; border-radius:4px; padding:4px 7px; width:100%;
             box-sizing:border-box; }
    .cs-in:focus { outline:2px solid #2563EB; outline-offset:-1px; border-color:#2563EB; }
    textarea.cs-in { resize:vertical; line-height:1.45; }
    .cs-in-num { width:88px; direction:ltr; text-align:center;
                 font-family:ui-monospace,Menlo,Consolas,monospace; }
    .cs-unit { font-size:12px; color:#334155; margin-inline-start:4px; }
    .cs-chk-lbl { display:inline-flex; align-items:center; gap:5px; font-size:12px;
                  color:#15803D; font-weight:700; margin-inline-start:8px; cursor:pointer;
                  white-space:nowrap; }
    .cs-chk-lbl input { cursor:pointer; }
    .cs-del-btn { border:1px solid #FCA5A5; background:#FEF2F2; color:#B91C1C;
                  border-radius:4px; font-size:11px; line-height:1; padding:3px 6px;
                  cursor:pointer; margin-inline-end:7px; }
    .cs-del-btn:hover { background:#DC2626; color:#fff; border-color:#DC2626; }
    /* An in-progress edit must never reach paper. */
    @media print { .cs-edit-bar, .cs-del-btn, .cs-chk-lbl { display:none !important; } }
    /* A row split across two sheets of paper is a row an operator reads wrong:
       the part number at the bottom of one page, its dimension at the top of the
       next. Keep rows whole, keep a heading with the table it introduces, and
       repeat the header on every page a long table spans. */
    @media print {
      .cs-tbl { page-break-inside:auto; break-inside:auto; }
      .cs-tbl tr { page-break-inside:avoid; break-inside:avoid; }
      .cs-tbl thead { display:table-header-group; }
      .cs-tbl tfoot { display:table-footer-group; }
      .cs-h2, .cs-h3 { page-break-after:avoid; break-after:avoid; }
      .cs-fig, .cs-box { page-break-inside:avoid; break-inside:avoid; }
    }

    /* Printing the sheet must produce the sheet and nothing else — no topbar,
       no Support button, no shadows eating toner. */
    @media print {
      body { background:#fff; }
      .topbar, .home-btn-grid, #btn-support-fab, #modal-bg, .breadcrumb { display:none !important; }
      .cs-sheet { box-shadow:none; margin:0; max-width:none; }
      .cs-h2 { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .cs-box, .cs-banner, .cs-tag, .cs-step-n, .cs-tbl th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .cs-step, .cs-fig, .cs-chk li { break-inside:avoid; page-break-inside:avoid; }
      .cs-h2 { break-after:avoid; page-break-after:avoid; }
    }

    /* ── Modal ── */
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex;
                align-items:center; justify-content:center; z-index:200;
                animation:fadeIn .15s; }
    .modal { background:#fff; border-radius:12px; width:min(94vw,860px);
             max-height:90vh; display:flex; flex-direction:column;
             box-shadow:0 24px 64px rgba(0,0,0,.3); overflow:hidden; }
    .modal-sm { width:min(94vw,420px); }
    .modal-head { padding:16px 20px; border-bottom:1px solid var(--border);
                  display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .modal-head h3 { font-size:15px; font-weight:700; color:var(--blue-dark); flex:1; }
    .modal-body { padding:20px; overflow-y:auto; flex:1; }
    .modal-foot { padding:12px 20px; border-top:1px solid var(--border);
                  display:flex; gap:8px; justify-content:flex-end; flex-shrink:0; }
    .close-modal { background:none; border:none; font-size:18px; cursor:pointer;
                   color:var(--muted); line-height:1; padding:2px 4px; }
    .close-modal:hover { color:var(--text); }

    /* ── Form ── */
    .form-field { margin-bottom:14px; }
    .form-field label { display:block; font-size:11px; font-weight:700; color:var(--muted);
                        text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
    .form-input { width:100%; padding:8px 11px; border:1.5px solid var(--border);
                  border-radius:7px; font-size:13px; outline:none; }
    .form-input:focus { border-color:var(--blue-mid); }

    /* ── Sales Desk ── */
    .sd-split { display:grid; grid-template-columns:1fr 300px; gap:14px; height:calc(100vh - 110px); }
    .sd-panel { background:#fff; border:1px solid var(--border); border-radius:9px;
                display:flex; flex-direction:column; overflow:hidden; }
    /* Same look as .sd-panel but WITHOUT the mobile max-height/overflow:hidden
       behavior below — .sd-panel's mobile constraint is meant for the Sales Desk
       BOM-items panel (which has its own internal .sd-scroll region), and was
       clipping content (e.g. the Save Settings button) when reused on the
       Settings page, whose panels can be taller than 60vh and have no inner
       scroll region of their own. */
    .settings-panel { background:#fff; border:1px solid var(--border); border-radius:9px; }
    .sd-panel-title { padding:9px 13px; font-size:12px; font-weight:700;
                      color:var(--blue-dark); background:var(--blue-light);
                      border-bottom:1px solid var(--border); flex-shrink:0; }
    .sd-scroll { flex:1; overflow:auto; }
    .summary-row { display:flex; justify-content:space-between; padding:7px 13px;
                   font-size:12px; border-bottom:1px solid #EDF2F7; }
    .summary-total { background:var(--blue-dark); color:#fff; padding:11px 13px;
                     display:flex; justify-content:space-between; font-weight:700; font-size:13px; }

    /* ── Suggest dropdown ── */
    .suggest-wrap { position:relative; flex:1; }
    .suggest-list { position:absolute; top:100%; left:0; right:0; background:#fff;
                    border:1px solid var(--border); border-radius:7px;
                    box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:50; max-height:260px;
                    overflow-y:auto; animation:fadeIn .1s; }
    .suggest-item { padding:8px 12px; cursor:pointer; border-bottom:1px solid #EDF2F7;

const SEED_ROLE_VIEWS = {

const ROLES_META_DOC = '_meta';

// That is what lets a deleted role stay deleted instead of reappearing on the

function _mergedRoleKeys(){

  else if(currentView==='admin'){

  }
}

// ── Resizable columns ──────────────────────────────────────────────────────
function makeTableResizable(table){
  if(!table) return;
  table.querySelectorAll('thead th').forEach((th,ci)=>{
    if(th.querySelector('.col-resizer')) return;
    const r=document.createElement('div');
    r.className='col-resizer';
    r.draggable=false;
    r.addEventListener('dragstart',e=>e.preventDefault());
    th.appendChild(r);
    r.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();});
    let x0=0,w0=0,dragged=false;
    r.addEventListener('mousedown',e=>{
      x0=e.clientX; w0=th.getBoundingClientRect().width; dragged=false;
      const move=ev=>{
        dragged=true;
        const w=Math.max(40,w0+ev.clientX-x0);
        th.style.minWidth=w+'px'; th.style.width=w+'px';
      };
      const up=()=>{
        document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        if(dragged){
          const finalW=th.offsetWidth;
          table.querySelectorAll(`tbody tr > *:nth-child(${ci+1})`).forEach(td=>{
            td.style.whiteSpace='normal';
            td.style.maxWidth=finalW+'px';
            td.style.lineHeight='1.35';
          });
          // The mouseup that ends a drag almost never lands back on the thin
          // resizer strip — it lands on the header cell itself, so the browser
          // fires a native "click" on the th right after this handler returns,
          // which would otherwise trigger a column sort and wipe the resize on
          // re-render. Swallow that one trailing click.
          const suppressClick=ce=>{
            ce.stopPropagation(); ce.preventDefault();
            document.removeEventListener('click',suppressClick,true);
          };
          document.addEventListener('click',suppressClick,true);
          setTimeout(()=>document.removeEventListener('click',suppressClick,true),0);
        }
      };
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
      e.preventDefault(); e.stopPropagation();
    });
  });
}

// ── Column order persistence (per browser) ────────────────────────────────
function loadColOrder(storageKey, defaultCols){
  try{
    const saved=JSON.parse(localStorage.getItem('colOrder_'+storageKey)||'null');
    if(Array.isArray(saved) && saved.length){
      const byKey=Object.fromEntries(defaultCols.map(c=>[c.k,c]));
      const ordered=saved.filter(k=>byKey[k]).map(k=>byKey[k]);
      // A column added since the user last dragged their layout used to be
      // appended at the far RIGHT. That silently broke pairings that only make
      // sense side by side — Mouser Stock ended up nowhere near Mouser Price.
      // Insert each new column after the neighbour it follows by default, so a
      // saved layout keeps the user's choices AND stays coherent.
      defaultCols.forEach((c,di)=>{
        if(saved.includes(c.k)) return;
        const prev = di>0 ? defaultCols[di-1].k : null;
        const at = prev ? ordered.findIndex(o=>o.k===prev) : -1;
        if(at>=0) ordered.splice(at+1, 0, c);
        else ordered.splice(Math.min(di, ordered.length), 0, c);
      });
      if(ordered.length===defaultCols.length) return ordered;
    }
  }catch{}
  return defaultCols;
}
function saveColOrder(storageKey, cols){
  try{ localStorage.setItem('colOrder_'+storageKey, JSON.stringify(cols.map(c=>c.k))); }catch{}
}
// Makes <th data-col="..."> headers in `table` drag-reorderable; on drop, reorders
// `cols` (array of {k,l,...}), persists the new order under storageKey, and calls
// rerenderFn() so the table redraws with the new column order.
function makeColumnsReorderable(table, storageKey, cols, rerenderFn){
  if(!table) return;
  table.querySelectorAll('thead th[data-col]').forEach(th=>{
    th.draggable=true;
    th.addEventListener('dragstart',e=>{
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', th.dataset.col);
      th.classList.add('col-dragging');
    });
    th.addEventListener('dragend',()=>th.classList.remove('col-dragging'));
    th.addEventListener('dragover',e=>{ e.preventDefault(); th.classList.add('col-drop-target'); });
    th.addEventListener('dragleave',()=>th.classList.remove('col-drop-target'));
    th.addEventListener('drop',e=>{
      e.preventDefault(); e.stopPropagation();
      th.classList.remove('col-drop-target');
      const fromKey=e.dataTransfer.getData('text/plain');
      const toKey=th.dataset.col;
      if(!fromKey||fromKey===toKey) return;
      const newCols=[...cols];
      const fromIdx=newCols.findIndex(c=>c.k===fromKey);
      const toIdx=newCols.findIndex(c=>c.k===toKey);
      if(fromIdx<0||toIdx<0) return;
      const [moved]=newCols.splice(fromIdx,1);
      newCols.splice(toIdx,0,moved);
      saveColOrder(storageKey,newCols);
      rerenderFn();
    });
  });
}

// Wires a "✕" clear button next to a search input (both passed by id): shows the
// button only while the input has text, and clicking it empties the input, fires a
// synthetic 'input' event (so the existing debounced filter/search listener re-runs),
// and refocuses the field.
function wireSearchClear(inputId, clearId){
  const inp=document.getElementById(inputId), clearBtn=document.getElementById(clearId);
  if(!inp||!clearBtn) return;
  const sync=()=>clearBtn.classList.toggle('show', !!inp.value);
  sync();
  inp.addEventListener('input', sync);
  clearBtn.addEventListener('click', ()=>{
    inp.value='';
    inp.dispatchEvent(new Event('input',{bubbles:true}));
    inp.focus();
  });
}
// Shift-click range selection for a table's row checkboxes: click one checkbox, then
// shift-click another — every checkbox in between (inclusive) is set to match the
// checked state of the one just clicked. Uses event delegation on `container` so it
// keeps working across re-renders of the checkboxes inside it (e.g. Sales Desk rows
// re-rendered by renderSD()) without needing to be re-wired each time.
function wireShiftCheck(container, checkboxSelector){
  if(!container) return;
  let lastIdx=null;
  container.addEventListener('click',e=>{
    const cb=e.target.closest(checkboxSelector);
    if(!cb) return;
    const all=[...container.querySelectorAll(checkboxSelector)];
    const idx=all.indexOf(cb);
    if(e.shiftKey && lastIdx!==null && idx>=0){
      const [from,to]=lastIdx<idx?[lastIdx,idx]:[idx,lastIdx];
      const state=cb.checked;
      for(let i=from;i<=to;i++) all[i].checked=state;
    }
    lastIdx=idx;
  });
}

// ── Boolean search (AND / OR / NOT / parentheses / "quoted phrases") ──────────
// Matches a free-text query against a lowercase haystack string built from all
// searchable field values of a row. Bare terms separated by whitespace are
// implicitly AND-ed; explicit AND/OR/NOT and parentheses are also supported.
function _tokenizeBoolQuery(q){
  const tokens=[]; const re=/\(|\)|"[^"]*"|[^\s()]+/g; let m;
  while((m=re.exec(q))!==null){
    const raw=m[0];
    if(raw==='(') tokens.push({type:'LPAREN'});
    else if(raw===')') tokens.push({type:'RPAREN'});
    else if(/^AND$/i.test(raw)) tokens.push({type:'AND'});
    else if(/^OR$/i.test(raw)) tokens.push({type:'OR'});
    else if(/^NOT$/i.test(raw)) tokens.push({type:'NOT'});
    else{
      let val=raw;
      if(val.startsWith('"')&&val.endsWith('"')&&val.length>=2) val=val.slice(1,-1);
      tokens.push({type:'TERM', value:val});
    }
  }
  return tokens;
}
function parseBoolQuery(query){
  const q=(query||'').trim();
  if(!q) return ()=>true;
  const tokens=_tokenizeBoolQuery(q);
  let pos=0;
  const peek=()=>tokens[pos];
  const next=()=>tokens[pos++];
  const startsOperand=t=>t && (t.type==='TERM'||t.type==='LPAREN'||t.type==='NOT');
  function parseOr(){
    let left=parseAnd();
    while(peek() && peek().type==='OR'){
      next(); const right=parseAnd(); const l=left; left=h=>l(h)||right(h);
    }
    return left;
  }
  function parseAnd(){
    let left=parseNot();
    while(peek() && (peek().type==='AND' || startsOperand(peek()))){
      if(peek().type==='AND') next();
      const right=parseNot(); const l=left; left=h=>l(h)&&right(h);
    }
    return left;
  }
  function parseNot(){
    if(peek() && peek().type==='NOT'){ next(); const operand=parseNot(); return h=>!operand(h); }
    return parseAtom();
  }
  function parseAtom(){
    const t=next();
    if(!t) return ()=>true;
    if(t.type==='LPAREN'){
      const inner=parseOr();
      if(peek() && peek().type==='RPAREN') next();
      return inner;
    }
    if(t.type==='TERM'){
      const term=t.value.toLowerCase();
      return h=>h.includes(term);
    }
    return ()=>true;
  }
  try{
    const predicate=parseOr();
    return h=>predicate(h);
  }catch{ return h=>h.includes(q.toLowerCase()); }
}

// Shared price-comparison colouring for every price column (Mouser / DigiKey /
// Priority) in BOTH the Database and Sales Desk, so the same number never means
// two different things depending on which screen you're looking at.
// Across all the prices a row actually HAS: cheapest → green, dearest → red,
// anything in between → uncoloured. A single price is left uncoloured, since
// "cheapest" is meaningless with nothing to compare against.
const _PRICE_FIELDS=['priority_price','mouser_price','digikey_price'];

// WHAT IS COMPARED, and why it isn't the displayed number.
// The cells show a per-unit price, but the sources don't quote on the same
// basis: Priority prices cable per METRE while Mouser and DigiKey quote it per
// FOOT. Ranking the raw numbers therefore gave the wrong answer on every mm
// row — $2.00/m from Priority looked dearer than $0.65/ft from DigiKey, when
// per metre DigiKey is actually $2.13. So the colours rank each source by what
// the row would ACTUALLY COST (quantity included, units reconciled), which is
// the question the colour is meant to answer.
// On "pc" rows every source is already per piece, so multiplying by the row's
// quantity changes nothing about the ordering — the colours there are the same
// as before. This matters only where the units genuinely differ.
function _priceRankValue(row, field){
  return typeof _sdLineCost==='function' ? _sdLineCost(row, field)
                                         : (parseFloat(row[field])||0);
}
// Shows the COST FOR THE ROW'S QUANTITY, not the per-unit price. Change QTY
// and every price column moves with it, which is what makes the three figures
// answerable ("which supplier is cheaper for what I'm actually buying?") and
// consistent with Part Cost, the Check Price modal and the exported quotation.
// The per-unit price is kept in the tooltip — it's still the number you'd read
// off a datasheet or paste into a PO, just not the one you compare on.
// In the Database every row has QTY 1, so cost and unit price coincide there
// and nothing about that screen changes.
// Which vendor a price column belongs to, for the match marker below.
// Priority has no marker: it's our own ERP, keyed on the exact part number, so
// there is no "similar part" case to warn about.
const _MATCH_FOR={
  mouser_price:{code:'mouser_match', mpn:'mouser_mpn', name:'Mouser',
                mfr:'mouser_mfr', alts:'mouser_alts', desc:'mouser_desc', cands:'mouser_cands', by:'mouser_by'},
  digikey_price:{code:'digikey_match', mpn:'digikey_mpn', name:'DigiKey',
                 mfr:'digikey_mfr', alts:'digikey_alts', desc:'digikey_desc', cands:'digikey_cands', by:'digikey_by'}};

// Tells the reader whether this price is for THE part or merely a close one.
// Same three symbols as the Check Price modal, now attached to the number
// itself so the distinction survives long after that modal was closed —
// including for whoever reads the quote instead of running the check.
function _matchMarkerHTML(row, field){
  const cfg=_MATCH_FOR[field];
  if(!cfg) return '';
  const code=row[cfg.code]||'';
  const mpn=row[cfg.mpn]||'';
  const alts=parseInt(row[cfg.alts],10)||1;
  const mfr=row[cfg.mfr]||'';
  const vdesc=row[cfg.desc]||'';
  // Several manufacturers sell this same part number and one had to be picked.
  // That choice changes the price by orders of magnitude on spec parts, so it
  // gets its own marker rather than hiding inside a plain ✓.
  if(alts>1 && (code==='exact'||code==='approx')){
    const cands=Array.isArray(row[cfg.cands])?row[cfg.cands]:[];
    // List everything that was compared, with the score each got. If the scores
    // are all 0 the descriptions couldn't be read and the pick was arbitrary —
    // which is exactly what you need to see, not something to hide.
    const by=row[cfg.by]||'';
    const money=v=>v>0?('$'+(+v).toFixed(2)):'—';
    const lines = cands.length
      ? cands.map(c=>`  ${money(c.price)}  ${c.mfr||'?'} — ${c.desc||'(no description)'}   [match ${c.score}]`).join('\n')
      : `  (candidate details unavailable — re-run Check Price)`;
    const tip=`${alts} products on ${cfg.name} share the part number "${row.part_number||''}".\n\n`
            + `Your BOM says:\n  ${row.description||'(no description)'}\n\n`
            + `Compared:\n${lines}\n\n`
            + `Chosen: ${mfr||'?'} — ${vdesc||'(no description)'}\n`
            + (by==='price'
                ? `Reason: none of the descriptions matched better than the others, so the CHEAPEST was taken.`
                : by==='description'
                  ? `Reason: best description match.`
                  : `Reason: only candidate with a price.`)
            + `\n\nSame spec number, different manufacturers — check this is the right one.`;
    // Purple when the description decided it; amber when price broke the tie —
    // the amber ones are the rows worth a human glance.
    const byPrice = by==='price';
    return `<span title="${esc(tip)}" style="margin-inline-start:4px;color:${byPrice?'#B45309':'#7C3AED'};font-weight:700;cursor:help">${byPrice?'≈$':'✓'}${alts}</span>`;
  }
  if(code==='exact'){
    return `<span title="${esc(`Exact match — ${cfg.name} lists this part number${mfr?` (${mfr})`:''}`)}" style="margin-inline-start:4px;color:var(--green);font-weight:700">✓</span>`;
  }
  if(code==='approx'){
    return `<span title="${esc(`Matched as "${mpn}" on ${cfg.name} — same part, different punctuation/zero-padding to "${row.part_number||''}". Verify before quoting.`)}" style="margin-inline-start:4px;color:#B45309;font-weight:700;cursor:help">✓ ≈</span>`;
  }
  if(code==='noprice'){
    return `<span title="${esc(`${cfg.name} lists this part${mpn?` as "${mpn}"`:''} but publishes no price — usually non-stocked or quote-only.`)}" style="margin-inline-start:4px;color:#B45309;font-weight:700;cursor:help">◑</span>`;
  }
  return '';
}

// Stock reads differently from a price: 0 is a real, actionable answer and an
// empty cell means "this vendor doesn't list the part at all". Amber for a
// listed-but-empty vendor so it's visible without hunting.
function _stockCellHTML(row, field){
  const raw=row[field];
  if(raw===undefined || raw===null || raw==='') return '<span style="color:var(--muted)">—</span>';
  const n=parseInt(raw,10)||0;
  return n>0
    ? `<span title="Units on hand">${n.toLocaleString()}</span>`
    : `<span style="color:#B45309;font-weight:600" title="Listed by this vendor, but none in stock">0</span>`;
}

function _priceCellHTML(row, field){
  const unit=parseFloat(row[field])||0;
  const mine=unit ? _priceRankValue(row, field) : 0;
  if(!(mine>0)){
    // No price, but the vendor DOES list the part — say so instead of leaving
    // an empty cell that reads as "never checked".
    const marker=_matchMarkerHTML(row, field);
    return (row[(_MATCH_FOR[field]||{}).code]==='noprice') ? marker : '';
  }
  const qty=parseFloat(row.qty)||1;
  const all=_PRICE_FIELDS.map(f=>_priceRankValue(row,f)).filter(n=>n>0);
  const cls = all.length<2 ? ''
            : (mine<=Math.min(...all) ? 'price-green'
            : (mine>=Math.max(...all) ? 'price-red' : ''));
  const title=`Unit price ${fmtPrice(unit)} × QTY ${qty}${row.unit?' '+row.unit:''} = $${mine.toFixed(2)}`;
  return `<span class="${cls}" title="${esc(title)}">$${mine.toFixed(2)}</span>`
       + _matchMarkerHTML(row, field);
}

// Renders the inner HTML for a single Part Stock cell, given a column key and part row
function _psCellHTML(k,p){
  // Built from the part number rather than stored: there's nothing to keep in
  // sync, and it works for parts that have never been price-checked.
  const fcUrl=`https://www.findchips.com/search/${encodeURIComponent(p.part_number||'')}`;
  switch(k){
    // All price columns share one comparison rule — see _priceCellHTML.
    case 'priority_price':
    case 'mouser_price':
    case 'digikey_price': return _priceCellHTML(p,k);
    case 'mouser_stock':
    case 'digikey_stock': return _stockCellHTML(p,k);
    case 'unit': return esc(p.unit||p.units||'');
    case 'rfq_names': return esc((p.rfq_names||[]).join(', '));
    case 'updatedAt': return fmtDate(p.updatedAt);
    // A part with QVL alternatives shows how many were (or will be) compared;
    // otherwise the fact that the shown part number is a CHOICE is invisible.
    case 'part_number': {
      const alts=(p.alt_mpns||[]).filter(a=>a&&a.mpn);
      if(alts.length<2) return esc(p.part_number);
      const tip='Customer-approved alternatives (QVL) — Check Price quotes the cheapest:\n\n'
                +alts.map(a=>'• '+a.mpn+(a.manufacturer?`  [${a.manufacturer}]`:'')).join('\n');
      return `${esc(p.part_number)} <span style="padding:1px 5px;border-radius:8px;background:#EDE9FE;color:#5B21B6;font-size:9px;font-weight:700;cursor:help" title="${esc(tip)}">${alts.length} QVL</span>`;
    }
    case '_fc': return p.part_number?`<a href="${fcUrl}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="text-decoration:none;font-size:11px" title="Open this part on findchips.com">🔍 View</a>`:'';
    // Whether WE physically stock/own this part (distinct from `stock`, which
    // is a distributor inventory count) — auto-checked for items
    // brought in via Import Data → Tools Catalog (see saveToolsImport), but
    // toggleable by hand for any part. Sales Desk reads this flag to decide
    // whether a synthesized crimp/insertion TOOL row is already owned and
    // should be excluded from the final price (see handleSDFiles).
    case 'own_stock': return `<input type="checkbox" class="ps-stock-toggle" data-id="${esc(p._id)}" ${p.own_stock?'checked':''} title="We already have this in stock">`;
    default: return esc(p[k]);
  }
}

// ── One-time cleanup: remove the dead FindChips fields ───────────────────────
// FindChips scraping was removed — prices now come from the Mouser and DigiKey
// APIs. Its three leftover fields (price / distributor / findchips_url) would
// otherwise sit in every one of the ~1000 part documents forever, showing up in
// exports and confusing anyone reading the data later.
//
// Runs at most once per browser: the flag below stops it re-scanning on every
// visit. It's safe to run again (deleting an absent field is a no-op), so
// clearing the localStorage key re-triggers it if a document is ever missed —
// e.g. one created by another user's browser before they upgraded.
const _FC_PURGE_KEY='fc_fields_purged_v1';
async function purgeLegacyFindChipsFields(){
  if(!companyId || localStorage.getItem(_FC_PURGE_KEY)) return;
  try{
    const snap=await getDocs(collection(db,'companies',companyId,'parts_cache'));
    const stale=snap.docs.filter(d=>{
      const v=d.data()||{};
      return ('price' in v) || ('distributor' in v) || ('findchips_url' in v);
    });
    if(!stale.length){ localStorage.setItem(_FC_PURGE_KEY,'1'); return; }
    // Batched so ~1000 documents cost a handful of round-trips, not 1000.
    // 500 is Firestore's hard cap on writes per batch.
    for(let i=0;i<stale.length;i+=400){
      const batch=writeBatch(db);
      for(const d of stale.slice(i,i+400)){
        batch.update(d.ref,{
          price:deleteField(), distributor:deleteField(), findchips_url:deleteField(),
        });
      }
      await batch.commit();
    }
    localStorage.setItem(_FC_PURGE_KEY,'1');
    console.info(`[Cleanup] removed FindChips fields from ${stale.length} part(s)`);
    logSystemAudit('fc_fields_purged',`${stale.length} part(s)`,true);
  }catch(e){
    // Never block the screen over cleanup — the app works fine with the fields
    // still present, they're simply no longer read.
    console.warn('[Cleanup] FindChips field purge failed:',e.message);
  }
}

async function renderPartStock(filter=''){
  setContent(`<div style="text-align:center;padding:60px;color:var(--muted)"><div class="ring" style="margin:0 auto 12px"></div>Loading parts…</div>`);
  setActions('');
  try { await loadParts(); } catch(e){ setContent(`<p style="color:red;padding:20px">${e.message}</p>`); return; }
  purgeLegacyFindChipsFields();  // fire-and-forget; never blocks the render

  const predicate=parseBoolQuery(filter);
  const filtered=(filter||'').trim()
    ? allParts.filter(p=>predicate([p.part_number,p.drawing_number,p.drawing_name,p.atlantium_pn,p.description,
        p.manufacturer,p.distributor,p.qty,p.unit,p.units,(p.rfq_names||[]).join(' '),
        p.pin_count].map(v=>String(v||'')).join(' | ').toLowerCase()))
    : allParts;

  // Sort ALWAYS runs over the full filtered set (all matching parts across every page),
  // never just the rows currently visible on screen.
  const sorted=[...filtered].sort((a,b)=>{
    let va=String(a[sortCol]||'').toLowerCase(), vb=String(b[sortCol]||'').toLowerCase();
    if(['price','priority_price','mouser_price','digikey_price'].includes(sortCol)){va=parseFloat(a[sortCol])||0;vb=parseFloat(b[sortCol])||0;}
    return sortAsc?(va<vb?-1:va>vb?1:0):(va<vb?1:va>vb?-1:0);
  });

  // Pagination is applied last, purely for display — search filtering and sorting above
  // already operated across the entire dataset.
  const totalItems=sorted.length;
  const effPageSize = psPageSize==='all' ? Math.max(totalItems,1) : psPageSize;
  const totalPages = psPageSize==='all' ? 1 : Math.max(1,Math.ceil(totalItems/psPageSize));
  if(psPage>totalPages) psPage=totalPages;
  if(psPage<1) psPage=1;
  const pageStart=(psPage-1)*effPageSize;
  const pageRows=sorted.slice(pageStart,pageStart+effPageSize);

  const COLS=loadColOrder('partstock',_PS_DEFAULT_COLS);
  const arrow=k=>k===sortCol?(sortAsc?' ▲':' ▼'):'';
  const rows=pageRows.map(p=>`<tr data-id="${esc(p._id)}">
      <td style="text-align:center"><input type="checkbox" class="ps-check" data-id="${esc(p._id)}"></td>
      ${COLS.map(c=>`<td${c.wrap?' class="wrap"':''}>${_psCellHTML(c.k,p)}</td>`).join('')}
    </tr>`).join('');

  const pageSizeOpts=[10,20,50,100,200,500].map(n=>`<option value="${n}" ${n===psPageSize?'selected':''}>${n}/page</option>`).join('')
    +`<option value="all" ${psPageSize==='all'?'selected':''}>All</option>`;

  setContent(`
    <div class="toolbar">
      <div class="search-wrap">
        <input class="search-box" id="ps-search" placeholder='Search — supports AND / OR / NOT / "phrase" / (...)' value="${esc(filter)}">
        <button type="button" class="search-clear" id="ps-search-clear" title="Clear">✕</button>
      </div>
      <button class="tbl-scroll-btn" id="ps-scroll-left" title="Scroll left">◀</button>
      <button class="tbl-scroll-btn" id="ps-scroll-right" title="Scroll right">▶</button>
      <select class="search-box" id="ps-page-size" style="flex:0 0 auto;min-width:auto;width:auto;padding:7px 9px">${pageSizeOpts}</select>
      <button class="btn btn-ghost" id="btn-ps-refresh" style="white-space:nowrap;flex-shrink:0" title="Reload latest data from the database">🔄 Refresh</button>
      <button class="btn btn-blue" id="btn-ps-fc" style="white-space:nowrap;flex-shrink:0">🔍 Check Price</button>
      <button class="btn btn-purple" id="btn-ps-import" style="white-space:nowrap;flex-shrink:0">📥 Import Data</button>
      <button class="btn btn-green" id="btn-ps-export" style="white-space:nowrap;flex-shrink:0">📊 Export to Excel</button>
      <button class="btn btn-red" id="btn-ps-delsel" style="white-space:nowrap;flex-shrink:0">🗑 Delete Selected</button>
      <span class="count-badge">${totalItems} parts — page ${psPage}/${totalPages}</span>
    </div>
    <div class="table-wrap" id="ps-table-wrap"><table id="ps-table">
      <thead><tr>
        <th style="width:28px"><input type="checkbox" id="ps-check-all" title="Select all"></th>
        ${COLS.map(c=>`<th data-col="${c.k}" style="min-width:${c.w}" title="Drag to reorder">${c.l}${arrow(c.k)}</th>`).join('')}
      </tr></thead>
      <tbody>${rows||`<tr class="empty-row"><td colspan="${COLS.length+1}">No parts found</td></tr>`}</tbody>
    </table></div>
    ${_PRICE_LEGEND_HTML}
    ${_buildPager(psPage,totalPages,'ps')}`);

  const inp=document.getElementById('ps-search');
  wireSearchClear('ps-search','ps-search-clear');
  wireShiftCheck(document.querySelector('#ps-table'),'.ps-check');
  makeTableResizable(document.querySelector('#ps-table'));
  makeColumnsReorderable(document.querySelector('#ps-table'),'partstock',COLS,()=>renderPartStock(inp.value));
  wireScrollButtons('#ps-table-wrap','ps-scroll-left','ps-scroll-right');
  inp.addEventListener('input',debounce(()=>{
    const v=inp.value, s=inp.selectionStart;
    psPage=1;
    renderPartStock(v).then(()=>{
      const ni=document.getElementById('ps-search');
      if(ni){ni.focus();ni.setSelectionRange(s,s);}
    });
  },260));
  inp.focus();
  document.querySelectorAll('thead th[data-col]').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.col;
    if(sortCol===k)sortAsc=!sortAsc;else{sortCol=k;sortAsc=true;}
    psPage=1;
    renderPartStock(inp.value);
  }));

  document.getElementById('ps-page-size')?.addEventListener('change',e=>{
    const v=e.target.value;
    psPageSize = v==='all' ? 'all' : (parseInt(v)||20);
    localStorage.setItem('psPageSize',String(psPageSize));
    psPage=1;
    renderPartStock(inp.value);
  });
  document.querySelectorAll('#ps-pager .pager-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=parseInt(btn.dataset.page);
      if(!p||p<1||p>totalPages||p===psPage) return;
      psPage=p;
      renderPartStock(inp.value);
    });
  });

  // Check-all toggle (current page only)
  document.getElementById('ps-check-all')?.addEventListener('change',e=>{
    document.querySelectorAll('.ps-check').forEach(cb=>cb.checked=e.target.checked);
  });

  // Stock toggle — hand-editable per part, independent of the Tools Catalog
  // import that auto-checks it (see saveToolsImport / _psCellHTML 'own_stock').
  document.querySelectorAll('.ps-stock-toggle').forEach(cb=>cb.addEventListener('change',async()=>{
    const id=cb.dataset.id, val=cb.checked;
    try{
      await updateDoc(doc(db,'companies',companyId,'parts_cache',id),{own_stock:val, updatedAt:serverTimestamp()});
      const p=allParts.find(p=>p._id===id); if(p) p.own_stock=val;
    }catch(e){ toast('Error: '+e.message,'error'); cb.checked=!val; }
  }));

  // Refresh — force a fresh read from Firestore (bypasses the in-memory allParts cache)
  document.getElementById('btn-ps-refresh')?.addEventListener('click',()=>{
    allParts=[];
    renderPartStock(inp.value);
  });

  // FindChips button — check selected rows (or all matching rows across every page if none selected)
  document.getElementById('btn-ps-fc')?.addEventListener('click',()=>{
    const checked=[...document.querySelectorAll('.ps-check:checked')].map(cb=>cb.dataset.id);
    const targets = checked.length
      ? sorted.filter(p=>checked.includes(p._id))
      : sorted.slice(0,2000);
    const items=targets.filter(p=>p.part_number).map(p=>({
      _id:p._id, part_number:p.part_number, qty:parseFloat(p.qty)||1, unit:p.unit||p.units||'',
      description:p.description||''
    }));
    if(!items.length){toast('No parts with part numbers','error');return;}
    runFCCheckModal(items,'parts');
  });

  // Import Data button — lets the user choose which kind of import to run
  // (Priority Prices or Tools Catalog) before opening that flow's own modal.
  document.getElementById('btn-ps-import')?.addEventListener('click',()=>{
    openImportDataModal();
  });

  // Export Excel — selected rows only, or all filtered rows (across every page) if none selected
  document.getElementById('btn-ps-export')?.addEventListener('click',()=>{
    const checked=[...document.querySelectorAll('.ps-check:checked')].map(cb=>cb.dataset.id);
    const targets = checked.length ? sorted.filter(p=>checked.includes(p._id)) : sorted;
    exportPartStockExcel(targets, sorted.length, COLS);
  });

  // Delete Selected — removes checked rows from Part Stock (parts_cache) in Firestore
  document.getElementById('btn-ps-delsel')?.addEventListener('click', async()=>{
    const checked=[...document.querySelectorAll('.ps-check:checked')].map(cb=>cb.dataset.id);
    if(!checked.length){ toast('No rows selected','error'); return; }
    if(!confirm(`Delete ${checked.length} selected part(s) from Database? This cannot be undone.`)) return;
    try{
      await Promise.all(checked.map(id=>deleteDoc(doc(db,'companies',companyId,'parts_cache',id))));
      allParts=allParts.filter(p=>!checked.includes(p._id));
      toast(`Deleted ${checked.length} part(s)`,'success');
      logAudit('database_delete_parts',{count:checked.length},true);
      renderPartStock(inp.value);
    }catch(e){ toast('Error: '+e.message,'error'); logAudit('database_delete_parts',{error:e.message},false); }
  });
}

let _rfqCustFilter='';
async function renderRFQList(){
  setContent(`<div style="text-align:center;padding:60px;color:var(--muted)"><div class="ring" style="margin:0 auto 12px"></div>Loading RFQs…</div>`);
  setActions(`<button class="btn btn-green" id="btn-new-rfq">＋ New RFQ</button>`);

  document.getElementById('btn-new-rfq').addEventListener('click', createRFQ);

  let projects=[];
  try {
    const snap=await getDocs(query(collection(db,'companies',companyId,'projects'),orderBy('updatedAt','desc')));
    projects=snap.docs.map(d=>({_id:d.id,...d.data()}));
  } catch {
    try {
      const snap=await getDocs(collection(db,'companies',companyId,'projects'));
      projects=snap.docs.map(d=>({_id:d.id,...d.data()}));
      projects.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
    } catch(e2){ setContent(`<p style="color:red;padding:20px">${e2.message}</p>`); return; }
  }

  if(!projects.length){
    setContent(`<div style="text-align:center;padding:80px;color:var(--muted)">
      <div style="font-size:48px;margin-bottom:12px">📋</div>
      <div>No RFQs yet. Click <strong>＋ New RFQ</strong> to create one.</div></div>`);
    return;
  }

  const customers=[...new Set(projects.map(p=>p.customer_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if(_rfqCustFilter && !customers.includes(_rfqCustFilter)) _rfqCustFilter='';
  const filtered = _rfqCustFilter ? projects.filter(p=>p.customer_name===_rfqCustFilter) : projects;

  // Group RFQs by customer (alphabetical order; RFQs without a customer form a
  // "No Customer" group shown last). Order of RFQs within each group is preserved
  // from `filtered` (already sorted by updatedAt desc from the query above).
  const groupsMap={};
  filtered.forEach(p=>{
    const key=p.customer_name||'';
    (groupsMap[key]=groupsMap[key]||[]).push(p);
  });
  // Within each customer group, RFQs are sorted alphabetically (A→Z) by name.
  Object.keys(groupsMap).forEach(key=>{
    groupsMap[key].sort((a,b)=>String(a.name||a._id||'').localeCompare(String(b.name||b._id||'')));
  });
  const groupKeys=Object.keys(groupsMap).sort((a,b)=>{
    if(!a) return 1; if(!b) return -1;
    return a.localeCompare(b);
  });

  setContent(`
    <div class="toolbar">
      ${customers.length>1?`
      <label style="font-size:12px;color:var(--muted);white-space:nowrap">Filter by Customer:</label>
      <select id="rfq-cust-filter" class="search-box" style="flex:0 0 auto;max-width:280px;padding:5px 9px">
        <option value="">All Customers (${customers.length})</option>
        ${customers.map(c=>`<option value="${esc(c)}" ${c===_rfqCustFilter?'selected':''}>${esc(c)}</option>`).join('')}
      </select>`:''}
      <span class="count-badge">${filtered.length} RFQs</span>
    </div>
    ${groupKeys.map(key=>`
      <div class="rfq-group">
        <div style="display:flex;align-items:center;gap:8px;margin:16px 0 8px;padding-bottom:6px;border-bottom:1.5px solid var(--border)">
          <h3 style="font-size:13px;font-weight:700;color:var(--blue-dark);text-transform:uppercase;letter-spacing:.4px;margin:0">${key?esc(key):'No Customer'}</h3>
          <span class="count-badge">${groupsMap[key].length}</span>
        </div>
        <div class="card-grid">
        ${groupsMap[key].map(p=>`
          <div class="rfq-card" data-id="${esc(p._id)}">
            <div class="rfq-card-icon">📋</div>
            <div class="rfq-card-body">
              <h3>${esc(p.name||p._id)}</h3>
              <p>${fmtDate(p.updatedAt)||'—'}</p>
            </div>
            <button class="btn btn-red btn-sm del-rfq" data-id="${esc(p._id)}" data-name="${esc(p.name||p._id)}"
              title="Delete" style="flex-shrink:0;align-self:center">✕</button>
          </div>`).join('')}
        </div>
      </div>`).join('')}
    `);

  document.getElementById('rfq-cust-filter')?.addEventListener('change',e=>{
    _rfqCustFilter=e.target.value;
    renderRFQList();
  });
  document.querySelectorAll('.rfq-card').forEach(el=>{
    el.addEventListener('click',e=>{if(!e.target.classList.contains('del-rfq')) renderRFQDetail(el.dataset.id, el.querySelector('h3').textContent);});
  });
  document.querySelectorAll('.del-rfq').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation(); deleteRFQ(btn.dataset.id, btn.dataset.name);});
  });
}

async function createRFQ(){

      getDocs(collection(db,'companies',companyId,'projects'))

  } catch(e){ toast('Error: '+e.message,'error'); return; }

    if(confirm('No customers yet. Go to Customers to add one first?')) route('customers');
    return;

  showModal(`<div class="modal modal-sm">

  document.getElementById('modal-close').addEventListener('click',closeModal);

  const sel=document.getElementById('rfq-cust-sel');
  const prev=document.getElementById('rfq-name-prev');
  const confirmBtn=document.getElementById('btn-confirm-rfq');

  function calcName(custId, custName){
    const existing=allProjects.filter(p=>p.customer_id===custId
      ||(p.name||'').toLowerCase().startsWith(custName.toLowerCase()+'-'));
    let maxN=0;
    existing.forEach(p=>{const m=(p.name||'').match(/-0*(\d+)$/);if(m)maxN=Math.max(maxN,+m[1]);});
    return `${custName}-${String(maxN+1).padStart(3,'0')}`;
  }

  sel.addEventListener('change',()=>{
    const custId=sel.value;
    const custName=sel.selectedOptions[0]?.dataset.name||'';
    if(!custId){prev.value='';confirmBtn.disabled=true;return;}
    const rfqName=calcName(custId,custName);
    prev.value=rfqName;
    confirmBtn.disabled=false;
    confirmBtn.dataset.custid=custId;
    confirmBtn.dataset.custname=custName;
    confirmBtn.dataset.rfqname=rfqName;
  });

  confirmBtn.addEventListener('click',async()=>{
    const{custid:custId,custname:custName,rfqname:rfqName}=confirmBtn.dataset;
    if(!custId||!rfqName) return;
    try {
      confirmBtn.disabled=true; confirmBtn.textContent='Creating…';
      const ref=await addDoc(collection(db,'companies',companyId,'projects'),{
        name:rfqName, customer_id:custId, customer_name:custName,
        updatedAt:serverTimestamp(), createdAt:serverTimestamp()
      });
      toast('RFQ created','success');
      logAudit('rfq_created',{name:rfqName},true);
      closeModal();
      renderRFQDetail(ref.id,rfqName);
    } catch(e){ toast('Error: '+e.message,'error'); logAudit('rfq_created',{error:e.message},false); confirmBtn.disabled=false; confirmBtn.textContent='✓ Create RFQ'; }
  });
}

async function deleteRFQ(id, name){
  if(!confirm(`Delete RFQ "${name}"? This removes all drawings.`)) return;
  try {
    // Delete all drawings first
    const snap=await getDocs(collection(db,'companies',companyId,'projects',id,'drawings'));
    await Promise.all(snap.docs.map(d=>deleteDoc(d.ref)));
    await deleteDoc(doc(db,'companies',companyId,'projects',id));
    toast('RFQ deleted','success');
    logAudit('rfq_deleted',{name},true);
    renderRFQList();
  } catch(e){ toast('Error: '+e.message,'error'); logAudit('rfq_deleted',{error:e.message},false); }
}

// ══════════════════════════════════════════════════════════════════════════════
// RFQ DETAIL  (show drawings – each drawing has items[] array)
// ══════════════════════════════════════════════════════════════════════════════
async function renderRFQDetail(projectId, projectName, searchQ=''){
  setContent(`<div style="text-align:center;padding:60px;color:var(--muted)"><div class="ring" style="margin:0 auto 12px"></div>Loading BOM…</div>`);
  setActions(`
    <button class="btn btn-blue" id="btn-add-drawing">＋ Add Drawing</button>
    <button class="btn btn-green" id="btn-bom-export">📊 Export to Excel</button>
    <button class="btn btn-red" id="btn-bom-del-sel">🗑 Delete Selected</button>
    <button class="btn btn-ghost" id="btn-back-rfq">← Back</button>`);

  document.getElementById('btn-back-rfq').addEventListener('click', renderRFQList);
  document.getElementById('btn-add-drawing').addEventListener('click',
    () => openAddDrawingModal(projectId, projectName));

  document.getElementById('page-title').textContent = `📋 ${projectName}`;

  let drawings=[];
  try {
    const snap=await getDocs(collection(db,'companies',companyId,'projects',projectId,'drawings'));
    drawings=snap.docs.map(d=>({_id:d.id,...d.data()}));
    drawings.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  } catch(e){
    setContent(`<p style="color:red;padding:20px">Error loading BOM: ${e.message}</p>`);
    return;
  }

  // Flatten items from all drawings.
  // Desktop app stores: { name, items:[{item,part_number,...}] }
  // Old web format stored individual docs with BOM fields directly – handle both.
  const allRows = [];
  for(const dwg of drawings){
    if(Array.isArray(dwg.items) && dwg.items.length > 0){
      dwg.items.forEach((it,idx)=>allRows.push({...it, _dwgId:dwg._id, _dwgName:dwg.name||'', _idx:idx, _fmt:'arr'}));
    } else if(dwg.part_number || dwg.description || dwg.drawing_number){
      // Old format: document IS the BOM row
      allRows.push({...dwg, _dwgId:dwg._id, _dwgName:'', _idx:-1, _fmt:'doc'});
    }
  }
  // Sort: drawing name first (keeps groups together), then item number within each drawing
  allRows.sort((a,b)=>{
    const nc=String(a._dwgName||'').localeCompare(String(b._dwgName||''));
    if(nc!==0) return nc;
    return (parseInt(a.item)||0)-(parseInt(b.item)||0);
  });

  const _BOM_DEFAULT_COLS=[
    {k:'item',          l:'Item',        w:'45px'},
    {k:'drawing_number',l:'Drawing #',   w:'110px'},
    {k:'revision',      l:'Revision',    w:'90px'},
    {k:'part_number',   l:'MNF P/N',      w:'130px'},
    {k:'atlantium_pn',  l:'Cust PN',     w:'100px'},
    {k:'description',   l:'Description', w:'210px',wrap:true},
    {k:'qty',           l:'QTY',         w:'55px'},
    {k:'unit',          l:'Units',       w:'55px'},
    {k:'manufacturer',  l:'Manufacturer',w:'110px'},
    {k:'pin_count',       l:'Pins',           w:'55px'},
  ];
  const BOM_COLS=loadColOrder('bom',_BOM_DEFAULT_COLS);
  const bomColspan=BOM_COLS.length+2;

  // Boolean text search (AND/OR/NOT/"phrase"/(...)) across all BOM columns
  const _bomPredicate=parseBoolQuery(searchQ);
  const allRowsFiltered=(searchQ||'').trim()
    ? allRows.filter(r=>_bomPredicate(_BOM_DEFAULT_COLS.map(c=>String(r[c.k]||'')).join(' | ').toLowerCase()))
    : allRows;

  // Unique drawing names for filter
  const uniqueDwgs = [...new Set(allRowsFiltered.map(r=>r._dwgName).filter(Boolean))];

  // Build rows with drawing-name group headers + data-dwg attributes for filtering
  let lastDwgName = null;
  const rowsHtml = allRowsFiltered.map((row,ri)=>{
    let header = '';
    if(row._dwgName && row._dwgName !== lastDwgName){
      lastDwgName = row._dwgName;
      header = `<tr data-dwg="${esc(row._dwgName)}" class="dwg-grp-hdr" style="background:var(--blue-light)"><td colspan="${bomColspan}" style="font-weight:700;color:var(--blue-dark);padding:5px 9px;border-right:none"><span class="dwg-toggle" style="cursor:pointer;user-select:none;display:inline-block;width:14px;text-align:center;font-size:11px;margin-right:5px;color:var(--blue-mid)" title="Collapse/expand">▼</span>📄 ${esc(row._dwgName)}</td></tr>`;
    }
    return header + `<tr data-dwg="${esc(row._dwgName)}">
      <td style="text-align:center"><input type="checkbox" class="bom-check" data-dwgid="${esc(row._dwgId)}" data-idx="${row._idx}" data-fmt="${row._fmt}"></td>
      ${BOM_COLS.map(c=>{
        // Drawing # fallback: if empty, show the drawing container name
        let val=row[c.k]||'';
        if(c.k==='drawing_number'&&!val) val=row._dwgName||'';
        return `<td${c.wrap?' class="wrap"':''}>${esc(val)}</td>`;
      }).join('')}
      <td><button class="btn btn-red btn-sm del-row" data-dwgid="${esc(row._dwgId)}" data-idx="${row._idx}" data-fmt="${row._fmt}" title="Delete row">✕</button></td>
    </tr>`;
  }).join('');

  const filterOpts = uniqueDwgs.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  setContent(`
    <div class="toolbar" style="margin-bottom:10px">
      <button class="btn btn-ghost btn-sm" id="btn-collapse-all" style="white-space:nowrap;flex-shrink:0">▶ Collapse All</button>
      <div class="search-wrap">
        <input class="search-box" id="bom-search" placeholder='Search — supports AND / OR / NOT / "phrase" / (...)' value="${esc(searchQ)}">
        <button type="button" class="search-clear" id="bom-search-clear" title="Clear">✕</button>
      </div>
      <button class="tbl-scroll-btn" id="bom-scroll-left" title="Scroll left">◀</button>
      <button class="tbl-scroll-btn" id="bom-scroll-right" title="Scroll right">▶</button>
      ${uniqueDwgs.length>1?`
      <label style="font-size:12px;color:var(--muted);white-space:nowrap">Filter by Drawing:</label>
      <select id="dwg-filter" class="search-box" style="flex:0 0 auto;max-width:280px;padding:5px 9px">
        <option value="">All Drawings (${uniqueDwgs.length})</option>
        ${filterOpts}
      </select>`:''}
      <span class="count-badge" id="bom-flt-count">${allRowsFiltered.length} parts</span>
    </div>
    <div class="table-wrap" id="bom-table-wrap"><table id="bom-table">
      <thead><tr><th style="width:28px"><input type="checkbox" id="bom-check-all" title="Select all"></th>${BOM_COLS.map(c=>`<th data-col="${c.k}" style="min-width:${c.w}" title="Drag to reorder">${c.l}</th>`).join('')}<th style="width:40px"></th></tr></thead>
      <tbody id="bom-tbody">${rowsHtml||`<tr class="empty-row"><td colspan="${bomColspan}">No BOM rows yet. Click ＋ Add Drawing to import.</td></tr>`}</tbody>
    </table></div>
    <div style="margin-top:8px;font-size:11px;color:var(--muted)">${allRowsFiltered.length} parts across ${drawings.length} drawing(s)</div>`);

  // Drawing group collapse/expand (per-group toggle)
  document.querySelectorAll('.dwg-grp-hdr').forEach(hdr=>{
    hdr.querySelector('.dwg-toggle')?.addEventListener('click',e=>{
      const dwg=hdr.dataset.dwg;
      const arrow=e.currentTarget;
      const collapsing=arrow.textContent.trim()==='▼';
      arrow.textContent=collapsing?'▶':'▼';
      document.querySelectorAll('#bom-tbody tr:not(.dwg-grp-hdr)').forEach(tr=>{
        if(tr.dataset.dwg===dwg) tr.style.display=collapsing?'none':'';
      });
    });
  });

  // Collapse All / Expand All toggle
  let _allCollapsed=false;
  document.getElementById('btn-collapse-all')?.addEventListener('click',e=>{
    _allCollapsed=!_allCollapsed;
    document.querySelectorAll('.dwg-grp-hdr').forEach(hdr=>{
      const arrow=hdr.querySelector('.dwg-toggle');
      if(arrow) arrow.textContent=_allCollapsed?'▶':'▼';
      const dwg=hdr.dataset.dwg;
      document.querySelectorAll('#bom-tbody tr:not(.dwg-grp-hdr)').forEach(tr=>{
        if(tr.dataset.dwg===dwg) tr.style.display=_allCollapsed?'none':'';
      });
    });
    e.currentTarget.textContent=_allCollapsed?'▼ Expand All':'▶ Collapse All';
  });

  // Drawing filter
  document.getElementById('dwg-filter')?.addEventListener('change',e=>{
    const val=e.target.value;
    document.querySelectorAll('#bom-tbody tr').forEach(tr=>{
      tr.style.display=(!val||tr.dataset.dwg===val)?'':'none';
    });
    const cnt=val?document.querySelectorAll(`#bom-tbody tr[data-dwg="${val}"]:not(.dwg-grp-hdr)`).length:allRowsFiltered.length;
    const el=document.getElementById('bom-flt-count');
    if(el) el.textContent=cnt+' parts';
  });

  // Boolean search box — re-renders BOM view filtered
  const bomSearchInp=document.getElementById('bom-search');
  wireSearchClear('bom-search','bom-search-clear');
  bomSearchInp?.addEventListener('input',debounce(()=>{
    const v=bomSearchInp.value, s=bomSearchInp.selectionStart;
    renderRFQDetail(projectId, projectName, v).then(()=>{
      const ni=document.getElementById('bom-search');
      if(ni){ni.focus();ni.setSelectionRange(s,s);}
    });
  },260));

  makeTableResizable(document.getElementById('bom-table'));
  makeColumnsReorderable(document.getElementById('bom-table'),'bom',BOM_COLS,
    ()=>renderRFQDetail(projectId, projectName, bomSearchInp?.value||''));
  wireScrollButtons('#bom-table-wrap','bom-scroll-left','bom-scroll-right');
  wireShiftCheck(document.getElementById('bom-table'),'.bom-check');

  document.querySelectorAll('.del-row').forEach((btn,ri)=>{
    btn.addEventListener('click', async()=>{
      if(!confirm('Delete this BOM row?')) return;
      const dwgId=btn.dataset.dwgid, idx=parseInt(btn.dataset.idx), fmt=btn.dataset.fmt;
      try {
        if(fmt==='doc'){
          await deleteDoc(doc(db,'companies',companyId,'projects',projectId,'drawings',dwgId));
        } else {
          // Remove item at idx from drawing.items array
          const dwgRef=doc(db,'companies',companyId,'projects',projectId,'drawings',dwgId);
          const dwgSnap=await getDoc(dwgRef);
          const items=[...(dwgSnap.data()?.items||[])];
          items.splice(idx,1);
          if(items.length===0){
            await deleteDoc(dwgRef);
          } else {
            await updateDoc(dwgRef,{items, updatedAt:serverTimestamp()});
          }
        }
        toast('Row deleted','success');
        renderRFQDetail(projectId, projectName);
      } catch(e){ toast(e.message,'error'); }
    });
  });

  // Check-all toggle
  document.getElementById('bom-check-all')?.addEventListener('change',e=>{
    document.querySelectorAll('.bom-check').forEach(cb=>cb.checked=e.target.checked);
  });

  // Bulk delete selected rows
  // Export Excel — selected rows only, or every filtered row if none selected
  document.getElementById('btn-bom-export')?.addEventListener('click',()=>{
    const checkedKeys=[...document.querySelectorAll('.bom-check:checked')]
      .map(cb=>cb.dataset.dwgid+'|'+cb.dataset.idx+'|'+cb.dataset.fmt);
    const targets = checkedKeys.length
      ? allRowsFiltered.filter(r=>checkedKeys.includes(r._dwgId+'|'+r._idx+'|'+r._fmt))
      : allRowsFiltered;
    exportBOMExcel(targets, allRowsFiltered.length, BOM_COLS, projectName);
  });

  document.getElementById('btn-bom-del-sel')?.addEventListener('click', async()=>{
    const checked=[...document.querySelectorAll('.bom-check:checked')];
    if(!checked.length){ toast('No rows selected','error'); return; }
    if(!confirm(`Delete ${checked.length} selected row(s)?`)) return;
    const selections=checked.map(cb=>({dwgId:cb.dataset.dwgid, idx:parseInt(cb.dataset.idx), fmt:cb.dataset.fmt}));
    const byDwg={};
    selections.forEach(s=>{ const key=s.dwgId+'|'+s.fmt; (byDwg[key]=byDwg[key]||[]).push(s); });
    try{
      for(const key in byDwg){
        const group=byDwg[key];
        const {dwgId,fmt}=group[0];
        if(fmt==='doc'){
          await deleteDoc(doc(db,'companies',companyId,'projects',projectId,'drawings',dwgId));
        } else {
          const dwgRef=doc(db,'companies',companyId,'projects',projectId,'drawings',dwgId);
          const dwgSnap=await getDoc(dwgRef);
          let items=[...(dwgSnap.data()?.items||[])];
          const idxs=group.map(g=>g.idx).sort((a,b)=>b-a);
          idxs.forEach(idx=>{ if(idx>=0 && idx<items.length) items.splice(idx,1); });
          if(items.length===0){ await deleteDoc(dwgRef); }
          else { await updateDoc(dwgRef,{items, updatedAt:serverTimestamp()}); }
        }
      }
      toast(`Deleted ${selections.length} row(s)`,'success');
      renderRFQDetail(projectId, projectName);
    }catch(e){ toast('Error: '+e.message,'error'); }
  });
}
