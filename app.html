// ── AI Prompts viewer (Admin page) ───────────────────────────────────────────
// Read-only listing of every prompt the app sends to the AI, grouped by what
// it's for. Built from the SAME constants/functions the real calls use (never
// a hand-copied duplicate), so this can't drift out of date when a prompt is
// edited. The two BOM prompts take a runtime argument, so a placeholder is
// passed purely for display.
function _aiPromptCatalog(){
  return [
    {id:'bom-text',   title:'BOM extraction — PDF text mode',
     note:'Used when the PDF has a readable text layer. Sent with the extracted page text appended.',
     text:_BOM_TEXT_PROMPT('<drawing-filename>.pdf')},
    {id:'bom-vision', title:'BOM extraction — page image (vision)',
     note:'Fallback when the PDF text layer is empty/sparse (table drawn as graphics), and for image uploads. Sent with the rendered page image.',
     text:_BOM_VISION_PROMPT},
    {id:'bom-excel',  title:'BOM extraction — Excel / CSV spreadsheet',
     note:'Used when the uploaded file is a spreadsheet (ERP/PLM BOM export). Understands hierarchical exports where only some row types are real components and vendor data sits on child rows.',
     text:_BOM_EXCEL_PROMPT('<bom-export>.xlsx')},
    {id:'tool-rule',  title:'Crimp / insertion tool detection + pricing',
     note:'Shared rule embedded inside BOTH BOM prompts above — makes the AI add a priced TOOL row for every connector that has a pin count.',
     text:_BOM_TOOL_RULE_SECTION},
    {id:'labor',      title:'Cable manufacturing process → Labor Time',
     note:'Sales Desk only. Works out the manufacturing steps and per-unit minutes behind the auto Labor Time (and the Labor Breakdown modal).',
     text:_cableProcessPrompt('0: <BOM row description> (qty=1 pc)\n1: <BOM row description> (qty=230 mm)')},
    {id:'notes',      title:'Drawing Notes / Manufacturing Instructions',
     note:'Sales Desk only. Pulls the drawing’s NOTES / GENERAL NOTES block out for the panel under the BOM table.',
     text:_notesPrompt()},
    {id:'cut-strip',  title:'Cut & Strip specification',
     note:'Cut & Strip screen. Reads a cable/harness drawing and produces the whole bench sheet: connectors, one block per cable run, cut-length calculation, strip dimensions, wiring table, operation steps, inspection list and open items. Always sent in Hebrew — English and Russian sheets are translations of this output, not separate analyses.',
     text:_csPrompt(_CS_SOURCE_LANG)},
    {id:'cut-strip-tr', title:'Cut & Strip — translation of an existing sheet',
     note:'Cut & Strip screen. Only used when someone switches a saved sheet to a language it was not generated in. Sent in chunks of 20 strings.',
     text:_csTranslatePromptSample()},
  ];
}
// The translation prompt is built inside _csTranslateChunk around a runtime
// batch. Rebuilt here from the same text with a placeholder batch, so the panel
// shows what is really sent rather than a hand-copied paraphrase.
function _csTranslatePromptSample(){
  const langName='Hebrew';
  return `Translate each of these cable-harness shop-floor work instruction strings into ${langName}.\n`
    +'Rules:\n'
    +'- Keep part numbers, standards (IPC/WHMA-A-620, MIL-DTL-17), reference designators (P1, J1), dimension codes (A, B, C) and all units EXACTLY as they are.\n'
    +'- Keep numbers and their units unchanged (e.g. "320 mm" stays "320 mm").\n'
    +'- Technical terms a technician normally says in English (crimp, PTFE, VSWR, PCB) may stay in English.\n'
    +'- These are safety-relevant instructions. Translate precisely; do not soften, shorten or embellish.\n'
    +'- Return ONLY a JSON array of the translated strings, same order, same length. No commentary.\n\n'
    +JSON.stringify(['<up to 20 strings from the sheet>'], null, 0);
}
function renderAdminPromptsSection(){
  const body=document.getElementById('adm-prompts-body');
  if(!body) return;
  const items=_aiPromptCatalog();
  body.innerHTML=items.map(p=>`
    <details style="border:1px solid var(--border);border-radius:6px;margin-bottom:8px">
      <summary style="padding:9px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--blue-dark)">${esc(p.title)}</summary>
      <div style="padding:0 12px 12px">
        <p style="font-size:11px;color:var(--muted);margin:0 0 8px">${esc(p.note)}</p>
        <button class="btn btn-ghost btn-sm prompt-copy" data-id="${esc(p.id)}" style="margin-bottom:8px">📋 Copy</button>
        <pre id="prompt-text-${esc(p.id)}" style="white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid var(--border);border-radius:5px;padding:10px;font-size:11px;line-height:1.5;max-height:340px;overflow:auto;margin:0">${esc(p.text)}</pre>
      </div>
    </details>`).join('');
  body.querySelectorAll('.prompt-copy').forEach(btn=>btn.addEventListener('click',async()=>{
    const el=document.getElementById(`prompt-text-${btn.dataset.id}`);
    if(!el) return;
    try{ await navigator.clipboard.writeText(el.textContent); toast('Prompt copied','success'); }
    catch{ toast('Could not copy — select the text manually','error'); }
  }));
}

// ── Logo (single-company build) ──────────────────────────────────────────────
// The app now runs for one company only, so there's no company list/selector
// any more — this just edits the CURRENT company's logo, which the Home screen
// and top bar read via companyLogoB64/_logoHTML().
async function renderSettingsLogoSection(){
  const body=document.getElementById('stg-logo-body');
  if(!body) return;
  let _logoB64=companyLogoB64||'';
  const _render=()=>{
    const prev=document.getElementById('stg-logo-preview');
    if(prev) prev.innerHTML=_logoB64?`<img src="${_logoB64}" style="width:100%;height:100%;object-fit:contain">`:`<span style="font-size:28px">🏢</span>`;
  };
  body.innerHTML=`
    <div style="display:flex;align-items:center;gap:14px">
      <div id="stg-logo-preview" style="width:80px;height:80px;border-radius:8px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0"></div>
      <div>
        <input type="file" id="stg-logo-inp" accept="image/*" style="font-size:12px">
        <button type="button" class="btn btn-ghost btn-sm" id="stg-logo-clear" style="margin-top:8px">Remove Logo</button>
      </div>
    </div>
    <button class="btn btn-green" id="btn-stg-logo-save" style="margin-top:16px">💾 Save Logo</button>`;
  _render();

  document.getElementById('stg-logo-inp').addEventListener('change',()=>{
    const f=document.getElementById('stg-logo-inp').files[0];
    if(!f) return;
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxDim=256;
        const scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        _logoB64=canvas.toDataURL('image/png');
        _render();
      };
      img.src=e.target.result;
    };

// Creates a new Firebase Auth account via the raw Identity Toolkit REST endpoint
// (NOT the client SDK's createUserWithEmailAndPassword, which would sign the
// currently-signed-in admin OUT of their own session and INTO the new account).
// A plain fetch() call never touches the SDK's in-memory auth state, so the
// admin's session stays untouched. The new user's Firestore profile doc is then
// written using the admin's own, still-active session/permissions.
async function adminCreateUser(email,password,displayName,companyIdVal,role){
  const resp=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.options.apiKey}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password,returnSecureToken:true})
  });
  const data=await resp.json();
  if(data.error) throw new Error(data.error.message==='EMAIL_EXISTS'?'A user with this email already exists':(data.error.message||'Failed to create user'));
  const uid=data.localId;
  await setDoc(doc(db,'users',uid),{
    email, displayName, company_id:companyIdVal, role,
    createdAt:serverTimestamp(), updatedAt:serverTimestamp()
  });
  return uid;
}

// ── Roles section ────────────────────────────────────────────────────────────
// Every role is one document in the Firestore 'roles' collection, listed,
// edited and deleted the same way. On first use the seed roles are written in
// so there is nothing that exists only in code, and no two-tier model for an
// admin to reason about.
//
// 'admin' is the single exception, and only to prevent an unrecoverable state —
// see PROTECTED_ROLE at the top of the script.
async function renderSettingsRolesSection(){
  const body=document.getElementById('stg-roles-body');
  if(!body) return;
  body.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted)"><div class="ring" style="margin:0 auto"></div></div>`;

  let saved={};
  try{
    const snap=await getDocs(collection(db,'roles'));
    snap.docs.forEach(d=>{
      if(d.id===ROLES_META_DOC){ _rolesSeeded = d.data()?.seeded===true; return; }
      if(_isRoleDocId(d.id)) saved[d.id]=d.data()||{};
    });

    // Materialise any seed role that has no document yet, ONCE. Gated on the
    // marker rather than on "is the collection empty", because an installation
    // can easily be part-populated — a custom role created under an earlier
    // version leaves exactly that state, and an emptiness check would then skip
    // seeding forever and show only that one role.
    //
    // After the marker is written this never runs again, so a role the admin
    // deletes stays deleted.
    if(!_rolesSeeded){
      const missing=Object.keys(SEED_ROLE_VIEWS).filter(k=>!(k in saved));
      await Promise.all(missing.map(k=>{
        const rec={name:k.charAt(0).toUpperCase()+k.slice(1), views:SEED_ROLE_VIEWS[k],
                   createdAt:serverTimestamp(), updatedAt:serverTimestamp()};
        saved[k]=rec;
        return setDoc(doc(db,'roles',k), rec);
      }));
      if(missing.length) logAudit('roles_seeded',{roles:missing},true);
      // The marker is an optimisation — it stops a deleted role from being
      // re-seeded. Losing it must not cost the admin the whole screen, so a
      // failure here is reported but not fatal: the roles above are already
      // written, and the next visit simply finds nothing missing and retries
      // the marker.
      try{
        await setDoc(doc(db,'roles',ROLES_META_DOC),
                     {seeded:true, seededAt:serverTimestamp(), seededBy:currentUserEmail||''});
        _rolesSeeded=true;
      }catch(e){
        console.warn('[Roles] seed marker not written:', e.message);
        toast('Roles are set up, but the one-time marker could not be saved — a deleted role may reappear. '+e.message,'error');
      }
    }
  }catch(e){ body.innerHTML=`<p style="color:red;padding:20px">${esc(e.message)}</p>`; return; }
  roleViewsMap=saved;   // keep the in-memory gate in step with what was just read

  const roles=_mergedRoleKeys().map(k=>({
    _id:k,
    name: saved[k]?.name || (k.charAt(0).toUpperCase()+k.slice(1)),
    views: Array.isArray(saved[k]?.views) ? saved[k].views : (SEED_ROLE_VIEWS[k]||[]),
  }));
  const viewKeys=Object.keys(HOME_BUTTONS);
  body.innerHTML=`
    <div class="toolbar"><span class="count-badge">${roles.length} roles</span>
      <button class="btn btn-green btn-sm" id="btn-new-role" style="margin-left:auto">＋ New Role</button></div>
    <div class="table-wrap"><table id="stg-roles-table">
      <thead><tr><th>Role Name</th><th>Key</th>${viewKeys.map(v=>`<th style="text-align:center">${HOME_BUTTONS[v][0]} ${HOME_BUTTONS[v][1]}</th>`).join('')}<th></th></tr></thead>
      <tbody>${roles.map(r=>{
        const locked = r._id===PROTECTED_ROLE;
        return `<tr data-key="${esc(r._id)}">
        <td><input class="form-input role-name-inp" data-key="${esc(r._id)}" value="${esc(r.name||r._id)}" style="padding:4px 7px;font-size:12px;min-width:100px"></td>
        <td style="font-family:monospace;font-size:11px;color:var(--muted)">${esc(r._id)}</td>
        ${viewKeys.map(v=>{
          const pin = locked && PROTECTED_VIEWS.includes(v);
          return `<td style="text-align:center"><input type="checkbox" class="role-view-chk"
            data-key="${esc(r._id)}" data-view="${v}"
            ${(r.views||[]).includes(v)||pin?'checked':''} ${pin?'disabled':''}
            ${pin?'title="Administrators must keep access to this screen — removing it would lock the system out of its own administration."':''}></td>`;
        }).join('')}
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-green btn-sm role-save" data-key="${esc(r._id)}">💾 Save</button>
          ${locked
            ? `<button class="btn btn-ghost btn-sm" disabled title="The administrator role cannot be deleted.">🔒</button>`
            : `<button class="btn btn-ghost btn-sm role-del" data-key="${esc(r._id)}" data-name="${esc(r.name||r._id)}">🗑</button>`}
        </td>
      </tr>`;}).join('')}</tbody>
    </table></div>`;

  document.getElementById('btn-new-role').addEventListener('click',()=>openNewRoleModal());

  body.querySelectorAll('.role-save').forEach(btn=>btn.addEventListener('click',async()=>{
    const key=btn.dataset.key;
    const name=(body.querySelector(`.role-name-inp[data-key="${key}"]`).value||'').trim()||key;
    let views=[...body.querySelectorAll(`.role-view-chk[data-key="${key}"]:checked`)].map(c=>c.dataset.view);
    // A disabled checkbox is still checked but is NOT submitted by a form read,
    // and more importantly the protected screens must survive regardless of what
    // the DOM says — this is the write path, so it is where the guarantee has to
    // hold.
    if(key===PROTECTED_ROLE) views=[...new Set([...views, ...PROTECTED_VIEWS])];
    btn.disabled=true; btn.textContent='Saving…';
    try{
      await setDoc(doc(db,'roles',key),{name,views,updatedAt:serverTimestamp()},{merge:true});
      roleViewsMap[key]={name,views};
      toast(`Role "${name}" saved`,'success');
      logAudit('role_saved',{role:key,name,views},true);
      // The current user may have just changed their own permissions.
      if(key===currentUserRole) renderHomeIfActive();
    }catch(e){ toast('Error: '+e.message,'error'); logAudit('role_saved',{role:key,error:e.message},false); }
    btn.disabled=false; btn.textContent='💾 Save';
  }));

  body.querySelectorAll('.role-del').forEach(btn=>btn.addEventListener('click',async()=>{
    const key=btn.dataset.key, name=btn.dataset.name;
    // Deleting a role that people are still assigned to would leave those
    // accounts pointing at nothing. Rather than silently reassigning them or
    // letting them fall back to a default they were never given, the delete is
    // refused and the admin is told how many users to move first.
    btn.disabled=true;
    let inUse=0;
    try{
      const snap=await getDocs(query(collection(db,'users'), where('role','==',key)));
      inUse=snap.size;
    }catch(e){
      toast('Could not check which users have this role: '+e.message,'error');
      btn.disabled=false; return;
    }
    if(inUse){
      toast(`"${name}" is assigned to ${inUse} user${inUse>1?'s':''} — reassign them first`,'error');
      btn.disabled=false; return;
    }
    if(!confirm(`Delete the role "${name}"? No users are assigned to it.`)){ btn.disabled=false; return; }
    try{
      await deleteDoc(doc(db,'roles',key));
      delete roleViewsMap[key];
      toast(`Role "${name}" deleted`,'success');
      logAudit('role_deleted',{role:key,name},true);
      renderSettingsRolesSection();
    }catch(e){
      toast('Error: '+e.message,'error'); logAudit('role_deleted',{role:key,error:e.message},false);
      btn.disabled=false;
    }
  }));
}

    <div class="modal-body">

          <input type="checkbox" class="nr-view-chk" value="${v}" style="width:auto"><span>${HOME_BUTTONS[v][0]} ${HOME_BUTTONS[v][1]}</span>
        </label>`).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" id="btn-nr-save">＋ Create</button>
    </div>
  </div>`);
  document.getElementById('btn-nr-save').addEventListener('click',async()=>{
    const name=document.getElementById('nr-name-inp').value.trim();
    // Leading/trailing underscores are stripped so the sanitiser can never
    // produce a bookkeeping-looking id, nor a Firestore-reserved one (any id
    // matching __.*__ is rejected outright by the server).
    const key=document.getElementById('nr-key-inp').value.trim().toLowerCase()
                .replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');
    const views=[...document.querySelectorAll('.nr-view-chk:checked')].map(c=>c.value);
    if(!name||!key){ toast('Name and key are required','error'); return; }
    // "Create" on an existing key is really an overwrite — it would silently
    // replace that role's permissions for everyone who has it. Checked against
    // what actually exists, so a role the admin deleted CAN be re-created.
    if(key in roleViewsMap || key===PROTECTED_ROLE){
      toast(`A role with the key "${key}" already exists — edit it in the table instead`,'error');
      return;
    }
    // Underscore-prefixed ids are bookkeeping documents, not roles.
    if(!_isRoleDocId(key)){ toast('A role key cannot start with an underscore','error'); return; }
    const btn=document.getElementById('btn-nr-save');
    btn.disabled=true; btn.textContent='Creating…';
    try{
      await setDoc(doc(db,'roles',key),{name,views,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      roleViewsMap[key]={name,views};
      toast(`Role "${name}" created`,'success');
      closeModal();
      renderSettingsRolesSection();
    }catch(e){ toast('Error: '+e.message,'error'); btn.disabled=false; btn.textContent='＋ Create'; }
  });
}


// ══════════════════════════════════════════════════════════════════════════════
// CUT & STRIP
// ------------------------------------------------------------------------------
// Turns one cable/harness drawing into a specification a bench operator can
// actually work from: verbal steps AND generated diagrams carrying the real
// dimensions.
//
// The hard constraint that shapes this whole module: a WRONG strip dimension
// destroys parts. Connector manufacturers publish strip dimensions in separate
// assembly specs that are frequently not in the drawing and often not public at
// all (Amphenol's SMP outline drawing, for instance, just says "see spec
// 349-50687"). So every dimension carries a `confirmed` flag. Anything the AI
// derived rather than read is rendered in red as TBC, and the sheet opens with
// a "do not cut production material" block listing exactly what's unverified.
// The operator is never left guessing which numbers are trustworthy.
//
// Specs are stored per drawing number at
//   companies/{cid}/cut_strip_specs/{sanitised drawing number}
// so re-analysing the same drawing UPDATES the sheet instead of piling up
// near-duplicates, and so it can be reopened later without paying for another
// AI call.
// ══════════════════════════════════════════════════════════════════════════════

let csSpecs   = [];      // cached list of saved specs
let csCurrent = null;    // spec object currently open, or null for the list view

function _csDocId(dwg){
  return String(dwg||'').trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,120)
         || ('UNTITLED_'+Date.now());
}
function _csNum(v){ const n=parseFloat(v); return Number.isFinite(n)?n:null; }
function _csMM(v){ const n=_csNum(v); return n==null ? '—' : (Math.round(n*100)/100)+' mm'; }
function _csR(n){ return Math.round(n*1000)/1000; }

// ── Harness model ─────────────────────────────────────────────────────────────
// A harness is CONNECTORS joined by SEGMENTS. One segment is one continuous cable
// run between two connectors; a multi-conductor segment additionally carries the
// wire-by-wire table the operator terminates from.
//
// The first version of this modelled a harness as one cable with two ends, which
// silently lost most of a real drawing: a wing-servo harness with three
// connectors and two cable runs came back as a single run with one end. Anything
// the model cannot represent is something the operator never sees, so the shape
// has to match the work.
//
// Specs saved under the old shape are migrated on read rather than left behind.
function _csSegments(spec){ return Array.isArray(spec?.segments) ? spec.segments : []; }
// A breakout is the point where a trunk fans out into branches. It is a NODE,
// not a connector: nothing is terminated there, so it gets no strip dimensions
// and no part number — but runs start and end at it, so it has to exist in the
// model or a breakout harness can only be described as a chain of connectors,
// which is a different harness from the one on the drawing.
function _csBreakouts(spec){ return Array.isArray(spec?.breakouts) ? spec.breakouts : []; }
function _csIsBreakout(spec, ref){
  const r=String(ref||'').toUpperCase();
  return _csBreakouts(spec).some(b=>String(b?.id||'').toUpperCase()===r);
}
function _csConnectors(spec){ return Array.isArray(spec?.connectors) ? spec.connectors : []; }
function _csSegLabel(seg){
  const f=String(seg?.from||'').trim(), t=String(seg?.to||'').trim();
  return (f&&t) ? `${f} → ${t}` : (seg?.id||'');
}
function _csSegEnds(seg, spec){
  const listed=Array.isArray(seg?.ends)?seg.ends:[];
  const isBrk=ref=>spec ? _csIsBreakout(spec, ref) : false;
  // A segment always has two physical ends. If the model only described one,
  // synthesise the other from `to` rather than dropping half the work.
  const refs=[seg?.from, seg?.to].filter(Boolean).map(String);
  return refs.map(ref=>{
    const found=listed.find(e=>String(e?.ref||'').toUpperCase()===ref.toUpperCase());
    // The junction flag depends on the REF, not on whether the model happened to
    // list that end — otherwise a breakout the model did list would be treated
    // as a real termination and the sheet would ask for strip dimensions there.
    if(found) return isBrk(ref) ? {...found, _breakout:true} : found;
    return {ref, strip:[], _missing:!isBrk(ref), _breakout:isBrk(ref)};
  }).concat(listed.filter(e=>!refs.some(r=>r.toUpperCase()===String(e?.ref||'').toUpperCase())));
}

// Old shape → new shape. Runs on parse AND on load, so a spec saved months ago
// renders through exactly the same code path as one made today.
function _csNormalize(spec){
  if(!spec || typeof spec!=='object') return spec;
  spec.connectors = Array.isArray(spec.connectors) ? spec.connectors : [];
  spec.segments   = Array.isArray(spec.segments)   ? spec.segments   : [];
  spec.breakouts  = Array.isArray(spec.breakouts)  ? spec.breakouts  : [];
  spec.route_dimensions = Array.isArray(spec.route_dimensions) ? spec.route_dimensions : [];
  // Specs saved before these fields existed load straight from Firestore without
  // passing through the parser, so the defaults have to live here as well.
  spec.engineering_notes = Array.isArray(spec.engineering_notes) ? spec.engineering_notes : [];
  spec.markers    = Array.isArray(spec.markers)  ? spec.markers  : [];
  if(spec.bundle && typeof spec.bundle!=='object') spec.bundle=null;

  if(!spec.segments.length && spec.cable){
    const c=spec.cable, legacyEnds=Array.isArray(spec.ends)?spec.ends:[];
    spec.segments=[{
      id:'S1',
      from: legacyEnds[0]?.ref || 'P1',
      to:   legacyEnds[1]?.ref || 'J1',
      cable_part_number:c.part_number||'', cable_description:c.description||'',
      type:c.type||'coax',
      finished_length_mm:c.finished_length_mm ?? null,
      length_basis:c.length_basis||'unclear',
      allowances:Array.isArray(c.allowances)?c.allowances:[],
      trim_allowance_mm:c.trim_allowance_mm ?? 0,
      trim_allowance_confirmed:c.trim_allowance_confirmed===true,
      cut_length_mm:c.cut_length_mm ?? null,
      cut_length_tolerance_mm:c.cut_length_tolerance_mm ?? null,
      cut_length_tolerance_confirmed:c.cut_length_tolerance_confirmed===true,
      layers:Array.isArray(c.layers)?c.layers:[],
      layers_confirmed:c.layers_confirmed!==false,
      ends:legacyEnds.map(e=>({ref:e.ref, strip:Array.isArray(e.strip)?e.strip:[],
                               strip_tolerance_mm:e.strip_tolerance_mm ?? null})),
      conductors:[], conductor_strip_mm:null, conductor_strip_confirmed:false,
      shield_treatment:'',
      _migrated:true,
    }];
    if(!spec.connectors.length)
      spec.connectors=legacyEnds.map(e=>({ref:e.ref, part_number:e.connector_pn||'',
        manufacturer:'', description:e.description||'', positions:null,
        termination:e.termination||'', contact_pn:'', datasheet_ref:e.datasheet_ref||''}));
  }

  // Connectors referenced by a segment but never described still need a row —
  // otherwise the operator sees a run going to a connector that isn't listed.
  const known=new Set(spec.connectors.map(c=>String(c?.ref||'').toUpperCase()));
  spec.segments.forEach(seg=>{
    seg.ends       = Array.isArray(seg.ends) ? seg.ends : [];
    seg.layers     = Array.isArray(seg.layers) ? seg.layers : [];
    seg.allowances = Array.isArray(seg.allowances) ? seg.allowances : [];
    seg.conductors = Array.isArray(seg.conductors) ? seg.conductors : [];
    seg.ends.forEach(e=>{ e.strip = Array.isArray(e.strip) ? e.strip : []; });
    [seg.from, seg.to].filter(Boolean).forEach(ref=>{
      if(_csIsBreakout(spec, ref)) return;      // a junction, not something to terminate
      if(!known.has(String(ref).toUpperCase())){
        known.add(String(ref).toUpperCase());
        spec.connectors.push({ref:String(ref), part_number:'', manufacturer:'',
          description:'', positions:null, termination:'', contact_pn:'', datasheet_ref:'',
          _inferred:true});
      }
    });
  });
  spec.segments.forEach((seg,i)=>{ if(!seg.id) seg.id='S'+(i+1); });
  return spec;
}

// ── Cut length, per segment ───────────────────────────────────────────────────
// The number on the drawing is almost never the number to cut. Cable is consumed
// by whatever sits inside each connector, by the jacket strip that lets the
// conductors fan out, and by squaring the end and re-doing a bad strip. Cutting
// to the dimensioned length produces a run that is short — which is scrap,
// because you cannot add cable back.
//
// The sum is computed HERE from its parts rather than taken from the model's own
// cut_length_mm. If the two disagree, the parts win: an operator can check
// 150 + 25 + 4 + 5, and cannot check a single number that arrived out of nowhere.
// Radion's convention, confirmed by Dima: the length dimensioned on a drawing runs
// to where the JACKET ends, not to the connector face. So every end costs the
// jacket strip plus a fixed handling margin, and a 180 mm run is cut at
//   180 + (8 + 1.5) + (8 + 1.5) = 199 mm.
//
// The strip term is READ FROM THE STRIP DIMENSIONS, never from "allowances". That
// is what makes the double count structurally impossible rather than merely
// forbidden: the analysis supplies the strip once, in the one place it belongs,
// and the app does the adding.
const _CS_END_MARGIN_MM = 1.5;
const _CS_BASIS_JACKET  = 'to_jacket_end';
const _CS_CUT_MODEL     = 'jacket_end_v1';   // stamped on every new analysis

function _csEndMargin(seg, spec){
  const v=_csNum(seg?.end_margin_mm);
  if(v!=null) return v;
  const g=_csNum(spec?.end_margin_mm);
  return g!=null ? g : _CS_END_MARGIN_MM;
}
// The jacket strip at one end: the outermost cut, which by the layer rule is the
// first non-derived entry. Derived values (C = A − B and friends) are consequences
// of the others and would double-count if included.
function _csJacketStrip(end){
  const first=(end?.strip||[]).find(x=>!x.derived && _csNum(x.value_mm)!=null);
  return first ? {mm:_csNum(first.value_mm), code:first.code||'', confirmed:first.confirmed===true} : null;
}

function _csCutLength(seg, spec){
  const finished=_csNum(seg?.finished_length_mm);
  const allowances=(Array.isArray(seg?.allowances)?seg.allowances:[])
    .map(a=>({ref:String(a?.ref||''), mm:_csNum(a?.mm)||0,
              reason:String(a?.reason||''), confirmed:a?.confirmed===true}))
    .filter(a=>a.mm!==0 || a.reason);
  const trim=_csNum(seg?.trim_allowance_mm)||0;

  // Under the jacket-end convention the per-end cost is derived here rather than
  // taken from the analysis. Specs saved under the old basis keep their stored
  // allowances so their numbers do not move under anyone's feet.
  const declared=String(seg?.length_basis||'');
  const stamped = String(spec?.cut_model||'')===_CS_CUT_MODEL;
  // A stamped spec always costs by the convention, whatever length_basis says.
  // An unstamped one was saved before the convention existed, so its arithmetic
  // is left exactly as it was — numbers on a shop-floor sheet must not move
  // under someone who already read them.
  const basis = stamped ? _CS_BASIS_JACKET
              : ((declared==='' || declared==='unclear') ? _CS_BASIS_JACKET : declared);
  if(basis===_CS_BASIS_JACKET && finished!=null){
    const margin=_csEndMargin(seg, spec);
    const ends=[];
    (seg.ends||[]).forEach(e=>{
      const js=_csJacketStrip(e);
      if(!js) return;
      ends.push({ref:e.ref||'', mm:_csR(js.mm+margin), strip:js.mm, margin,
                 code:js.code, confirmed:js.confirmed});
    });
    // An end whose cost this convention already derives must not ALSO carry an
    // allowance: the analysis's 4 mm insertion depth and the 1.5 mm margin are two
    // accounts of the same millimetres, and adding both is the double count in a
    // new costume. The per-end ones are superseded and reported; anything left —
    // a service loop, an allowance at no particular end — is genuinely extra and
    // still counts.
    const costed=new Set(ends.map(e=>String(e.ref||'').toUpperCase()).filter(Boolean));
    const extra=allowances.filter(a=>!costed.has(String(a.ref||'').toUpperCase()));
    const superseded=allowances.filter(a=>costed.has(String(a.ref||'').toUpperCase()));
    const added=_csR(ends.reduce((s,e)=>s+e.mm,0) + extra.reduce((s,a)=>s+a.mm,0) + trim);
    return {finished, allowances:extra, superseded, endCosts:ends, trim, added, basis,
            total:_csR(finished+added), hasBreakdown:true,
            allConfirmed: ends.every(e=>e.confirmed) && extra.every(a=>a.confirmed)
                          && (!trim || seg.trim_allowance_confirmed===true)};
  }

  if(finished==null){
    return {finished:null, allowances:[], superseded:[], endCosts:[], trim:0, basis,
            total:_csNum(seg?.cut_length_mm), hasBreakdown:false,
            allConfirmed:false, added:0};
  }
  const added=_csR(allowances.reduce((s,a)=>s+a.mm,0)+trim);
  return {
    finished, allowances, superseded:[], endCosts:[], trim, added, basis,
    total:_csR(finished+added),
    hasBreakdown:true,
    allConfirmed: allowances.every(a=>a.confirmed) && (!trim || seg.trim_allowance_confirmed===true),
  };
}
function _csSyncCutLength(spec){
  _csSegments(spec).forEach(seg=>{
    const r=_csCutLength(seg, spec);
    if(r.hasBreakdown) seg.cut_length_mm=r.total;
  });
}
// Human-readable arithmetic, e.g. "150 + 25 (P1) + 4 (WSRV1) + 5 (trim) = 184 mm".
// Deliberately spelled out: a worker who can see the sum can spot a wrong term.
function _csCutFormula(seg, spec){
  const r=_csCutLength(seg, spec);
  if(!r.hasBreakdown) return '';
  const parts=[`${r.finished}`]
    // Each end is spelled out as strip + margin, so the operator can see both
    // numbers and check them against the strip table rather than trusting a total.
    .concat((r.endCosts||[]).map(e=>`+ ${e.strip} + ${e.margin} (${e.ref||e.code})`))
    .concat(r.allowances.map(a=>`${a.mm<0?'−':'+'} ${Math.abs(a.mm)}${a.ref?` (${a.ref})`:''}`))
    .concat(r.trim ? [`+ ${r.trim} (${_csT('trim')})`] : []);
  return `${parts.join(' ')} = ${r.total} mm`;
}
// ── End-to-end routes ────────────────────────────────────────────────────────
// A drawing dimensions from connector to connector. When a harness genuinely has
// a breakout, the run the operator reads on the paper is trunk + branch, which
// is NOT any single segment. Computing it here lets the sheet show the same
// number the drawing shows, next to the per-run length that gets cut.
//
// It also catches the mistake this was written for: a "200 mm" that only reaches
// the breakout. If a route the drawing dimensions at 200 adds up to something
// else here, the two disagree in the open and somebody notices, instead of a
// wire being cut short.
function _csRoutes(spec){
  const segs=_csSegments(spec);
  const isTerm=ref=>!!ref && !_csIsBreakout(spec, ref);
  const adj={};
  segs.forEach(sg=>{
    if(!sg.from||!sg.to||sg.from===sg.to) return;
    (adj[sg.from]=adj[sg.from]||[]).push({to:sg.to, seg:sg});
    (adj[sg.to]  =adj[sg.to]  ||[]).push({to:sg.from, seg:sg});
  });
  const terminals=[...new Set(segs.flatMap(sg=>[sg.from,sg.to]).filter(isTerm))];
  const out=[], seen=new Set();
  terminals.forEach(start=>{
    // Walk outward, passing THROUGH breakouts and stopping at the first terminal.
    const stack=[{node:start, mm:0, via:[]}];
    let guard=0;
    while(stack.length && guard++<5000){
      const cur=stack.pop();
      (adj[cur.node]||[]).forEach(edge=>{
        if(cur.via.includes(edge.seg.id)) return;      // never reuse a run
        const mm=cur.mm + (_csNum(edge.seg.finished_length_mm)||0);
        const via=[...cur.via, edge.seg.id];
        if(isTerm(edge.to)){
          if(edge.to===start) return;
          const key=[start,edge.to].sort().join('|')+'#'+via.slice().sort().join(',');
          if(!seen.has(key)){ seen.add(key); out.push({from:start,to:edge.to,mm:_csR(mm),via}); }
          return;
        }
        stack.push({node:edge.to, mm, via});
      });
    }
  });
  return out;
}
// A dimension the drawing gives that our own run lengths do not reproduce.
// Reported, never reconciled: the drawing is the authority, and quietly adjusting
// a length to match would hide which of the two is wrong.
function _csRouteMismatches(spec){
  const dims=Array.isArray(spec?.route_dimensions)?spec.route_dimensions:[];
  if(!dims.length) return [];
  const routes=_csRoutes(spec);
  const key=(a,b)=>[String(a||'').toUpperCase(),String(b||'').toUpperCase()].sort().join('|');
  const best={};
  routes.forEach(r=>{ const k=key(r.from,r.to); if(best[k]==null||r.mm>best[k]) best[k]=r.mm; });
  return dims.map(d=>{
    const drawn=_csNum(d.mm), got=best[key(d.from,d.to)];
    if(drawn==null || got==null) return null;
    return Math.abs(drawn-got)>0.5 ? {from:d.from,to:d.to,drawn,got:_csR(got),what:d.what||''} : null;
  }).filter(Boolean);
}

// Total cable to draw off the reel, per cable part number — what stores issues.
// The failure this catches: an 8 mm jacket strip written into "allowances" as
// well as into "strip", so the same end is paid for twice and the cut length
// comes out 8 mm long per end. Reported, never silently corrected — which of the
// two numbers is wrong is a question about the drawing, not about arithmetic.
function _csAllowanceDoubles(spec){
  const out=[];
  _csSegments(spec).forEach(seg=>{
    const ends={};
    (seg.ends||[]).forEach(e=>{
      ends[String(e.ref||'').toUpperCase()]=(e.strip||[])
        .filter(x=>!x.derived).map(x=>({code:x.code, mm:_csNum(x.value_mm)}))
        .filter(x=>x.mm!=null);
    });
    (seg.allowances||[]).forEach(a=>{
      const mm=_csNum(a.mm), ref=String(a.ref||'').toUpperCase();
      if(mm==null || !ends[ref]) return;
      const hit=ends[ref].find(x=>Math.abs(x.mm-mm)<0.01);
      if(hit) out.push({seg:seg.id, ref:a.ref, mm, code:hit.code, reason:a.reason||''});
    });
  });
  return out;
}

// Length is drawn from a reel, so this list may only contain cable. A run whose
// "cable_part_number" is in fact a connector's part number produced a stores line
// telling the storeman to fetch 570 mm of fan — so those are separated out and
// named rather than quietly totalled.
// "If a number appears in the prose it must be the same number in the sum and on
// the figure." The sum and the figures already read the same fields, so they
// cannot drift. The prose is written by the analysis and can. This finds every
// millimetre figure quoted in the step text and reports any that is not one of
// the sheet's own numbers — which is exactly how "add 4 mm" ended up beside a
// figure showing 8 mm.
function _csKnownNumbers(spec){
  const n=new Set(); const add=v=>{ const x=_csNum(v); if(x!=null) n.add(_csR(x)); };
  add(spec?.overall_length_mm); add(spec?.end_margin_mm); n.add(_CS_END_MARGIN_MM);
  (spec?.route_dimensions||[]).forEach(d=>add(d.mm));
  (spec?.markers||[]).forEach(m=>add(m.distance_mm));
  (spec?.sleeves||[]).forEach(x=>{ add(x.length_mm); add(x.distance_mm); });
  if(spec?.bundle) add(spec.bundle.length_mm);
  _csSegments(spec).forEach(seg=>{
    const c=_csCutLength(seg, spec);
    add(seg.finished_length_mm); add(c.total); add(c.added); add(seg.cut_length_tolerance_mm);
    add(seg.trim_allowance_mm); add(seg.conductor_strip_mm);
    (c.endCosts||[]).forEach(e=>{ add(e.mm); add(e.strip); add(e.margin); });
    (c.allowances||[]).forEach(a=>add(a.mm));
    // Deliberately NOT the superseded ones. A superseded allowance is a number
    // the sheet decided not to act on, so prose quoting it is the exact error
    // this check exists to catch: "add 4 mm" printed beside a figure showing 8.
    (seg.layers||[]).forEach(l=>add(l.od_mm));
    (seg.ends||[]).forEach(e=>{ add(e.strip_tolerance_mm);
      (e.strip||[]).forEach(x=>add(x.value_mm)); });
  });
  return n;
}
function _csNumberConflicts(spec){
  const known=_csKnownNumbers(spec), out=[];
  const scan=(text, where)=>{
    String(text||'').replace(/(\d+(?:[.,]\d+)?)\s*(?:mm|מ״מ|מ"מ|מ׳׳מ)/gi, (m,d)=>{
      const v=_csR(parseFloat(String(d).replace(',','.')));
      if(v!=null && !known.has(v)) out.push({value:v, where, text:String(text).slice(0,120)});
      return m;
    });
  };
  (spec?.steps||[]).forEach((st,i)=>{ scan(st.title,`${_csT('Step')} ${st.n??i+1}`);
    scan(st.body,`${_csT('Step')} ${st.n??i+1}`); scan(st.critical,`${_csT('Step')} ${st.n??i+1}`); });
  (spec?.inspection||[]).forEach(t=>scan(t, _csT('Inspection')));
  (spec?.engineering_notes||[]).forEach(nt=>scan(nt.action, _csT('Engineering notes from the drawing')));
  // one report per distinct number, not one per mention
  const seen=new Set();
  return out.filter(o=>{ const k=o.value+'|'+o.where; if(seen.has(k)) return false; seen.add(k); return true; });
}

function _csCableTotals(spec){
  const conn=new Set(_csConnectors(spec).map(c=>String(c.part_number||'').trim().toUpperCase()).filter(Boolean));
  const by={};
  _csSegments(spec).forEach(seg=>{
    const k=seg.cable_part_number||seg.cable_description||'—';
    if(conn.has(String(k).trim().toUpperCase())) return;   // not a cable — see _csCableSuspects
    const mm=_csCutLength(seg, spec).total;
    if(mm==null) return;
    (by[k]=by[k]||{pn:k, mm:0, runs:0}); by[k].mm=_csR(by[k].mm+mm); by[k].runs++;
  });
  return Object.values(by);
}
function _csCableSuspects(spec){
  const conn=new Map(_csConnectors(spec)
    .filter(c=>c.part_number)
    .map(c=>[String(c.part_number).trim().toUpperCase(), c]));
  const out=[];
  _csSegments(spec).forEach(seg=>{
    const k=String(seg.cable_part_number||'').trim().toUpperCase();
    if(k && conn.has(k)) out.push({seg:seg.id, pn:seg.cable_part_number, ref:conn.get(k).ref||''});
  });
  return out;
}

// The analysis states what it counted on the drawing; this compares that against
// what it actually produced. Same discipline as _csRouteMismatches: report the
// gap, never paper over it. A label the analysis dropped is invisible otherwise,
// and "invisible" is exactly how D and F went missing twice running.
function _csCountMismatches(spec){
  const c=(spec&&spec.counts)||{}; const out=[];
  const cmp=(said, got, what)=>{
    const n=_csNum(said);
    if(n==null || n===got) return;
    out.push({what, said:n, got, missing:n-got});
  };
  cmp(c.marking_table_rows, (spec?.markers||[]).length, 'Labels in the marking table');
  // Count only the connectors the analysis actually DESCRIBED. _csNormalize
  // back-fills a row for any ref a segment mentions, which keeps the model sound
  // but would otherwise mask the thing this check exists to catch: P4 present as
  // an endpoint, absent from the connector list, with no part number behind it.
  cmp(c.connectors_on_drawing, _csConnectors(spec).filter(x=>!x._inferred).length,
      'Connectors on the drawing');
  cmp(c.cable_runs, _csSegments(spec).length, 'Cable runs');
  return out;
}

// The harness's own overall length — the single number a planner quotes and a
// stores clerk checks. Three candidates can disagree: what the drawing states,
// the longest end-to-end route through the model, and the longest single run.
// We report all three rather than picking one, for the same reason
// _csRouteMismatches reports instead of reconciling: which one is wrong is
// exactly the thing a human has to decide.
function _csOverall(spec){
  const stated=_csNum(spec&&spec.overall_length_mm);
  let longest=null, span=null;
  _csRoutes(spec).forEach(r=>{ if(r.mm!=null && (longest==null||r.mm>longest)){ longest=r.mm; span=r.from+' → '+r.to; } });
  if(longest==null) _csSegments(spec).forEach(seg=>{
    const f=_csCutLength(seg, spec).finished ?? _csNum(seg.finished_length_mm);
    if(f!=null && (longest==null||f>longest)){ longest=f; span=_csSegLabel(seg); } });
  const value = stated ?? longest;
  const mismatch = (stated!=null && longest!=null && Math.abs(stated-longest)>0.5)
    ? {stated, longest, span} : null;

  // The drawing's overall length is a FINISHED length — note 2 on this very
  // drawing says so ("the specified cable length is without the connectors").
  // Nobody cuts that. The number the operator needs is the longest CUT length,
  // allowances included, so both are reported and the cut one is the headline.
  let cut=null, cutSpan=null, added=0;
  _csSegments(spec).forEach(seg=>{
    const cl=_csCutLength(seg, spec);
    if(cl.total!=null && (cut==null || cl.total>cut)){
      cut=cl.total; cutSpan=_csSegLabel(seg); added=cl.added||0;
    }
  });
  return {value, stated, longest, span, mismatch, cut, cutSpan, added};
}

// This screen behaves differently from the Labor Breakdown dialog, on purpose.
// A breakdown is read by whoever is quoting; a cut & strip sheet is read at the
// bench, by the same people, every day. So Hebrew is the default and the choice
// STICKS: making an operator press a language button every single time they open
// a work instruction is friction with no upside.
//
// English remains the stored source of truth — the AI produces English, and
// Hebrew and Russian are translations of it. That matters for editing: see
// _csT and _csCollectEdits.
const _CS_CACHE_KEY='cut_strip_tr_cache';
const _CS_LANG_KEY='cut_strip_lang';
// The language every analysis is written in, regardless of what the screen is
// showing. Kept separate from the DISPLAY language on purpose: the sheet is a
// shop-floor document in Hebrew, and having one source language means a spec
// reads the same however it was created, and there is a single path to every
// other language rather than one path per starting point.
const _CS_SOURCE_LANG='he';
let _csLang = (()=>{
  try{ const v=localStorage.getItem(_CS_LANG_KEY); return ['en','he','ru'].includes(v) ? v : 'he'; }
  catch{ return 'he'; }
})();
function _csSetLang(l){
  _csLang=l;
  try{ localStorage.setItem(_CS_LANG_KEY,l); }
  catch(e){ console.warn('[CutStrip] language choice not saved:', e.message); }
}
let _csCache = (()=>{
  try{ const c=JSON.parse(localStorage.getItem(_CS_CACHE_KEY))||{}; return {he:c.he||{}, ru:c.ru||{}}; }
  catch{ return {he:{}, ru:{}}; }
})();
function _csSaveCache(){
  try{ localStorage.setItem(_CS_CACHE_KEY, JSON.stringify(_csCache)); }
  catch(e){ console.warn('[CutStrip] translation cache not saved:', e.message); }
}
function _csRTL(){ return _csLang==='he'; }

// ── Two lookups, deliberately separate ────────────────────────────────────────
// _csT  — FIXED CHROME. Section headings, column names, buttons. Always keyed by
//         the English literal written in this file, always answered from
//         _CS_LABELS. Never involves the AI, so the structure of the sheet
//         renders correctly even with no network at all.
//
// _csP  — SPEC PROSE. The sentences the AI wrote. These are stored in whatever
//         language the analysis was RUN in (spec.lang, Hebrew by default), so
//         when the sheet is displayed in that same language there is nothing to
//         translate and nothing that can fail.
//
// Conflating the two was a latent bug: with Hebrew-native specs, a chrome label
// would have been treated as already-translated and shown in English.
function _csT(text){
  if(_csLang==='en') return text;
  return (_CS_LABELS[_csLang]||{})[String(text||'')] || text;
}
// Language the stored prose is written in. Specs created before Hebrew-native
// analysis have no marker and are English.
function _csSrcLang(spec){ return (spec && spec.lang) || 'en'; }

// Lookup order matters. A human override saved on THIS spec beats the shared
// machine-translation cache, and both beat the source text. That is what makes
// "fix the wording and have it stay fixed" work: the correction is stored
// against the spec, so reopening — or someone else opening it — sees the
// corrected wording rather than the machine's first attempt.
function _csP(text){
  const t=String(text||'');
  const src=_csSrcLang(csCurrent);
  const ov=(csCurrent && csCurrent.overrides && csCurrent.overrides[_csLang]) || {};
  if(ov[t]) return ov[t];
  if(_csLang===src) return t;                 // nothing to do — the common path
  return (_csCache[_csLang]||{})[t] || t;     // fall back to the source, never blank
}

// Makes sure every prose string has a translation before the sheet is drawn.
// Returns immediately — no network at all — when the sheet is being shown in
// the language it was generated in, which is the normal case.
//
// Deliberately non-fatal: if translation fails, the sheet still opens in its
// source language with the reason shown. A work instruction that renders in the
// wrong language is usable; one that refuses to render is not.
async function _csEnsureLang(spec, lang, onProgress){
  if(!spec || lang===_csSrcLang(spec)) return true;
  const ov=(spec.overrides&&spec.overrides[lang])||{};
  const bucket=_csCache[lang]||{};
  const todo=_csProseStrings(spec).filter(t=>!ov[t] && !bucket[t]);
  if(!todo.length) return true;
  try{ await _csTranslate(todo, lang, onProgress); return true; }
  catch(e){
    console.warn('[CutStrip] auto-translate failed:', e.message);
    toast(`Showing in ${_CS_LANG_NAMES[_csSrcLang(spec)]||'the original language'} — ${e.message}`,'error');
    _csSetLang(_csSrcLang(spec));
    return false;
  }
}

// Every free-text string on the sheet that came from the AI rather than from
// the label table. Collected in one place so translation is a single batched
// request instead of one call per sentence.
function _csProseStrings(spec){
  const _extra=[];
  (spec?.engineering_notes||[]).forEach(n=>{ _extra.push(n.text, n.action); });
  (spec?.markers||[]).forEach(m=>_extra.push(m.position));
  if(spec?.bundle){ _extra.push(spec.bundle.note, spec.bundle.method); }
  const out=[];
  const push=v=>{ const t=String(v||'').trim(); if(t) out.push(t); };
  _extra.forEach(push);
  (spec.steps||[]).forEach(s=>{ push(s.title); push(s.body); push(s.critical); });
  (spec.inspection||[]).forEach(push);
  (spec.open_items||[]).forEach(o=>{ push(o.what); push(o.why); push(o.action); });
  (spec.discrepancies||[]).forEach(d=>{ push(d.what); push(d.detail); });
  (spec.tools||[]).forEach(t=>{ push(t.tool); push(t.note); });
  (spec.materials||[]).forEach(m=>push(m.description));
  _csConnectors(spec).forEach(c=>push(c.description));
  _csSegments(spec).forEach(seg=>{
    push(seg.cable_description); push(seg.shield_treatment);
    (seg.layers||[]).forEach(l=>{ push(l.name); push(l.note); });
    (seg.allowances||[]).forEach(a=>push(a.reason));
    (seg.ends||[]).forEach(e=>(e.strip||[]).forEach(x=>{ push(x.label); push(x.basis); }));
    (seg.conductors||[]).forEach(w=>push(w.note));
  });
  return [...new Set(out)];
}


// Sent in CHUNKS, not as one request. A real spec routinely carries 150+
// sentences once open items and inspection lines are counted; asking for all of
// them at once produced a response big enough to blow the 60s request timeout,
// which failed the whole translation and left the sheet in the wrong language.
// Chunks also degrade gracefully: if the fourth batch fails, the first three are
// already cached and only the remainder is missing.
const _CS_TR_CHUNK=20;
async function _csTranslate(texts, lang, onProgress){
  const bucket=_csCache[lang] || (_csCache[lang]={});
  const todo=[...new Set(texts.map(t=>String(t||'').trim()).filter(t=>t && !bucket[t]))];
  if(!todo.length) return true;
  if(!anthKey) throw new Error(_AI_NO_KEY);

  const chunks=[];
  for(let i=0;i<todo.length;i+=_CS_TR_CHUNK) chunks.push(todo.slice(i,i+_CS_TR_CHUNK));
  let done=0, firstError=null;
  for(const chunk of chunks){
    try{ await _csTranslateChunk(chunk, lang, bucket); }
    catch(e){ if(!firstError) firstError=e; }
    done+=chunk.length;
    if(onProgress) onProgress(done, todo.length);
  }
  _csSaveCache();
  // Only fail outright if NOTHING landed. A partly translated sheet still shows
  // every dimension and diagram correctly, and the untranslated lines fall back
  // to their source text rather than going blank.
  const got=todo.filter(t=>bucket[t]).length;
  if(!got && firstError) throw firstError;
  if(firstError) toast(`${todo.length-got} of ${todo.length} lines could not be translated — those stay in the original language`,'error');
  return true;
}
async function _csTranslateChunk(todo, lang, bucket){
  const langName = lang==='ru' ? 'Russian' : (lang==='he' ? 'Hebrew' : 'English');
  const prompt=`Translate each of these cable-harness shop-floor work instruction strings into ${langName}.\n`
    +'Rules:\n'
    +'- Keep part numbers, standards (IPC/WHMA-A-620, MIL-DTL-17), reference designators (P1, J1), dimension codes (A, B, C) and all units EXACTLY as they are.\n'
    +'- Keep numbers and their units unchanged (e.g. "320 mm" stays "320 mm").\n'
    +'- Technical terms a technician normally says in English (crimp, PTFE, VSWR, PCB) may stay in English.\n'
    +'- These are safety-relevant instructions. Translate precisely; do not soften, shorten or embellish.\n'
    +'- Return ONLY a JSON array of the translated strings, same order, same length. No commentary.\n\n'
    +JSON.stringify(todo, null, 0);

  const resp=await _fetchWithRetry('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'x-api-key':anthKey,'anthropic-version':'2023-06-01',
             'anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:16000,temperature:0,
                         messages:[{role:'user',content:prompt}]})
  });
  if(!resp.ok){ let m=`Anthropic error ${resp.status}`;
    try{const e=await resp.json(); m=e.error?.message||m;}catch{} throw new Error(m); }
  const raw=(await resp.json()).content[0].text;
  const m=String(raw).match(/\[[\s\S]*\]/);
  if(!m) throw new Error('Translation came back in an unexpected format');
  const arr=JSON.parse(m[0]);
  // A length mismatch means the lines no longer line up with their originals.
  // Caching by position would then attach the wrong translation to the wrong
  // instruction — on a work instruction that is a safety problem, not a
  // cosmetic one, so refuse the whole batch.
  if(!Array.isArray(arr) || arr.length!==todo.length)
    throw new Error(`Translation returned ${Array.isArray(arr)?arr.length:'?'} lines for ${todo.length} strings`);
  todo.forEach((t,i)=>{ const v=String(arr[i]||'').trim(); if(v) bucket[t]=v; });
  return true;
}

// ── AI analysis ───────────────────────────────────────────────────────────────
// Reading a whole drawing and emitting several thousand tokens of structured
// JSON is the longest single request this app makes. 60s — the app-wide default
// — was cutting it off mid-generation and reporting it as a hang.
const _CS_ANALYSIS_TIMEOUT = 180000;
// Output budget. 8192 was enough for one coax with two ends in English; it is
// not enough for a real harness. The schema now carries connectors, one block
// per cable run, and a wiring table per run — and Hebrew costs roughly twice
// the tokens of the same English text. The two together overran the limit and
// the reply came back cut off mid-string, which surfaced as "malformed JSON"
// when the real cause was that the model was still writing.
const _CS_MAX_TOKENS = 32000;
// Vision needs to read dimension callouts, not fine-print BOM rows, so the
// analysis image can be smaller than the one BOM extraction uses. Less to
// upload is less time spent before the model even starts.
const _CS_IMG_MAXDIM = 1800, _CS_IMG_QUALITY = 0.82;
// A second, smaller copy is kept ON the spec as the reference figure. It has to
// live inside the Firestore document, which caps at 1 MB for everything else
// too, so it is deliberately smaller than the one sent for analysis and is
// dropped rather than risking a save that fails.
const _CS_REF_MAXDIM = 1400, _CS_REF_QUALITY = 0.68, _CS_REF_MAX_BYTES = 420000;

// Provider errors are quoted verbatim, but a few of them have a specific fix
// the user would otherwise have to go and look up.
function _csProviderHint(provider, msg){
  const m=String(msg||'');
  if(/service account is deleted or disabled|API key not valid|API_KEY_INVALID/i.test(m))
    return `${provider} rejected the key: ${m} → the key needs to be re-issued in Admin → AI API Keys.`;
  if(/quota|rate limit|429|insufficient|credit balance/i.test(m))
    return `${provider} is out of quota or credit: ${m} → check the account's billing, or use the other provider.`;
  return m;
}

// Re-encodes an already-rendered page smaller. Rendering again from the PDF
// would be cleaner but costs a second full render; this is a cheap resize of
// something already in memory.
function _csShrinkJpeg(b64, maxDim, quality){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      // The whole body is guarded, not just toDataURL. A throw anywhere in here
      // used to leave this promise unsettled forever — the analysis would then
      // hang until the 180 s timeout with no clue why. Allocating a canvas for a
      // large scan is exactly the kind of call that fails on a loaded machine.
      try{
        const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
        if(scale>=1){ resolve(b64); return; }
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',quality).split(',')[1]);
      }catch{ resolve(b64); }   // tainted canvas, no memory — the original still works
    };
    img.onerror=()=>resolve(b64);     // never let a resize failure block the analysis
    img.src='data:image/jpeg;base64,'+b64;
  });
}

// The title block carries the customer's logo and name, and the sheet goes to a
// shop floor that should not be carrying someone else's branding. Asking a vision
// model where the logo was did not work — it ate the drawing number and left the
// logo showing. A fixed region does work, because on an ISO/ANSI sheet the title
// block is always the bottom-right corner. Nothing identifying is lost: drawing
// number, name, project and revision are already printed at the top of the sheet.
// Checked against the real WLS-122-050 sheet: this clears the logo, the company
// name and the whole title block while leaving the part list — including its QTY
// and Ref columns — fully readable.
const _CS_TITLEBLOCK = {x:0.655, y:0.775};   // masked from here to the bottom-right corner
function _csMaskTitleBlock(b64){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');
        c.width=img.width; c.height=img.height;
        const ctx=c.getContext('2d');
        ctx.drawImage(img,0,0);
        const x=_CS_TITLEBLOCK.x*img.width, y=_CS_TITLEBLOCK.y*img.height;
        ctx.fillStyle='#FFFFFF';
        ctx.fillRect(x, y, img.width-x, img.height-y);
        resolve(c.toDataURL('image/jpeg',0.9).split(',')[1]);
      }catch{ resolve(null); }   // could not mask ⇒ do not store, handled by caller
    };
    img.onerror=()=>resolve(null);
    img.src='data:image/jpeg;base64,'+b64;
  });
}

// A reference copy of the drawing, small enough to travel inside the Firestore
// document. Returns null rather than an oversized string: a spec that fails to
// save is far worse than a spec without the picture attached.
async function _csRefImage(b64){
  try{
    if(!b64) return null;
    // Masking first, so the branding is gone before anything is stored. A failure
    // here returns null rather than the original: publishing a customer's logo is
    // the one outcome worth losing the picture over.
    const masked=await _csMaskTitleBlock(b64);
    if(!masked) return null;
    const small=await _csShrinkJpeg(masked, _CS_REF_MAXDIM, _CS_REF_QUALITY);
    if(!small || small.length > _CS_REF_MAX_BYTES){
      console.log('[CutStrip] reference image dropped —',
        small?(small.length/1e3).toFixed(0)+' kB over budget':'shrink failed');
      return null;
    }
    return small;
  }catch(e){ console.log('[CutStrip] reference image skipped:', e.message); return null; }
}

// The analysis writes its prose DIRECTLY in the language the sheet will be read
// in. This is not a convenience — it removes the entire translate-after-the-fact
// round trip from the normal path. That second call was both the slowest part of
// creating a spec and its most common failure: a real drawing yields well over a
// hundred sentences, and translating them all was enough to hit the request
// timeout. Writing them in Hebrew the first time costs nothing extra, because
// the model is composing those sentences either way.
function _csPrompt(lang){
  const LANGS={he:'Hebrew', ru:'Russian', en:'English'};

  // the two copies is English — the schema comments, the rules, the worked
  // examples — and a model that has just read four thousand words of English
  // writes English unless told otherwise as the last thing it sees.
  const langTail = langName==='English' ? '' :

"action", every "reason", every "position", every description, every layer name and note.
Notes and text ON THE DRAWING are usually printed in English — translate them into ${langName} as you
record them. "Copy the note" means keep its meaning and its number, not its language.
In Latin, untranslated: part numbers, manufacturer names, standards, reference designators (P1, P4),
dimension codes (A, B, C), signal names, colours, units, drawing_number, drawing_name, project, and
every JSON key and enum value.
If you have written an open item or a discrepancy in English, rewrite it in ${langName} before you answer.
──────────────────────────────────────────────────────────────────────`;

  const langRule = langName==='English' ? '' :
`

Write every human-readable string in ${langName}. That means: all step titles and bodies,
all "critical" warnings, every inspection line, every layer name and note, every strip label and
"basis" text, every tool name and note, all open_items and discrepancies text, and all descriptions.

Keep these in their original Latin form, never translated or transliterated:
  - drawing_number, drawing_name and project — copy these from the title block EXACTLY as printed,

  - part numbers and catalogue numbers (ISDF-04-D-M, RG-405SS, 50-57-9403)

Enum values ("coax", "multi_conductor", "crimp", "cable_only" …) also stay English.

  return `You are a cable-harness manufacturing engineer. From this drawing, produce a CUT AND STRIP specification that a bench operator can work from.
${langRule}
Return ONLY a JSON object. No markdown fence, no commentary.

{

  "drawing_name": "the Description / title of the harness, copied VERBATIM from the title block — never translated",
  "project": "the Project field, e.g. \\"H-120 GEN C\\" — the programme this belongs to, NOT the drawing number",
  "revision": "e.g. 01.0",

             "connectors_on_drawing": <how many distinct connector refs the assembly view and part list show>,
             "cable_runs": <how many separate cable runs there are>},

  "breakouts": [ {"id":"BR1","note":"where the trunk fans out into the branches"} ],

    { "ref":"J1", "kind":"connector | open_wires | splice | ring_terminal",

      "contact_pn":"the separate contact/socket/pin part number if the connector uses loose contacts, else \\"\\"",

  ],

    { "id":"S1", "from":"P1", "to":"WSRV1",
      "cable_part_number":"", "cable_description":"",

      "trim_allowance_mm": <number>, "trim_allowance_confirmed": <true|false>,
      "cut_length_mm": <number>,
      "cut_length_tolerance_mm": <number>, "cut_length_tolerance_confirmed": <true|false>,

      "layers":[ {"name":"Jacket","od_mm":3.6,"material":"PVC","note":"what the operator must watch out for"},

      "shield_treatment":"what happens to the shield/drain at each end, in plain language, or \\"\\"",

  "markers":  [ {"part_number":"","label":"A","segment":"S1","from_end":"P1","distance_mm":50,

                 "confirmed":false,"text_lines":["DB9 FEMALE","RS422"]} ],
  "materials":[ {"item":1,"part_number":"","manufacturer":"","description":"","qty":"1","ref":"P1"} ],
