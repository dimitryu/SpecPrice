<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecPrice</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sidebar-w: 220px;
      --topbar-h: 52px;
      --blue-dark:  #1F3A5F;
      --blue-mid:   #2E75B6;
      --blue-light: #EBF3FB;
      --text:       #1A202C;
      --muted:      #718096;
      --border:     #CBD5E0;
      --green:      #1B6B3A;
      --green-bg:   #D4EDDA;
      --red:        #9B1C1C;
      --red-bg:     #FDE8E8;
      --row-alt:    #F0F6FB;
    }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ── Splash ── */
    #splash { position:fixed; inset:0; background:var(--blue-dark); display:flex; align-items:center;
              justify-content:center; flex-direction:column; gap:16px; z-index:999; }
    #splash h1 { color:#fff; font-size:22px; font-weight:700; }
    .ring { width:34px; height:34px; border:3px solid rgba(255,255,255,.2); border-top-color:#fff;
            border-radius:50%; animation:spin .8s linear infinite; }

    /* ── Shell ── */
    #shell { display:flex; height:100vh; }
    /* The old persistent-sidebar CSS (aside/.sb-brand/.sb-company/.nav-item/
       .sb-foot/#user-email-sb/.btn-signout) was removed along with the
       sidebar itself when the app moved to the role-gated Home-screen hub
       model — the Home screen's Sign Out button uses .btn/.btn-ghost. */

    /* ── Main ── */
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .topbar { height:var(--topbar-h); background:#fff; border-bottom:1px solid var(--border);
              display:flex; align-items:center; padding:0 18px; gap:10px; flex-shrink:0; }
    .topbar h2 { font-size:15px; font-weight:700; color:var(--blue-dark); flex:1; }
    #content { flex:1; overflow:auto; padding:18px; background:#F7FAFC; }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border:none;
           border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:opacity .12s; }
    .btn:hover:not(:disabled) { opacity:.85; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-blue   { background:var(--blue-mid); color:#fff; }
    .btn-green  { background:#1F8B4C; color:#fff; }
    .btn-red    { background:#E53E3E; color:#fff; }
    .btn-ghost  { background:var(--blue-light); color:var(--blue-dark); }
    .btn-purple { background:#7C3AED; color:#fff; }
    .btn-sm     { padding:4px 9px; font-size:11px; }

    /* ── Toolbar ── */
    .toolbar { display:flex; align-items:center; gap:9px; margin-bottom:13px; flex-wrap:wrap; }
    .search-box { flex:1; min-width:200px; padding:7px 11px; border:1.5px solid var(--border);
                  border-radius:7px; font-size:13px; outline:none; color:var(--text); }
    .search-box:focus { border-color:var(--blue-mid); box-shadow:0 0 0 3px rgba(46,117,182,.1); }
    .count-badge { font-size:11px; color:var(--muted); white-space:nowrap; }

    /* ── Search clear (✕) button ── */
    .search-wrap { position:relative; flex:1; min-width:200px; }
    .search-wrap .search-box { width:100%; min-width:0; padding-right:28px; }
    .search-clear { position:absolute; right:4px; top:50%; transform:translateY(-50%);
                     background:none; border:none; color:var(--muted); cursor:pointer;
                     font-size:13px; padding:4px 6px; border-radius:4px; line-height:1;
                     display:none; align-items:center; justify-content:center; }
    .search-clear:hover { background:var(--blue-light); color:var(--text); }
    .search-clear.show { display:flex; }

    /* ── Tables ── */
    /* Bounded so the box itself scrolls internally once rows overflow it — this is what
       makes `thead th { position:sticky }` below actually stick (a sticky element only
       sticks within its nearest ancestor that truly scrolls; with no height cap here the
       box just grows forever and the whole page scrolls instead, taking the toolbar/search
       row and header along with it). Modals that embed a table override this max-height
       inline with their own (smaller) value — this default only applies to the main
       Part Stock / RFQ BOM table views. */
    .table-wrap { overflow:auto; border-radius:8px; border:1px solid var(--border); background:#fff;
                  scrollbar-width:auto; max-height:calc(100vh - 250px); }
    .table-wrap::-webkit-scrollbar { height:12px; width:12px; }
    .table-wrap::-webkit-scrollbar-track { background:#EDF2F7; }
    .table-wrap::-webkit-scrollbar-thumb { background:var(--blue-mid); border-radius:6px; border:2px solid #EDF2F7; }
    .table-wrap::-webkit-scrollbar-thumb:hover { background:var(--blue-dark); }
    .tbl-scroll-btn { background:var(--blue-light); color:var(--blue-dark); border:1px solid var(--border);
                       border-radius:6px; width:28px; height:28px; cursor:pointer; font-size:13px;
                       flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
    .tbl-scroll-btn:hover { background:var(--blue-mid); color:#fff; }
    .pager { display:flex; align-items:center; gap:5px; margin-top:10px; flex-wrap:wrap; }
    .pager-btn { min-width:28px; padding:0 6px; }
    .pager-btn.pager-active { background:var(--blue-mid); color:#fff; }
    .pager-ellipsis { color:var(--muted); padding:0 3px; font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:12.5px; }
    thead th { position:sticky; top:0; z-index:2; background:var(--blue-mid); color:#fff;
               font-weight:600; padding:7px 9px; text-align:left; white-space:nowrap;
               cursor:pointer; user-select:none; border-right:1px solid rgba(255,255,255,.25); }
    thead th:last-child { border-right:none; }
    thead th:hover { background:#1F5B92; }
    thead th.col-dragging { opacity:.4; }
    thead th.col-drop-target { box-shadow:inset 0 0 0 2px #fff; }
    tbody tr:nth-child(odd)  { background:#FFFFFF; }
    tbody tr:nth-child(even) { background:var(--row-alt); }
    tbody tr:hover { background:#D6EAF8 !important; }
    td { padding:5px 9px; border-bottom:1px solid #EDF2F7; border-right:1px solid #E2E8F0;
         white-space:nowrap; vertical-align:middle; }
    td:last-child { border-right:none; }
    td.wrap { white-space:normal; max-width:240px; line-height:1.3; }
    td[contenteditable="true"] { outline:2px solid var(--blue-mid); outline-offset:-2px;
                                  background:#FFFDE7 !important; min-width:60px; }
    .price-green { color:var(--green); background:var(--green-bg); font-weight:600;
                   border-radius:4px; padding:1px 6px; }
    .price-red   { color:var(--red);   background:var(--red-bg);   font-weight:600;
                   border-radius:4px; padding:1px 6px; }
    .empty-row td { text-align:center; padding:40px; color:var(--muted); border-right:none; }

    /* ── Cards ── */
    .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
    .rfq-card { background:#fff; border:1px solid var(--border); border-radius:9px;
                padding:14px 16px; cursor:pointer; transition:box-shadow .12s, border-color .12s;
                animation:fadeIn .2s; display:flex; align-items:flex-start; gap:12px; }
    .rfq-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); border-color:var(--blue-mid); }
    .rfq-card-body { flex:1; min-width:0; }
    .rfq-card h3 { font-size:13px; font-weight:700; color:var(--blue-dark);
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rfq-card p  { font-size:11px; color:var(--muted); margin-top:3px; }
    .rfq-card-icon { font-size:24px; flex-shrink:0; }

    /* ── Back / Breadcrumb ── */
    .breadcrumb { display:flex; align-items:center; gap:6px; margin-bottom:13px; font-size:12px; }
    .breadcrumb a { color:var(--blue-mid); cursor:pointer; }
    .breadcrumb a:hover { text-decoration:underline; }
    .breadcrumb span { color:var(--muted); }

    /* ── Drop zone ── */
    .drop-zone { border:2px dashed var(--border); border-radius:10px; padding:40px 20px;
                 text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
    .drop-zone:hover, .drop-zone.dragover { border-color:var(--blue-mid); background:var(--blue-light); }
    .drop-zone p { color:var(--muted); font-size:13px; margin-top:8px; }
    .drop-zone .icon-big { font-size:40px; display:block; margin-bottom:8px; }

    /* ── Cut & Strip specification sheet ──────────────────────────────────────
       Deliberately styled like a controlled document rather than like the rest
       of the app: this page gets printed and taped to a bench, so it has to read
       the same on paper as on screen. Everything is scoped under .cs-sheet so it
       can't leak into the other views. */
    .cs-sheet { max-width:1080px; margin:0 auto 40px; background:#fff; color:#0F172A;
                font-size:15px; line-height:1.6;
                box-shadow:0 1px 3px rgba(0,0,0,.10), 0 6px 24px rgba(0,0,0,.06); }
    .cs-pad { padding:0 34px; }
    .cs-banner { background:repeating-linear-gradient(135deg,#FDE68A,#FDE68A 14px,#FCD34D 14px,#FCD34D 28px);
                 color:#78350F; font-weight:800; font-size:12.5px; text-align:center;
                 padding:10px 34px; border-bottom:2px solid #B45309; }
    /* ── The works' own form: a company block, a centred title, boxed
          planning/execution/approval tables and a signature cell that is empty
          on purpose — it is signed with a pen. ── */
    .cs-form-head { display:flex; align-items:center; gap:22px; padding:20px 34px 16px;
                    border-bottom:3px solid #1E293B; }
    .cs-form-co { width:190px; flex-shrink:0; display:flex; align-items:center; }
    .cs-form-co img { max-width:100%; max-height:62px; object-fit:contain; }
    .cs-form-co-n { font-size:15px; font-weight:800; color:#1E293B; line-height:1.3; }
    .cs-form-t { flex:1; text-align:center; }
    .cs-form-t1 { font-size:23px; font-weight:800; letter-spacing:-.01em;
                  text-decoration:underline; text-underline-offset:5px; }
    .cs-form-t2 { font-size:14px; color:#334155; margin-top:5px; }
    .cs-tbl.cs-form-tbl th { background:#fff; border:1px solid #0F172A; text-align:center !important; }
    .cs-tbl.cs-form-tbl td { border:1px solid #0F172A; }
    .cs-tbl.cs-form-tbl tr:nth-child(even) td { background:#fff; }
    .cs-formula { font:11.5px/1.45 monospace; color:#7C2D12; margin-top:3px; }
    .cs-links { display:flex; flex-wrap:wrap; gap:4px; }
    .cs-link { display:inline-flex; align-items:center; gap:2px; font-size:10px; font-weight:700;
               color:#1D4ED8; text-decoration:none; border:1px solid #BFDBFE; background:#EFF6FF;
               border-radius:9px; padding:0 5px; line-height:16px; white-space:nowrap; }
    .cs-link:hover { background:#DBEAFE; }
    .cs-link-s { color:#475569; border-color:#E2E8F0; background:#F8FAFC; font-weight:600; }
    .cs-links-sub { font-size:10px; color:#94A3B8; margin:4px 0 2px; }
    @media print { .cs-link { border:none; background:none; padding:0; color:#1E293B; } }
    .cs-datum { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:12px;
                padding:8px 11px; background:#F8FAFC; border:1px solid #E4E5E7; border-radius:6px;
                font-size:13px; }
    .cs-notes-box { border:1px solid #0F172A; min-height:58px; padding:9px 11px;
                    font-size:13px; white-space:pre-wrap; }
    .cs-sig-cell { height:44px; }
    .cs-role { font-size:10.5px; color:#64748B; text-transform:uppercase; letter-spacing:.4px; }
    .cs-tb { display:grid; grid-template-columns:1.5fr 1fr; border-bottom:3px solid #1E293B; }
    .cs-tb-l { padding:22px 34px 18px; }
    .cs-tb-r { padding:18px 26px; background:#F8FAFC; }
    .cs-sheet[dir="ltr"] .cs-tb-r { border-left:1px solid #E4E5E7; }
    .cs-sheet[dir="rtl"] .cs-tb-r { border-right:1px solid #E4E5E7; }
    .cs-doc-t { font-size:24px; font-weight:800; letter-spacing:-.01em; }
    .cs-doc-s { font-size:14px; color:#334155; margin-top:3px; }
    .cs-kv { display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:13px; margin:0; }
    .cs-kv dt { color:#334155; font-weight:500; }
    .cs-kv dd { margin:0; font-weight:700; }
    .cs-h2 { font-size:13px; font-weight:800; color:#fff; background:#1E293B;
             padding:8px 34px; margin:30px 0 16px; }
    .cs-sheet[dir="ltr"] .cs-n { opacity:.55; margin-right:11px; font-family:monospace; }
    .cs-sheet[dir="rtl"] .cs-n { opacity:.55; margin-left:11px; font-family:monospace;
                                 direction:ltr; display:inline-block; }
    .cs-h3 { font-size:15px; font-weight:700; margin:22px 0 8px; }
    /* Part numbers, dimensions and codes must not be reordered by the bidi
       algorithm when the sheet is shown in Hebrew — an SMP part number printed
       backwards is a wrong part number. */
    /* THE table bug. This class exists to hold a Latin part number upright inside
       Hebrew text, and it was doing that with display:inline-block. Put it on a
       <td> — which 65 cells in the sheet do — and the cell stops being a table
       cell: the row falls apart and every cell lands on its own line, keeping its
       column but dropping a step each time. unicode-bidi:isolate already does the
       whole job on any display type, so the display override goes, and the cells
       that need it get it explicitly. */
    .cs-ltr { direction:ltr; unicode-bidi:isolate;
              font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
    span.cs-ltr, b.cs-ltr, i.cs-ltr { display:inline-block; }
    .cs-tbl td.cs-ltr, .cs-tbl th.cs-ltr { display:table-cell; }
    .cs-ctr { text-align:center; }
    .cs-tbl { width:100%; border-collapse:collapse; font-size:13px;
              table-layout:fixed; }
    /* Long part numbers and formulas wrap inside their own cell instead of
       widening it past the header it belongs under. white-space:normal undoes
       the global `td { white-space:nowrap }`, which is meant for the scrolling
       data grids and made every sheet cell overflow its own border. */
    .cs-tbl td, .cs-tbl th { white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
    /* A dimension must never break across two lines — "190" above "mm" reads as
       two numbers. */
    .cs-tbl td.cs-nowrap { white-space:nowrap; }
    /* The strip codes now live inline with their description instead of in a
       column of their own, which was pushing every row onto two lines. */
    .cs-code { display:inline-block; min-width:18px; padding:1px 5px; margin-inline-end:5px;
               background:#1E293B; color:#fff; border-radius:3px; font:700 11px/1.5 monospace;
               text-align:center; direction:ltr; }
    .cs-tbl th { background:#F1F2F3; padding:8px 10px; font-weight:700; font-size:12px;
                 color:#334155; border:1px solid #E4E5E7; }
    .cs-sheet[dir="ltr"] .cs-tbl th { text-align:left; }
    .cs-sheet[dir="rtl"] .cs-tbl th { text-align:right; }
    .cs-tbl td { padding:8px 10px; border:1px solid #E4E5E7; vertical-align:top; }
    .cs-tbl tr:nth-child(even) td { background:#FBFCFD; }
    .cs-note { font-size:12.5px; color:#334155; margin-top:7px; }
    /* The one number the operator acts on. */
    .cs-tbl tr.cs-cut-row td { background:#FEF3C7 !important; border-top:2px solid #B45309; }
    @media print { .cs-tbl tr.cs-cut-row td { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
    .cs-box { padding:14px 18px; margin:0 0 16px; font-size:14px; }
    .cs-sheet[dir="ltr"] .cs-box { border-left:4px solid; }
    .cs-sheet[dir="rtl"] .cs-box { border-right:4px solid; }
    .cs-box b { display:block; margin-bottom:5px; font-weight:800; }
    .cs-box p { margin:0; }
    .cs-box ul { margin:8px 0 0; padding-inline-start:20px; padding-inline-end:0; }
    .cs-box li { margin:4px 0; }
    .cs-stop { border-color:#DC2626; background:#FEE2E2; color:#7F1D1D; }
    .cs-warn { border-color:#B45309; background:#FEF3C7; color:#78350F; }
    .cs-tag { display:inline-block; font-family:ui-monospace,Menlo,Consolas,monospace;
              font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:3px;
              white-space:nowrap; direction:ltr; }
    .cs-tbc { background:#DC2626; color:#fff; }
    .cs-dim { background:#DBEAFE; color:#1D4ED8; border:1px solid #93C5FD; }
    .cs-fig { margin:0 0 20px; border:1px solid #E4E5E7; background:#fff; }
    .cs-fig svg { display:block; width:100%; height:auto; }
    .cs-step { display:grid; grid-template-columns:40px 1fr; gap:15px;
               padding:15px 0; border-top:1px solid #E4E5E7; }
    .cs-step:last-child { border-bottom:1px solid #E4E5E7; }
    .cs-step-n { width:34px; height:34px; border-radius:50%; background:#1E293B; color:#fff;
                 display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
    .cs-step h4 { margin:0 0 4px; font-size:15px; font-weight:700; }
    .cs-crit { margin-top:7px; color:#B91C1C; font-weight:600; font-size:13.5px; }
    .cs-chk { list-style:none; padding:0; margin:0; font-size:14px; }
    .cs-chk li { display:grid; grid-template-columns:20px 1fr; gap:11px;
                 padding:8px 0; border-bottom:1px dashed #E4E5E7; }
    .cs-b { width:15px; height:15px; border:2px solid #334155; margin-top:4px; }
    .cs-sig { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:26px; }
    .cs-sig div { border-top:1px solid #1E293B; padding-top:7px; font-size:12px;
                  color:#334155; font-weight:600; min-height:56px; }
    .cs-foot { margin-top:28px; padding:12px 0 26px; border-top:1px solid #E4E5E7;
               font-size:11.5px; color:#334155; display:flex; justify-content:space-between; gap:18px; }

    /* ── Edit mode ── */
    .cs-edit-bar { background:#EFF6FF; border-bottom:1px solid #BFDBFE; color:#1E3A8A;
                   padding:10px 34px; font-size:12.5px; display:flex; flex-wrap:wrap;
                   align-items:center; gap:6px 16px; }
    .cs-edit-bar b { font-weight:800; }
    .cs-edit-lang { opacity:.8; font-style:italic; }
    .cs-in { font:inherit; font-size:13px; color:#0F172A; background:#fff;
             border:1px solid #93C5FD; border-radius:4px; padding:4px 7px; width:100%;
             box-sizing:border-box; }
    .cs-in:focus { outline:2px solid #2563EB; outline-offset:-1px; border-color:#2563EB; }
    textarea.cs-in { resize:vertical; line-height:1.45; }
    .cs-in-num { width:88px; direction:ltr; text-align:center;
                 font-family:ui-monospace,Menlo,Consolas,monospace; }
    .cs-unit { font-size:12px; color:#334155; margin-inline-start:4px; }
    .cs-chk-lbl { display:inline-flex; align-items:center; gap:5px; font-size:12px;
                  color:#15803D; font-weight:700; margin-inline-start:8px; cursor:pointer;
                  white-space:nowrap; }
    .cs-chk-lbl input { cursor:pointer; }
    .cs-del-btn { border:1px solid #FCA5A5; background:#FEF2F2; color:#B91C1C;
                  border-radius:4px; font-size:11px; line-height:1; padding:3px 6px;
                  cursor:pointer; margin-inline-end:7px; }
    .cs-del-btn:hover { background:#DC2626; color:#fff; border-color:#DC2626; }
    /* An in-progress edit must never reach paper. */
    @media print { .cs-edit-bar, .cs-del-btn, .cs-chk-lbl { display:none !important; } }
    /* A row split across two sheets of paper is a row an operator reads wrong:
       the part number at the bottom of one page, its dimension at the top of the
       next. Keep rows whole, keep a heading with the table it introduces, and
       repeat the header on every page a long table spans. */
    @media print {
      .cs-tbl { page-break-inside:auto; break-inside:auto; }
      .cs-tbl tr { page-break-inside:avoid; break-inside:avoid; }
      .cs-tbl thead { display:table-header-group; }
      .cs-tbl tfoot { display:table-footer-group; }
      .cs-h2, .cs-h3 { page-break-after:avoid; break-after:avoid; }
      .cs-fig, .cs-box { page-break-inside:avoid; break-inside:avoid; }
    }

    /* Printing the sheet must produce the sheet and nothing else — no topbar,
       no Support button, no shadows eating toner. */
    @media print {
      body { background:#fff; }
      .topbar, .home-btn-grid, #btn-support-fab, #modal-bg, .breadcrumb { display:none !important; }
      .cs-sheet { box-shadow:none; margin:0; max-width:none; }
      .cs-h2 { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .cs-box, .cs-banner, .cs-tag, .cs-step-n, .cs-tbl th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .cs-step, .cs-fig, .cs-chk li { break-inside:avoid; page-break-inside:avoid; }
      .cs-h2 { break-after:avoid; page-break-after:avoid; }
    }

    /* ── Modal ── */
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex;
                align-items:center; justify-content:center; z-index:200;
                animation:fadeIn .15s; }
    .modal { background:#fff; border-radius:12px; width:min(94vw,860px);
             max-height:90vh; display:flex; flex-direction:column;
             box-shadow:0 24px 64px rgba(0,0,0,.3); overflow:hidden; }
    .modal-sm { width:min(94vw,420px); }
    .modal-head { padding:16px 20px; border-bottom:1px solid var(--border);
                  display:flex; align-items:center; gap:10px; flex-shrink:0; }

// ── State ─────────────────────────────────────────────────────────────────────
let companyId   = '';
let companyName = '';
let companyLogoB64 = '';
let currentUserEmail = '';
let allParts    = [];
// Seeded from localStorage, which is where the Admin page saves them.
// This read did not exist: the keys were written on save and then only ever
// re-read from the company document, so a key typed into Admin worked until
// the page was reloaded and then silently disappeared — taking every AI
// feature with it, with no error anywhere.
let anthKey     = localStorage.getItem('anth_key') || '';
// Anthropic is the only AI provider. A Gemini fallback used to sit behind every
// call; it was removed because keeping two providers meant every prompt change
// had to be verified twice, and the second path was rarely exercised — a
// fallback nobody tests is not a safety net. The trade-off is deliberate and
// worth stating: if this key stops working, every AI feature stops with it.
const _AI_NO_KEY='No AI key configured — add an Anthropic key in Admin → AI API Keys';
try{ localStorage.removeItem('gem_key'); }catch{}   // left over from the Gemini era
let currentView = 'home';
let currentUserRole = '';
// Role → views visible as buttons on the Home screen.
//
// There is no permanent "built-in" class of role. SEED_ROLE_VIEWS is only what a
// brand-new installation STARTS with: the first time an admin opens
// Settings > Roles these are written to Firestore as ordinary documents, after
// which every role — seeded or created by hand — is listed, edited and deleted
// exactly the same way. Having two kinds of role that behaved differently was

// or deletes the admin role, locks administration out of the system permanently
// with no way back through the UI. So the admin ROLE cannot be deleted and
// cannot lose those two screens. Its name and everything else about it are
// editable like any other role.
const SEED_ROLE_VIEWS = {
  admin:  ['rfq','sales-desk','part-stock','cut-strip','manufacturing','customers','statistics','settings','admin'],
  agent:  ['rfq','sales-desk','part-stock','cut-strip','manufacturing','customers'],
  // 'viewer' gets cut-strip too: the whole point of a cut & strip sheet is that
  // the person on the bench can pull it up, and a shop-floor account is exactly
  // the kind of read-only user 'viewer' exists for.
  viewer: ['part-stock','rfq','cut-strip'],
  sales:  ['sales-desk'],
};
const PROTECTED_ROLE  = 'admin';
const PROTECTED_VIEWS = ['settings','admin'];   // cannot be taken away from PROTECTED_ROLE
// Screens added in a later version than the role documents in Firestore. A role
// document is a snapshot of the screens that existed when it was written, so a
// new screen is invisible to everyone — including the administrator who would
// have to go and grant it — until someone edits the role. Administrators get
// those screens automatically; every other role is granted them by hand, as
// before. Unlike PROTECTED_VIEWS this is not a lock: an admin who doesn't want
// the screen can still set it to Disabled in Settings > Roles.
const ADMIN_AUTO_VIEWS = ['statistics','manufacturing'];

// Seeding has to tell "this role has never been created" apart from "an admin
// deleted this role on purpose". Without that distinction you get one of two
// bugs: either deleted roles keep coming back, or an installation that already
// has SOME roles never gets the rest.
//
// A marker document records that the seed has run. Any doc id starting with an
// underscore is bookkeeping, never a role, and is filtered out everywhere roles
// are listed.
//
// NOT '__meta__': Firestore reserves every document id matching __.*__ and
// rejects the write outright ("Resource id is invalid because it is reserved").
// A single leading underscore is allowed and reads just as clearly.
const ROLES_META_DOC = '_meta';
const _isRoleDocId = id => !String(id||'').startsWith('_');
let _rolesSeeded = false;
let roleViewsMap = {}; // populated from Firestore 'roles' collection: {[roleKey]: {name, views:[...]}}
async function loadRoles(){
  try{
    const snap = await getDocs(collection(db,'roles'));
    const map = {};
    snap.docs.forEach(d=>{
      if(d.id===ROLES_META_DOC){ _rolesSeeded = d.data()?.seeded===true; return; }
      if(_isRoleDocId(d.id)) map[d.id] = d.data();
    });
    roleViewsMap = map;
  }catch(e){ console.error('loadRoles', e); }
}
function allowedViews(){
  const r = roleViewsMap[currentUserRole];
  let views = (r && Array.isArray(r.views)) ? r.views
            // Not in Firestore yet (fresh install, before the seed is written) or
            // the role was deleted while a user still had it. Either way, falling
            // back beats showing an empty Home screen with no way out.
            : (SEED_ROLE_VIEWS[currentUserRole] || SEED_ROLE_VIEWS['agent']);
  // Belt and braces on top of the save-time guard: however the admin role's
  // document ends up looking, an admin can always reach Settings and Admin.
  if(currentUserRole===PROTECTED_ROLE) views=[...new Set([...views, ...PROTECTED_VIEWS, ...ADMIN_AUTO_VIEWS])];
  return views;
}
// Screens a role can SEE but not open. A hidden screen tells a user nothing; a
// greyed-out one says "this exists, it isn't yours" — which is the honest answer
// when a feature is being rolled out, or belongs to another team. Disabled
// screens are never openable, so every access check treats them as closed.
function disabledViews(){
  const r = roleViewsMap[currentUserRole];
  let list = (r && Array.isArray(r.disabledViews)) ? r.disabledViews : [];
  // An administrator locked out of Settings or Admin could not undo it, so those
  // two can never be disabled for the admin role however the document looks.
  if(currentUserRole===PROTECTED_ROLE) list = list.filter(v=>!PROTECTED_VIEWS.includes(v));
  return list;
}
function isViewDisabled(v){ return disabledViews().includes(v); }
function canView(v){
  if(v==='home') return true;
  return allowedViews().includes(v) && !isViewDisabled(v);
}
// Every role key the app knows about.
//
// Before the seed has been written, the seed roles exist conceptually even
// though they have no documents, so they are unioned in — otherwise they vanish
// from the Roles table and from every user-role dropdown, which is exactly what
// went wrong when the first custom role was created.
//
// After seeding, Firestore is the whole truth and the seed contributes nothing.
// That is what lets a deleted role stay deleted instead of reappearing on the
// next page load.
function _mergedRoleKeys(){
  const saved=Object.keys(roleViewsMap).filter(_isRoleDocId);
  return _rolesSeeded ? saved : [...new Set([...Object.keys(SEED_ROLE_VIEWS), ...saved])];
}
function roleOptions(){
  return _mergedRoleKeys().map(k =>
    [k, (roleViewsMap[k] && roleViewsMap[k].name) || (k.charAt(0).toUpperCase()+k.slice(1))]);
}

// ── Audit log ─────────────────────────────────────────────────────────────────

// never block or surface an error for the actual user action it's describing,

// `details` can be a string or a plain object (stored as-is, rendered with
// JSON.stringify by the Logs tab when it's an object).
async function logAudit(action, details, success=true){
  if(!companyId) return; // no company context yet (e.g. very first load) — nothing to attribute this to
  try{
    await addDoc(collection(db,'companies',companyId,'audit_logs'),{
      user: currentUserEmail||'', userId: auth.currentUser?.uid||'',
      action, details: details==null?'':details, success: !!success,
      timestamp: serverTimestamp()
    });

}
// Same trail as logAudit(), but for automated operations the app runs on its own
// behalf (FindChips/Priority price searches, AI drawing/BOM price analysis) rather

// column so Admin > Logs can tell "I clicked X" apart from "the app computed Y".
// Still records which human's session triggered it (viaUser) for traceability.
async function logSystemAudit(action, details, success=true){
  if(!companyId) return;
  try{
    await addDoc(collection(db,'companies',companyId,'audit_logs'),{
      user: 'SYSTEM', userId: 'system', viaUser: currentUserEmail||'',
      action, details: details==null?'':details, success: !!success,
      timestamp: serverTimestamp()
    });

}

let sortCol     = 'part_number';

// Builds a windowed pager control ("‹ 1 … 4 5 6 … 12 ›") for Part Stock (or any paginated table)
function _buildPager(page,totalPages,idPrefix){
  if(totalPages<=1) return '';
  const pages=[]; const w=2;
  pages.push(1);
  if(page-w>2) pages.push('…');
  for(let p=Math.max(2,page-w); p<=Math.min(totalPages-1,page+w); p++) pages.push(p);
  if(page+w<totalPages-1) pages.push('…');
  if(totalPages>1) pages.push(totalPages);

// ── Version check ─────────────────────────────────────────────────────────────
// The whole app is one static file on GitHub Pages, so a browser can keep
// serving a cached copy for hours after a deploy — long enough for someone to
// report a bug that was fixed that morning, from a screen that no longer
// exists in the current code. There's no service worker here to push an
// update, so the app asks instead: it re-fetches its own file, cache bypassed,
// and compares the version string it finds with the one it is running.
//
// Only the first 64KB are requested — APP_VER sits near the top of the file —
// so the check costs a fraction of the 650KB the page itself weighs. A server
// that ignores the Range header simply returns the whole file, which parses
// exactly the same.
const _VER_CHECK_BYTES=65535;

function _parseAppVer(html){
  const m=String(html||'').match(/const\s+APP_VER\s*=\s*'([0-9]+(?:\.[0-9]+)*)'/);
  return m?m[1]:'';
}
// Compared part by part as NUMBERS: '1.32.0' is newer than '1.9.9', which a
// plain string comparison gets backwards.
function _verIsNewer(remote, local){
  const a=String(remote||'').split('.').map(x=>parseInt(x,10)||0);
  const b=String(local||'').split('.').map(x=>parseInt(x,10)||0);
  for(let i=0;i<Math.max(a.length,b.length);i++){
    const x=a[i]||0, y=b[i]||0;
    if(x>y) return true;
    if(x<y) return false;
  }
  return false;
}

// The version the SERVER is serving right now, or '' when it couldn't be read.
// Never throws: a failed check is a non-event, not something to explain.
async function fetchLatestAppVersion(){
  try{
    const resp=await fetch(`app.html?_vc=${Date.now()}`,
      {cache:'no-store', headers:{Range:`bytes=0-${_VER_CHECK_BYTES}`}});
    if(!resp.ok && resp.status!==206) return '';
    return _parseAppVer(await resp.text());
  }catch(e){ console.warn('[version] check failed:', e.message); return ''; }
}

// Loads from a URL the cache has never seen. That is the only reliable way to
// bypass it — location.reload(true) has been ignored by browsers for years.
function _applyUpdate(latest){
  location.replace(`app.html?v=${encodeURIComponent(latest||String(Date.now()))}`);
}

// A dismissible bar rather than a modal: an update is worth noticing, not
// worth interrupting a quote someone is in the middle of building.
function _showUpdateBar(latest){
  if(document.getElementById('update-bar')) return;
  const bar=document.createElement('div');
  bar.id='update-bar';
  bar.setAttribute('role','status');
  bar.innerHTML=`<span>New version <b>v${esc(latest)}</b> available — you're on v${esc(APP_VER)}.</span>
    <button class="btn btn-green btn-sm" id="update-now">↻ Update now</button>
    <button class="btn btn-ghost btn-sm" id="update-later">Later</button>`;
  document.body.appendChild(bar);
  document.getElementById('update-now').addEventListener('click',()=>_applyUpdate(latest));
  document.getElementById('update-later').addEventListener('click',()=>bar.remove());
}

// The explicit "Check for updates" button. Reports EVERY outcome — up to date,
// update available, or server unreachable — because a button that sometimes
// says nothing leaves the person no wiser than before they pressed it.
async function checkForUpdate(btn){
  const restore=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='Checking…'; }
  const latest=await fetchLatestAppVersion();
  if(btn){ btn.disabled=false; btn.textContent=restore; }
  if(!latest){ toast('Could not reach the server to check the version','error'); return; }
  if(_verIsNewer(latest, APP_VER)){
    _showUpdateBar(latest);
    toast(`Version ${latest} is available`,'info');
  } else {
    toast(`You're on the latest version (v${APP_VER})`,'success');
  }
}

// Runs once after sign-in. Shows the bar when there is something to update and
// stays completely silent otherwise.
async function autoCheckForUpdate(){
  const latest=await fetchLatestAppVersion();
  if(latest && _verIsNewer(latest, APP_VER)) _showUpdateBar(latest);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
// Escapes for safe embedding in BOTH HTML text content AND double-quoted HTML
// attributes (e.g. data-id="${esc(x)}"). Part numbers/descriptions routinely
// contain a literal " (inch mark, e.g. 3/4", 1/4") — without escaping quotes,
// that " prematurely closes the attribute and corrupts whatever follows it
// (e.g. a checkbox's data-id gets truncated, breaking Delete Selected for that
// row). Must escape & first so the entities below aren't double-escaped.
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function mkEl(tag,cls='',html=''){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}

function fmtDate(v){if(!v)return'';try{const d=v.toDate?v.toDate():new Date(v);return d.toLocaleDateString('en-GB');}catch{return String(v);}}
function fmtDateTime(v){if(!v)return'';try{const d=v.toDate?v.toDate():new Date(v);return d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}catch{return String(v);}}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function nowISO(){return new Date().toISOString();}

// There's no persistent sidebar — the Home screen (role-gated button grid) is
// the hub. Every other screen shows a 🏠 button in the topbar to get back.
function route(v){
  const target = v||'home';
  if(!canView(target)){
    if(target!=='home') logAudit('screen_open',{screen:target},false); // blocked by role — logged as a failed attempt
    route('home'); return;
  }
  currentView=target;
  const btnHome=document.getElementById('btn-home');
  if(btnHome) btnHome.style.display = currentView==='home' ? 'none' : 'inline-flex';
  const TITLES={'home':'🏠 Home','part-stock':'📦 Database','rfq':'📋 RFQ','sales-desk':'💰 Sales Desk','cut-strip':'✂️ Cut & Strip','customers':'👥 Customers','manufacturing':'🛠️ Manufacturing Instructions','statistics':'📊 Statistics','settings':'⚙️ Settings','admin':'🛡️ Admin'};
  document.getElementById('page-title').textContent=TITLES[currentView]||'';
  setActions('');
  if(currentView!=='home') logAudit('screen_open',{screen:currentView},true);
  if(currentView==='home') renderHome();
  else if(currentView==='part-stock'){
    // Navigating to Part Stock always refetches from Firestore, so parts added
    // on other screens (Add Drawing extraction, Priority Import, etc.) show up
    // immediately without needing a full page reload. Same-screen interactions
    // (search/sort/paging) call renderPartStock() directly rather than route(),
    // so they keep reusing the in-memory cache and don't re-hit Firestore on
    // every keystroke.
    allParts=[];
    renderPartStock();
  }
  else if(currentView==='rfq') renderRFQList();
  else if(currentView==='sales-desk') renderSalesDesk();
  // Always lands on the saved-specs list, never on whatever spec happened to be
  // open last — a stale sheet on screen is how the wrong revision gets cut.
  else if(currentView==='cut-strip'){ csCurrent=null; renderCutStrip(); }
  else if(currentView==='customers') renderCustomers();
  // Always lands on the document list, never on whatever instruction happened
  // to be open last — same reasoning as Cut & Strip above.
  else if(currentView==='manufacturing'){ mfgCurrent=null; renderManufacturing(); }
  else if(currentView==='statistics') renderStatisticsPage();
  else if(currentView==='settings'){
    if(currentUserRole!=='admin'){ route('home'); return; }
    renderSettingsPage();
  }
  else if(currentView==='admin'){
    if(currentUserRole!=='admin'){ route('home'); return; }
    renderAdminPage();
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// STATISTICS — how the system is actually being used
// ══════════════════════════════════════════════════════════════════════════════
// Every figure here is derived from data the app already writes: the audit trail
// (companies/{id}/audit_logs) for anything that happened, and live collection
// counts for anything that simply IS. The two are kept in separate blocks and
// labelled as such, because only the first can honestly answer "in this date
// range" — a count of parts in the Database is today's number whatever dates you
// pick, and quietly filtering it would be a lie.
//
// audit_logs is admin-readable only (see firestore.rules), so this screen needs
// the admin role — or a role an admin grants it to.
let _statFrom=null, _statTo=null;      // Date objects; null until the page opens
let _statBlocks={};                    // { key: {title, columns, rows} } for export

const _STAT_PRESETS=[[7,'7 days'],[30,'30 days'],[90,'90 days'],[365,'12 months']];
function _statIsoDay(d){
  // Local calendar day, not UTC — "logins per day" must line up with the day the
  // person actually worked, not with Greenwich.
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function _statSetRangeDays(days){
  const to=new Date(); to.setHours(23,59,59,999);
  const from=new Date(); from.setDate(from.getDate()-(days-1)); from.setHours(0,0,0,0);
  _statFrom=from; _statTo=to;
}
// Firestore timestamps come back as Timestamp objects, but a row written in the
// same session can still be a pending serverTimestamp (null) — skip those rather
// than counting them on 1970.
function _statLogDate(l){
  const t=l && l.timestamp;
  if(!t) return null;
  try{ return t.toDate ? t.toDate() : new Date(t); }catch{ return null; }
}
function _statDetails(l){
  const d=l && l.details;
  return (d && typeof d==='object') ? d : {};
}

// ── Aggregations. Pure functions over a plain array of log rows, so they can be
//    tested without a browser or a database. ──────────────────────────────────
function _statCount(logs, action, okOnly=true){
  return logs.filter(l=>l.action===action && (!okOnly || l.success!==false)).length;
}
function _statSum(logs, action, field){
  return logs.reduce((a,l)=>
    l.action===action && l.success!==false ? a+(parseFloat(_statDetails(l)[field])||0) : a, 0);
}
// Average of a numeric detail, ignoring rows that never recorded it. Returns null
// rather than 0 when nothing has been measured yet — "no data" and "zero" are
// different answers and a dashboard must not blur them.
function _statAvg(logs, action, field){
  const vals=logs.filter(l=>l.action===action && l.success!==false)
                 .map(l=>parseFloat(_statDetails(l)[field]))
                 .filter(v=>isFinite(v) && v>0);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function _statPerDay(logs, actions){
  const want=new Set([].concat(actions));
  const by={};
  for(const l of logs){
    if(!want.has(l.action) || l.success===false) continue;
    const d=_statLogDate(l); if(!d) continue;
    const k=_statIsoDay(d);
    by[k]=(by[k]||0)+1;
  }
  return Object.entries(by).sort((a,b)=>a[0]<b[0]?-1:1);
}
function _statPerUser(logs, actions){
  const want=new Set([].concat(actions));
  const by={};
  for(const l of logs){
    if(!want.has(l.action) || l.success===false) continue;
    const u=l.user||'(unknown)';
    if(u==='SYSTEM') continue;          // automated work isn't a person signing in
    by[u]=(by[u]||0)+1;
  }
  return Object.entries(by).sort((a,b)=>b[1]-a[1]);
}
// One row per drawing file the AI was asked to read. Keyed on the filename the
// extraction logged, which is the only drawing identity present in the trail.
function _statDrawings(logs){
  const by={};
  for(const l of logs){
    if(l.action!=='drawing_bom_search') continue;
    const d=_statDetails(l);
    const name=String(d.filename||'(unnamed)');
    const e=by[name]||(by[name]={drawing:name,runs:0,ok:0,failed:0,rows:[],ms:[],last:null});
    e.runs++;
    if(l.success===false){ e.failed++; }
    else {
      e.ok++;
      // Only a run that produced something contributes to the averages: a
      // failed extraction's duration is the time spent failing, which would
      // quietly drag "avg time to read a drawing" in either direction.
      const rows=parseFloat(d.rowsFound); if(isFinite(rows)) e.rows.push(rows);
      const ms=parseFloat(d.ms);          if(isFinite(ms)&&ms>0) e.ms.push(ms);
    }
    const when=_statLogDate(l);
    if(when && (!e.last || when>e.last)) e.last=when;
  }
  const avg=a=>a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  return Object.values(by).map(e=>({
    drawing:e.drawing, runs:e.runs, ok:e.ok, failed:e.failed,
    avgRows:avg(e.rows), avgMs:avg(e.ms), last:e.last,
  })).sort((a,b)=>b.runs-a.runs || (a.drawing<b.drawing?-1:1));
}
// Price coverage: of the parts in the Database, how many carry a price from any
// source. Answers "can we actually quote what we hold?".
const _STAT_PRICE_FIELDS=['priority_price','mouser_price','digikey_price'];
function _statCoverage(parts){
  let withPrice=0;
  const byDwg={};
  for(const p of parts||[]){
    const has=_STAT_PRICE_FIELDS.some(f=>(parseFloat(p[f])||0)>0);
    if(has) withPrice++;
    const d=String(p.drawing_number||'').trim()||'(no drawing #)';
    const e=byDwg[d]||(byDwg[d]={drawing:d,parts:0,priced:0});
    e.parts++; if(has) e.priced++;
  }
  const total=(parts||[]).length;
  return {
    total, withPrice, pct: total ? (100*withPrice/total) : null,
    byDrawing: Object.values(byDwg)
      .map(e=>({...e, pct: e.parts ? (100*e.priced/e.parts) : null}))
      .sort((a,b)=>b.parts-a.parts || (a.drawing<b.drawing?-1:1)),
  };
}

function _statFmtMs(ms){
  if(ms==null) return '—';
  return ms<1000 ? `${Math.round(ms)} ms`
       : ms<60000 ? `${(ms/1000).toFixed(1)} s`
       : `${Math.floor(ms/60000)}m ${Math.round((ms%60000)/1000)}s`;
}
function _statFmtNum(n,dp=0){ return n==null ? '—' : (+n).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function _statFmtPct(p){ return p==null ? '—' : `${p.toFixed(1)}%`; }
function _statFmtDate(d){ return d ? d.toLocaleDateString('en-GB') : '—'; }

// A bar list rather than a chart library: the app loads no charting code, and a
// ranked list with proportional bars answers "which days / who / what" without
// 300KB of dependency.
function _statBars(pairs, fmt){
  if(!pairs.length) return `<p class="stat-empty">Nothing recorded in this range.</p>`;
  const max=Math.max(...pairs.map(p=>p[1]));
  return `<div class="stat-bars">${pairs.map(([k,v])=>`
    <div class="stat-bar-row">
      <span class="stat-bar-k" title="${esc(String(k))}">${esc(String(k))}</span>
      <span class="stat-bar-t"><span class="stat-bar-f" style="width:${max?Math.max(2,100*v/max):0}%"></span></span>
      <span class="stat-bar-v">${esc(String(fmt?fmt(v):v))}</span>
    </div>`).join('')}</div>`;
}
function _statTable(columns, rows){
  if(!rows.length) return `<p class="stat-empty">Nothing recorded in this range.</p>`;
  return `<div class="table-wrap"><table style="font-size:12px">
    <thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}
// Registers a block's tabular form for export at the same moment it is drawn, so
// the spreadsheet can never disagree with the screen.
function _statBlock(key, title, note, innerHTML, columns, rows){
  _statBlocks[key]={title, columns, rows};
  return `<div class="settings-panel stat-block" style="padding:16px 18px;margin-top:16px">
    <div class="stat-block-head">
      <div>
        <div class="stat-block-title">${esc(title)}</div>
        ${note?`<div class="stat-block-note">${esc(note)}</div>`:''}
      </div>
      <button class="btn btn-ghost btn-sm stat-export" data-block="${esc(key)}" title="Export just this block to Excel">📊 Export</button>
    </div>
    ${innerHTML}
  </div>`;
}

async function _statLoad(){
  const host=document.getElementById('stat-body');
  if(!host) return;
  _statBlocks={};
  host.innerHTML=`<div class="ai-status" style="margin-top:20px"><div class="ring"></div>
    <span>Reading the activity log…</span></div>`;

  // Each source is fetched independently: a permissions error on the audit trail
  // must not also blank the counts that come from elsewhere.
  let logs=null, logErr='';
  try{
    const snap=await getDocs(query(
      collection(db,'companies',companyId,'audit_logs'),
      where('timestamp','>=',_statFrom), where('timestamp','<=',_statTo),
      orderBy('timestamp','desc'), limit(5000)));
    logs=snap.docs.map(d=>d.data());
  }catch(e){
    logErr = /permission|insufficient/i.test(e.message||'')
      ? 'Reading the activity log needs the administrator role.'
      : e.message;
  }

  let parts=[], counts={}, countErr='';
  try{
    await loadParts();
    parts=allParts;
    const [usersSnap, rolesSnap, projSnap, custSnap] = await Promise.all([
      getDocs(collection(db,'users')),
      getDocs(collection(db,'roles')),
      getDocs(collection(db,'companies',companyId,'projects')),
      getDocs(collection(db,'companies',companyId,'customers')),
    ]);
    counts={
      users: usersSnap.size,
      roles: rolesSnap.docs.filter(d=>_isRoleDocId(d.id)).length,
      projects: projSnap.size,
      customers: custSnap.size,
      parts: parts.length,
    };
  }catch(e){ countErr=e.message; }

  host.innerHTML=_statRender(logs, logErr, parts, counts, countErr);
  host.querySelectorAll('.stat-export').forEach(b=>
    b.addEventListener('click',()=>_statExportBlock(b.dataset.block)));
}

function _statRender(logs, logErr, parts, counts, countErr){
  const rangeLabel=`${_statFmtDate(_statFrom)} – ${_statFmtDate(_statTo)}`;
  let out='';

  if(logErr){
    out += `<div class="settings-panel" style="padding:16px 18px;margin-top:16px;border-color:#FCA5A5;background:#FEF2F2">
      <strong style="color:#9B1C1C;font-size:13px">Activity data unavailable</strong>
      <p style="font-size:12px;color:#7F1D1D;margin-top:4px">${esc(logErr)}</p></div>`;
  }

  if(logs){
    // ── Activity ────────────────────────────────────────────────────────────
    const analysed=_statCount(logs,'drawing_bom_search');
    const analysedFail=logs.filter(l=>l.action==='drawing_bom_search'&&l.success===false).length;
    const toSD=_statSum(logs,'sales_desk_add_from_drawing','count');
    const rfqs=_statCount(logs,'rfq_created');
    const boms=_statCount(logs,'rfq_bom_saved');
    const exports=_statCount(logs,'sales_desk_export');
    const failures=logs.filter(l=>l.success===false).length;
    const actRows=[
      ['Drawings analysed',analysed],['Failed analyses',analysedFail],
      ['Parts sent to Sales Desk',toSD],['RFQs created',rfqs],
      ['BOMs saved to RFQ',boms],['Quotations exported',exports],
      ['Failed actions (all kinds)',failures],['Log entries read',logs.length],
    ];
    out += _statBlock('activity','Activity',`Audit trail · ${rangeLabel}`,
      `<div class="stat-tiles">
        ${_statTile('Drawings analysed',_statFmtNum(analysed), analysedFail?`${analysedFail} failed`:'')}
        ${_statTile('Parts → Sales Desk',_statFmtNum(toSD))}
        ${_statTile('RFQs created',_statFmtNum(rfqs))}
        ${_statTile('Quotations exported',_statFmtNum(exports))}
        ${_statTile('Failed actions',_statFmtNum(failures))}
      </div>
      <div class="stat-sub">Drawing analyses per day</div>
      ${_statBars(_statPerDay(logs,'drawing_bom_search'))}`,
      ['Metric','Value'], actRows);

    // ── Drawings ────────────────────────────────────────────────────────────
    const dwgs=_statDrawings(logs);
    const dwgRows=dwgs.map(d=>[d.drawing,d.runs,d.ok,d.failed,
      d.avgRows==null?'—':d.avgRows.toFixed(1), _statFmtMs(d.avgMs), _statFmtDate(d.last)]);
    const avgAnalysis=_statAvg(logs,'drawing_bom_search','ms');
    out += _statBlock('drawings','Drawings',
      `One row per drawing file the AI was asked to read · ${rangeLabel}`,
      `<div class="stat-tiles">
        ${_statTile('Distinct drawings',_statFmtNum(dwgs.length))}
        ${_statTile('Total analyses',_statFmtNum(dwgs.reduce((a,d)=>a+d.runs,0)))}
        ${_statTile('Avg analysis time',_statFmtMs(avgAnalysis), avgAnalysis==null?'measured from v1.37 onward':'')}
      </div>
      ${_statTable(['Drawing','Analyses','OK','Failed','Avg rows','Avg time','Last'], dwgRows.slice(0,40))}
      ${dwgRows.length>40?`<p class="stat-empty">Showing the 40 most analysed — Export for the full list.</p>`:''}`,
      ['Drawing','Analyses','OK','Failed','Avg rows','Avg time','Last'], dwgRows);

    // ── Pricing ─────────────────────────────────────────────────────────────
    const runs=_statCount(logs,'price_check',false);
    const checked=_statSum(logs,'price_check','checked');
    const found=_statSum(logs,'price_check','found');
    const failedParts=_statSum(logs,'price_check','failed');
    const avgRun=_statAvg(logs,'price_check','ms');
    const cov=_statCoverage(parts);
    const priceRows=[
      ['Price-check runs',runs],['Parts checked',checked],['Prices found',found],
      ['Lookups failed',failedParts],
      ['Hit rate',checked?_statFmtPct(100*found/checked):'—'],
      ['Avg run time',_statFmtMs(avgRun)],
      ['Parts in Database (now)',cov.total],
      ['Parts with a price (now)',cov.withPrice],
      ['Price coverage (now)',_statFmtPct(cov.pct)],
    ];
    out += _statBlock('pricing','Pricing',
      `Runs are from the audit trail (${rangeLabel}); coverage is the Database as it stands now`,
      `<div class="stat-tiles">
        ${_statTile('Price-check runs',_statFmtNum(runs))}
        ${_statTile('Parts checked',_statFmtNum(checked))}
        ${_statTile('Hit rate',checked?_statFmtPct(100*found/checked):'—')}
        ${_statTile('Avg run time',_statFmtMs(avgRun), avgRun==null?'measured from v1.37 onward':'')}
        ${_statTile('Price coverage',_statFmtPct(cov.pct),'Database, now')}
      </div>
      <div class="stat-sub">Price coverage per drawing — Database, now</div>
      ${_statTable(['Drawing','Parts','Priced','Coverage'],
        cov.byDrawing.slice(0,25).map(d=>[d.drawing,d.parts,d.priced,_statFmtPct(d.pct)]))}`,
      ['Metric','Value'], priceRows);

    // ── People ──────────────────────────────────────────────────────────────
    const logins=_statPerDay(logs,'login');
    const byUser=_statPerUser(logs,'login');
    const screens=_statPerUser(logs.map(l=>l.action==='screen_open'
      ? {...l, user:_statDetails(l).screen||'?'} : l), 'screen_open');
    out += _statBlock('people','People',`Audit trail · ${rangeLabel}`,
      `<div class="stat-tiles">
        ${_statTile('Sign-ins',_statFmtNum(_statCount(logs,'login')))}
        ${_statTile('People who signed in',_statFmtNum(byUser.length))}
        ${_statTile('Screens opened',_statFmtNum(_statCount(logs,'screen_open')))}
      </div>
      <div class="stat-sub">Sign-ins per day</div>
      ${_statBars(logins)}
      <div class="stat-sub">Sign-ins per person</div>
      ${_statBars(byUser)}
      <div class="stat-sub">Most opened screens</div>
      ${_statBars(screens.slice(0,10))}`,
      ['Person','Sign-ins'], byUser.map(([u,c])=>[u,c]));
  }

  // ── Current state ─────────────────────────────────────────────────────────
  const nowRows=[
    ['Parts in Database',counts.parts],['Customers',counts.customers],
    ['RFQs / projects',counts.projects],['Users',counts.users],['Roles',counts.roles],
  ].filter(r=>r[1]!=null);
  out += _statBlock('now','System — right now',
    'Live counts. Not affected by the date range above: these are totals as they stand today.',
    countErr
      ? `<p style="color:#9B1C1C;font-size:12px">${esc(countErr)}</p>`
      : `<div class="stat-tiles">
          ${_statTile('Parts in Database',_statFmtNum(counts.parts))}
          ${_statTile('Customers',_statFmtNum(counts.customers))}
          ${_statTile('RFQs',_statFmtNum(counts.projects))}
          ${_statTile('Users',_statFmtNum(counts.users))}
          ${_statTile('Roles',_statFmtNum(counts.roles))}
        </div>`,
    ['Metric','Value'], nowRows);

  return out;
}

const _SUPPORT_STATUSES=['open','in_progress','done','rejected'];
const _SUPPORT_STATUS_LABEL={open:'Open',in_progress:'In Progress',done:'Done',rejected:'Rejected'};
const _SUPPORT_STATUS_COLOR={open:'#2E75B6',in_progress:'#EAB308',done:'#1F8B4C',rejected:'#E53E3E'};
const _SUPPORT_STATUS_TEXT={open:'#fff',in_progress:'#1A202C',done:'#fff',rejected:'#fff'};
const _SUPPORT_ROW_BG={open:'#F7FAFC',in_progress:'#FEFCE8',done:'#F0FDF4',rejected:'#FEF2F2'};
function _supportStatusBadge(status){

  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:${_SUPPORT_STATUS_TEXT[s]};background:${_SUPPORT_STATUS_COLOR[s]}">${_SUPPORT_STATUS_LABEL[s]}</span>`;
}

// A ticket is a CONVERSATION, not a message with one reply stapled to it.
// Every turn lives in `thread`, an array of
//   {role:'user'|'admin', by, text, at (ISO string), files:[{id,name,type,size}]}
//
// Two older shapes are still in the database and are folded into the same list
// when a ticket is read: the original `message` (the first user turn) and a
// single `adminReply` (the admin's answer, before threads existed). Nothing is
// migrated in place — old tickets simply read correctly, and the first new
// reply on one starts the thread.
//
// Firestore rejects serverTimestamp() inside an array, so a turn carries a
// client ISO string. It is a display timestamp only; the authoritative ordering
// fields (createdAt, lastMsgAt) are real server timestamps on the document.
function _supportThread(t){
  const out=[];
  if(t && (t.message || (t.files||[]).length))
    out.push({role:'user', by:t.user, text:t.message||'', at:t.createdAt, files:t.files||[]});
  if(t && t.adminReply)
    out.push({role:'admin', by:t.repliedBy||'', text:t.adminReply, at:t.repliedAt, files:[]});
  for(const m of (t && Array.isArray(t.thread) ? t.thread : []))
    out.push({role:m.role==='admin'?'admin':'user', by:m.by||'', text:m.text||'',
              at:m.at, files:Array.isArray(m.files)?m.files:[]});
  return out;
}
// Who still has to look at this ticket. Both flags are written by whoever posts
// (see _supPostMessage) and cleared by the side that reads it, so "unread" means
// exactly "something happened that you have not opened yet" rather than being
// re-derived from timestamps that two clocks would disagree about.
//
// A ticket written before this version has neither flag. It reads as "nothing
// new", which is the honest answer: nobody can know today whether it was seen
// back then, and lighting up every old ticket would train people to ignore the
// marker on the first day.
function _supportNeedsUser(t){ return t && t.userUnread===true; }
function _supportNeedsAdmin(t){ return t && t.adminUnread===true; }
function _supportUnreadDot(on,title){
  return on ? `<span title="${esc(title||'Unread')}" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#E53E3E;flex-shrink:0"></span>` : '';
}

// ── Attachments ─────────────────────────────────────────────────────────────
// A screenshot of what went wrong is worth more than a paragraph describing it,
// so a ticket and every reply can carry files.
//
// There is no Firebase Storage bucket in this build, so a file is stored as a
// base64 data URL in a document of its own — in the SAME support_tickets
// collection, deliberately WITHOUT a `createdAt` field. Firestore's orderBy
// only returns documents that actually carry the ordered field, and every query
// that lists tickets orders by createdAt, so attachment documents never come
// back with the ticket list however large they get. They are fetched one at a
// time, by id, when someone clicks the attachment. (Both list paths also filter
// on `kind` — belt and braces, not a substitute: the ordering is what keeps the
// bytes off the wire.)
//
// A Firestore document is capped at 1 MiB, so the base64 payload is capped well
// below that. Images are re-encoded down to fit; anything else has to arrive
// small enough on its own.
const _SUP_FILE_MAX_B64=900000;       // ≈ 660 KB of original bytes
const _SUP_IMG_MAX_PX=1600;
const _SUP_IMG_QUALITIES=[0.82,0.7,0.58,0.45,0.35];
const _SUP_MAX_FILES=4;
function _supFmtBytes(n){
  const b=Number(n)||0;
  return b<1024 ? `${b} B` : b<1048576 ? `${(b/1024).toFixed(0)} KB` : `${(b/1048576).toFixed(1)} MB`;
}
function _supReadDataUrl(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(String(fr.result||''));
    fr.onerror=()=>rej(new Error('Could not read '+file.name));
    fr.readAsDataURL(file);
  });
}
// Screenshots off a 4K monitor are several megabytes of mostly empty desktop.
// Re-encoding at 1600px is invisible for reading an error message and is what
// makes "attach a screenshot" work at all within the document limit.
async function _supShrinkImage(file, dataUrl){
  if(!/^image\//.test(file.type||'') || /svg/i.test(file.type||'')) return dataUrl;
  try{
    const img=await new Promise((res,rej)=>{
      const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('bad image')); i.src=dataUrl;
    });
    const scale=Math.min(1,_SUP_IMG_MAX_PX/Math.max(img.width,img.height));
    if(scale>=1 && dataUrl.length<=_SUP_FILE_MAX_B64) return dataUrl;
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(img.width*scale));
    cv.height=Math.max(1,Math.round(img.height*scale));
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    let out=dataUrl;
    for(const q of _SUP_IMG_QUALITIES){
      out=cv.toDataURL('image/jpeg',q);
      if(out.length<=_SUP_FILE_MAX_B64) return out;
    }
    return out;
  }catch{ return dataUrl; }   // not decodable as an image — fall through to the size check
}
// Turns the File objects picked in the dialog into records ready to be written.
// Anything too big is reported by name rather than silently dropped.
async function _supPrepareFiles(files){
  const ready=[], rejected=[];
  for(const f of Array.from(files||[]).slice(0,_SUP_MAX_FILES)){
    let data;
    try{ data=await _supShrinkImage(f, await _supReadDataUrl(f)); }
    catch(e){ rejected.push(`${f.name} (${e.message})`); continue; }
    if(data.length>_SUP_FILE_MAX_B64){
      rejected.push(`${f.name} — ${_supFmtBytes(f.size)}, too large (max ≈ ${_supFmtBytes(_SUP_FILE_MAX_B64*0.73)})`);
      continue;
    }
    ready.push({name:f.name||'attachment', type:f.type||'application/octet-stream',
                size:f.size||0, data});
  }
  return {ready, rejected};
}
async function _supUploadFiles(ticketId, prepared){
  const metas=[];
  for(const p of prepared){
    const ref=await addDoc(collection(db,'companies',companyId,'support_tickets'),{
      kind:'file', ticketId, name:p.name, type:p.type, size:p.size, data:p.data,
      by:currentUserEmail, at:new Date().toISOString()
    });
    metas.push({id:ref.id, name:p.name, type:p.type, size:p.size});
  }
  return metas;
}
function _supFileIcon(type){
  const t=String(type||'');
  return /^image\//.test(t) ? '🖼️' : /pdf/.test(t) ? '📕'
       : /sheet|excel|csv/.test(t) ? '📊' : /word|document/.test(t) ? '📄' : '📎';
}
function _supFileChips(files){
  if(!files || !files.length) return '';
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${files.map(f=>
    `<button class="sup-file" data-id="${esc(f.id)}" data-name="${esc(f.name)}"

// Attachments are downloaded rather than previewed: the data URL is already in
// hand, and a download works the same for a screenshot, a PDF and a workbook.
async function _supDownloadFile(fileId, name){
  try{
    const snap=await getDoc(doc(db,'companies',companyId,'support_tickets',fileId));
    if(!snap.exists()){ toast('That attachment is no longer stored','error'); return; }
    const a=document.createElement('a');

// ── Posting a turn ──────────────────────────────────────────────────────────
// Any new turn re-opens the ticket. A "Done" ticket someone writes into again is
// not done — that is the whole reason they wrote. The admin can still pick a
// different status in the same breath (the reply dialog carries the dropdown),
// which is what makes this a default rather than a rule that fights them.
async function _supPostMessage(ticketId, text, prepared, asAdmin, status){
  const metas=prepared && prepared.length ? await _supUploadFiles(ticketId, prepared) : [];
  const entry={role:asAdmin?'admin':'user', by:currentUserEmail, text:text||'',
               at:new Date().toISOString()};
  if(metas.length) entry.files=metas;
  await updateDoc(doc(db,'companies',companyId,'support_tickets',ticketId),{
    thread:arrayUnion(entry),
    status:_SUPPORT_STATUSES.includes(status)?status:'open',
    lastMsgAt:serverTimestamp(), lastMsgRole:entry.role,
    userUnread:!!asAdmin, adminUnread:!asAdmin,
    updatedAt:serverTimestamp()
  });
  logAudit(asAdmin?'ticket_replied':'ticket_user_replied',
    {ticketId, files:metas.length, chars:(text||'').length}, true);
  return entry;
}

// ── Unread markers ──────────────────────────────────────────────────────────
// Two counts, refreshed on a timer and after anything that could change them:
// what is waiting for THIS user on their own tickets, and — for an
// administrator — what is waiting for the admin on everyone else's. They are
// drawn on the Support button, in the top bar and on the Home screen, so the
// answer to "does anything need me?" is visible from every screen without
// opening anything.
let _supUserAlerts=0, _supAdminAlerts=0, _supPollTimer=null;
const _SUP_POLL_MS=90000;

async function _supRefreshBadges(){
  if(!companyId || !currentUserEmail) return;
  try{

      where('user','==',currentUserEmail), where('userUnread','==',true)));

// ── Resizable columns ──────────────────────────────────────────────────────
function makeTableResizable(table){
  if(!table) return;
  table.querySelectorAll('thead th').forEach((th,ci)=>{
    if(th.querySelector('.col-resizer')) return;
    const r=document.createElement('div');
    r.className='col-resizer';
    r.draggable=false;
    r.addEventListener('dragstart',e=>e.preventDefault());
    th.appendChild(r);
    r.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();});
    let x0=0,w0=0,dragged=false;
    r.addEventListener('mousedown',e=>{
      x0=e.clientX; w0=th.getBoundingClientRect().width; dragged=false;
      const move=ev=>{
        dragged=true;
        const w=Math.max(40,w0+ev.clientX-x0);
        th.style.minWidth=w+'px'; th.style.width=w+'px';
      };
      const up=()=>{
        document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        if(dragged){
          const finalW=th.offsetWidth;
          table.querySelectorAll(`tbody tr > *:nth-child(${ci+1})`).forEach(td=>{
            td.style.whiteSpace='normal';
            td.style.maxWidth=finalW+'px';
            td.style.lineHeight='1.35';
          });
          // The mouseup that ends a drag almost never lands back on the thin
          // resizer strip — it lands on the header cell itself, so the browser
          // fires a native "click" on the th right after this handler returns,
          // which would otherwise trigger a column sort and wipe the resize on
          // re-render. Swallow that one trailing click.
          const suppressClick=ce=>{
            ce.stopPropagation(); ce.preventDefault();
            document.removeEventListener('click',suppressClick,true);
          };
          document.addEventListener('click',suppressClick,true);
          setTimeout(()=>document.removeEventListener('click',suppressClick,true),0);
        }
      };
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
      e.preventDefault(); e.stopPropagation();
    });
  });
}

// ── Column order persistence (per browser) ────────────────────────────────
function loadColOrder(storageKey, defaultCols){
  try{
    const saved=JSON.parse(localStorage.getItem('colOrder_'+storageKey)||'null');
    if(Array.isArray(saved) && saved.length){
      const byKey=Object.fromEntries(defaultCols.map(c=>[c.k,c]));
      const ordered=saved.filter(k=>byKey[k]).map(k=>byKey[k]);
      // A column added since the user last dragged their layout used to be
      // appended at the far RIGHT. That silently broke pairings that only make
      // sense side by side — Mouser Stock ended up nowhere near Mouser Price.
      // Insert each new column after the neighbour it follows by default, so a
      // saved layout keeps the user's choices AND stays coherent.
      defaultCols.forEach((c,di)=>{
        if(saved.includes(c.k)) return;
        const prev = di>0 ? defaultCols[di-1].k : null;
        const at = prev ? ordered.findIndex(o=>o.k===prev) : -1;
        if(at>=0) ordered.splice(at+1, 0, c);
        else ordered.splice(Math.min(di, ordered.length), 0, c);
      });
      if(ordered.length===defaultCols.length) return ordered;
    }
  }catch{}
  return defaultCols;
}
function saveColOrder(storageKey, cols){
  try{ localStorage.setItem('colOrder_'+storageKey, JSON.stringify(cols.map(c=>c.k))); }catch{}
}
// Makes <th data-col="..."> headers in `table` drag-reorderable; on drop, reorders
// `cols` (array of {k,l,...}), persists the new order under storageKey, and calls
// rerenderFn() so the table redraws with the new column order.
function makeColumnsReorderable(table, storageKey, cols, rerenderFn){
  if(!table) return;
  table.querySelectorAll('thead th[data-col]').forEach(th=>{
    th.draggable=true;
    th.addEventListener('dragstart',e=>{
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', th.dataset.col);
      th.classList.add('col-dragging');
    });
    th.addEventListener('dragend',()=>th.classList.remove('col-dragging'));
    th.addEventListener('dragover',e=>{ e.preventDefault(); th.classList.add('col-drop-target'); });
    th.addEventListener('dragleave',()=>th.classList.remove('col-drop-target'));
    th.addEventListener('drop',e=>{
      e.preventDefault(); e.stopPropagation();
      th.classList.remove('col-drop-target');
      const fromKey=e.dataTransfer.getData('text/plain');
      const toKey=th.dataset.col;
      if(!fromKey||fromKey===toKey) return;
      const newCols=[...cols];
      const fromIdx=newCols.findIndex(c=>c.k===fromKey);
      const toIdx=newCols.findIndex(c=>c.k===toKey);
      if(fromIdx<0||toIdx<0) return;
      const [moved]=newCols.splice(fromIdx,1);
      newCols.splice(toIdx,0,moved);
      saveColOrder(storageKey,newCols);
      rerenderFn();
    });
  });
}
// Wires up ◀/▶ buttons (if present in the DOM) to scroll a .table-wrap horizontally.
function wireScrollButtons(wrapEl, leftBtnId, rightBtnId){
  const wrap = typeof wrapEl==='string' ? document.querySelector(wrapEl) : wrapEl;
  const leftBtn=document.getElementById(leftBtnId), rightBtn=document.getElementById(rightBtnId);
  if(!wrap||!leftBtn||!rightBtn) return;
  leftBtn.addEventListener('click',()=>wrap.scrollBy({left:-220,behavior:'smooth'}));
  rightBtn.addEventListener('click',()=>wrap.scrollBy({left:220,behavior:'smooth'}));
}
// Wires a "✕" clear button next to a search input (both passed by id): shows the
// button only while the input has text, and clicking it empties the input, fires a
// synthetic 'input' event (so the existing debounced filter/search listener re-runs),
// and refocuses the field.
function wireSearchClear(inputId, clearId){
  const inp=document.getElementById(inputId), clearBtn=document.getElementById(clearId);
  if(!inp||!clearBtn) return;
  const sync=()=>clearBtn.classList.toggle('show', !!inp.value);
  sync();
  inp.addEventListener('input', sync);
  clearBtn.addEventListener('click', ()=>{
    inp.value='';
    inp.dispatchEvent(new Event('input',{bubbles:true}));
    inp.focus();
  });
}
// Shift-click range selection for a table's row checkboxes: click one checkbox, then
// shift-click another — every checkbox in between (inclusive) is set to match the
// checked state of the one just clicked. Uses event delegation on `container` so it
// keeps working across re-renders of the checkboxes inside it (e.g. Sales Desk rows
// re-rendered by renderSD()) without needing to be re-wired each time.
function wireShiftCheck(container, checkboxSelector){
  if(!container) return;
  let lastIdx=null;
  container.addEventListener('click',e=>{
    const cb=e.target.closest(checkboxSelector);
    if(!cb) return;
    const all=[...container.querySelectorAll(checkboxSelector)];
    const idx=all.indexOf(cb);
    if(e.shiftKey && lastIdx!==null && idx>=0){
      const [from,to]=lastIdx<idx?[lastIdx,idx]:[idx,lastIdx];
      const state=cb.checked;
      for(let i=from;i<=to;i++) all[i].checked=state;
    }
    lastIdx=idx;
  });
}

// ── Boolean search (AND / OR / NOT / parentheses / "quoted phrases") ──────────
// Matches a free-text query against a lowercase haystack string built from all
// searchable field values of a row. Bare terms separated by whitespace are
// implicitly AND-ed; explicit AND/OR/NOT and parentheses are also supported.
function _tokenizeBoolQuery(q){
  const tokens=[]; const re=/\(|\)|"[^"]*"|[^\s()]+/g; let m;
  while((m=re.exec(q))!==null){
    const raw=m[0];
    if(raw==='(') tokens.push({type:'LPAREN'});
    else if(raw===')') tokens.push({type:'RPAREN'});
    else if(/^AND$/i.test(raw)) tokens.push({type:'AND'});
    else if(/^OR$/i.test(raw)) tokens.push({type:'OR'});
    else if(/^NOT$/i.test(raw)) tokens.push({type:'NOT'});
    else{
      let val=raw;
      if(val.startsWith('"')&&val.endsWith('"')&&val.length>=2) val=val.slice(1,-1);
      tokens.push({type:'TERM', value:val});
    }
  }
  return tokens;
}
function parseBoolQuery(query){
  const q=(query||'').trim();
  if(!q) return ()=>true;
  const tokens=_tokenizeBoolQuery(q);
  let pos=0;
  const peek=()=>tokens[pos];
  const next=()=>tokens[pos++];
  const startsOperand=t=>t && (t.type==='TERM'||t.type==='LPAREN'||t.type==='NOT');
  function parseOr(){
    let left=parseAnd();
    while(peek() && peek().type==='OR'){
      next(); const right=parseAnd(); const l=left; left=h=>l(h)||right(h);
    }
    return left;
  }
  function parseAnd(){
    let left=parseNot();
    while(peek() && (peek().type==='AND' || startsOperand(peek()))){
      if(peek().type==='AND') next();
      const right=parseNot(); const l=left; left=h=>l(h)&&right(h);
    }
    return left;
  }
  function parseNot(){
    if(peek() && peek().type==='NOT'){ next(); const operand=parseNot(); return h=>!operand(h); }
    return parseAtom();
  }
  function parseAtom(){
    const t=next();
    if(!t) return ()=>true;
    if(t.type==='LPAREN'){
      const inner=parseOr();
      if(peek() && peek().type==='RPAREN') next();
      return inner;
    }
    if(t.type==='TERM'){
      const term=t.value.toLowerCase();
      return h=>h.includes(term);
    }
    return ()=>true;
  }
  try{
    const predicate=parseOr();
    return h=>predicate(h);
  }catch{ return h=>h.includes(q.toLowerCase()); }
}

async function loadParts(){
