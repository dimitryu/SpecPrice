<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- csp:begin -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.gstatic.com 'sha256-6oVMYwkr3k6goOkudDReH3yq8fDAZegsWXqgBO3cM6Y='; worker-src 'self' blob: https://cdnjs.cloudflare.com; connect-src 'self' data: blob: https://*.googleapis.com https://us-central1-specprice-236a2.cloudfunctions.net; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://specprice-236a2.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- csp:end -->
  <title>SpecPrice</title>
  <style>
    @font-face { font-family:'IBM Plex Sans'; font-weight:400; font-display:swap; src:url('vendor/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family:'IBM Plex Sans'; font-weight:600; font-display:swap; src:url('vendor/fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family:'IBM Plex Sans'; font-weight:700; font-display:swap; src:url('vendor/fonts/ibm-plex-sans-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family:'IBM Plex Mono'; font-weight:400; font-display:swap; src:url('vendor/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Copper & Graphite: graphite page, drafting grid, copper action. */
    body {
      font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh; color:#1C232D;
      background-color:#1C232D;
      background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:24px 24px;
      display: flex; align-items: center; justify-content: center; overflow:hidden;
    }
    .harness { position:fixed; left:50%; bottom:6vh; width:1100px; max-width:120vw; transform:translateX(-50%); color:#B4532A; opacity:.28; pointer-events:none; }
    .card {
      position:relative; background: #fff; border-radius: 14px; padding: 40px 38px 34px; width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,.45); border-top:3px solid #B4532A;
    }
    .logo { display:flex; align-items:center; gap:12px; margin-bottom: 30px; }
    .logo h1 { font-size: 24px; font-weight: 700; color: #1C232D; letter-spacing: -.2px; }
    .logo p  { color: #6B6F76; font-size: 12px; margin-top: 2px; letter-spacing: .3px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #6B6F76;
            text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; margin-top: 16px; }
    input {
      width: 100%; padding: 10px 13px; border: 1px solid #DDD8CF; border-radius: 7px; background:#F8F6F2;
      font: 14px 'IBM Plex Sans', sans-serif; color: #1C232D; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #B4532A; box-shadow: 0 0 0 3px rgba(180,83,42,.14); background:#fff; }
    .btn {
      width: 100%; margin-top: 24px; padding: 11px;
      background: #B4532A; color: #fff; border: none; border-radius: 7px;
      font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer; transition: background .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover:not(:disabled) { background: #963F1C; }
    .btn:disabled { background: #B8B2A8; cursor: not-allowed; }
    .error { color: #B42318; font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
    .error.ok { color: #2E7D4F; }
    .forgot { display: block; margin-top: 14px; text-align: center; font: 13px 'IBM Plex Sans', sans-serif; color: #9A4520;
              background: none; border: none; cursor: pointer; width: 100%; }
    .forgot:hover { text-decoration: underline; }
    .forgot:disabled { color: #A0A4AA; cursor: default; text-decoration: none; }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<svg class="harness" viewBox="0 0 1200 170" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
<rect x="60" y="58" width="96" height="54" rx="8"/><path d="M80 70v30M96 70v30M112 70v30M128 70v30M144 70v30" stroke-width="1.4"/>
<path d="M156 75 C 300 75 330 40 470 40 S 650 70 760 70"/><path d="M156 85 C 300 85 340 85 480 85 S 650 85 760 85"/><path d="M156 95 C 300 95 330 130 470 130 S 650 100 760 100"/>
<rect x="470" y="30" width="26" height="20" rx="3" stroke-width="1.6"/><path d="M760 64h36v42h-36z"/><path d="M796 85 C 880 85 900 60 990 60"/><path d="M796 92 C 880 92 900 120 990 120"/>
<rect x="990" y="44" width="70" height="32" rx="6"/><rect x="990" y="104" width="70" height="32" rx="6"/></svg>
<div class="card">
  <div class="logo">
    <svg width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#B4532A"/><path d="M6 21c4 0 5-10 10-10s6 10 10 10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="6" cy="21" r="2.4" fill="#fff"/><rect x="23.5" y="18.5" width="5" height="5" rx="1.2" fill="#fff"/></svg>
    <div><h1>SpecPrice</h1><p>Cable assemblies · electronic components · quoting</p></div>
  </div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="your@email.com" autocomplete="email">

  <label for="pw">Password</label>
  <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password">

  <button class="btn" id="btn">Sign In</button>
  <button type="button" class="forgot" id="forgot">Forgot password?</button>
  <div class="error" id="err" role="alert" aria-live="polite"></div>
</div>

<script type="module">
import { initializeApp }                        from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword,
         onAuthStateChanged, setPersistence,
         browserLocalPersistence,
         sendPasswordResetEmail }               from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';

const app  = initializeApp({
  apiKey:            "AIzaSyCyRRnbEE_h7KC5RieXiNcVAZv_aaiqNK4",
  authDomain:        "specprice-236a2.firebaseapp.com",
  projectId:         "specprice-236a2",
  storageBucket:     "specprice-236a2.firebasestorage.app",
  messagingSenderId: "294680326166",
  appId:             "1:294680326166:web:d3ef0602f2103c87b30537"
});
const auth = getAuth(app);

// Already logged in → skip to app
onAuthStateChanged(auth, u => { if (u) location.href = 'app.html'; });

const btn = document.getElementById('btn');
const err = document.getElementById('err');

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw    = document.getElementById('pw').value;
  err.classList.remove('ok');
  if (!email || !pw) { err.textContent = 'Please enter email and password.'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in…';
  err.textContent = '';
  try {
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email, pw);
    location.href = 'app.html';
  } catch (e) {
    err.textContent =
      ['auth/wrong-password','auth/user-not-found','auth/invalid-credential'].includes(e.code)
        ? 'Invalid email or password.' : e.message;
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

btn.addEventListener('click', doLogin);

// Forgot password: Firebase e-mails a link to set a new one. The answer is the
// same whether or not the address has an account — saying "no such user" would
// tell a stranger which e-mail addresses are registered.
const forgot = document.getElementById('forgot');
forgot.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  err.classList.remove('ok');
  if (!email) { err.textContent = 'Type your email above, then click "Forgot password?" again.';
                document.getElementById('email').focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'That email address does not look right.'; return; }
  forgot.disabled = true; forgot.textContent = 'Sending…';
  try {
    await sendPasswordResetEmail(auth, email);
    err.classList.add('ok');
    err.textContent = `If ${email} has an account, a password reset link was sent to it. `
                    + 'Check your inbox (and the spam folder), set a new password, then sign in here.';
  } catch (e) {
    err.classList.remove('ok');
    err.textContent = e.code === 'auth/invalid-email' ? 'That email address does not look right.'
                    : e.code === 'auth/too-many-requests' ? 'Too many requests. Wait a few minutes and try again.'
                    : e.code === 'auth/user-not-found'
                      ? `If ${email} has an account, a password reset link was sent to it.`
                    : e.message;
    if (e.code === 'auth/user-not-found') err.classList.add('ok');
  } finally {
    forgot.disabled = false; forgot.textContent = 'Forgot password?';
  }
});
document.getElementById('pw').addEventListener('keydown', e => e.key === 'Enter' && doLogin());
</script>
</body>
</html>
